/* ============ OCR: API 키 없이 코드와 가사 읽기 ============
   Tesseract.js 는 "글자"를 읽는다. 오선보의 음표는 못 읽는다.
   그래서 코드 심볼과 가사까지만 가져오고 멜로디는 포기한다. */
let wChord=null, wLyric=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.onload=()=>res(); el.onerror=()=>rej(new Error('스크립트를 불러오지 못했습니다'));
    document.head.appendChild(el);
  });
}
/* 오선을 지운다. 가로로 길게 이어진 어두운 줄만 하얗게 만든다.
   음표는 일부 깎이지만 우리가 읽을 건 글자라 상관없다. */
function stripStaff(srcUrl,scale){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const W=Math.round(img.width*scale),H=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,0,0,W,H);
      const d=ctx.getImageData(0,0,W,H), px=d.data;
      const dark=new Uint8Array(W*H);
      for(let i=0,p=0;i<px.length;i+=4,p++){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        dark[p]=v<150?1:0;
      }
      const rowCount=new Int32Array(H);
      for(let y=0;y<H;y++){let c=0;const o=y*W;for(let x=0;x<W;x++)c+=dark[o+x];rowCount[y]=c;}
      for(let y=0;y<H;y++){
        if(rowCount[y]<W*0.45)continue;
        const o=y*W;
        for(let x=0;x<W;x++){
          if(!dark[o+x])continue;
          // 위아래 3px 안이 비어 있으면 오선으로 보고 지운다(음표 기둥은 살린다)
          let up=0,dn=0;
          for(let k=1;k<=3;k++){
            if(y-k>=0&&dark[(y-k)*W+x])up++;
            if(y+k<H&&dark[(y+k)*W+x])dn++;
          }
          if(up<=1&&dn<=1){const i=(o+x)*4;px[i]=px[i+1]=px[i+2]=255;}
        }
      }
      // 대비 강화
      for(let i=0;i<px.length;i+=4){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        const t=v<170?0:255;
        px[i]=px[i+1]=px[i+2]=t;
      }
      ctx.putImageData(d,0,0);
      res(cv.toDataURL('image/png'));
    };
    img.onerror=()=>rej(new Error('이미지 처리 실패'));
    img.src=srcUrl;
  });
}
function fixChordToken(t){
  let x=t.replace(/[♭]/g,'b').replace(/[♯]/g,'#').replace(/[·•,.]$/,'').trim();
  x=x.replace(/^([A-G])[|1lI](?=[A-G])/,'$1/');
  x=x.replace(/([A-G][#b]?)[|lI]([A-G][#b]?)$/,'$1/$2');
  x=x.replace(/^([A-G])[oO0](?![a-z])/,'$1');
  x=x.replace(/^([A-G][#b]?)rn/,'$1m');
  x=x.replace(/^([A-G][#b]?)M(?=7|$)/,'$1maj');
  x=x.replace(/[^A-Ga-g#b\/0-9msuadijMΔ°+()\-]/g,'');
  if(/^[A-G]/.test(x))x=x[0].toUpperCase()+x.slice(1);
  return x;
}
/* OCR 가사 낱말에서 흔한 잡음만 가볍게 정리한다(사전 대조 없는 규칙 기반).
   실제 한글 사전으로 오타를 고치는 건 별도 작업 — 이건 "글자 아닌 것"만 걷어낸다. */
function cleanOcrLyricToken(t){
  return t
    .replace(/[|Il~`^*_<>{}\[\]0-9]/g,'')     // 오선·바코드성 잡음이 섞여 들어온 자리(가사에 나올 일 없는 문자)
    .replace(/[.,·•‥…]+$/,'')                  // 끝에 붙은 구두점 잡음
    .trim();
}
function wordsFrom(data){
  if(data.words&&data.words.length)return data.words;
  const out=[];
  const walk=n=>{ if(!n)return;
    if(Array.isArray(n)){n.forEach(walk);return;}
    if(n.text!==undefined&&n.bbox&&!n.words&&!n.lines&&!n.paragraphs){out.push(n);return;}
    ['blocks','paragraphs','lines','words'].forEach(k=>{if(n[k])walk(n[k])});
  };
  walk(data.blocks||data);
  return out;
}
function wordsToChart(words){
  const ws=words.filter(w=>w.text&&w.text.trim())
    .map(w=>({t:w.text.trim(),kind:w.kind,x0:w.bbox.x0,x1:w.bbox.x1,yc:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}));
  if(!ws.length)return '';
  const medH=ws.map(w=>w.h).sort((a,b)=>a-b)[Math.floor(ws.length/2)]||20;
  ws.sort((a,b)=>a.yc-b.yc);
  /* 절 번호('v', 예: 전통 찬송가의 왼쪽 여백 "1." "2." "3.")는 코드('c')와는 다른 줄이지만
     그 옆 가사('l')와는 같은 줄이다 — 묶을 때는 코드만 따로, 가사+절번호는 한 묶음으로 본다. */
  const grp=k=>k==='c'?'c':'l';
  const lines=[];
  for(const w of ws){
    const L=lines[lines.length-1];
    if(L&&Math.abs(w.yc-L.yc)<medH*0.7&&grp(L.kind)===grp(w.kind)){
      L.items.push(w); L.yc=(L.yc*(L.items.length-1)+w.yc)/L.items.length;
    } else lines.push({yc:w.yc,items:[w],kind:w.kind});
  }
  const charW=Math.max(6,medH*0.6);
  const minX=Math.min(...ws.map(w=>w.x0));
  const out=[];
  for(const L of lines){
    L.items.sort((a,b)=>a.x0-b.x0);
    const isChord=L.kind==='c';
    let line='';
    for(const w of L.items){
      /* 절 번호 1은 표시하지 않음(코드 붙은 기본 절), 2 이상만 "2) " 형식으로 —
         나머지 파서가 그 형식으로 다음 절 가사를 알아본다. */
      const text=isChord?fixChordToken(w.t):(w.kind==='v'?(w.t==='1'?'':w.t+') '):w.t);
      if(!text)continue;
      const col=Math.round((w.x0-minX)/charW);
      while(line.length<col)line+=' ';
      if(line.length&&line[line.length-1]!==' ')line+=' ';
      line+=text;
    }
    if(line.trim())out.push(line.replace(/\s+$/,''));
  }
  return out.join('\n');
}
async function ensureOcrWorkers(say){
  if(!window.Tesseract){
    say&&say('OCR 엔진을 내려받는 중…');
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }
  const SPARSE=(window.Tesseract&&Tesseract.PSM&&Tesseract.PSM.SPARSE_TEXT)||'11';
  if(!wChord){
    say&&say('코드 인식 준비 중…');
    wChord=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!==undefined)say&&say('코드 인식 준비 '+Math.round(m.progress*100)+'%')}});
    await wChord.setParameters({
      tessedit_pageseg_mode:SPARSE,
      tessedit_char_whitelist:'ABCDEFGabdgijmosu#/0123456789'
    });
  }
  if(!wLyric){
    say&&say('한글 인식 데이터를 내려받는 중… 처음 한 번만 오래 걸립니다.');
    wLyric=await Tesseract.createWorker(['kor','eng'],1,{logger:m=>{if(m.progress!==undefined)say&&say('한글 준비 '+Math.round(m.progress*100)+'%')}});
  }
}
/* 사진 여러 장을 OCR로 읽어 "코드+가사" 초안 텍스트를 만든다(음표는 못 읽음).
   - 단독으로 쓰면 키 없는 OCR 결과
   - runScan()에서 API 프롬프트에 참고 힌트로 얹으면 AI 채보 정확도를 보정하는 용도로도 쓴다 */
async function ocrDraft(photoUrls,say){
  await ensureOcrWorkers(say);
  const pages=[]; let chordN=0, lyricN=0;
  for(let i=0;i<photoUrls.length;i++){
    const tag=photoUrls.length>1?(i+1)+'/'+photoUrls.length+'쪽 ':'';
    /* 한 장에 단이 여러 개 있으면(전통 찬송가 등) 단 단위로 잘라 한 단씩 읽는다 —
       한 장 통째로 넣으면 밀도가 높아 코드·글자 인식이 훨씬 부정확해진다. */
    let shots=[photoUrls[i]];
    /* 단 단위로 자르면 그 조각 안에서 다시 확대할 여유가 생긴다(전체 페이지를 한 번에 키우는
       것보다 훨씬 싸다) — 그래서 여기서는 목표 해상도를 크게 잡는다. */
    try{ const parts=await splitSystems(photoUrls[i],2200); if(parts&&parts.length)shots=parts.map(p=>p.url); }catch(e){}
    for(let j=0;j<shots.length;j++){
      const tag2=shots.length>1?tag+(j+1)+'/'+shots.length+'단 ':tag;
      say&&say(tag2+'오선을 지우는 중…');
      /* 단 단위로 잘랐으면 이미 위에서 충분히 확대했으니 그대로, 통째로(단 분리 실패) 넣을 땐
         한 번 더 키운다 — 어느 쪽이든 작은 글자가 인식 가능한 크기가 되도록. */
      const clean=await stripStaff(shots[j],shots.length>1?1:1.4);
      say&&say(tag2+'코드 심볼을 읽는 중…');
      const rc=await wChord.recognize(clean,{},{blocks:true,text:false});
      const chordWords=wordsFrom(rc.data)
        .filter(w=>w.text&&w.text.trim()&&(w.confidence===undefined||w.confidence>40))
        .filter(w=>parseChord(fixChordToken(w.text.trim())))
        .map(w=>({text:w.text,bbox:w.bbox,kind:'c'}));
      say&&say(tag2+'가사를 읽는 중…');
      const rl=await wLyric.recognize(clean,{},{blocks:true,text:false});
      const rawLyric=wordsFrom(rl.data).filter(w=>w.text&&w.text.trim());
      const lyricWords=rawLyric
        .filter(w=>w.confidence===undefined||w.confidence>40)   // 확신도 낮은 잡음 토큰은 애초에 버린다(코드 인식과 동일 기준)
        .filter(w=>/[가-힣]/.test(w.text))
        .map(w=>({text:cleanOcrLyricToken(w.text),bbox:w.bbox,kind:'l'}))
        .filter(w=>w.text);
      /* 전통 찬송가는 절 가사 왼쪽에 "1. 2. 3. 4."로 번호가 붙어 있다.
         한글이 없어 위 필터에서 빠지므로, 홀로 있는 한 자리 숫자(+점)만 절 번호 후보로 따로 챙긴다. */
      const verseWords=rawLyric.filter(w=>{
          const t=w.text.trim();
          if(!/^[1-9][.).]?$/.test(t))return false;
          if(w.confidence!==undefined&&w.confidence<70)return false;   // 잘못 읽은 낱자 숫자(페이지 번호·연도 조각 등)를 절 번호로 오인하지 않도록 엄격하게
          return +t.replace(/[.).]/g,'')<=6;   // 찬송가 절이 6개를 넘는 경우는 거의 없다
        })
        .map(w=>({text:w.text.trim().replace(/[.).]/g,''),bbox:w.bbox,kind:'v'}));
      chordN+=chordWords.length; lyricN+=lyricWords.length;
      const txt=wordsToChart(chordWords.concat(lyricWords).concat(verseWords));
      if(txt.trim())pages.push(txt);
    }
  }
  return {text:pages.join('\n\n'),chordN,lyricN};
}
async function runOCR(){
  if(!S.photos.length)return;
  const say=m=>{const b=$('scanstate'); if(b){b.className='callout work';b.innerHTML='<span class="spin"></span> '+m;} setWork(m);};
  say('OCR로 읽는 중…');
  try{
    const {text:txt,chordN,lyricN}=await ocrDraft(S.photos.map(p=>p.ocrUrl||p.url),say);
    if(!txt.trim())throw new Error('읽어낸 내용이 없습니다');
    S.raw=txt; S.semis=0; S.verse=1; stopPlay(); reparse(); renderAll(); addHistory();
    const box=$('scanstate');
    if(box){
      box.className='callout ok';
      box.innerHTML='<b>코드 '+chordN+'개, 가사 '+lyricN+'덩어리를 읽었습니다'+(S.photos.length>1?' ('+S.photos.length+'쪽)':'')+'.</b> '
        +'키 없이 읽은 것이라 빠지거나 틀린 게 많습니다. 원본과 비교하며 <b>직접 입력</b>에서 고쳐 주세요. '
        +'멜로디(음표)는 읽지 못합니다.';
    }
    toast('OCR로 읽었습니다. 내용을 확인해 고쳐 주세요.');
  }catch(err){
    const box=$('scanstate');
    if(box){ box.className='callout err'; box.textContent='OCR 실패: '+(err.message||'알 수 없는 오류')+' — "직접 입력"에 옮겨 주세요.'; }
    else toast('OCR 실패: '+(err.message||'알 수 없는 오류'));
  }finally{ clearWork(); }
}

/* 모델 이름은 자주 바뀐다. 추측하지 말고 계정에서 실제 목록을 받아온다. */
let GMODELS=null, LAST_TRUNCATED=false;
async function geminiModels(gkey){
  if(GMODELS)return GMODELS;
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(gkey)+'&pageSize=200');
    if(r.ok){
      const d=await r.json();
      const ok=(d.models||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>String(m.name||'').replace(/^models\//,''))
        .filter(n=>/gemini/i.test(n)&&!/embedding|aqa|tts|image|audio|native|thinking-exp/i.test(n));
      const score=n=>{
        let s=0;
        if(/flash/i.test(n))s+=100;          // 무료 등급은 flash 계열
        if(/lite/i.test(n))s-=20;            // lite 는 정확도가 낮다
        if(/latest/i.test(n))s+=15;
        if(/preview|exp/i.test(n))s-=30;
        const v=parseFloat((n.match(/(\d+(?:\.\d+)?)/)||[])[1]||0);
        s+=v*3;
        return s;
      };
      ok.sort((x,y)=>score(y)-score(x));
      if(ok.length){GMODELS=ok.slice(0,6);return GMODELS;}
    }else if(r.status===403){
      throw new Error('키가 거부되었습니다. AI Studio에서 키를 다시 확인해 주세요');
    }
  }catch(e){ if(/거부/.test(e.message))throw e; }
  return GEMINI_MODELS;   // 목록 조회 실패 시 예비 목록 — 실패는 캐시하지 않아 다음 시도 때 다시 조회한다
}
async function geminiScan(gkey,prompt,b64,say){
  const models=await geminiModels(gkey);
  let lastErr='';
  for(const model of models){
    if(say)say('읽는 중… ('+model+')');
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(gkey);
    let r;
    try{
      r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({
          contents:[{role:'user',parts:[
            {inline_data:{mime_type:'image/jpeg',data:b64}},
            {text:prompt}
          ]}],
          generationConfig:{temperature:0,maxOutputTokens:8192,thinkingConfig:{thinkingBudget:0}}
        })});
    }catch(e){ throw new Error('네트워크 오류 — 인터넷 연결을 확인해 주세요'); }

    let d=null;
    try{ d=await r.json(); }catch(e){}
    if(r.ok){
      const cand=(d&&d.candidates&&d.candidates[0])||null;
      const txt=(cand&&cand.content&&cand.content.parts)
        ? cand.content.parts.map(x=>x.text||'').join('') : '';
      if(txt.trim()){
        if(cand.finishReason==='MAX_TOKENS')LAST_TRUNCATED=true;
        return txt;
      }
      lastErr='빈 응답'+(cand&&cand.finishReason?' ('+cand.finishReason+')':'');
      continue;
    }
    const msg=(d&&d.error&&d.error.message)||('서버 응답 '+r.status);
    if(r.status===403) throw new Error('키가 거부되었습니다: '+msg);
    if(r.status===429){
      if(!P._retried){ P._retried=true;
        for(let w=25;w>0;w--){ if(say)say('무료 한도에 걸렸습니다. '+w+'초 뒤 자동으로 다시 시도합니다…'); await new Promise(z=>setTimeout(z,1000)); }
        return await geminiScan(gkey,prompt,b64,say);
      }
      { const qe=new Error('무료 한도를 다 썼습니다. 분당 한도라면 1~2분 뒤 됩니다. '
        +'몇 시간째 안 되면 하루 한도까지 쓴 것이고, 태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다. '
        +'그때까지는 아래 OCR이나 직접 입력을 쓰세요');
        qe.quota=true; throw qe; }
    }
    lastErr=msg;
  }
  if(/no longer available|not found|deprecated/i.test(lastErr))
    throw new Error('시도한 모델이 전부 더는 지원되지 않습니다. 새로고침 후 다시 시도해 보세요('+lastErr+')');
  throw new Error(lastErr||'인식 실패');
}

async function runScan(){
  if(!S.photos.length)return;
  const hosted=!!SCAN_ENDPOINT, prov=getProv();
  const fail=html=>{const b=$('scanstate'); if(b){b.className='callout err';b.innerHTML=html;} clearWork();};

  if(!hosted&&prov==='gemini'&&!getGKey())
    return fail('<b>무료 Gemini 키를 먼저 넣어 주세요.</b><br>'
      +'aistudio.google.com → 구글 계정 로그인 → <b>Get API key</b> → 복사해서 위 칸에 붙여넣기.<br>'
      +'카드 등록도 결제도 없습니다.');
  if(!hosted&&prov==='claude'&&!getKey()&&!IN_FRAME)
    return fail('<b>Claude API는 유료입니다.</b> 무료로 쓰시려면 위에서 <b>Gemini (무료)</b>를 고르세요.');

  const N=S.photos.length;
  const say=m=>{const b=$('scanstate'); if(b){b.className='callout work';b.innerHTML='<span class="spin"></span> '+m;} setWork(m);};
  say('시작하는 중…');
  LAST_TRUNCATED=false; P._retried=false;
  let ocrResult=null;   // Gemini 무료 한도를 다 쓰면 이걸(또는 새로 돌린 OCR을) 그대로 결과로 쓴다
  try{
    /* OCR로 먼저 코드·가사 초안을 훑어서, AI가 헷갈리기 쉬운 코드 기호·글자를
       구분할 때 참고하도록 프롬프트에 힌트로 얹는다. 실패해도 API 채보 자체는 그대로 진행한다. */
    let ocrHint='';
    if(P.ocrBoost!==false){
      try{
        ocrResult=await ocrDraft(S.photos.map(p=>p.ocrUrl||p.url),m=>say('OCR로 초안 대조 중… '+m));
        if(ocrResult.text.trim())ocrHint='\n\n참고용 OCR 초안(문자 인식 결과라 오타·오류가 있을 수 있습니다. '
          +'코드 기호나 헷갈리는 글자를 구분할 때만 참고하고, 실제 내용은 항상 사진 이미지를 기준으로 판단하세요):\n---\n'
          +ocrResult.text+'\n---';
      }catch(e){ ocrResult=null; /* OCR 보정은 실패해도 무시하고 API만으로 진행 */ }
    }
    /* 한 장을 단 단위로 쪼개면 인식이 정확해진다 */
    let shots=S.photos;
    if(P.bySystem!==false){
      say('악보를 단 단위로 나누는 중…');
      const acc=[];
      for(const ph of S.photos){
        const parts=await splitSystems(ph.url);
        if(parts&&parts.length)acc.push(...parts); else acc.push(ph);
      }
      if(acc.length)shots=acc;   // 쪽이 많아도 단 단위로 쪼갠 쪽이 정확도가 훨씬 높다
    }
    const NN=shots.length;
    const pages=[];
    for(let i=0;i<NN;i++){
      const tag=NN>1?(i+1)+'/'+NN+'단 ':'';
      say(tag+'악보를 읽는 중입니다…');
      const b64=shots[i].b64;
      const usePrompt=(P.readMel===false?makePrompt(false):PROMPT)+ocrHint;
      let t='';
      if(hosted){
        const r=await fetch(SCAN_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({data:b64,prompt:usePrompt})});
        if(!r.ok)throw new Error(tag+'서버 응답 '+r.status);
        const d=await r.json();
        t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      }else if(prov==='gemini'){
        t=await geminiScan(getGKey(),usePrompt,b64,m=>say(tag+m));
      }else{
        const key=getKey();
        const r=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',
          headers:key
            ? {'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}
            : {'content-type':'application/json'},
          body:JSON.stringify({model:'claude-sonnet-5',max_tokens:4000,messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
            {type:'text',text:usePrompt}]}]})
        });
        if(!r.ok)throw new Error(tag+(r.status===401?'키가 거부되었습니다':'서버 응답 '+r.status));
        const d=await r.json();
        t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      }
      if(LAST_TRUNCATED&&P.readMel!==false&&!hosted){
        say(tag+'길이가 넘쳐 멜로디 없이 다시 읽는 중…');
        LAST_TRUNCATED=false;
        const p2=makePrompt(false)+ocrHint;
        if(prov==='gemini')t=await geminiScan(getGKey(),p2,b64,m=>say(tag+m));
      }
      t=t.trim().replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
      const tm=t.match(/^TITLE:\s*(.+)$/m);
      if(tm){ if(i===0)$('title').value=tm[1].trim(); t=t.replace(/^TITLE:\s*.+$/m,'').trim(); }
      if(t)pages.push(t);
      if(i<NN-1)await new Promise(r=>setTimeout(r,1100));   // 무료 등급 분당 한도 배려
    }
    let text=pages.join('\n\n');
    if(!text)throw new Error('읽어낸 내용이 없습니다 — 사진을 더 밝고 반듯하게 찍어 보세요');
    S.raw=text; S.semis=0; S.verse=1; stopPlay(); reparse(); renderAll(); addHistory();
    clearWork();
    toast('옮겼습니다. 원본과 비교해 확인해 주세요.'
      +(LAST_TRUNCATED?' 길이 제한으로 뒷부분이 잘렸을 수 있어요 — 악보를 반씩 나눠 찍으면 더 잘 됩니다.':''));
    closePanel();
  }catch(err){
    if(err.quota&&!hosted&&prov==='gemini'){ await ocrFallback(ocrResult,say,fail); return; }
    fail((err.message||'변환 실패')+' — 다시 시도하거나 <b>직접 입력</b>에 옮겨 주세요.');
  }
}
/* Gemini 무료 한도를 다 쓰면 사용자가 따로 누를 필요 없이 OCR 결과로 대신 채워 넣는다.

   없는지, 왜 정확도가 떨어지는지 사용자가 헷갈리지 않게. */
async function ocrFallback(existing,say,fail){

    if(!txt||!txt.trim())throw new Error('OCR로도 읽어낸 내용이 없습니다');

    clearWork();
    toast('Gemini 무료 한도를 다 써서 OCR로만 옮겼습니다. 내용을 확인해 고쳐 주세요.');

        +'키 없이 읽은 것이라 빠지거나 틀린 게 많고 <b>멜로디(음표)는 읽지 못합니다</b> — 원본과 비교하며 '
        +'<b>직접 입력</b>에서 고쳐 주세요. 한도는 태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다.';
    }
    /* AI로 성공했을 때와 달리 여기서는 패널을 자동으로 닫지 않는다 — 결과 질이 떨어진 이유를
       사용자가 위 안내에서 직접 읽고 확인한 뒤 스스로 닫게 한다. */
  }catch(err2){

/* ============ 음악 파일 → 채보(베타) ============
   서버 없이 브라우저 안에서만 동작: 가사는 Whisper(transformers.js, CDN에서 모델을 받아옴),
   멜로디는 자기상관(autocorrelation) 기반 단음 피치 추적으로 뽑는다.
   합주곡(여러 음이 겹치는 곡)에는 안 맞고, 보컬이 뚜렷한 단선율 위주로만 그럭저럭 동작한다. */
function audioToMono(buffer){
  if(buffer.numberOfChannels===1)return buffer.getChannelData(0).slice();
  const L=buffer.getChannelData(0), R=buffer.getChannelData(1), out=new Float32Array(L.length);
  for(let i=0;i<L.length;i++)out[i]=(L[i]+R[i])/2;
  return out;
}
async function resampleTo(buffer,rate){
  const len=Math.max(1,Math.ceil(buffer.duration*rate));
  const off=new OfflineAudioContext(1,len,rate);
  const src=off.createBufferSource(); src.buffer=buffer; src.connect(off.destination); src.start();
  const rendered=await off.startRendering();
  return rendered.getChannelData(0).slice();
}
/* 프레임마다 RMS(소리 크기)와 자기상관으로 얻은 기본주파수를 구해 반음 단위로 묶는다 */
function detectMelodyNotes(mono,sr){
  const frame=1024, hop=512;
  const minLag=Math.floor(sr/1000), maxLag=Math.floor(sr/70);
  const hopSec=hop/sr, runs=[]; let cur=null;
  for(let i=0;i+frame<=mono.length;i+=hop){
    let rms=0; for(let j=0;j<frame;j++)rms+=mono[i+j]*mono[i+j];
    rms=Math.sqrt(rms/frame);
    let midi=null;
    if(rms>0.012){
      let bestLag=-1,bestVal=0;
      for(let lag=minLag;lag<=maxLag;lag++){
        let sum=0; for(let j=0;j<frame-lag;j++)sum+=mono[i+j]*mono[i+j+lag];
        if(sum>bestVal){bestVal=sum;bestLag=lag;}
      }
      if(bestLag>0){ const f0=sr/bestLag; midi=Math.round(69+12*Math.log2(f0/440)); }
    }
    const rest=(midi===null);
    if(cur&&((rest&&cur.rest)||(!rest&&!cur.rest&&midi===cur.midi))){ cur.dur+=hopSec; continue; }
    if(cur)runs.push(cur);
    cur=rest?{rest:true,dur:hopSec}:{midi,dur:hopSec};
  }
  if(cur)runs.push(cur);
  const MIN=hopSec*3, merged=[];               // 3프레임 미만 잡음은 앞 음에 흡수
  for(const n of runs){
    if(n.dur<MIN&&merged.length){ merged[merged.length-1].dur+=n.dur; continue; }
    merged.push(n);
  }
  return merged;                                // [{midi|rest,dur(초)}]
}
/* 초 단위 길이를 주어진 BPM 기준 박수로 바꾸고 16분음표 단위로 반올림 */
function quantizeToBeats(runs,bpm){
  return runs.map(n=>{
    let b=Math.max(0.25,Math.round((n.dur*(bpm/60))/0.25)*0.25);
    return n.rest?{rest:true,beats:b}:{midi:n.midi,beats:b};
  });
}
/* 마디 경계(beatsPerBar)에서 음을 잘라 마디선을 끼워 넣는다 */
function barSplitNotes(notes,beatsPerBar){
  const out=[]; let pos=0;
  for(const n of notes){
    let remain=n.beats;
    while(remain>0.001){
      const take=Math.min(remain,beatsPerBar-pos);
      out.push(n.rest?{rest:true,beats:take}:{midi:n.midi,beats:take});
      pos+=take; remain-=take;
      if(pos>=beatsPerBar-0.001){ out.push({bar:true}); pos=0; }
    }
  }
  while(out.length&&out[out.length-1].bar)out.pop();
  return out;
}
function barCountOf(notes){ return notes.filter(n=>n.bar).length+1; }
/* Whisper 단어 타임스탬프를 같은 마디 구간에 떨어지는 것끼리 묶어 가사 줄을 만든다 */
function wordsToBarredLyric(chunks,barCount,beatsPerBar,bpm){
  const secPerBeat=60/bpm, barSec=beatsPerBar*secPerBeat;
  const buckets=new Array(barCount).fill(0).map(()=>[]);
  (chunks||[]).forEach(c=>{
    const t=(c.timestamp&&c.timestamp[0])||0;
    const bi=Math.min(barCount-1,Math.max(0,Math.floor(t/barSec)));
    const w=(c.text||'').trim(); if(w)buckets[bi].push(w);
  });
  // 가사가 없는 마디(간주 등)를 빈 문자열로 두면 파서(withBars)가 그 마디선을 지워버려
  // 멜로디 마디 수와 어긋난다 — 자리표시자를 넣어 마디 개수를 지킨다.
  return buckets.map(b=>b.length?b.join(' '):'·').join('|');
}
let TFJS=null;
async function loadWhisper(onProg){
  if(!TFJS){
    const mod=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    mod.env.allowLocalModels=false;
    TFJS=mod;
  }
  return TFJS.pipeline('automatic-speech-recognition','Xenova/whisper-base',{progress_callback:onProg});
}
/* 전체 파이프라인: 파일 → 멜로디(오선) + 가사(마디 정렬), S.raw에 새 곡으로 써 넣는다 */
async function runAudioTranscribe(setStatus){
  const ab=S.audioFile&&S.audioFile.buf; if(!ab)throw new Error('no-buffer');
  const beatsPerBar=P.beats||4, bpm0=P.bpm;   // 처리 중 사용자가 BPM/박자표를 바꿔도 흔들리지 않도록 시작 시점 값을 고정

  setStatus('멜로디 분석 중… (곡 길이에 따라 오래 걸릴 수 있어요)');
  const mono8k=await resampleTo(ab,8000);
  const rawNotes=detectMelodyNotes(mono8k,8000);
  const barred=barSplitNotes(quantizeToBeats(rawNotes,bpm0),beatsPerBar);
  const bars=barCountOf(barred);

  setStatus('가사 인식 모델을 내려받는 중… (처음 한 번만, 수십MB)');
  const asr=await loadWhisper(p=>{
    if(p&&p.status==='progress')setStatus('모델 다운로드 중… '+Math.round(p.progress||0)+'%');
  });
  setStatus('가사를 텍스트로 옮기는 중…');
  const mono16k=await resampleTo(ab,16000);
  const result=await asr(mono16k,{chunk_length_s:30,stride_length_s:5,return_timestamps:'word',language:'korean',task:'transcribe'});
  const lyricLine=wordsToBarredLyric(result.chunks,bars,beatsPerBar,bpm0);

  const title=($('title').value||'').trim()||(S.audioFile.name||'').replace(/\.[^.]+$/,'');
  $('title').value=title;
  S.raw='[Verse 1]\n'+melLine(barred,0,'flat')+'\n'+(lyricLine||result.text||'');
  S.semis=0; S.verse=1; S.mode='auto';
  stopPlay(); reparse(); renderAll();
}

  if(name==='diag'){
    const L=S.raw.replace(/\r\n?/g,'\n').split('\n');

    for(const line of L){
      if(MEL_RE.test(line)){ mel=parseMelody(line); continue; }
      if(isSection(line)||!line.trim())continue;
      const bl=parseChart(line)[0];
      if(!bl||bl.k!=='pairs')continue;
      const nCh=bl.pairs.filter(p=>p.chord).length;
      if(!nCh){ continue; }
      let sums=[];
      if(mel){ sums=[0]; for(const n of mel.notes){ if(n.bar)sums.push(0); else sums[sums.length-1]+=n.beats; }
        sums=sums.map(x=>Math.round(x*100)/100); }
      rows.push({ch:nCh,bar:bl.pairs.filter(p=>p.bar).length,
        mel:mel?mel.notes.filter(n=>!n.bar).length:0,
        melBar:mel?mel.notes.filter(n=>n.bar).length:0,sums});
      mel=null;
    }
    const tl=buildTimeline();
    body.innerHTML='<p class="note">멜로디가 코드와 안 맞을 때 원인을 찾는 화면입니다. 복사해서 보내 주시면 정확히 고칠 수 있습니다.</p>'

      if(P.playing)startPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.mix;
      P.accomp=(m!=='mel'); P.melody=(m!=='acc');
      renderToolbar(); if(P.playing)startPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{
      applyGenre(b.dataset.genre); openPanel('play');
    });
    if($('mel'))$('mel').onclick=()=>{P.melody=!P.melody;openPanel('play')};
    body.querySelectorAll('[data-minst]').forEach(b=>b.onclick=()=>{
      P.melInst=b.dataset.minst; if(P.playing)startPlay(); openPanel('play');
    });
    if($('melfit'))$('melfit').onclick=()=>{P.melFit=P.melFit===false;if(P.playing)startPlay();openPanel('play')};
    if($('playbass'))$('playbass').onclick=()=>{P.playBass=!P.playBass;if(P.playing)startPlay();openPanel('play')};
    if($('realinst'))$('realinst').onclick=()=>{P.realInst=P.realInst===false;openPanel('play')};
    body.querySelectorAll('[data-moct]').forEach(b=>b.onclick=()=>{
      P.melOct=parseInt(b.dataset.moct,10)||0; if(P.playing)startPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{
      P.genre='';P.pattern=b.dataset.pat; openPanel('play');
    });
    body.querySelectorAll('[data-beats]').forEach(b=>b.onclick=()=>{
      P.beats=parseInt(b.dataset.beats,10); if(P.playing)startPlay(); openPanel('play');
    });
    $('bpmr').oninput=e=>{const v=parseInt(e.target.value,10);setBpm(v,true);if($('bpmnum'))$('bpmnum').textContent=v;};
    $('clk').onclick=()=>{P.click=!P.click;openPanel('play')};
    $('lp').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop);openPanel('play')};
  }

  if(name==='export'){
    body.innerHTML='<p class="note">지금 보이는 키 그대로 내보냅니다. PDF는 A4 세로, 넘치면 자동으로 여러 장이 됩니다.</p>'
      +'<div class="btns"><button class="btn lg on wide" id="pdf">PDF 내려받기</button>'
      +'<button class="btn lg wide" id="png">이미지 PNG</button>'
      +'<button class="btn" id="prt">인쇄</button>'
      +'<button class="btn" id="txt">TXT</button>'
      +'<button class="btn" id="cho">ChordPro</button>'
      +'<button class="btn" id="cpy">복사</button></div>'
      +'<p class="note" style="margin-top:14px">파일 이름: <code>'+esc(baseName())+'</code><br>'
      +'다운로드가 막히면 <b>복사</b>나 <b>인쇄</b>를 쓰세요.</p>';
    $('pdf').onclick=()=>{try{saveBlob(new Blob([pdfBytes(chartCanvas())],{type:'application/pdf'}),baseName()+'.pdf');toast('PDF 내려받기 시작')}catch(e){toast('PDF 생성 실패')}};
    $('png').onclick=()=>{try{chartCanvas().toBlob(b=>{saveBlob(b,baseName()+'.png');toast('PNG 내려받기 시작')},'image/png')}catch(e){toast('이미지 생성 실패')}};
    $('prt').onclick=()=>{closePanel();setTimeout(()=>window.print(),150)};
    $('txt').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.txt');toast('TXT 내려받기 시작')};
    $('cho').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.cho');toast('ChordPro 내려받기 시작')};
    $('cpy').onclick=async()=>{try{await navigator.clipboard.writeText(chartText());toast('클립보드에 복사했어요')}catch(e){toast('복사가 막혀 있어요. 내려받기를 써 주세요.')}};
  }

  $('scrim').classList.add('open');
}
function closePanel(){closeCam();$('scrim').classList.remove('open')}
$('scrim').onclick=e=>{if(e.target===$('scrim'))closePanel()};

/* ============ 배선 ============ */
document.querySelectorAll('nav [data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$('up').onclick=()=>{S.semis=Math.min(12,S.semis+1);renderAll()};
$('down').onclick=()=>{S.semis=Math.max(-12,S.semis-1);renderAll()};
$('b-verse').onclick=()=>{const mv=maxVerse(); if(mv<2)return; S.verse=S.verse>=mv?1:S.verse+1; renderAll();};



function setFont(v){S.font=Math.max(12,Math.min(44,v));renderAll();}
function setStaffScale(v){S.staffScale=Math.max(.4,Math.min(1,Math.round(v*10)/10));renderAll();scheduleSave();}


function saveSong(){
  const t=$('title').value.trim()||'제목 없음';
  const list=load().filter(s=>s.title!==t);
  const st=new Date();
  list.unshift({id:'s'+Date.now(),title:t,raw:S.raw,semis:S.semis,
    at:st.toISOString().slice(0,10)+' '+st.toTimeString().slice(0,5)});
  toast(save(list.slice(0,40))?'콘티에 “'+t+'” 저장했습니다':'저장에 실패했어요.');
}
$('theme').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('theme').textContent=d?'어둡게':'밝게';
};
$('play').onclick=togglePlay;
$('track').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width)));
  seekTo(ratio*songSeconds());
};
$('instbtn').onclick=()=>openPanel('play');
$('loopbtn').classList.toggle('on',P.loop);
$('loopbtn').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop)};
function setBpm(v,skipSlider){
  v=Math.round(Number(v));
  if(!isFinite(v))v=P.bpm;
  P.bpm=Math.max(30,Math.min(300,v));
  $('bpm').value=P.bpm;
  if(!skipSlider&&$('bpmr'))$('bpmr').value=P.bpm;
}
$('bpmd').onclick=()=>setBpm(P.bpm-4);
$('bpmu').onclick=()=>setBpm(P.bpm+4);
$('bpm').onfocus=e=>e.target.select();
$('bpm').oninput=e=>{
  const v=parseInt(e.target.value,10);
  if(v>=30&&v<=300){P.bpm=v;if($('bpmr'))$('bpmr').value=v;}
};
$('bpm').onchange=e=>setBpm(e.target.value);
setInterval(()=>{if(!P.playing)renderTime(0)},1500);
$('bpm').onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();setBpm(e.target.value);e.target.blur();}
  if(e.key==='ArrowUp'){e.preventDefault();setBpm(P.bpm+1);}
  if(e.key==='ArrowDown'){e.preventDefault();setBpm(P.bpm-1);}
};
$('bpm').value=P.bpm;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
});
/* 집중 모드: 헤더와 도구막대를 감춰 악보만 크게 */
function setFocus(on){
  document.body.classList.toggle('focus',on);
  $('b-focus').classList.toggle('on',on);
  if(on)wakeOn(); else wakeOff();
}
$('b-mode').onclick=()=>{
  if(!hasMelody()){toast('멜로디가 있어야 악보로 볼 수 있습니다.');return;}
  S.mode=(S.mode==='text')?'staff':'text';
  renderAll();
  toast(S.mode==='text'?'가사 중심 보기':'악보 보기');
};
$('b-melonly').onclick=()=>{
  if(!hasMelody()){toast('이 곡에는 멜로디가 없습니다.');return;}
  P.accomp=(P.accomp===false); P.melody=true;
  renderToolbar(); if(P.playing)startPlay();
  toast(P.accomp===false?'멜로디만 재생합니다':'반주와 함께 재생합니다');
};
$('b-focus').onclick=()=>setFocus(!document.body.classList.contains('focus'));
$('focusout').onclick=()=>setFocus(false);

/* 연주 중 화면이 꺼지지 않게 */
let wl=null;
async function wakeOn(){
  try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null}); } }catch(e){}
}
function wakeOff(){ if(wl&&!P.playing&&!document.body.classList.contains('focus')){try{wl.release()}catch(e){} wl=null;} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&(P.playing||document.body.classList.contains('focus')))wakeOn();
});
if($("ver"))$("ver").textContent=APP_VER;
if(restoreLast())reparse();
let rsT=null;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.mode!=='text')renderChart()},250);});
renderAll();
</script>
</body>
</html>
