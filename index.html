const P={playing:false,bpm:84,genre:'',insts:['piano'],melInst:'ep',pattern:'block',beats:4,loop:true,click:false,melody:true,accomp:true,readMel:true,bySystem:true,ocrBoost:true,geomPitch:true,realInst:true,melOct:0,melFit:true,playBass:false,
         evs:[],total:0,k:0,cursorT:0,lastAt:0,t0:0,timer:null,uiTimer:null,marks:[],vmarks:[],vnext:1,cur:-1,
         sound:[],piano:true,nmarks:[],curNote:null,
         /* ★ 멜로디·반주 소리 크기를 따로 조절한다(v65, 사용자 요청).
            *"멜로디와 반주음악 경우 멜로디가 반주에 묻힌다"* — 악기를 여럿 겹치면
            반주가 두꺼워져 멜로디 한 줄이 상대적으로 작게 들린다. 0.4~2.0 배로 조절한다. */
         melVol:1,accVol:1};

function buildTimeline(){
  /* tlBars: 재생 엔진이 실제로 만든 **마디 목록**이다(v53). 사진 위 하이라이트가
     "몇째 마디인가"를 어림하지 않고 여기서 그대로 읽어 가도록 내보낸다.
     idx0 = 그 마디 첫 코드의 전역 번호(reparse 가 매긴 p.idx) — 단(사진 한 줄)이
     "몇 번째 코드부터"인지만 알면 이 번호로 마디를 짝지을 수 있다. */
  const tlBars=[];
  const evs=[], hasBar=blocks.some(b=>b.k==='pairs'&&b.pairs.some(p=>p.bar));
  let beat=0, pendingMel=null, pendingBass=null, drift=0, melNotes=0, bassNotes=0;
  let prevUp=null;                 // 앞 코드의 화음 자리 — 성부 진행의 기준

  /* ★ 음표마다 **어느 블록의 몇 번째 음인지**(bi/ni)를 이벤트에 실어 보낸다 (v60).
     채보한 오선보 위에 "지금 치는 음"을 표시하려면 이것이 필요하다. 화면이 박자를 따로
     세지 않고 **소리를 예약한 그 이벤트**를 그대로 받아 쓰므로 어긋날 수가 없다 —
     사진 하이라이트에서 이미 한 번 배운 원칙이다(CLAUDE.md 12·16번). */
  const put=(items,startBeat,fitTo,evType,baseMidi,bi)=>{
    evType=evType||'m'; baseMidi=baseMidi||60;
    const raw=items.reduce((a,it)=>a+(it.n.bar?0:it.n.beats),0);
    const k=(P.melFit!==false&&fitTo>0&&raw>0&&Math.abs(raw-fitTo)>0.01)?(fitTo/raw):1;
    let t=startBeat;
    for(const it of items){
      const n=it.n;
      if(n.bar)continue;
      const d=n.beats*k;
      if(!n.rest){
        const mi=(n.midi!==undefined)?n.midi:(baseMidi+origKey.pc+n.deg+(n.oct||0)*12);
        evs.push({type:evType,midi:mi,beats:d,at:t,bi,ni:it.ni});
        if(evType==='mb')bassNotes++; else melNotes++;
      }
      t+=d;
    }
    return t-startBeat;
  };
  const dur=g=>g.reduce((a,it)=>a+(it.n.bar?0:it.n.beats),0);

  /* 멜로디를 마디 단위로 코드 마디에 맞춘다. 못갖춘마디는 첫 마디 앞에 붙인다. */
  const layMel=(mel,barStarts,lineStart,lineBeats,evType,baseMidi)=>{
    if(!mel)return;
    const bi=mel._bi;
    const items=mel.notes.map((n,ni)=>({n,ni}));
    const groups=[[]];
    for(const it of items){ if(it.n.bar)groups.push([]); else groups[groups.length-1].push(it); }
    const gs=groups.filter(g=>g.length);
    if(!barStarts.length||gs.length<2){
      const raw=dur(items);
      if(lineBeats>0&&Math.abs(raw-lineBeats)>0.75)drift++;
      put(items,lineStart,lineBeats,evType,baseMidi,bi);   // 마디 표시가 없으면 단 길이에 맞춰 늘린다
      return;
    }
    const nb=barStarts.length, off=gs.length-nb;
    if(off>0){                                   // 못갖춘마디: 첫 마디 앞에서 끝나도록
      let t=barStarts[0];
      for(let g=off-1;g>=0;g--){ t-=dur(gs[g]); put(gs[g],t,0,evType,baseMidi,bi); }
    }
    for(let i=0;i<nb;i++){
      const g=gs[i+Math.max(0,off)];
      if(!g)break;
      if(Math.abs(dur(g)-P.beats)>0.75)drift++;
      put(g,barStarts[i],P.beats,evType,baseMidi,bi);      // 마디마다 강제로 길이를 맞춘다
    }
  };

  for(const b of blocks){
    if(b.k==='mel'){
      if(b.clef==='bass'){ if(pendingBass)layMel(pendingBass,[],beat,0,'mb',48); pendingBass=b; }
      else { if(pendingMel)layMel(pendingMel,[],beat,0); pendingMel=b; }
      continue;
    }
    if(b.k!=='pairs')continue;

    const lineStart=beat, barStarts=[];
    let bar=[];
    const flush=()=>{ if(!bar.length)return;
      barStarts.push(beat);
      tlBars.push({at:beat,beats:P.beats,idx0:bar[0].idx});
      const per=P.beats/bar.length;
      /* 화음 자리를 **여기서 한 번만** 정한다(v62). 앞 코드에서 가장 적게 움직이는 자리를
         고르므로 순서가 중요하다 — 재생할 때마다 다시 고르면 같은 곡이 달리 들린다. */
      bar.forEach(x=>{
        const vv=chordVoicing(x.chord,S.semis,prevUp);
        prevUp=vv.upper;
        evs.push({type:'c',chord:x.chord,idx:x.idx,beats:per,at:beat,v:vv});
        beat+=per;
      });
      bar=[]; };
    for(const pr of b.pairs){
      if(pr.bar){ if(hasBar)flush(); continue; }
      if(pr.chord){ bar.push(pr); if(!hasBar)flush(); }
    }
    flush();
    if(pendingMel){ layMel(pendingMel,barStarts,lineStart,beat-lineStart); pendingMel=null; }
    if(pendingBass){ layMel(pendingBass,barStarts,lineStart,beat-lineStart,'mb',48); pendingBass=null; }
  }
  if(pendingMel)layMel(pendingMel,[],beat,0);
  if(pendingBass)layMel(pendingBass,[],beat,0,'mb',48);

  /* 못갖춘마디가 0박 앞으로 나갔으면 전체를 밀어준다 */
  let minAt=0;
  for(const e of evs) if(e.at<minAt)minAt=e.at;
  if(minAt<0){ for(const e of evs)e.at-=minAt; for(const b of tlBars)b.at-=minAt; beat-=minAt; }

  const total=Math.max(beat,1);
  if(P.click)for(let t=0;t<total;t+=1)
    evs.push({type:'k',at:t,strong:Math.round(t)%P.beats===0});
  evs.sort((a,b)=>a.at-b.at||(a.type==='k'?-1:1));
  return {evs,total,hasMel:melNotes>0,melNotes,bassNotes,drift,bars:tlBars};
}
function hasMelody(){return blocks.some(b=>b.k==='mel');}
function hasBassMelody(){return blocks.some(b=>b.k==='mel'&&b.clef==='bass');}
function schedule(){
  const ctx=AC(); if(!ctx)return;
  const now=ctx.currentTime;
  for(let guard=0;guard<400;guard++){
    const spb=60/P.bpm;
    if(P.k>=P.evs.length){
      const wrapT=P.cursorT+(P.total-P.lastAt)*spb, mv=maxVerse();
      if(P.vnext<mv){                      // 1절 끝 → 2절
        P.vnext++; P.vmarks.push({t:wrapT,v:P.vnext});
      }else if(P.loop){                    // 마지막 절 끝 → 처음부터
        P.vnext=1; P.vmarks.push({t:wrapT,v:1});
      }else{
        setTimeout(stopPlay,Math.max(0,(wrapT-now)*1000)+400);
        return;
      }
      P.cursorT=wrapT; P.lastAt=0; P.k=0;
    }
    const ev=P.evs[P.k], t=P.cursorT+(ev.at-P.lastAt)*spb;
    if(t>now+.25)return;
    /* ★ 건반에 켜 둘 음(P.sound)은 **실제로 울린 것만** 적는다(v63). 예전에는 소리는
       끄고도 건반은 늘 켜서, '멜로디만'인데 반주 코드가 건반에 켜졌다. 화면이 거짓말을
       하면 건반을 보고 따라 치는 사람이 틀린다 — 이 앱에서 가장 하면 안 되는 일이다. */
    if(ev.type==='c'){
      const on=accompOn();
      if(on)strike(ctx,ev.chord,S.semis,instList(),t,ev.beats*spb*.96,ev.beats,spb,ev.v);
      P.marks.push({t,idx:ev.idx});
      /* 건반 표시는 **예약한 그 시각 그대로** 적어 둔다 — 소리를 예약한 것과 같은 숫자를
         쓰므로 화면과 소리가 어긋날 수가 없다(박자를 따로 어림하지 않는다). */
      const vv=ev.v||chordVoicing(ev.chord,S.semis);
      if(on)P.sound.push({t,e:t+ev.beats*spb*.96,k:'c',ms:[vv.bass].concat(vv.upper),
                    name:S.num?showNum(ev.chord,origKey.pc):showChord(ev.chord,chordSemis(),pref())});
    }else if(ev.type==='m'){
      const mm=ev.midi+S.semis+(P.melOct||0)*12;
      if(melodyOn()){
        voice(ctx,P.melInst,mm,t,ev.beats*spb*.92,(accompOn()?.46:.6)*(P.melVol!=null?P.melVol:1),0);
        P.sound.push({t,e:t+ev.beats*spb*.92,k:'m',ms:[mm]});
      }
      /* 채보한 오선보 위 '지금 치는 음' 표시 — 소리를 예약한 그 시각을 그대로 적어 둔다.
         ★ 이건 소리와 상관없이 늘 적는다. 반주만 듣더라도 "지금 악보 어디인지"는 보여야 한다. */
      if(ev.bi!==undefined)P.nmarks.push({t,bi:ev.bi,ni:ev.ni});
    }else if(ev.type==='mb'){
      const mm=ev.midi+S.semis;
      if(P.playBass){
        voice(ctx,'bass',mm,t,ev.beats*spb*.92,.4*(P.melVol!=null?P.melVol:1),0);
        P.sound.push({t,e:t+ev.beats*spb*.92,k:'b',ms:[mm]});
      }
      if(ev.bi!==undefined)P.nmarks.push({t,bi:ev.bi,ni:ev.ni});
    }else{
      click(ctx,t,ev.strong);
    }
    P.cursorT=t; P.lastAt=ev.at; P.k++;
  }
}
/* 재생 중 화면 갱신(시간 표시·코드 하이라이트·사진 하이라이트).
   예전에는 이걸 requestAnimationFrame 하나에만 맡겼다. 그런데 RAF 는 탭이 뒤로 가거나
   절전·저사양 상태에서 아예 멈춘다 — 그러면 소리는 계속 나는데 화면만 얼어붙어서
   "지금 어디를 연주하는지" 표시가 죽는다(실제로 한 환경에서 RAF 가 1초에 0번 불리는 걸
   확인했다). 그래서 같은 갱신을 느린 타이머로도 돌린다. 두 번 불려도 문제없게 만들어 뒀다. */
function tickUI(){
  if(!P.playing)return;
  const ctx=actx; if(!ctx)return;
  const now=ctx.currentTime;
  if(now-(P.lastT||0)>0.16){
    P.lastT=now;
    const total=songSeconds();
    let el=now-P.t0;
    if(P.loop&&total>0&&el>total)el=el%total;
    renderTime(el);
  }
  while(P.vmarks.length&&P.vmarks[0].t<=now){
    const v=P.vmarks.shift().v;
    if(S.verse!==v){S.verse=v;renderChart();renderToolbar();}
  }
  while(P.marks.length>1&&P.marks[1].t<=now)P.marks.shift();
  if(P.marks.length&&P.marks[0].t<=now&&P.marks[0].idx!==P.cur)mark(P.marks[0].idx);
  while(P.nmarks.length>1&&P.nmarks[1].t<=now)P.nmarks.shift();
  if(P.nmarks.length&&P.nmarks[0].t<=now&&P.nmarks[0]!==P.curNote){ P.curNote=P.nmarks[0]; markNote(P.curNote); }
  while(P.sound.length&&P.sound[0].e<now-0.25)P.sound.shift();
  paintPiano(now);
  if(S.mode==='sheet')paintSheet(sheetProgress());
}
function frame(){
  if(!P.playing){renderTime(0);return;}
  tickUI();
  requestAnimationFrame(frame);
}
function mark(idx){
  P.cur=idx;
  document.querySelectorAll('.ch.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('.lineblk.cur').forEach(e=>e.classList.remove('cur'));
  document.querySelectorAll('#chart text[data-cidx].now').forEach(e=>e.classList.remove('now'));
  /* 채보 오선보에서도 지금 치는 코드를 켠다 — 멜로디가 없는 줄(코드+가사만)에서는
     이것이 유일한 위치 표시다. 마디 음영도 여기서 같이 옮긴다. */
  const ct=document.querySelector('#chart text[data-cidx="'+idx+'"]');
  if(ct){ ct.classList.add('now');
    if(ct.dataset.m!==undefined&&!P.curNote)setStaffMeasure(+ct.dataset.m,ct); }
  const el=document.querySelector('.ch[data-idx="'+idx+'"]');
  if(!el)return;
  el.classList.add('now');
  const line=el.closest('.lineblk'); if(line)line.classList.add('cur');
  const r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>window.innerHeight-190)el.scrollIntoView({block:'center',behavior:'smooth'});
}
/* ============ 채보한 오선보 위 재생 위치 표시 (v60) ============
   사용자 요청 그대로 — *"원본사진으로 안볼때도 지금 진행하는 위치 사진처럼 악보에
   표기바람(하이라이트 또는 음영 등)"*. 맞는 요청이다. 원본 사진 화면에는 진작부터
   마디 상자와 재생선이 있었는데, 정작 **우리가 그린 악보에는 아무 표시가 없어서**
   그 화면에서는 어디를 치는지 알 수 없었다.
   ★ 위치는 **재생 엔진이 소리를 예약할 때 쓴 그 시각**에서 그대로 온다(P.nmarks).
     박자를 따로 세지 않으므로 소리와 어긋날 수가 없다 — 사진 하이라이트에서 이미
     같은 실수를 두 번 하고 나서 세운 원칙이다(CLAUDE.md 12·16번). */
function clearStaffNow(){
  document.querySelectorAll('#chart .nowbox.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#chart .mbox.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#chart text[data-cidx].now').forEach(e=>e.classList.remove('now'));

function setStaffMeasure(m,anchor){
  const boxes=document.querySelectorAll('#chart .mbox');
  let cur=null;
  boxes.forEach(b=>{ const on=(+b.dataset.m===m); b.classList.toggle('on',on); if(on)cur=b; });
  const el=anchor||cur;
  if(el&&P.playing){
    const r=el.getBoundingClientRect();
    const fh=(document.querySelector('footer')||{offsetHeight:180}).offsetHeight+24;
    if(r.top<80||r.bottom>window.innerHeight-fh)
      el.scrollIntoView({block:'center',behavior:'smooth'});
    /* 원본 단이 화면보다 넓어 가로로 넘겼으면(v61) 그쪽도 따라간다 —
       사진 보기에서 크게 보기를 했을 때와 똑같이. 안 그러면 넘어간 마디는 볼 수 없다. */
    const line=el.closest?el.closest('.staffline'):null;
    if(line&&line.scrollWidth>line.clientWidth+4&&cur){
      const bx=+cur.getAttribute('x'), bw=+cur.getAttribute('width');
      const svg=cur.ownerSVGElement;
      const vb=(svg&&svg.getAttribute('viewBox')||'0 0 1 1').split(/\s+/).map(Number);
      const px=(bx+bw/2)/(vb[2]||1)*line.scrollWidth;
      const want=Math.max(0,Math.min(line.scrollWidth-line.clientWidth,px-line.clientWidth/2));
      if(Math.abs(line.scrollLeft-want)>8)line.scrollLeft=want;
    }
  }
}
function markNote(nm2){

   사용자 신고: *"예수 내 구주. 파, 미 인데 파만 나왔다!"*
   ★ 박수 검사로는 절대 못 잡는다 — 온음표 하나(4박)나 2분음표 둘(2+2박)이나 합은 같다.
   ★ **모든 절이 한목소리로 모자랄 때만** 센다(음절 수의 최솟값). 가사는 글자 인식이라
     한 절이 깨지는 일이 흔한데, 그것까지 경고하면 곧 무시하게 된다. */
function countLackNotes(){
  let n=0, pm=null;
  for(const b of blocks){
    if(b.k==='mel'){pm=b;continue;}
    if(b.k!=='pairs')continue;
    let M=null; try{ M=measuresOfBlock(pm,b); }catch(e){ M=null; }
    pm=null;
    if(!M)continue;
    for(let m=0;m<M.N;m++){
      const notes=(M.melM[m]||[]).filter(it=>it&&!it.n.bar);
      const si=notes.filter(it=>!it.n.rest).length;
      if(!si)continue;
      const vs=M.verses.filter(v=>sylsOf(M.lyM[v]&&M.lyM[v][m]).length);
      if(!vs.length)continue;
      const need=Math.min.apply(null,vs.map(v=>sylsOf(M.lyM[v][m]).length));
      if(need>si)n++;
    }
  }
  return n;
}

   ★ applyGeomPitch 와 같은 원칙 — **마디 수가 정확히 같을 때만** 쓴다. 하나라도 다르면
     어느 마디가 어느 단인지 맞출 근거가 없고, 어긋난 채로 따라가면 원본과 다른 자리에서
     줄이 바뀌어 오히려 더 헷갈린다. 그때는 지금까지처럼 폭에 맞춰 넣는다. */
function staffBreaks(){
  if(!S.orig||!S.orig.pages)return null;
  const ends=[]; let acc=0;
  for(const pg of S.orig.pages)for(const sy of (pg.sys||[])){
    if(!sy.seg||!sy.seg.length)return null;        // 마디선을 못 찾은 단이 하나라도 있으면 포기
    acc+=sy.seg.length; ends.push(acc);
  }
  if(!ends.length)return null;
  let total=0, pm=null;
  for(const b of blocks){
    if(b.k==='mel'){pm=b;continue;}
    if(b.k!=='pairs')continue;
    total+=measuresOfBlock(pm,b).N; pm=null;
  }
  if(total!==acc)return null;                      // 세어 본 마디 수가 다르면 손대지 않는다
  return new Set(ends.slice(0,-1));                // 마지막 단 뒤에는 끊을 것이 없다
}
function renderChartStaff(){

      +'<b>⚠음표 N개</b> 라고 적힌 곳입니다. 가사 음절보다 음표가 그만큼 적습니다. '
      +'<span style="opacity:.7">그 마디 음표를 누른 뒤 <b>설정 → 오선보</b>에서 '
      +'<b>둘로 쪼개기</b>(두 음을 하나로 읽은 경우) 또는 <b>＋ 넣기</b>로 채워 주세요.</span>';
    el.appendChild(d);
  }
  let pendMel=null, pendBass=null, measureNo=1;

     한 줄에 4마디씩 보이도록 한다 — [Verse]/[Chorus] 같은 구간 표시나
     곡 끝에서만 끊는다. */

     실제 화면 폭 ÷ 확대율로 잡으면 글자가 정확히 확대율 배로 렌더된다.
     이렇게 해야 폭이 좁은 휴대폰에서는 한 행에 2~3마디만 넣어 글자 크기를
     지키고, 넓은 화면에서는 4마디를 꽉 채운다. 예전엔 논리 폭이 1000 고정이라
     휴대폰에서 글자가 3분의 1로 줄어들어 아예 읽을 수 없었다. */
  const zoom=Math.max(.5,Math.min(2,S.staffScale||1));
  const rowW=Math.max(320,Math.round((el.clientWidth||1000)/zoom));
  const sysBreaks=staffBreaks();
  let accMel=[], accCh=[], accLy={}, accFit=[], accBass=[];

    if(!accMel.length)return;

  for(const b of blocks){

    if(b.k==='blank'){ continue; }
    if(b.k==='sec'){ flush(); const d=document.createElement('div');d.className='section';d.textContent=b.text;el.appendChild(d);continue; }
    const {melM,chM,lyM,verses,N,fitM}=measuresOfBlock(pendMel,b);
    const {melM:bassM}=measuresOfBlock(pendBass,b,N);
    pendMel=null; pendBass=null;
    if(!N)continue;
    const priorLen=accMel.length;
    accMel=accMel.concat(melM); accCh=accCh.concat(chM); accFit=accFit.concat(fitM); accBass=accBass.concat(bassM);
    const known=new Set(Object.keys(accLy).map(Number)); verses.forEach(v=>known.add(v));
    known.forEach(v=>{
      if(!accLy[v])accLy[v]=new Array(priorLen).fill(0).map(()=>[]);
      accLy[v]=accLy[v].concat(lyM[v]||new Array(N).fill(0).map(()=>[]));
    });
  }
  flush();
  el.querySelectorAll('[data-bi]').forEach(r=>r.onclick=()=>{
    S.selNote={bi:+r.dataset.bi,ni:+r.dataset.ni};
    /* ★ 고른 음을 **악보에 다시 그려야** 표시가 바뀐다(v67). 여태 고르기만 하고 다시
       그리지 않아, 어느 음을 고쳤는지 악보에서 알 수 없었다 — 폰에서 특히 답답했다. */
    renderAll(); openPanel('staff');
  });
  el.querySelectorAll('[data-cidx]').forEach(t=>t.onclick=()=>{
    const i=+t.dataset.cidx;
    if(P.playing){ if(seekToChord(i))return; }
    for(const bb of blocks) if(bb.k==='pairs') for(const p of bb.pairs)
      if(p.idx===i&&p.chord){ tapChord(p.chord,chordSemis()); return; }
  });
}
/* 원본 사진을 그대로 띄우고, 각 단(사진에서 찾아낸 오선 한 줄) 위에 하이라이트를 얹는다.
   S.orig = {pages:[{url,sys:[{t0,t1,b0,b1}]}], total} — b0/b1 은 그 단이 곡 전체에서
   차지하는 진행 구간(0~1). 재생할 때 frame() 이 이 값으로 하이라이트를 옮긴다. */
function renderSheet(){
  const el=$('chart');
  el.style.fontSize=S.font+'px'; el.style.columnCount=1;
  el.innerHTML='';
  const o=S.orig;
  if(!o||!o.pages||!o.pages.length){
    el.innerHTML='<div class="callout err"><b>원본 사진이 없습니다.</b><br>'
      +'<b>가져오기</b>에서 악보 사진을 다시 넣어 주세요. 직접 입력한 곡에는 원본 사진이 없습니다.</div>';
    MEASURE.txt=''; MEASURE.total=0;
    return;
  }
  /* 마디 번호는 단을 넘어가며 계속 센다 — 사진 위 번호와 아래 '12/34마디' 가 같은 수다 */
  let mn=0;
  o.pages.forEach(pg=>(pg.sys||[]).forEach(sy=>{ mn+=(sy.seg?sy.seg.length:0); }));
  MEASURE.total=mn;
  const note=document.createElement('div');
  note.className='orignote';
  note.innerHTML=(mn
      ? '재생하면 <b>지금 치는 마디</b>가 사진 위에 상자로 표시되고, 아래 건반에 <b>누르는 음</b>이 켜집니다. '
      : '재생하면 지금 연주 중인 단이 사진 위에 표시됩니다. ')
    +'<b>누른 자리부터 재생</b>합니다.'
    +(o.approx?' 단 구분을 못 찾은 사진은 쪽 전체를 한 덩어리로 표시합니다.':'')
    +(mn?' 마디선은 사진에서 직접 찾은 것이라 마디 수가 원본과 같습니다('+mn+'마디).':'');
  el.appendChild(note);
  /* 사진을 키워서 보는 단추 — 원본 사진은 한 쪽을 통째로 띄우면 음표가 너무 작다.
     키운 채로도 "지금 치는 마디"를 가운데로 끌고 다니므로 손으로 스크롤할 일이 없다. */
  const zbar=document.createElement('div'); zbar.className='sheetbar';
  const ZS=[1,1.6,2.4,3.4];
  zbar.innerHTML='<span style="font-size:12px;color:var(--dim)">크게 보기</span>'
    +ZS.map(z=>'<button class="btn'+(Math.abs((S.sheetZoom||1)-z)<.01?' on':'')+'" data-z="'+z+'">'
      +(z===1?'원래 크기':'×'+z)+'</button>').join('');
  zbar.querySelectorAll('[data-z]').forEach(bt=>bt.onclick=()=>{
    S.sheetZoom=+bt.dataset.z; renderChart(); scheduleSave();
    if(P.playing)paintSheet(sheetProgress());
  });
  el.appendChild(zbar);
  const wrap=document.createElement('div'); wrap.className='origwrap';
  const Z=Math.max(1,S.sheetZoom||1);
  if(Z>1){ wrap.classList.add('zoom'); wrap.style.setProperty('--szoom',Z); }
  /* 재생 타임라인에서 읽어 온 단별 구간(v53). 못 읽으면 null 이고, 그때는 예전 어림값을 쓴다. */
  const EB=origBeats(o);
  let acc=0, si=-1;
  o.pages.forEach((pg,pi)=>{
    const d=document.createElement('div'); d.className='origpg';
    const img=document.createElement('img');
    img.src=pg.url; img.alt=(pi+1)+'쪽 원본 악보'; img.loading='lazy';
    d.appendChild(img);
    (pg.sys||[]).forEach(sy=>{
      si++;
      const ex=EB?EB[si]:null;
      const b=document.createElement('div');
      b.className='origsys';
      b.style.top=(sy.t0*100).toFixed(3)+'%';
      b.style.height=((sy.t1-sy.t0)*100).toFixed(3)+'%';
      b.dataset.b0=ex?ex.b0:sy.b0; b.dataset.b1=ex?ex.b1:sy.b1;
      b._kx=sy.kx||null; b._kb=sy.kb||null;
      /* 사진에서 찾은 마디 수와 재생 엔진이 만든 마디 수가 **정확히 같을 때만** 마디끼리
         1:1 로 짝짓는다. 그러면 재생선이 마디선을 넘는 순간이 소리와 한 치도 다르지 않다.
         하나라도 다르면 짝지을 근거가 없으므로 단 전체를 고르게 훑는 예전 방식으로 둔다. */
      const ex1=ex&&sy.seg&&ex.bars&&sy.seg.length===ex.bars.length?ex:null;
      const span=ex1?(ex1.b1-ex1.b0):0;
      let inner='<span class="lab">'+(sy.n||'')+'</span>';
      (sy.seg||[]).forEach((sg,mi)=>{
        acc++;
        let fa='';
        if(ex1&&span>0){
          const mb=ex1.bars[mi];
          const f0=(mb.at/ex1.tot-ex1.b0)/span, f1=((mb.at+mb.beats)/ex1.tot-ex1.b0)/span;
          fa=' data-f0="'+f0.toFixed(5)+'" data-f1="'+f1.toFixed(5)+'"';
        }
        inner+='<div class="origbar" data-x0="'+sg.x0.toFixed(4)+'" data-x1="'+sg.x1.toFixed(4)+'"'
          +fa+' data-mn="'+acc+'" style="left:'+(sg.x0*100).toFixed(3)+'%;width:'
          +((sg.x1-sg.x0)*100).toFixed(3)+'%"><span class="mno">'+acc+'</span></div>';
      });
      b.innerHTML=inner+'<div class="origline"></div>';
      /* 마디 안에서 '몇 박째 → 가로 어디' 꺾은선을 상자에 붙여 둔다(사진에서 잰 음표 자리) */
      if(ex1)b.querySelectorAll('.origbar').forEach((bx,mi)=>{
        const sg=sy.seg[mi]; if(sg&&sg.pb&&sg.px){ bx._pb=sg.pb; bx._px=sg.px; }
      });
      /* 누른 자리부터 재생 — 마디를 찾았으면 그 마디 머리로, 아니면 단 머리로 */
      b.onclick=(ev)=>{
        const r=b.getBoundingClientRect();
        const fx=r.width>0?Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)):0;
        const f=sysFrac(b,fx);
        /* 사진은 한 절치이므로 **지금 부르는 절 안에서** 그 자리로 간다.
           (예전엔 곡 전체 길이에 곡해서, 2절짜리 곡이면 엉뚱하게 절반 자리로 갔다.) */
        const b0=+b.dataset.b0, b1=+b.dataset.b1;
        const pass=passSeconds(), vi=Math.max(0,(P.playing?S.verse:1)-1);
        const t=pass*(vi+Math.max(0,Math.min(0.999,b0+(b1-b0)*f)));
        if(!P.playing)startPlay(); seekTo(t);
      };
      d.appendChild(b);
    });
    wrap.appendChild(d);
  });
  el.appendChild(wrap);
  paintSheet(P.playing?sheetProgress():-1);
}
/* 한 절(악보 한 바퀴)의 길이. 사진은 한 절치 악보다. */
function passSeconds(){
  const mv=Math.max(1,maxVerse());
  return songSeconds()/mv;
}
/* 지금 재생 위치를 0~1 진행도로 — **한 절 안에서의 자리**다.
   ★ v53에서 고친 버그. 여기서 `songSeconds()` 로 나누고 있었는데 그건 **절 반복까지 포함한
     곡 전체 길이**다(2절이면 2배). 사진은 한 절치 악보이므로, 2절짜리 곡에서 사진
     하이라이트가 정확히 **절반 속도**로 기어갔다. 1절 끝날 무렵에는 사진이 아직 한가운데를
     가리키고 있다 — 사용자가 *"진행 속도와 표시되는 부분이 전혀 다르다. 악보에서는 A코드를
     가리키면서 A코드 소리가 들려야 하는데 전혀 아니다"* 라고 한 것이 정확히 이것이다.
     바로 위 주석에는 "절 반복은 무시하고 한 절 안에서의 위치"라고 **쓰여 있었는데 코드가
     그렇게 되어 있지 않았다** — 주석이 맞고 코드가 틀린 경우였다.
     나머지(%)를 쓰면 절이 바뀔 때 사진이 저절로 처음으로 돌아간다(반복 재생도 같다). */
function sheetProgressAt(el){
  const pass=passSeconds(); if(!(pass>0))return -1;
  if(el<0)return 0;                       // 시작 직전 준비 구간(0.25초)
  return Math.max(0,Math.min(1,(el%pass)/pass));
}
function sheetProgress(){
  return actx?sheetProgressAt(actx.currentTime-P.t0):-1;
}
/* 단 안에서의 진행도(f, 0~1) → 사진 가로 자리(0~1).
   ★ 고르게 나누지 않는다. staffGeom 이 음표마다 **잰 x 자리**와 **잰 길이**를 갖고 있으니
     그 사이를 잇는다 — 조판은 음 길이에 비례해 간격이 벌어지므로 직선 보간과 많이 다르다
     (한 마디에 온음표 하나만 있는 곳에서 특히). 잰 값이 없으면 그대로 직선이다. */
function sysX(b,f){
  const kb=b._kb, kx=b._kx;
  if(!kb||!kx||kb.length<2)return f;
  let i=kb.length-1;
  while(i>0&&kb[i]>f)i--;                 // 같은 박에 점이 둘이면 뒤엣것(다음 마디 첫 음)을 쓴다
  const a=kb[i], b2=(i+1<kb.length)?kb[i+1]:1;
  const xa=kx[i], xb=(i+1<kx.length)?kx[i+1]:1;
  const t=(b2>a)?(f-a)/(b2-a):0;
  return Math.max(0,Math.min(1,xa+(xb-xa)*Math.max(0,Math.min(1,t))));
}
/* 한 마디 안에서 '몇 박째(t, 0~1)' → 사진 가로 자리(0~1).
   마디 안 음표 자리를 알면 그 사이를 잇고(조판은 음 길이에 비례해 벌어진다),
   모르면 마디를 고르게 훑는다. 어느 쪽이든 **마디선에서 반드시 다시 맞춰진다.** */
function barX(bx,t){
  const pb=bx._pb, px=bx._px;
  const x0=+bx.dataset.x0, x1=+bx.dataset.x1;
  if(!pb||!px||pb.length<2)return x0+(x1-x0)*Math.max(0,Math.min(1,t));
  let i=pb.length-1; while(i>0&&pb[i]>t)i--;
  const a=pb[i], b2=(i+1<pb.length)?pb[i+1]:1;
  const xa=px[i], xb=(i+1<px.length)?px[i+1]:x1;
  const u=(b2>a)?(t-a)/(b2-a):0;
  return Math.max(0,Math.min(1,xa+(xb-xa)*Math.max(0,Math.min(1,u))));
}
/* sysX 의 반대 — 사진에서 누른 가로 자리(0~1)를 그 단 안의 진행도로.
   마디마다 박 구간이 붙어 있으면 그걸 먼저 쓴다(그래야 누른 마디가 정확히 그 마디로 간다). */
function sysFrac(b,x){
  const bars=b.querySelectorAll('.origbar');
  for(const bx of bars){
    if(bx.dataset.f0===undefined)break;
    const x0=+bx.dataset.x0, x1=+bx.dataset.x1;
    if(x<x0||x>=x1)continue;
    const f0=+bx.dataset.f0, f1=+bx.dataset.f1;
    const pb=bx._pb, px=bx._px;
    let t=(x1>x0)?(x-x0)/(x1-x0):0;
    if(pb&&px&&px.length>1){
      let i=px.length-1; while(i>0&&px[i]>x)i--;
      const xa=px[i], xb=(i+1<px.length)?px[i+1]:x1;
      const a=pb[i], b2=(i+1<pb.length)?pb[i+1]:1;
      t=a+(b2-a)*((xb>xa)?Math.max(0,Math.min(1,(x-xa)/(xb-xa))):0);
    }
    return Math.max(0,Math.min(1,f0+(f1-f0)*t));
  }
  return sysFracGeom(b,x);
}
function sysFracGeom(b,x){
  const kb=b._kb, kx=b._kx;
  if(!kb||!kx||kx.length<2)return x;
  let i=kx.length-1;
  while(i>0&&kx[i]>x)i--;
  const xa=kx[i], xb=(i+1<kx.length)?kx[i+1]:1;
  const a=kb[i], b2=(i+1<kb.length)?kb[i+1]:1;
  const t=(xb>xa)?(x-xa)/(xb-xa):0;
  return Math.max(0,Math.min(1,a+(b2-a)*Math.max(0,Math.min(1,t))));
}
/* 진행도에 맞춰 마디 상자와 재생선을 옮긴다. p<0 이면 전부 끈다. */
function paintSheet(p){
  const boxes=document.querySelectorAll('#chart .origsys');
  if(!boxes.length){MEASURE.txt='';return;}
  let cur=null, mtxt='', curX=0;
  boxes.forEach(b=>{
    const b0=+b.dataset.b0, b1=+b.dataset.b1;
    const on=p>=0&&p>=b0&&p<b1;
    b.classList.toggle('on',on);
    const bars=b.querySelectorAll('.origbar');
    if(!on){ bars.forEach(x=>x.classList.remove('now')); return; }
    cur=b;
    const f=(b1>b0)?(p-b0)/(b1-b0):0;
    /* ★ 마디를 **박으로** 고른다(v53). 예전엔 재생선의 가로 자리(x)를 먼저 구하고 그 x 가
       어느 마디 상자 안인지 되물었다 — 그러면 '지금 몇째 마디'가 사진에서 잰 음표 자리를
       거쳐 나오므로, 음표 길이를 하나만 잘못 재도 마디가 한 칸 밀려 보인다.
       지금은 마디마다 재생 엔진이 준 박 구간(f0~f1)이 붙어 있으므로 그걸로 바로 고르고,
       가로 자리는 **고른 마디 안에서만** 구한다. 소리와 어긋날 수가 없다. */
    let x=null, hitBar=null;
    bars.forEach(bx=>{
      const f0=bx.dataset.f0, f1=bx.dataset.f1;
      const hit=(f0!==undefined&&f1!==undefined)?(f>=+f0&&f<+f1):false;
      if(hit)hitBar=bx;
    });
    if(hitBar){
      const f0=+hitBar.dataset.f0, f1=+hitBar.dataset.f1;
      const t=(f1>f0)?(f-f0)/(f1-f0):0;
      x=barX(hitBar,t);
      bars.forEach(bx=>bx.classList.toggle('now',bx===hitBar));
      mtxt=hitBar.dataset.mn+(MEASURE.total?'/'+MEASURE.total:'')+'마디';
    }else{
      x=sysX(b,f);
      bars.forEach(bx=>{
        const hit=x>=+bx.dataset.x0&&x<+bx.dataset.x1;
        bx.classList.toggle('now',hit);
        if(hit)mtxt=bx.dataset.mn+(MEASURE.total?'/'+MEASURE.total:'')+'마디';
      });
    }
    const h=b.querySelector('.origline');
    if(h)h.style.left=(x*100).toFixed(2)+'%';
    curX=x;
  });
  MEASURE.txt=(p>=0)?mtxt:'';
  if(cur&&P.playing){
    const r=cur.getBoundingClientRect();
    const fh=(document.querySelector('footer')||{offsetHeight:180}).offsetHeight+24;
    const top=80, bot=window.innerHeight-fh, vis=bot-top;
    /* ★ scrollIntoView({block:'center'}) 를 쓰지 않는다 — 크게 보기(×2.4)에서는 한 단이
       화면보다 커져서, 가운데 맞추면 오선이 통째로 화면 밖으로 밀려난다(위쪽에 검은 여백만
       남았다). 단의 **위쪽**을 보이는 영역의 1/4 지점에 놓는 게 어느 배율에서나 맞다. */
    if(r.top<top||r.bottom>bot||r.height>vis){
      const y=window.scrollY+r.top-top-Math.max(0,(vis-Math.min(r.height,vis))*0.25);
      window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
    }
    /* 키워 놓았으면 가로로도 따라간다 — 지금 치는 마디가 늘 화면 가운데 오게 */
    const wr=cur.closest('.origwrap');
    if(wr&&wr.scrollWidth>wr.clientWidth+4){
      const want=cur.offsetLeft+cur.offsetWidth*curX-wr.clientWidth/2;
      const lim=Math.max(0,Math.min(wr.scrollWidth-wr.clientWidth,want));
      if(Math.abs(wr.scrollLeft-lim)>8)wr.scrollLeft=lim;
    }
  }
}
/* ============ 건반 표시 (v52) ============
   사용자 요청의 핵심 — *"한글 채보보다 악보 음 높이·박자·쉼표·코드가 더 중요하다.
   마디마디마다 보여 주고, 밑에 피아노 어떤 음이 눌렸는지도 표기해서 보여 줘라. 그럼
   한글이나 가사 등을 따로 변환 안 해도 되고 실제 사진을 사용해서 위에다가 표시만 하면
   된다."* 맞는 판단이다. 원본 사진은 항상 100% 정확한 악보이고, 앱이 보탤 수 있는 건
   **지금 어디를(마디) · 무엇을(건반)** 둘뿐이다.
   ★ 표시 시각은 schedule() 이 **소리를 예약할 때 쓴 그 시각**을 그대로 받아 쓴다.
     박자를 따로 세지 않으므로 원리적으로 소리와 어긋날 수 없다. */
const WHITE_PC=[0,2,4,5,7,9,11];
const isWhiteKey=m=>WHITE_PC.indexOf(mod(m))>=0;
let PIANO={lo:0,hi:0,el:null};
let MEASURE={txt:'',total:0};

/* 이 곡이 실제로 쓰는 음역만 그린다 — 88건반을 다 그리면 휴대폰에서 건반 하나가 2px 이 된다 */
/* ★ 그리는 음역도 **울릴 것만** 본다(v63) — '멜로디만'인데 반주 화음까지 넣어 음역을
   잡으면, 건반이 쓸데없이 넓어져 정작 켜지는 멜로디 건반이 좁쌀만 해진다. */
function pianoRange(){
  let lo=127,hi=0;
  const add=m=>{ if(m<lo)lo=m; if(m>hi)hi=m; };
  const mOn=melodyOn(), cOn=accompOn();
  for(const e of (P.evs||[])){
    if(e.type==='m'){ if(mOn)add(e.midi+S.semis+(P.melOct||0)*12); }
    else if(e.type==='mb'){ if(P.playBass)add(e.midi+S.semis); }
    else if(e.type==='c'&&e.chord&&cOn){ const v=e.v||chordVoicing(e.chord,S.semis); add(v.bass); v.upper.forEach(add); }
  }
  if(lo>hi){lo=48;hi=84;}
  lo=Math.max(21,Math.floor(lo/12)*12); hi=Math.min(108,Math.ceil((hi+1)/12)*12);
  while(hi-lo<36){ if(hi<=95)hi+=12; else if(lo>=33)lo-=12; else break; }
  return {lo,hi};
}
function renderPiano(){
  const svg=$('piano'); if(!svg||!window.innerWidth)return;   // 창이 접혀 있으면 비율을 못 잰다
  const r=pianoRange();
  /* SVG 는 폭 100% 로 늘어난다. 그래서 viewBox 의 가로:세로 비가 곧 화면에서의 높이다 —
     건반 높이를 픽셀로 정해 두고 거기서 viewBox 세로를 거꾸로 구한다. 예전처럼 비율을
     고정해 두면 넓은 화면에서 건반이 200px 로 치솟거나(잘려서 가운데 우표만 하게 보인다)
     좁은 화면에서 뭉개진다. */
  let cw=(svg.parentNode&&svg.parentNode.clientWidth)||0;
  if(cw<240)cw=window.innerWidth||360;          // 아직 자리를 못 잡았으면 창 폭으로
  cw=Math.max(240,cw);
  if(PIANO.lo===r.lo&&PIANO.hi===r.hi&&PIANO.cw===cw&&PIANO.el)return;
  PIANO.lo=r.lo; PIANO.hi=r.hi; PIANO.cw=cw;
  const whites=[]; for(let m=r.lo;m<=r.hi;m++)if(isWhiteKey(m))whites.push(m);
  if(!whites.length)return;
  const WK=10, Wd=whites.length*WK;
  /* 악보가 주인공이다 — 건반은 낮게 깔고, 좁은 화면일수록(세로 여유가 없다) 더 낮춘다 */
  const TH=Math.max(46,Math.min(78,Math.round(cw*0.092),Math.round((window.innerHeight||700)*0.17)));
  const H=Math.max(14,TH*Wd/cw), WH=H*0.88, BK=6.4, BH=WH*0.63;
  const wi=new Map(); whites.forEach((m,i)=>wi.set(m,i));
  let g='';
  whites.forEach((m,i)=>{
    g+='<rect class="wk" data-m="'+m+'" x="'+(i*WK)+'" y="0" width="'+WK+'" height="'+WH+'" rx="1.4"/>'
      +'<text class="kl" x="'+(i*WK+WK/2)+'" y="'+(WH-H*0.09).toFixed(2)+'" font-size="'+(H*0.15).toFixed(2)+'">'+SHARP[mod(m)]+'</text>';
    if(mod(m)===0)g+='<text class="oc" x="'+(i*WK+WK/2)+'" y="'+(H-H*0.015).toFixed(2)+'" font-size="'+(H*0.12).toFixed(2)+'">C'+(Math.floor(m/12)-1)+'</text>';
  });
  for(let m=r.lo;m<=r.hi;m++){
    if(isWhiteKey(m))continue;
    const i=wi.get(m-1); if(i===undefined)continue;
    const x=(i+1)*WK-BK/2;
    g+='<rect class="bk" data-m="'+m+'" x="'+x.toFixed(2)+'" y="0" width="'+BK+'" height="'+BH.toFixed(2)+'" rx="1.2"/>'
      +'<text class="kl" x="'+(x+BK/2).toFixed(2)+'" y="'+(BH-H*0.06).toFixed(2)+'" font-size="'+(H*0.13).toFixed(2)+'">'+SHARP[mod(m)]+'</text>';
  }
  svg.setAttribute('viewBox','0 0 '+Wd+' '+H);
  svg.innerHTML=g;
  PIANO.el=new Map();
  svg.querySelectorAll('[data-m]').forEach(k=>PIANO.el.set(+k.dataset.m,k));
}
/* now = 오디오 시계. 그 순간 실제로 울리고 있는 음만 켜 둔다. */
function paintPiano(now){
  if(!PIANO.el)return;
  const onM=new Map();
  let ch='', mel='';
  if(P.playing&&now){
    for(const sd of P.sound){
      if(sd.t>now||sd.e<=now)continue;
      for(const m of sd.ms) if(sd.k==='m'||!onM.has(m))onM.set(m,sd.k==='m'?'on':'onc');
      if(sd.k==='c'&&sd.name)ch=sd.name;
      if(sd.k==='m')mel=SHARP[mod(sd.ms[0])]+(Math.floor(sd.ms[0]/12)-1);
    }
  }
  PIANO.el.forEach((el,m)=>{
    const c=onM.get(m)||'';
    el.classList.toggle('on',c==='on');
    el.classList.toggle('onc',c==='onc');
  });
  const lab=$('pianolab');
  /* 범례도 지금 켜져 있는 것만 — 안 울리는 색을 설명해 두면 "왜 안 켜지지?"가 된다(v63) */
  const lg=(melodyOn()?'<i class="m"></i>멜로디':'')+(accompOn()?'<i class="c"></i>반주':'');
  if(lab)lab.innerHTML=(MEASURE.txt?'<span class="mn">'+esc(MEASURE.txt)+'</span>':'')
    +(ch?'<b>'+esc(ch)+'</b>':'')
    +(mel?'<span class="mel">'+esc(mel)+'</span>':'')
    +(lg?'<span class="lg">'+lg+'</span>':'<span class="lg">소리 없음</span>');
}

/* 아래 고정 막대가 실제로 몇 px 인지 재서 본문 아래 여백에 그대로 쓴다.
   예전엔 182/296/96 같은 숫자를 박아 두었는데, 건반이 생기면서 화면마다 달라져
   악보가 막대에 가리거나 반대로 빈 공간이 한 뼘씩 남았다. 재는 게 맞다. */

function renderChartText(){
  const el=$('chart'),sm=chordSemis(),p=pref(),ci=capoInfo();
  el.style.fontSize=S.font+'px';
  el.style.columnCount=S.col?2:1; el.style.columnGap='28px';
  el.innerHTML='';
  if(S.capo&&ci){
    const d=document.createElement('div');d.className='capo';
    d.innerHTML='카포 <b>'+ci.fret+'</b>프렛 · '+nm(ci.shape,PREF[ci.shape])+' 폼으로 잡으면 실제로는 '+esc(targetLabel())+'로 들립니다';
    el.appendChild(d);
  }
  for(const b of blocks){
    if(b.k==='blank'){const d=document.createElement('div');d.style.height=(S.font*.9)+'px';el.appendChild(d);continue;}
    if(b.k==='sec'){const d=document.createElement('div');d.className='section';d.textContent=b.text;el.appendChild(d);continue;}
    if(b.k==='mel')continue;
    const row=document.createElement('div');row.className='lineblk';
    let meas=document.createElement('span'), nIn=0; meas.className='meas';
    const flushMeas=()=>{ if(nIn)row.appendChild(meas);
      meas=document.createElement('span'); meas.className='meas'; nIn=0; };
    for(const pr of pairsForVerse(b,S.verse)){
      if(pr.bar){ flushMeas(); continue; }
      const label=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;
      const wrap=document.createElement('span');wrap.className='pair';
      const ch=document.createElement('span');
      ch.className='ch'+(pr.chord?'':' plain');
      ch.style.fontSize=(S.font*.88)+'px';
      ch.style.minHeight=(S.font*1.2)+'px';
      ch.textContent=label;
      if(pr.chord){
        ch.dataset.idx=pr.idx;
        if(pr.idx===P.cur){ch.classList.add('now');row.classList.add('cur');}
        ch.onclick=()=>{ if(P.playing){ if(seekToChord(pr.idx))return; } tapChord(pr.chord,sm); };
        ch.setAttribute('role','button');ch.tabIndex=0;
        ch.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();
          if(P.playing&&seekToChord(pr.idx))return; tapChord(pr.chord,sm);}};
      }
      const ly=document.createElement('span');ly.className='ly';ly.textContent=pr.text;
      wrap.appendChild(ch);wrap.appendChild(ly);meas.appendChild(wrap);nIn++;
    }
    flushMeas();
    el.appendChild(row);
  }
}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let DUR={key:'',sec:0};
function songSeconds(){
  const key=S.raw.length+'|'+P.bpm+'|'+P.beats+'|'+S.verse;
  if(DUR.key===key)return DUR.sec;
  const tl=buildTimeline();
  DUR={key,sec:tl.total*(60/P.bpm)*Math.max(1,maxVerse())};
  return DUR.sec;
}
function renderTime(elapsed){
  const total=songSeconds();
  const el=Math.min(elapsed===undefined?0:elapsed,total);
  const t=$('time'); if(t)t.textContent=fmt(el)+' / '+fmt(total);
  const f=$('bar-fill'); if(f)f.style.width=(total>0?Math.min(100,el/total*100):0)+'%';
}
/* 원하는 지점부터 다시 재생 */
function seekTo(sec){
  const ctx=AC(); if(!ctx)return;
  const tl=buildTimeline();
  if(!tl.evs.length)return;
  const spb=60/P.bpm, pass=tl.total, mv=Math.max(1,maxVerse());
  const total=pass*spb*mv;
  sec=Math.max(0,Math.min(total-0.05,sec));
  const beat=sec/spb;
  const vi=Math.min(mv-1,Math.floor(beat/pass)), inPass=beat-vi*pass;
  if(!P.playing){ S.verse=vi+1; startPlay(); }
  P.evs=tl.evs; P.total=tl.total;
  let k=0; while(k<P.evs.length&&P.evs[k].at<inPass)k++;
  P.k=k; P.lastAt=inPass; P.vnext=vi+1;
  P.cursorT=ctx.currentTime+0.08;
  P.t0=P.cursorT-sec;
  P.marks=[]; P.vmarks=[]; P.cur=-1; P.sound=[];
  if(S.verse!==vi+1){S.verse=vi+1;renderChart();renderToolbar();}
  renderTime(sec);
}
/* ★★ 재생 중에 설정을 바꿨면 **그 자리에서 이어서** 다시 짠다 (v64, 사용자 요청).
   사용자 요청: *"악기를 추가하거나 빼면 무조건 처음부터 새로 시작하는데,
   처음부터 시작하지 말고 기존 재생하고 있을때 자연스럽게 이어서 하면 된다"*.
   예전에는 악기·멜로디·박자를 건드리면 startPlay() 를 다시 불렀는데, 그건 **처음으로
   되돌리기**다. 연습하다가 소리를 바꾸려면 곡을 처음부터 다시 들어야 했다.
   ★ seekTo 가 이미 "임의의 자리에서 예약을 다시 짜는" 일을 한다 — 지금 시각을 넣어 주면
     그대로 이어진다. 이미 예약된 0.25초치는 옆에 섞여 들리지만 귀에 녹지 않는다.
   ★ 재생 중이 아니면 아무 일도 하지 않는다(멈춰 둔 곳에 그대로 머무른다). */
function resyncPlay(){
  if(!P.playing)return;
  const ctx=actx; if(!ctx)return;
  seekTo(Math.max(0,ctx.currentTime-P.t0));
}
function seekToChord(idx){
  const tl=buildTimeline();
  const e=tl.evs.find(x=>x.type==='c'&&x.idx===idx);
  if(!e)return false;
  const spb=60/P.bpm, vi=Math.max(0,S.verse-1);
  seekTo((vi*tl.total+e.at)*spb);
  return true;
}

function renderToolbar(){
  renderTime(P.playing&&actx?actx.currentTime-P.t0:0);
  const ib=$('instbtn');
  if(ib){
    const L=instList();
    /* 악기를 다 끈 상태를 **단추에 그대로 보여 준다**(v63) — 소리가 안 나는 이유가 여기 있다 */
    ib.textContent=!L.length
      ? (hasMelody()&&melodyOn()?'♪ 멜로디만':'소리 없음')
      : (hasMelody()&&melodyOn()?'♪ ':'')
        +(L.length>1?INSTRUMENTS[L[0]].label+' 외 '+(L.length-1):INSTRUMENTS[L[0]].label);
  }
  if($('v-size'))$('v-size').textContent=S.font;
  /* 보기 전환 묶음 — 지금 보고 있는 화면 한 칸만 켠다. 쓸 수 없는 칸은 흐리게 두되
     **감추지는 않는다**(칸이 사라지면 나머지 칸이 옆으로 밀려서 누르던 자리가 달라진다). */
  const cur=(S.mode==='sheet'&&hasSheet())?'sheet':(S.mode!=='text'&&hasMelody())?'staff':'text';
  document.querySelectorAll('.seg [data-view]').forEach(b=>{
    const v=b.dataset.view;
    b.classList.toggle('on',v===cur);
    b.disabled=(v==='sheet'&&!hasSheet())||(v==='staff'&&!hasMelody());
    b.setAttribute('aria-pressed',v===cur?'true':'false');
  });
  const mv=maxVerse(), vb=$('b-verse');
  if(vb){ vb.textContent=S.verse+'절'+(mv>1?' / '+mv:''); vb.disabled=mv<2; vb.classList.toggle('on',S.verse>1); }
}

function saveLast(){
  try{
    setLS('konti:last',JSON.stringify({
      t:$('title').value, raw:S.raw, semis:S.semis, verse:S.verse, flat:S.flat,
      num:S.num, capo:S.capo, font:S.font, staffScale:S.staffScale, col:S.col, mode:S.mode,
      bpm:P.bpm, insts:P.insts, melInst:P.melInst, pattern:P.pattern,
      beats:P.beats, genre:P.genre, loop:P.loop, click:P.click, melody:P.melody, realInst:P.realInst,
      playBass:P.playBass, piano:P.piano!==false, melVol:P.melVol, accVol:P.accVol,
      sheetZoom:S.sheetZoom||1, orig:S.orig,
      at:Date.now()
    }));
  }catch(e){
    /* 사진까지 넣으면 localStorage 한도를 넘길 수 있다 — 그때는 사진만 빼고 다시 저장한다.
       사진 보기는 있으면 좋은 기능이고, 곡 자체를 못 저장하는 건 훨씬 큰 손해다. */
    try{
      setLS('konti:last',JSON.stringify({
        t:$('title').value, raw:S.raw, semis:S.semis, verse:S.verse, flat:S.flat,
        num:S.num, capo:S.capo, font:S.font, staffScale:S.staffScale, col:S.col,
        mode:S.mode,   /* 'sheet'(원본 사진 보기)도 그대로 저장한다 — 사진에서 가져온 곡의 기본 보기다 */
        bpm:P.bpm, insts:P.insts, melInst:P.melInst, pattern:P.pattern,
        beats:P.beats, genre:P.genre, loop:P.loop, click:P.click, melody:P.melody,
        realInst:P.realInst, playBass:P.playBass, piano:P.piano!==false,
        melVol:P.melVol, accVol:P.accVol, at:Date.now()
      }));
    }catch(e2){}
  }
}
function restoreLast(){
  let r=null;
  try{ r=JSON.parse(localStorage.getItem('konti:last')||'null'); }catch(e){}
  if(!r||!r.raw||!r.raw.trim())return false;
  S.raw=r.raw;
  S.semis=r.semis||0; S.verse=r.verse||1; S.flat=r.flat||null;
  S.num=!!r.num; S.capo=!!r.capo; S.font=r.font||20;
  S.staffScale=(typeof r.staffScale==='number')?Math.max(.5,Math.min(2,r.staffScale)):1;
  S.col=!!r.col;
  S.orig=(r.orig&&r.orig.pages&&r.orig.pages.length)?r.orig:null;
  S.mode=(r.mode==='text')?'text':(r.mode==='sheet'&&S.orig)?'sheet':'auto';
  if(r.bpm)P.bpm=r.bpm;
  /* ★ **빈 목록도 그대로 되살린다**(v63) — 악기를 일부러 다 끄고 저장했는데 다시 열 때
     피아노가 살아나면 그건 설정이 안 지켜진 것이다. 목록 자체가 없을 때만(옛 콘티) 기본값. */
  if(Array.isArray(r.insts))P.insts=r.insts.filter(k=>INSTRUMENTS[k]);
  else if(r.inst&&INSTRUMENTS[r.inst])P.insts=[r.inst];
  else if(!Array.isArray(P.insts))P.insts=['piano'];
  if(r.melInst)P.melInst=r.melInst;
  if(r.pattern)P.pattern=r.pattern; if(r.beats)P.beats=r.beats;
  P.genre=r.genre||''; P.loop=r.loop!==false; P.click=!!r.click; P.melody=r.melody!==false;
  P.realInst=r.realInst!==false; P.playBass=!!r.playBass; P.piano=r.piano!==false;
  P.melVol=(typeof r.melVol==='number')?Math.max(0.4,Math.min(2,r.melVol)):1;
  P.accVol=(typeof r.accVol==='number')?Math.max(0.4,Math.min(2,r.accVol)):1;
  S.sheetZoom=Math.max(1,Math.min(4,+r.sheetZoom||1));
  if(r.t)$('title').value=r.t;
  return true;
}

function chartCanvas(){
  const M=78,W=PAGE_W,maxW=W-M*2,CH=27,LY=27,LINE=74,GAP=14,sm=chordSemis(),p=pref();
  const probe=document.createElement('canvas').getContext('2d');
  const cf='700 '+CH+'px '+CMONO, lf=LY+'px '+CMONO;
  const ops=[]; let y=M;
  ops.push({t:'title',x:M,y:y+40,s:$('title').value.trim()||'제목 없음'}); y+=62;
  ops.push({t:'sub',x:M,y:y+18,s:subtitle()}); y+=54;
  for(const b of blocks){
    if(b.k==='blank'){y+=LINE*.42;continue;}
    if(b.k==='sec'){y+=26;ops.push({t:'sec',x:M,y:y+18,s:b.text.toUpperCase()});y+=30;ops.push({t:'rule',x:M,y,w:maxW});y+=20;continue;}
    if(b.k==='mel')continue;
    let x=M;
    for(const pr of pairsForVerse(b,S.verse)){

      const label=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;

    else if(o.t==='ch'){c.font=cf;c.fillStyle='#000';c.fillText(o.s,o.x,o.y);}

  }

}
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function buildPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=u=>{parts.push(u);len+=u.length};
  const str=s=>push(enc.encode(s));
  const mark=n=>{off[n]=len};
  const W=595.28,H=841.89,N=pages.length;
  str('%PDF-1.4\n');
  mark(1);str('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  mark(2);str('2 0 obj\n<</Type/Pages/Kids['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']/Count '+N+'>>\nendobj\n');
  pages.forEach((p,i)=>{
    const pg=3+i*3,ct=4+i*3,im=5+i*3;
    mark(pg);str(pg+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']/Resources<</XObject<</I0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>\nendobj\n');
    const co='q '+W+' 0 0 '+H+' 0 0 cm /I0 Do Q';
    mark(ct);str(ct+' 0 obj\n<</Length '+co.length+'>>\nstream\n'+co+'\nendstream\nendobj\n');
    mark(im);str(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.bytes.length+'>>\nstream\n');
    push(p.bytes);str('\nendstream\nendobj\n');
  });
  const xp=len,total=3+N*3;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)x+=String(off[n]||0).padStart(10,'0')+' 00000 n \n';
  str(x);str('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xp+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length}
  return out;
}
function pdfBytes(cv){
  const ph=Math.round(cv.width*RATIO),n=Math.max(1,Math.ceil(cv.height/ph)),pages=[];
  for(let i=0;i<n;i++){
    const s=document.createElement('canvas');s.width=cv.width;s.height=ph;
    const c=s.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,s.width,s.height);
    c.drawImage(cv,0,i*ph,cv.width,ph,0,0,cv.width,ph);
    pages.push({bytes:b64bytes(s.toDataURL('image/jpeg',.92).split(',')[1]),w:s.width,h:s.height});
  }
  return buildPdf(pages);
}

     '가로로 긴 검은 줄'을 행마다 세는 방식이라 1~2도만 기울어도 무너진다.
   ★ 순서가 **종이 자르기 → 기울기 재기** 여야 한다. 반대로 하면 안 된다:
     기울기 판정(bestSkew)은 '행마다 어두운 정도의 제곡합'이라, 화면을 가득 채운 책상이
     그 값을 좌우해 버려서 **오선이 주는 신호가 묻힌다.** 실측으로 2.5도 사진이 2.51도
     그대로 남았다(하나도 못 편 것). 종이만 먼저 잘라 내면 그 자리에서 제대로 잡힌다.
   ★ 여기서 한 번만 펴고 자르면, 뒤따르는 모든 사본(보내는 것·OCR·재는 것·화면용)이 같이
     펴진다. 화면용도 같이 펴지므로 사진 위 마디 표시 자리가 저절로 맞는다. */
function paperBox(cv){
  const W=cv.width, H=cv.height;
  let d; try{ d=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data; }catch(e){ return null; }
  const step=Math.max(1,Math.round(Math.min(W,H)/400));
  const hist=new Uint32Array(256); let n=0;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){
    const i=(y*W+x)*4; hist[(d[i]*.3+d[i+1]*.59+d[i+2]*.11)|0]++; n++;
  }
  /* "밝기 180 이상" 같은 고정값을 쓰면 안 된다 — 사진은 한쪽이 어둡고 한쪽이 밝은 게 보통이다.
     그림에서 가장 밝은 축(상위 10%)을 먼저 구하고 그 비율로 종이를 본다. */
  let acc=0, p90=255;
  for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>=n*0.10){ p90=v; break; } }
  const bright=Math.max(90,p90*0.72);
  const rowOk=new Uint8Array(H), colOk=new Uint8Array(W);
  for(let y=0;y<H;y+=step){
    let c=0,t=0;
    for(let x=0;x<W;x+=step){ const i=(y*W+x)*4; if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)>bright)c++; t++; }
    if(t&&c/t>0.55)for(let k=y;k<Math.min(H,y+step);k++)rowOk[k]=1;
  }
  let r0=-1,r1=-1; for(let y=0;y<H;y++)if(rowOk[y]){ if(r0<0)r0=y; r1=y; }
  if(r0<0||r1-r0<H*0.25)return null;
  for(let x=0;x<W;x+=step){
    let c=0,t=0;
    for(let y=r0;y<=r1;y+=step){ const i=(y*W+x)*4; if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)>bright)c++; t++; }
    if(t&&c/t>0.55)for(let k=x;k<Math.min(W,x+step);k++)colOk[k]=1;
  }
  let c0=-1,c1=-1; for(let x=0;x<W;x++)if(colOk[x]){ if(c0<0)c0=x; c1=x; }
  if(c0<0||c1-c0<W*0.25)return null;
  return [c0,r0,c1-c0+1,r1-r0+1];
}
function cropTo(cv,box,pad){
  const W=cv.width,H=cv.height;
  const x0=Math.max(0,box[0]-pad), y0=Math.max(0,box[1]-pad);
  const x1=Math.min(W,box[0]+box[2]+pad), y1=Math.min(H,box[1]+box[3]+pad);
  const o=document.createElement('canvas'); o.width=x1-x0; o.height=y1-y0;
  o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o;
}
async function deskewPaper(img){
  const W0=img.width, H0=img.height;
  let cv=document.createElement('canvas'); cv.width=W0; cv.height=H0;
  cv.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0);
  /* 1) 종이만 남긴다(책상·어두운 배경을 걷어낸다) */
  const pad=Math.round(Math.min(W0,H0)*0.004);
  const box=paperBox(cv);
  if(box&&!(box[2]>=W0*0.985&&box[3]>=H0*0.985))cv=cropTo(cv,box,pad);
  /* 2) 그다음에 기울기를 잰다 — 배경이 빠진 뒤라야 오선의 신호가 산다 */
  let ang=0;
  try{ ang=bestSkew(await imgFrom(cv.toDataURL('image/jpeg',.95)),6)||0; }catch(e){ ang=0; }
  if(!ang)return cv;
  const W=cv.width, H=cv.height;
  const o=document.createElement('canvas'); o.width=W; o.height=H;
  const g=o.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.translate(W/2,H/2); g.rotate(ang); g.translate(-W/2,-H/2);
  g.drawImage(cv,0,0);
  g.setTransform(1,0,0,1,0,0);
  /* 3) 돌리면 네 귀퉁이에 흰 삼각형이 생긴다 — 종이 상자를 한 번 더 잡아 잘라 낸다 */
  const b2=paperBox(o);
  return (b2&&!(b2[2]>=W*0.99&&b2[3]>=H*0.99))?cropTo(o,b2,0):o;
}
function fitCanvas(img,cap){
  const sc=Math.min(1,cap/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  const c=cv.getContext('2d');
  c.filter='grayscale(1) contrast(1.25) brightness(1.05)';
  c.drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',.9);
}
async function prepImage(f){
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const raw=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl});
  /* ★ 먼저 사진을 펌다(v55) — 기울기를 되돌리고 책상·배경을 잘라 종이만 남긴다.
     여기서 한 번만 하면 뒤따르는 모든 사본(보내는 것·OCR·재는 것·화면용)이 같이 펴진다.
     화면용 사본도 같이 펴지므로 사진 위 마디 표시 자리도 저절로 맞는다. */
  const img=await (async()=>{
    try{
      const cv=await deskewPaper(raw);
      if(!cv||!cv.width||!cv.height)return raw;
      return await imgFrom(cv.toDataURL('image/jpeg',.95));
    }catch(e){ return raw; }
  })();
  const out=fitCanvas(img,1600);
  /* OCR(무료·키 없이 읽기)은 AI 인식과 달리 이미지 크기 제한이 없다 — 작은 글자가 많은
     찬송가 등은 해상도가 정확도를 크게 좌우해서, 원본을 덜 줄인 별도 사본을 하나 더 만들어 둔다. */
  const ocrOut=fitCanvas(img,2200);
  /* 단 단위로 잘라 보낼 원본. 예전에는 위의 1600px 사본을 다시 잘라 썼는데, 이미 줄여 놓은
     그림에서 오려낸 것이라 오선 간격이 몇 픽셀밖에 안 남아 음높이를 볼 수가 없었다.
     음높이 인식은 "음표 머리가 어느 줄/칸에 놓였나"를 보는 일이라 이 해상도가 곧 정확도다. */
  /* ★★ 재는 사본은 **보정을 거치면 안 된다**(v54에서 고친 진짜 범인).
     fitCanvas 는 글자를 읽히기 좋게 하려고 `contrast(1.25) brightness(1.05)` 를 건다.
     그런데 오선은 1~2px 짜리 얇은 회색 선이라, 밝기를 조금만 올려도 **배경에 묻혀 사라진다.**
     실측: 보정한 사본에서는 splitSystems 가 단을 **하나도 못 찾고**(null), staffGeom 도
     단마다 null 이었다. 보정을 안 거치는 showUrl 만 혼자 잘 돌아가고 있었다.
     그래서 글자를 읽는 사본(url·ocrUrl)과 **재는 사본(hiUrl)을 갈라** 둔다. */
  const hiOut=(()=>{
    const sc=Math.min(1,3000/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.95);
  })();
  /* 화면에 그대로 비춰 줄 사본. 보내는 사본(url)은 흑백·고대비로 만들어 놓은 것이라
     사람이 보기엔 원본이 낫다. localStorage 에 넣을 수 있는 크기로 줄여 둔다. */
  const showOut=(()=>{
    const sc=Math.min(1,1400/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.72);
  })();
  return {url:out,b64:out.split(',')[1],ocrUrl:ocrOut,hiUrl:hiOut,showUrl:showOut,w:img.width,h:img.height};
}
async function onPickFile(e){
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  S.importMode='photo';
  let bad=0;
  for(const f of files){
    try{ S.photos.push(await prepImage(f)); }catch(err){ bad++; }
  }
  if(S.photos.length>8)S.photos=S.photos.slice(0,8);
  if(bad)toast(bad+'장은 열지 못했습니다.');
  openPanel('scan');
}
document.addEventListener('paste',ev=>{
  const it=[...(ev.clipboardData&&ev.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));
  if(!it)return;
  const f=it.getAsFile(); if(!f)return;
  S.importMode='photo';
  prepImage(f).then(p=>{S.photos.push(p);openPanel('scan')}).catch(()=>toast('이미지를 열지 못했습니다.'));
});

/* ============ 오선 자리를 픽셀로 재서 음높이를 확정한다 (v49) ============
   AI 비전이 가장 못 하는 일이 "음표 머리가 오선 몇째 줄·칸에 놓였나 세기"다(CLAUDE.md
   1번 항목 — 프롬프트를 아무리 조여도 3도·2도씩 틀리는 건 못 막았다). 그런데 이건
   추론이 아니라 자로 재는 일이고, 브라우저에서 픽셀로 재면 계산 문제라 거의 틀리지
   않는다. 반대로 AI가 잘 하는 건 박자·가사·코드·절 구분이다. 그래서 일을 나눈다 —
   음높이는 우리가 재고, 길이·가사·코드는 AI가 읽는다.

     1) 가로 투영으로 오선 다섯 줄의 y 를 찾는다(줄 간격 sp 도 여기서 나온다).
        간격이 고른 다섯 줄 묶음 중 가장 위를 쓴다 = 소프라노 보표
        (찬송가는 그랜드 스태프라 아래에 낮은음자리표 오선이 하나 더 있다).
     2) 오선 줄만 지운다. 그 열의 잉크가 세로로 짧게 끊기면(=줄뿐이면) 지우고,
        길게 이어지면(=음표 머리·기둥이 걸쳐 있으면) 남긴다.

        고른다. 기둥은 세로로 너무 길고, 빔은 세로로 너무 얇고, 점·임시표는 너무 작다.
     4) 속이 빈 음표(2분·온음표)는 3)에 안 걸린다 — 대신 잉크로 완전히 둘러싸인
        흰 구멍을 찾는다. 그게 곧 머리 중심이다.
     5) 같은 x 에 쌓인 것(SATB 화음)은 맨 위 것만 쓴다 = 소프라노 = 멜로디.
     6) 머리 중심 y 를 맨 아래 줄 기준 반칸 단위로 세어 음이름을 바로 계산한다.

   ★ 못 믿을 상황(오선 다섯 줄을 못 찾음 / 음표 3개 미만 / 반칸 격자에 잘 안 떨어짐)에는
     반드시 null 을 돌려준다. 추측으로 덮어쓰면 지금보다 나빠진다 — 이 원칙을 깨지 말 것.
   ★ 결과는 두 곳에 쓴다. (a) 프롬프트에 "우리가 센 음이름"으로 넣어 AI가 참고하게 하고,
     (b) AI가 돌려준 음표 개수가 우리가 센 개수와 정확히 같을 때만 음이름을 덮어쓴다.
     개수가 다르면 정렬 근거가 없으므로 손대지 않는다(잘못 맞추면 뒤가 전부 밀린다).
   ★ 임시표(#/b)는 픽셀로 읽지 않는다. 음이름만 우리가 정하고, 음이름이 그대로면 AI가
     붙인 임시표를 유지한다. 음이름이 바뀌면 그 임시표는 다른 음의 것이므로 떼어낸다. */
const DIA_L=['C','D','E','F','G','A','B'];
/* 맨 아래 오선 줄의 음을 "옥타브*7 + 음이름번호"로: 높은음자리표 E4, 낮은음자리표 G2 */
const CLEF_BOTTOM={treble:4*7+2, bass:2*7+4};
const diaName=abs=>DIA_L[((abs%7)+7)%7]+Math.floor(abs/7);
function otsuTh(hist,total){
  let sum=0; for(let i=0;i<256;i++)sum+=i*hist[i];
  let wB=0,sumB=0,best=-1,th=128;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB)continue;
    const wF=total-wB; if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF, v=wB*wF*(mB-mF)*(mB-mF);
    if(v>best){best=v;th=t;}
  }
  return th;
}
function imgFrom(url){
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});
}
/* 오선이 가장 수평에 가까워지는 기울기(라디안)를 찾는다.
   손으로 찍은 악보 사진은 늘 조금 기울어 있고, 가로 투영으로 오선을 찾는 방식은 1도만
   기울어도 무너진다(합성 테스트에서 1.5도에 아무것도 못 찾는 것을 확인했다).

   ★ 두 가지를 조심할 것 — 둘 다 실제로 밟은 함정이다.
   1. 판정용 사본을 너무 작게 줄이면 안 된다. 오선은 1~3px 짜리 얇은 선이라, 브라우저의
      기본 축소(저품질 이중선형)로 1/4 이하로 줄이면 **선이 통째로 사라진다.** 실제로
      380px 사본에서는 잉크 픽셀이 0개가 나와 모든 각도의 점수가 같아졌고, 반듯한 그림에
      3도 회전을 걸어 버렸다. 사본 폭은 760px 이상으로 두고 고품질 축소를 켠다.
   2. 점수를 "잉크냐 아니냐"로 세지 말 것. 얇은 선은 축소하면 회색이 되어 문턱값 하나로
      갈리면 결과가 요동친다. 밝기(0~1)의 행 평균을 그대로 제곡해서 더한다 —
      오선이 수평에 맞으면 어두움이 몇 행에 몰려 제곡합이 최대가 된다. */
function bestSkew(img,range){
  const W=Math.min(img.width,Math.max(760,Math.round(img.width*0.5)));
  const H=Math.max(24,Math.round(img.height*(W/img.width)));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  const score=deg=>{
    const a=deg*Math.PI/180;
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    if(a){ g.translate(W/2,H/2); g.rotate(a); g.translate(-W/2,-H/2); }
    g.drawImage(img,0,0,W,H);
    g.setTransform(1,0,0,1,0,0);
    let d; try{ d=g.getImageData(0,0,W,H).data; }catch(e){ return null; }
    let sum=0;
    for(let y=0;y<H;y++){
      let dark=0; const o=y*W*4;
      for(let x=0;x<W;x++){ const i=o+x*4; dark+=255-(d[i]*.299+d[i+1]*.587+d[i+2]*.114); }
      const r=dark/(W*255);
      sum+=r*r;
    }
    return sum;
  };
  const flat=score(0);
  if(flat===null||flat<=0)return 0;
  let best=0, bestScore=flat;
  const RG=Math.max(1,range||3);
  for(let deg=-RG;deg<=RG+0.001;deg+=0.4){
    if(Math.abs(deg)<0.05)continue;
    const v=score(deg); if(v===null)return 0;
    if(v>bestScore){ bestScore=v; best=deg; }
  }
  /* 남은 기울기가 0.2도만 있어도 오선 줄 지우기가 양쪽 끝에서 실패해서 음표를 잃는다.
     (합성 테스트: 1.5도 사진에서 왼쪽 세 음이 통째로 빠졌다) 그래서 곡게 다시 훑는다. */
  if(best){
    for(let pass=0;pass<2;pass++){
      const step=pass?0.05:0.15, span=pass?0.12:0.36;
      for(let deg=best-span;deg<=best+span+1e-9;deg+=step){
        const v=score(deg); if(v===null)break;
        if(v>bestScore){ bestScore=v; best=deg; }
      }
    }
  }
  /* 원래대로 두는 것이 기본이다. 되돌리는 게 뚜렷하게 나을 때만 돌린다 —
     미세한 회전은 음표 머리를 세로로 번지게 해서 오히려 음을 잃는다. */
  if(bestScore<flat*1.03)return 0;
  const a=best*Math.PI/180;
  return Math.abs(a)<0.003?0:a;               // 0.17도 미만은 되돌릴 필요가 없다
}
/* 한 단 그림에서 소프라노 음표들의 자리를 재서
   {sp,top,bot,med,notes:[{x,cy,step,abs,name}]} 또는 null 을 돌려준다. */
/* ============ 음표 길이(박자)를 픽셀로 재기 (v50) ============
   음높이를 자로 재듯, 길이도 "그림에 무엇이 붙어 있나"를 세면 나온다:
     속이 빈 머리인가 → 온음표·2분음표 · 기둥이 있나 → 온음표 구분
     기둥 끝에 가로로 굵은 잉크(빔·꼬리)가 몇 겹인가 → 8분(1겹)·16분(2겹)
     머리 오른쪽에 작고 동그란 점이 있나 → 점음표(×1.5)
   ★ 박자는 하나만 틀려도 그 뒤가 전부 밀린다. 그래서 음높이 때와 똑같이
     "모르겠으면 손대지 않는다" — 애매하면 sure:false 를 달아 돌려주고, 부르는 쪽에서
     한 음이라도 sure 가 아니면 그 단 전체의 박자를 쓰지 않는다. */
function headDur(ink,vr,hr,W,c,sp,y0,y1,bot,nextX0,others,lineRow){
  const hy0=Math.round(c.cy-sp*0.55), hy1=Math.round(c.cy+sp*0.55);
  /* 기둥 찾기.
     ★ 처음엔 "머리 높이에서 세로 잉크 덩어리를 따라가는" 방식으로 했는데 전부 실패했다 —
       머리와 기둥이 붙는 지점에서는 가로 잉크 폭이 머리 전체 폭이라, 기둥을 가늘다는
       기준으로 찾으면 그 자리에서 걸러져 버린다. 그래서 **머리에서 떨어진 구간**
       (0.9~2.4칸 위/아래)에서 그 x 칸이 얼마나 채워져 있는지로 본다. */
  /* dil=1 이면 x 좌우 1픽셀까지 같은 칸으로 본다.
     ★ v53에서 이것 때문에 실제 사진의 음표가 통째로 버려지고 있었다. 인쇄 악보의 기둥은
       원본 해상도에서 1~2px 이고, 사진·JPEG 로 한 번 뭉개진 뒤 이진화하면 **두 칸에 걸쳐
       반씩 걸리거나 중간이 끊긴다.** 한 칸만 세면 채움률이 0.5~0.8 로 내려앉는다.
       실측(실제 찬송가 사진 한 단): 후보 28개 중 24개가 "기둥 없음"으로 버려졌고,
       그래서 v49~v50 의 음높이·박자 보정이 **조용히 꺼져 있었다.** */
  const colFill=(x,ya,yb,dil)=>{
    if(x<0||x>=W)return 0;
    const a=Math.max(y0,Math.round(Math.min(ya,yb))), b=Math.min(y1,Math.round(Math.max(ya,yb)));
    if(b<=a)return 0;
    let n=0;
    for(let y=a;y<=b;y++){
      const o=y*W;
      if(ink[o+x]){n++;continue;}
      if(dil){ if((x>0&&ink[o+x-1])||(x+1<W&&ink[o+x+1]))n++; }
    }
    return n/(b-a+1);
  };
  const tipOf=(x,dir)=>{                    // 머리에서 dir 방향으로 잉크를 따라간 끝
    let y=Math.round(c.cy+dir*sp*0.6), last=y, gap=0;
    const lim=Math.max(2,Math.round(sp*0.35));
    while(y>=y0&&y<=y1){
      if(ink[y*W+x]){ last=y; gap=0; } else if(++gap>lim)break;
      y+=dir;
    }
    return last;
  };
  /* ★★ 반대쪽 검사는 **오선 안쪽만** 본다 (v64).
     이 검사의 목적은 마디선·조표의 #/b 처럼 **위아래로 다 뻗는 것**을 거르는 일인데,
     그것들은 전부 오선 안에 산다. 그런데 창을 오선 밖까지 열어 두면 **바로 아래 가사
     글자**가 걸려서, 오선 아래 덧줄 음(기둥이 위로 뻗는 낮은 음)의 기둥이 통째로 부정된다.
     그 음은 그다음 "속도 안 비었고 기둥도 없다"로 **통째로 버려진다.**
     실측(참 반가운 성도여 · 800px 짜리 작은 사진): 1단에서 덧줄 음 3개가 이 길로 사라졌다.
     낮은 음이 많은 찬송가에서는 이게 한 단의 4분의 1이다. */
  const inTop=bot-4*sp-sp*0.5, inBot=bot+sp*0.5;
  const oppFill=(x,ya,yb,dil)=>{
    const a=Math.max(Math.min(ya,yb),inTop), b=Math.min(Math.max(ya,yb),inBot);
    return (b-a<sp*0.4)?0:colFill(x,a,b,dil);   // 오선 안에 볼 게 없으면 '비었다'로 본다
  };
  let stem=null;
  const reach=Math.max(2,Math.round(sp*0.7));   // 속 빈 머리는 x 범위가 '구멍' 기준이라 넉넉히
  /* 두 번 훑는다. 먼저 **깨끗한 기준**(한 칸이 거의 다 잉크)으로 찾고, 못 찾았을 때만
     **사진 기준**(좌우 1픽셀까지 묶고 문턱을 낮춤)으로 다시 찾는다. 순서가 중요하다 —
     깨끗한 스캔에서는 첫 번째 훑기가 예전과 똑같이 동작하므로 기존 판정이 바뀌지 않는다.
     ★ 반대쪽 검사(마디선 거르기)는 **완화하지 않는다.** 마디선은 위아래로 다 뻗으므로
       여기서만 걸러지는데, 이걸 느슨하게 하면 마디선이 음표로 들어온다.
       조표의 #/b 도 위아래로 다 뻗어서 같이 걸러진다 — 실측으로 확인했다.
     ★ 0.5 라는 낮은 문턱이 위험해 보이지만 실측 분포는 두 무리로 뚜렷이 갈렸다:
       진짜 기둥 0.43~1.0 / 가짜(가사 글자·코드 글자) 0.08~0.16. 그 사이가 텅 비어 있다. */
  const PASS=[{dil:0,fill:0.8},{dil:1,fill:0.5}];
  for(const ps of PASS){
    for(let d=0;d<=reach&&!stem;d++){
      const xr=Math.round(c.x1)+d;
      if(colFill(xr,c.cy-sp*0.9,c.cy-sp*2.4,ps.dil)>=ps.fill&&oppFill(xr,c.cy+sp*1.1,c.cy+sp*2.4,ps.dil)<0.5){
        stem={x:xr,tip:tipOf(xr,-1),up:true}; break; }
      const xl=Math.round(c.x0)-d;
      if(colFill(xl,c.cy+sp*0.9,c.cy+sp*2.4,ps.dil)>=ps.fill&&oppFill(xl,c.cy-sp*1.1,c.cy-sp*2.4,ps.dil)<0.5){
        stem={x:xl,tip:tipOf(xl,1),up:false}; break; }
    }
    if(stem)break;
  }
  /* 기둥 끝에서 머리 쪽으로 훑으며 꼬리·빔이 몇 겹인지 센다.
     ★ 처음엔 기둥 칸의 가로 런 길이(hr)로 판정했는데, 꼬리가 오선 줄과 겹치는 자리에
       오면 줄 지우기 단계에서 그 부분이 함께 지워져 놓쳤다(높은 음의 아래 기둥에서 발생).
       그래서 기둥 칸 한 줄이 아니라 **기둥 양옆 띠의 잉크 양**으로 센다 — 꼬리든 빔이든
       기둥 옆으로 뻗어 나가는 잉크라는 점은 같고, 한 칸이 지워져도 살아남는다. */
  let bands=0;
  if(stem){
    /* ★ 처음엔 기둥 끝(tip)에서 머리 쪽으로 훑었는데, 끝 위치를 정확히 잡는 게 생각보다
       어려웠다(빔이 오선 줄과 겹쳐 일부가 지워지면 끝이 빔 앞에서 끊긴다). 그래서
       **기둥 길이 전체**를 훑는다 — 기둥 가운데는 옆에 잉크가 없으니 헛집히지 않고,
       끝 위치를 몰라도 된다. */
    const dOut=stem.up?-1:1;
    const ya=Math.round(c.cy+dOut*sp*0.85), yb=Math.round(c.cy+dOut*sp*4.3);
    /* 기둥과 **이어져 있는** 가로 잉크의 폭으로 센다(hr). 창 안의 잉크를 전부 세면
       바로 옆의 쉼표·다른 기호까지 들어와 헛집힌다 — 실측: 8분쉼표가 붙어 있는 8분음표.
       그리고 문턱을 0.45칸에서 0.3칸으로 내렸다. 빔은 옆 음표까지 길게 뻗지만
       **꼬리는 훨씬 얇아서**(기둥 2px + 꼬리 4px 정도) 0.45칸에서는 통째로 놓쳤다. */
    let need=Math.max(3,Math.round(sp*0.3));
    /* 두 줄이면 충분하다. 꼬리는 원래 얇고(6줄쯤), 그중 4줄이 오선 줄과 겹쳐 지워지면
       두 줄만 남는다 — 실측에서 minBand=3 이라 그 꼬리를 통째로 놓쳤다.
       기둥은 어차피 2px 라 need(0.3칸) 문턱을 절대 못 넘으므로 헛집히지 않는다. */
    const minBand=2;
    const lpad=Math.max(1,Math.round(sp*0.06));   // 줄 토막 봉우리가 번지는 폭(아래 isL 참고)
    /* 지워진 오선 줄이 빔을 두 조각으로 끊는다. 그 끊김은 이어 붙여야 하지만,
       빔 두 겹 사이의 빈틈(약 0.25칸)까지 이어 붙이면 16분음표가 8분음표로 읽힌다 —
       그래서 이어 붙이는 폭을 그보다 뚜렷하게 좁게 둔다. */
    const gapTol=Math.max(1,Math.round(sp*0.12));
    /* 같은 x 에 다른 성부의 머리가 쌓여 있으면(SATB) 그 머리를 빔으로 오인한다 —
       그 머리 앞에서 훑기를 멈춘다. */
    let lim=yb;
    if(others&&others.length)for(const oy of others){
      if(dOut<0&&oy<c.cy-sp*0.9&&oy>lim)lim=Math.round(oy+sp*0.7);
      if(dOut>0&&oy>c.cy+sp*0.9&&oy<lim)lim=Math.round(oy-sp*0.7);
    }
    const steps=Math.abs(lim-ya)+1;
    const wide=[], dbg=[], isL=[];
    for(let k=0;k<steps;k++){
      const y=ya+dOut*k;
      if(y<y0||y>y1)break;
      /* 기둥과 이어진 가로 런(hr)을 쓰되, 주변을 조금 넓혀 본다.
         ★ 세로 ±1 · 가로 ±2 로 넓히는 이유가 각각 있다:
           가로 — 기둥 굵기가 2px 뿐이라 찾아낸 stem.x 가 1~2px 어긋나면 빈 칸을 본다.
           세로 — 꼬리가 붙는 부분이 **오선 줄과 정확히 겹치면** 줄 지우기가 그 행들을
                  지워 버려 살아남는 행이 하나뿐이 된다(실측: 기둥이 아래로 뻗는 높은 음).
         세로를 ±2 로 넓히면 안 된다 — 16분음표의 빔 두 겹 사이 빈틈(약 0.25칸)까지
         메워져 8분음표로 읽힌다. ±1 이 두 요구의 경계다. */
      let side=0;
      for(let dy=-1;dy<=1;dy++){
        const yy=y+dy; if(yy<y0||yy>y1)continue;
        for(let dx=-2;dx<=2;dx++){
          const xx=stem.x+dx; if(xx<0||xx>=W)continue;
          const p2=yy*W+xx;
          if(ink[p2]&&hr[p2]>side)side=hr[p2];
        }
      }
      /* ★★ '오선 줄 행'을 **줄 간격에 비례해 넓게** 본다(v64).
         줄 토막의 봉우리는 줄 띠 바깥까지 번진다 — 위에서 세로 ±1 로 번지게 보고,
         그림 자체도 크게 키우면 봉우리가 완만하게 내려앉는다(실측 sp=47: 18→16→14→12).
         ±1 로만 보면 그 16 이 '줄이 아닌 행'으로 남아 가짜 빔이 다시 살아난다.
         줄 굵기는 오선 간격에 비례하므로(조판 규칙: 0.08~0.13칸) 번짐도 그렇게 놓는다.
         sp=24 짜리 합성 악보에서는 ±1 이 나와 예전 판정이 그대로 유지된다. */
      let onL=0;
      if(lineRow)for(let dy=-lpad;dy<=lpad&&!onL;dy++){ const yy=y+dy; if(yy>=0&&lineRow[yy])onL=1; }
      dbg.push(side); isL.push(onL);
    }
    /* ★ 문턱을 **기둥 자신의 굵기**에서 뽑는다(v57). 예전엔 0.3칸 고정이었는데, 스캔본을
       확대하면 기둥 자체가 7px(0.33칸)까지 번져서 **모든 음표가 빔을 가진 것처럼** 읽혔다
       — 실측: 4분음표만 있는 단에서 bands 3~5, 한 단 합계가 16박이 아니라 6.75박이 됐다.
       ★ 굵기를 잴 때 **오선 줄이 지나는 행은 뺀다**(lineRow — 인자로 받아 놓고 여태 한 번도
         쓰지 않던 값이다). 줄 지우기는 기둥 칸에서 일부러 줄을 남기므로 그 행들만 값이
         푹 꺼지는데(실측 7 → 3), 그걸 같이 세면 기둥이 얇은 줄 알고 문턱이 도로 낮아진다.
       ★ 반대로 줄 행을 **아예 빼 버리면 안 된다** — 꼬리가 오선 줄과 정확히 겹치는 조판이
         실제로 있다(높은 음의 아래 기둥). 회귀 테스트가 그걸 잡았다. 그래서 굵기 추정에서만
         빼고, 빔을 셀 때는 모든 행을 그대로 쓴다.
       깨끗한 악보에서는 기둥이 2px 라 예전 문턱(0.3칸)이 그대로 이긴다 — 판정이 안 바뀐다. */
    {
      let nz=dbg.filter((v,i)=>v>0&&!isL[i]);
      if(nz.length<4)nz=dbg.filter(v=>v>0);
      nz.sort((a,b)=>a-b);
      if(nz.length>=4){
        const sw=nz[Math.floor(nz.length*0.25)];
        need=Math.max(need,sw+Math.max(2,Math.round(sp*0.12)));
      }
    }
    for(const v of dbg)wide.push(v>=need);
    for(let i=0;i<wide.length;i++){
      if(wide[i])continue;
      let j=i; while(j<wide.length&&!wide[j])j++;
      if(i>0&&j<wide.length&&(j-i)<=gapTol)for(let k=i;k<j;k++)wide[k]=true;
      i=j-1;
    }
    /* ★★ 꼬리·빔으로 세려면 그 덩어리에 **오선 줄이 아닌 행이 하나는 있어야 한다** (v64).
       줄 지우기는 기둥이 지나가는 칸에서 일부러 줄을 남긴다(기둥이 끊기면 안 되니까).
       그 남은 줄 토막이 기둥 옆으로 삐져나와 **줄마다 하나씩 가짜 빔**이 된다.
       실측(참 반가운 성도여 · 800px): 4분음표뿐인 단에서 bands 가 2~5 로 나와 온 단이
       32분음표(0.125박)가 됐다. 기둥 옆 잉크 값이 기둥 7~9 / 줄 토막 10~13 이라
       **굵기 문턱만으로는 절대 못 가른다** — 줄 토막은 딱 줄 두께만큼(3행)만 두껍고
       진짜 꼬리는 줄 밖으로도 이어진다는 점이 진짜 차이다.
       ★ 예외를 남긴다: 꼬리가 줄과 정확히 겹쳐 줄 행만 살아남는 조판이 실제로 있다
         (높은 음의 아래 기둥 — 회귀 테스트가 지키고 있다). 그때는 **뚜렷하게 더 넓다**
         (꼬리는 옆으로 0.6칸 넘게 뻗는다). 그래서 폭이 문턱보다 0.35칸 더 크면 인정한다. */
    let run=0, runFree=false, runMax=0;
    /* 예외 구간: 꼬리가 줄과 정확히 걹쳐 줄 행만 살아남은 경우. 단, **너무 넓으면 줄 그 자체다** —
       지워지지 않고 통째로 남은 오선 줄은 단 폭 전체로 뻗는다(실측 hr=484 = 10칸 넘음).
       꼬리는 기둥 옆으로 1칸 남짓, 빔은 다음 음표까지니 둘 다 5칸 안에 든다. */
    const bigW=need+sp*0.35, capW=sp*5;
    for(let i=0;i<=wide.length;i++){
      if(i<wide.length&&wide[i]){ run++; if(!isL[i])runFree=true; if(dbg[i]>runMax)runMax=dbg[i]; }
      else { if(run>=minBand&&(runFree||(runMax>=bigW&&runMax<=capW)))bands++; run=0; runFree=false; runMax=0; }
    }
    /* 디버그 고리: window.__DURDBG=[] 을 먼저 두면 기둥 옆 잉크 양이 줄줄이 담긴다.
       이 판정도 눈에 보이는 출력이 없어서, 이게 없으면 왜 꼬리를 놓쳤는지 알 수 없다. */
    if(window.__DURDBG)window.__DURDBG.push({cx:+c.cx.toFixed(0),stemX:stem.x,up:stem.up,need,minBand,gapTol,bands,sp:+sp.toFixed(1),side:dbg.slice(),isL:isL.slice()});
  }
  /* 점: 머리 오른쪽의 작고 동글한 잉크 한 덩어리. 다음 음표 앞까지만 본다.
     ★ 두 곳만 본다 — 점은 음표와 **같은 높이**(칸에 놓인 음)이거나 **반 칸 위**(줄에 놓인
       음은 점을 위 칸에 찍는다)에 온다. 예전엔 위아래 0.65칸을 통째로 훑었는데, 오선
       아래쪽 낮은 음에서는 바로 밑의 **가사 글자**가 그 범위에 들어왔다.
     ★ 그리고 덩어리를 잴 때 검색창 밖으로 못 나가게 막아 뒀던 것이 진짜 원인이었다 —
       큰 가사 글자가 창 안쪽만 잘려서 '작고 동그란 점'처럼 보였다. 지금은 창 밖까지
       따라가 **진짜 크기**를 재고, 점보다 크면 버린다.
       실측: 실제 찬송가 사진의 여린내기 8분음표를 점8분음표로 잘못 읽던 것이 사라졌다. */
  let dot=false;
  {
    const dx0=Math.round(c.x1+sp*0.3);
    const dx1=Math.min(Math.round(c.x1+sp*1.5),Math.round(nextX0)-1,W-1);
    const lim=sp*0.52, minA=Math.max(3,Math.round(sp*sp*0.05)), maxA=Math.round(sp*sp*0.5);
    /* ★ 줄/칸 판정은 반드시 **정수로 반올림한 자리 번호**로 해야 한다. 처음엔
       `((bot-cy)/(sp/2))%2 < 0.4` 로 했는데, 실측 3.99 는 %2 가 1.99 라 짝수(줄)인데도
       칸으로 판정됐다 — 짝수 바로 아래 값을 통째로 놓치는 검사였다. */
    const st=Math.round((bot-c.cy)/(sp/2));
    const onLine=(Math.abs(st)%2)===0;
    /* 오선 바깥은 가사·글자가 사는 구역이다 — 거기서는 점을 믿지 않는다(점이 있어도
       없다고 본다). 놓치면 합계 검사에서 걸려 그 단을 건너뛰므로 안전한 실패다. */
    const inStaff=c.cy>=bot-4*sp-sp*0.6&&c.cy<=bot+sp*0.6;
    const spots=inStaff?(onLine?[c.cy-sp*0.5]:[c.cy]):[];
    const tol=Math.max(1.5,sp*0.22);
    for(const sy0 of spots){
      const dy0=Math.max(y0,Math.round(sy0-tol)), dy1=Math.min(y1,Math.round(sy0+tol));
      for(let y=dy0;y<=dy1&&!dot;y++)for(let x=dx0;x<=dx1;x++){
        const p=y*W+x;
        if(!ink[p]||vr[p]>lim||hr[p]>lim)continue;
        let ax0=x,ax1=x,ay0=y,ay1=y,area=0,over=false;
        const q=[p], mark=new Set([p]);
        while(q.length){
          const s2=q.pop(), sy=(s2/W)|0, sx=s2-sy*W;
          area++;
          if(sx<ax0)ax0=sx; if(sx>ax1)ax1=sx; if(sy<ay0)ay0=sy; if(sy>ay1)ay1=sy;
          if(area>maxA*2){ over=true; break; }
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            const nx=sx+dx, ny=sy+dy;
            if(nx<0||nx>=W||ny<y0||ny>y1)continue;
            const np=ny*W+nx;
            if(ink[np]&&!mark.has(np)){ mark.add(np); q.push(np); }
          }
        }
        const bw=ax1-ax0+1, bh=ay1-ay0+1;
        if(!over&&area>=minA&&area<=maxA&&bw<=sp*0.55&&bh<=sp*0.55&&bw>=sp*0.12&&bh>=sp*0.12
           &&Math.abs(bw-bh)<=Math.max(2,sp*0.25))dot=true;
        if(dot)break;
      }
      if(dot)break;
    }
  }
  let beats=null, sure=false;
  if(c.hollow){ beats=stem?2:4; sure=true; }
  else if(stem){
    if(bands===0){beats=1;sure=true;}
    else if(bands===1){beats=0.5;sure=true;}
    else if(bands===2){beats=0.25;sure=true;}
    else {beats=0.125;sure=false;}          // 32분음표는 찬송가에 거의 없다 — 못 믿는다
  }
  else { beats=1; sure=false; }             // 속이 찬데 기둥이 없다 = 뭔가 잘못 봤다
  if(dot&&beats!==null)beats=+(beats*1.5).toFixed(4);
  return {beats,sure,stem:!!stem,bands,dot,hollow:!!c.hollow};
}

/* ============ 임시표(♯·♭·♮)를 픽셀로 읽기 (v60) ============
   v59 까지 이 앱은 **임시표를 아예 보지 않았다**(옛 주석: "임시표는 픽셀로 읽지 않는다").
   음이름만 자리로 재고 #/b 는 조표에서 입혔으니, 조에 없는 음은 전부 제자리음이 됐다.
   사용자가 정확히 이걸 잡아냈다 — *"예수내주에서 레# 인데 샵이 표기가 안되어있다"*.
   A장조(♯3개)에서 B7 코드의 D♯ 이 그냥 D 로 울리고 그려졌다. 화성의 색이 통째로 사라진다.

   임시표는 음표 머리 **왼쪽**에 붙는 한 덩어리 기호다. 그래서 자로 잴 수 있다:
     1) 머리 왼쪽 0.2~2.4칸, 머리와 같은 높이 언저리에서 잉크 덩어리를 찾는다
     2) 크기가 임시표 범위(세로 1.2~3.2칸 · 가로 0.3~1.3칸)인 것만 남긴다
     3) **세로획 개수**로 가른다 — ♭ 은 하나, ♯·♮ 은 둘
     4) ♯ 과 ♮ 은 **가로세로 비**로 가른다 — ♯ 은 거의 정사각, ♮ 은 뚜렷하게 홀쭉하다

   ★ 조표(#/b)를 임시표로 잘못 읽으면 곡 전체가 반음씩 틀어진다. 그래서 자리표·조표
     구간(clefEnd) 왼쪽은 아예 보지 않고, 앞 음표의 오른쪽 끝보다 왼쪽도 보지 않는다.
   ★ 애매하면 '' 을 돌려준다 — 없는 임시표를 붙이는 것이 빠뜨리는 것보다 나쁘다.
     빠뜨리면 조표대로 울리고(지금까지와 같다), 잘못 붙이면 없던 음이 생긴다. */
function findAccidentals(ink,W,H,sp,y0,y1,xFrom){
  const out=[];
  const seen=new Uint8Array(W*(y1-y0+1));
  const CAP=Math.round(sp*sp*4);
  const minH=sp*1.3, maxH=sp*3.2, minW=sp*0.26, maxW=sp*1.45;
  const cells=[];
  for(let y=y0;y<=y1;y++)for(let x=xFrom;x<W;x++){
    const p=y*W+x, sp0=(y-y0)*W+x;
    if(!ink[p]||seen[sp0])continue;
    let ax0=x,ax1=x,ay0=y,ay1=y,area=0,over=false;
    cells.length=0;
    const st=[p]; seen[sp0]=1;
    while(st.length){
      const q=st.pop(), qy=(q/W)|0, qx=q-qy*W;
      area++;
      if(area<=CAP)cells.push(q); else over=true;
      if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
      for(let dy=-1;dy<=1;dy++){
        const ny=qy+dy; if(ny<y0||ny>y1)continue;
        for(let dx=-1;dx<=1;dx++){
          const nx=qx+dx; if(nx<0||nx>=W)continue;
          const np=ny*W+nx, ns=(ny-y0)*W+nx;
          if(ink[np]&&!seen[ns]){ seen[ns]=1; st.push(np); }
        }
      }
    }
    if(over)continue;
    const bw=ax1-ax0+1, bh=ay1-ay0+1;
    if(bh<minH||bh>maxH||bw<minW||bw>maxW)continue;
    /* ★ 임시표는 셋 다 **폭보다 두 배 넘게 길쭉하다**(SMuFL 실측: ♯ 0.99×2.62칸,
       ♮ 0.67×2.67칸, ♭ 0.65×2.29칸). 이 한 줄이 **온음표 머리**를 걸러 낸다 —
       속 빈 온음표는 테두리가 두꺼워 세로획 둘처럼 보이고 폭도 한 칸이 넘어서,
       이게 없으면 ♯ 으로 읽혀 음표가 통째로 지워졌다(rhythm 회귀 테스트가 잡았다). */
    if(bh<bw*1.5)continue;
    if(area<bw*bh*0.16)continue;                 // 너무 성기면 덧줄·빔 조각이다
    const kind=classify(cells.slice(),ax0,ay0,ax1,ay1,bw,bh);
    if(!kind)continue;
    /* 소리나는 자리: ♯·♮ 은 한가운데, ♭ 은 아래쪽 동그라미의 가운데 */
    const cy=(kind==='b')?(ay1-bh*0.28):((ay0+ay1)/2);
    out.push({kind,x0:ax0,x1:ax1,y0:ay0,y1:ay1,cy});
  }
  return out;

  function classify(cs,ax0,ay0,ax1,ay1,bw,bh){
    /* 세로획 세기: 그 칸의 세로 잉크가 덩어리 높이의 절반을 넘으면 '획'으로 본다 */
    const col=new Uint16Array(bw), run=new Uint16Array(bw);
    const grid=new Uint8Array(bw*bh);
    for(const q of cs){ const qy=(q/W)|0, qx=q-qy*W; grid[(qy-ay0)*bw+(qx-ax0)]=1; }
    for(let i=0;i<bw;i++){
      let r=0,mx=0;
      for(let j=0;j<bh;j++){ if(grid[j*bw+i]){ if(++r>mx)mx=r; } else r=0; }
      run[i]=mx; col[i]=mx;
    }
    const TALL=bh*0.52;
    let strokes=0, on=false;
    for(let i=0;i<bw;i++){ const t=run[i]>=TALL; if(t&&!on)strokes++; on=t; }
    if(!strokes)return '';
    const wN=bw/sp;
    if(strokes===1){
      /* ♭ — 세로획이 하나뿐이고 **왼쪽 끝**에 있으며, 잉크가 아래쪽에 몰린다
         (위는 막대뿐, 아래는 동그라미). 둘 다 맞아야 한다. */
      let si=0; while(si<bw&&run[si]<TALL)si++;
      if(si>bw*0.45)return '';
      let up=0,dn=0;
      for(let j=0;j<bh;j++)for(let i=0;i<bw;i++)if(grid[j*bw+i]){ if(j<bh/2)up++; else dn++; }
      return (dn>up*1.25&&bh>=bw*1.35&&wN>=0.28&&wN<=1.0)?'b':'';
    }
    /* ♯ 과 ♮ 은 둘 다 세로획 두 개다. **가로세로 비로는 갈리지 않는다** — 둘 다 폭의
       2.5배쯤 길쭉하다(SMuFL 실측: ♯ 0.99×2.62칸, ♮ 0.67×2.67칸). 처음에 정사각/홀쭉으로
       가르려 했다가 ♯ 을 ♮ 으로 읽고 ♮ 은 통째로 놓쳤다.
       진짜 차이는 **가로줄이 세로획 밖으로 삐져나오는가**다 — ♯ 의 두 가로줄은 양옆으로
       뻗고, ♮ 의 두 가로줄은 세로획 사이에만 있다. 그래서 세로획 바깥 여백을 재면 갈린다.
       폭(칸 기준)도 함께 본다: ♯ 은 한 칸 남짓, ♮ 은 3분의 2 칸. */
    let li=0; while(li<bw&&run[li]<TALL)li++;
    let ri=bw-1; while(ri>=0&&run[ri]<TALL)ri--;
    const marg=Math.min(li,bw-1-ri);
    if(marg>=Math.max(1,bw*0.10)||wN>=0.85)return (wN>=0.55&&wN<=1.7)?'#':'';
    return (wN>=0.3&&wN<=0.95)?'n':'';
  }
}
/* 찾아낸 임시표를 음표에 붙인다 — **오른쪽 가장 가까운**, 높이가 맞는 음표 하나에만.
   ★ 임시표는 반드시 그 음표 **바로 왼쪽**(2.4칸 안)에 붙는다. 더 멀면 다른 음의 것이거나
     조표이므로 붙이지 않는다 — 빈 것이 틀린 것보다 낫다. */
function attachAccidentals(accs,cols,sp){
  const out=new Array(cols.length).fill('');
  for(const a of accs){
    let best=-1, bd=1e9;
    for(let i=0;i<cols.length;i++){
      const c=cols[i];
      const gap=c.x0-a.x1;
      if(gap<-sp*0.1||gap>sp*1.6)continue;             // 머리와 겹치거나 너무 멀다
      if(Math.abs(c.cy-a.cy)>sp*0.85)continue;
      if(gap<bd){ bd=gap; best=i; }
    }
    if(best>=0&&!out[best])out[best]=a.kind;
  }
  return out;
}

async function staffGeom(url,clef){
  let img; try{ img=await imgFrom(url); }catch(e){ return null; }
  /* 사용자 요청으로 정확도를 속도보다 앞세운다(v50): 예전 1200px 로는 실제 찬송가
     한 단에서 오선 간격이 13px 밖에 안 나와 **빔 두 겹(16분음표)을 한 겹으로** 셌다.
     2000px 면 20px 가 되어 갈라진다. 느려지지만 호출 수는 그대로다(무료 한도 무관). */
  /* ★ 들어온 그림을 **함부로 줄이지 않는다**(v53). 예전에는 무조건 2000px 로 깎았는데,
     splitSystems 가 오선 간격 22px 에 맞춰 정성껏 키워 보낸 것을 여기서 도로 줄여 버렸다
     (실측: 2400px 로 보내도 오선 간격이 16.3px 에서 더 올라가지 않았다 — 여기가 범인이었다).
     메모리 상한만 지키고(4200px) 그 아래로는 받은 그대로 쓴다. */
  const cap=Math.max(2000,Math.min(4200,img.width)), sc=Math.min(1,cap/Math.max(1,img.width));
  const W=Math.max(1,Math.round(img.width*sc)), H=Math.max(1,Math.round(img.height*sc));
  if(W<200||H<36)return null;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g2=cv.getContext('2d',{willReadFrequently:true});
  g2.fillStyle='#fff'; g2.fillRect(0,0,W,H);
  const skew=bestSkew(img);            // 손으로 찍은 사진은 늘 조금 기울어 있다
  if(skew){ g2.translate(W/2,H/2); g2.rotate(skew); g2.translate(-W/2,-H/2); }
  g2.drawImage(img,0,0,W,H);
  g2.setTransform(1,0,0,1,0,0);
  let px; try{ px=g2.getImageData(0,0,W,H).data; }catch(e){ return null; }   // file:// 에서는 막힌다
  const N=W*H, hist=new Uint32Array(256), gray=new Uint8Array(N);
  for(let p=0,i=0;p<N;p++,i+=4){ const v=(px[i]*.299+px[i+1]*.587+px[i+2]*.114)|0; gray[p]=v; hist[v]++; }
  /* ★ 문턱값 하나로 온 그림을 자르면 안 된다(v55). 손으로 찍은 사진은 한쪽이 그늘지고
     한쪽이 밝은 게 보통이라, 전체 오츠 하나로는 **어두운 쪽이 통째로 잉크가 되고 밝은 쪽은
     오선이 통째로 사라진다.** 실측: 조명이 기운 사진에서 단 6개 중 3개만 읽혔다.
     그래서 '그 자리 주변보다 어두운가'로 본다(Bradley 적응 문턱값). 주변 평균은 적분영상
     으로 한 번에 구하므로 창 크기와 상관없이 빠르다.
     ★ 전체 오츠도 버리지 않고 **하한**으로 함께 쓴다 — 완전히 빈 여백에서는 주변 평균이
       종이색이라, 적응 문턱값만 쓰면 종이의 얼룩까지 잉크로 본다. */
  const otsu=Math.min(210,Math.max(55,otsuTh(hist,N)));
  const ink=new Uint8Array(N);
  {
    const ii=new Float64Array((W+1)*(H+1));
    for(let y=0;y<H;y++){
      let rs=0;
      for(let x=0;x<W;x++){ rs+=gray[y*W+x]; ii[(y+1)*(W+1)+(x+1)]=ii[y*(W+1)+(x+1)]+rs; }
    }
    const r=Math.max(8,Math.round(Math.min(W,H)*0.25));
    const hi=Math.min(245,otsu+55);          // 이보다 밝으면 무조건 종이
    for(let y=0;y<H;y++){
      const y0b=Math.max(0,y-r), y1b=Math.min(H-1,y+r);
      for(let x=0;x<W;x++){
        const g0=gray[y*W+x];
        if(g0>hi)continue;
        const x0b=Math.max(0,x-r), x1b=Math.min(W-1,x+r);
        const area=(x1b-x0b+1)*(y1b-y0b+1);
        const sum=ii[(y1b+1)*(W+1)+(x1b+1)]-ii[y0b*(W+1)+(x1b+1)]-ii[(y1b+1)*(W+1)+x0b]+ii[y0b*(W+1)+x0b];
        if(g0<(sum/area)*0.90)ink[y*W+x]=1;
      }
    }
  }
  const th=otsu;

  /* 1) 오선 다섯 줄 찾기 — **두 가지 방법을 순서대로** 쓴다(v55).
     ① 예전 방법(문턱값 + 간격이 고른 다섯 줄 묶기). 깨끗한 스캔·합성 그림에서 확실하고,
        그랜드 스태프에서 **위 오선을 먼저 고르는** 성질이 있다(위에서부터 훑으니까).
        지금까지 쌓은 회귀 테스트가 전부 이 동작을 지키고 있으므로 **먼저** 돌린다.
     ② 그게 실패했을 때만 새 방법(런렝스로 간격 추정 → 배경 제거 → 빗살 정합).
        손으로 찍은 사진처럼 오선이 흐리거나 조명이 기운 그림에서 ①이 그냥 null 을
        돌려주던 자리를 메운다.
     ★ 순서가 중요하다. ②를 먼저 돌리게 했더니 합성 회귀 테스트 11개가 깨졌다 —
       ②는 곡 전체에서 '가장 잘 맞는' 자리를 고르므로 그랜드 스태프에서 아래 오선을
       고르기도 하고, 덧줄이 많은 그림에서 한 칸 밀리기도 한다. ②는 어디까지나
       **①이 아무것도 못 찾았을 때의 구제책**이다. */
  const rows=new Float32Array(H); let rmax=0;
  for(let y=0;y<H;y++){ let c=0; const o=y*W; for(let x=0;x<W;x++)c+=ink[o+x]; rows[y]=c/W; if(rows[y]>rmax)rmax=rows[y]; }
  if(rmax<0.08)return null;
  /* ① 예전 방법 */
  let ctr5=null;
  if(rmax>=0.3){
    const lineTh=Math.max(0.3,rmax*0.55), thick=Math.max(4,Math.round(H*0.055));
    const runs=[]; let st=-1;
    for(let y=0;y<H;y++){
      if(rows[y]>=lineTh){ if(st<0)st=y; }
      else if(st>=0){ if(y-st<=thick)runs.push([st,y-1]); st=-1; }
    }
    if(st>=0&&H-st<=thick)runs.push([st,H-1]);
    if(runs.length>=5){
      const ctr=runs.map(r=>(r[0]+r[1])/2);
      for(let i=0;i+4<ctr.length;i++){
        const g=[ctr[i+1]-ctr[i],ctr[i+2]-ctr[i+1],ctr[i+3]-ctr[i+2],ctr[i+4]-ctr[i+3]];
        const mn=Math.min.apply(null,g), mx=Math.max.apply(null,g);
        if(mn<4||mx>mn*1.35)continue;
        const s2=(ctr[i+4]-ctr[i])/4;
        if(Math.max.apply(null,g.map(v=>Math.abs(v-s2)))/s2>0.16)continue;
        ctr5=[0,1,2,3,4].map(k=>runs[i+k]);            // [a,b] 쌍 그대로 (두께를 이미 안다)
        break;                                          // 위에서부터 처음 = 소프라노 보표
      }
    }
  }
  /* ② 구제책 — 런렝스로 간격을 재고, 배경을 뺀 뒤, 그 간격으로 빗살을 맞춘다.
     research/omr-pitch/RESULTS.md 가 실측으로 고른 방법이다:
     "전역 최대 밀도의 45% 이상이라는 절대 임계값을 쓴 것이 실패 원인이었다." */
  if(!ctr5){
    let spGuess=0;
    {
      const black=new Uint32Array(80), white=new Uint32Array(260);
      const xs=Math.max(1,Math.round(W/600));
      for(let x=0;x<W;x+=xs){
        let y=0;
        while(y<H){
          const v=ink[y*W+x]; let e=y;
          while(e+1<H&&ink[(e+1)*W+x]===v)e++;
          const L=e-y+1;
          if(v){ if(L<80)black[L]++; } else if(L>1&&L<260)white[L]++;
          y=e+1;
        }
      }
      let bi=1,bv=0; for(let i=1;i<80;i++)if(black[i]>bv){bv=black[i];bi=i;}
      let wi=2,wv=0; for(let i=2;i<260;i++)if(white[i]>wv){wv=white[i];wi=i;}
      spGuess=bi+wi;
    }
    if(!(spGuess>=4)||spGuess>H/4)spGuess=Math.max(4,H/9);
    const win=Math.max(3,Math.round(spGuess*2)|1), hp=new Float32Array(H);
    {
      const buf=new Float32Array(win);
      for(let y=0;y<H;y++){
        let n=0;
        for(let k=-(win>>1);k<=(win>>1);k++){ const yy=y+k; if(yy>=0&&yy<H)buf[n++]=rows[yy]; }
        const a2=Array.prototype.slice.call(buf.subarray(0,n)).sort((p,q)=>p-q);
        hp[y]=Math.max(0,rows[y]-a2[n>>1]);
      }
    }
    const tol=Math.max(1,Math.round(spGuess*0.2)), peak=new Float32Array(H);
    for(let y=0;y<H;y++){ let m=0; for(let k=-tol;k<=tol;k++){const yy=y+k; if(yy>=0&&yy<H&&hp[yy]>m)m=hp[yy];} peak[y]=m; }
    let best={sc:0,sp:0,y:-1};
    for(let sp2=Math.max(4,spGuess*0.72);sp2<=spGuess*1.6;sp2+=0.25){
      const span=Math.round(sp2*4); if(span>=H)break;
      for(let y=0;y+span<H;y++){
        const v=[peak[y],peak[Math.round(y+sp2)],peak[Math.round(y+sp2*2)],peak[Math.round(y+sp2*3)],peak[Math.round(y+sp2*4)]].sort((a,b)=>a-b);
        if(v[2]>best.sc)best={sc:v[2],sp:sp2,y};        // 다섯 중 중간값 — 다섯이 다 있어야 높다
      }
    }
    if(!(best.sc>0.02)||best.y<0)return null;
    ctr5=[];
    for(let k=0;k<5;k++){
      const yg=Math.round(best.y+best.sp*k);
      let by=yg,bv=-1;
      for(let dy=-tol;dy<=tol;dy++){ const yy=yg+dy; if(yy<0||yy>=H)continue; if(rows[yy]>bv){bv=rows[yy];by=yy;} }
      const halfTh=Math.max(0.1,rows[by]*0.45);
      let a2=by,b2=by;
      while(a2-1>=0&&rows[a2-1]>=halfTh&&by-a2<best.sp*0.35)a2--;
      while(b2+1<H&&rows[b2+1]>=halfTh&&b2-by<best.sp*0.35)b2++;
      ctr5.push([a2,b2]);
    }
  }
  if(!ctr5)return null;
  const ctrOf=r=>(r[0]+r[1])/2;
  const sp=(ctrOf(ctr5[4])-ctrOf(ctr5[0]))/4, top=ctrOf(ctr5[0]), bot=ctrOf(ctr5[4]);
  if(sp<5)return null;                                 // 반칸이 2px 남짓이면 자리를 셀 수 없다

  /* 오선이 **가로로 어디까지 그어져 있는지** 먼저 재 둔다(v57). 줄을 지우기 전에 재야 한다.
     조판 규칙상 **단의 오른쪽 끝은 언제나 마디선**이다(겹줄이든 홑줄이든). 아래에서 마디선을
     하나도 못 찾았을 때 이 자리를 마지막 마디선으로 쓴다 — 실측: 온음표로 끝나는 단에서
     끝 마디선을 놓쳐 한 마디가 통째로 사라졌다. */
  let staffX1=0;
  {
    const ends=[];
    for(let k=0;k<5;k++){
      const yc=Math.round(ctrOf(ctr5[k]));
      if(yc<0||yc>=H)continue;
      let last=-1;
      for(let x=W-1;x>=0;x--){ if(ink[yc*W+x]){ last=x; break; } }
      if(last>=0)ends.push(last);
    }
    if(ends.length>=3){ ends.sort((a,b)=>a-b); staffX1=ends[ends.length>>1]; }
  }

  /* 2) 오선 줄 지우기 */
  /* ★ 흐린 줄(soft) 대비(v57). 스캔본·저해상도 인쇄물에서는 오선이 **연한 회색**으로
     번져 이진화하면 굵은 띠가 된다(실측: 줄 간격 21px 에 줄 두께 7px, 회색 146 인데
     음표 잉크는 9). 그 굵은 띠가 **온·2분음표 머리의 구멍을 가로질러 반으로 쪼개서**
     속 빈 머리가 통째로 사라졌다 — 실측한 찬송가에서 한 단 11음 중 4음이 이것 때문에
     빠졌고, 전부 줄 위에 놓인 2분음표였다.
     예전 규칙(세로 잉크 런이 짧으면 지운다)은 머리가 줄에 걸치면 런이 길어져 못 지운다.
     그래서 **줄이 흐릴 때만** 규칙을 하나 더 쓴다: 그 칸의 띠 안 픽셀이 "맨 줄 정도의
     회색"이면(= 진한 잉크가 지나가지 않으면) 지운다. 기둥·마디선·속 찬 머리는 훨씬
     진하므로 그대로 남는다.
     ★ 이 규칙은 **흐린 줄에서만** 켠다. 합성 악보·깨끗한 스캔은 줄도 음표도 새까매서
       구분이 안 되는데, 거기서는 예전 규칙이 이미 정확하다(회귀 테스트 196개가 그걸
       지키고 있다). soft 판정이 그 경계다. */
  let softLine=false, softTh=0;
  {
    const lv=[], iv=[];
    for(let k=0;k<5;k++){
      const yc=Math.round(ctrOf(ctr5[k]));
      if(yc<0||yc>=H)continue;
      for(let x=0;x<W;x+=3)lv.push(gray[yc*W+x]);
    }
    for(let p=0;p<N;p+=5)if(ink[p])iv.push(gray[p]);
    if(lv.length>20&&iv.length>50){
      lv.sort((a,b)=>a-b); iv.sort((a,b)=>a-b);
      const lineG=lv[lv.length>>1], inkG=iv[Math.floor(iv.length*0.1)];
      if(lineG-inkG>60){ softLine=true; softTh=(lineG+inkG)/2; }
    }
  }
  /* 지운 자리를 기억해 둔다 — 아래 4)에서 **속 빈 머리의 구멍**을 찾을 때 되살린다(v63). */
  const erased=new Uint8Array(N);
  const wipe=(x,a,b)=>{ for(let y=a;y<=b;y++){ const p=y*W+x; if(ink[p]){erased[p]=1; ink[p]=0;} } };
  for(let k=0;k<5;k++){
    const a=ctr5[k][0], b=ctr5[k][1];
    const t=b-a+1, lim=Math.max(t*2+1,Math.round(sp*0.46));
    for(let x=0;x<W;x++){
      if(!ink[a*W+x]&&!ink[b*W+x])continue;
      if(softLine){
        let mn=255;
        for(let y=a;y<=b;y++){ const v=gray[y*W+x]; if(v<mn)mn=v; }
        if(mn>softTh){ wipe(x,a,b); continue; }
      }
      let yT=a; while(yT-1>=0&&ink[(yT-1)*W+x])yT--;
      let yB=b; while(yB+1<H&&ink[(yB+1)*W+x])yB++;
      if(yB-yT+1<=lim)wipe(x,a,b);
    }
  }
  /* 어느 행이 오선 줄인지 기억해 둔다 — 길이 판정(headDur)이 이 행을 건너뛴다 */
  const lineRow=new Uint8Array(H);
  for(let k=0;k<5;k++){
    const a=ctr5[k][0], b=ctr5[k][1];
    for(let y=Math.max(0,a-1);y<=Math.min(H-1,b+1);y++)lineRow[y]=1;
  }

  /* 관심 창: 위로 2.2칸(C6까지), 아래로 **2.7칸**(A3까지).
     ★ 아래쪽이 1.6칸이었던 것이 8분·16분이 많은 단에서 음을 놓친 진짜 원인이다(v57).
       1.6칸은 반칸으로 -3.2, 즉 **덧줄 한 개짜리 음(C4·B3)의 머리가 창 밖으로 잘린다.**
       실측(사용자 악보 3단 첫 마디): 덧줄 위에 놓인 낮은 음 3개의 머리가 통째로 잘려
       나가고 덧줄(19×5px)만 남아 있었다 — "원 수 를"이 통째로 사라진 것이 이것이다.
       찬송가 멜로디는 으뜸음 아래로 자주 내려가므로 흔한 모양이다.
     ★ 그래도 가사가 섞이지 않는 이유: 오선 밖(반칸 -2 아래) 후보는 **덧줄이 실제로
       그어져 있어야** 음표로 인정한다(칸 묶기 전에 거른다). 조판 규칙상 -2 자리에는
       반드시 덧줄이 있고, 가사 글자에는 그 자리에 가로줄이 없다.
     ★ 2.7칸을 넘기면 안 된다 — 그 아래가 가사 줄이다(실측: 가사 윗선이 2.7~2.8칸). */
  const y0=Math.max(0,Math.round(top-sp*2.2)), y1=Math.min(H-1,Math.round(bot+sp*2.7));
  if(y1-y0<sp*4)return null;

  /* 세로·가로 잉크 런 길이. 아래에서 "머리 크기인 픽셀"을 고르는 기준이 된다. */
  const vr=new Uint16Array(N), hr=new Uint16Array(N);
  const measure=()=>{
    vr.fill(0); hr.fill(0);
    for(let x=0;x<W;x++){
      let y=0;
      while(y<H){
        if(!ink[y*W+x]){y++;continue;}
        let e=y; while(e+1<H&&ink[(e+1)*W+x])e++;
        const L=e-y+1; for(let k=y;k<=e;k++)vr[k*W+x]=L;
        y=e+1;
      }
    }
    for(let y=0;y<H;y++){
      const o=y*W; let x=0;
      while(x<W){
        if(!ink[o+x]){x++;continue;}
        let e=x; while(e+1<W&&ink[o+e+1])e++;
        const L=e-x+1; for(let k=x;k<=e;k++)hr[o+k]=L;
        x=e+1;
      }
    }
  };
  measure();
  /* 자리표(𝄞) 구간은 건너뛴다. 판정은 "세로로 오선 위와 아래를 **둘 다** 넘어서는
     한 덩어리 잉크"다 — 높은음자리표는 오선 아래에서 위까지 통째로 뻗는다.
     ★ 처음엔 그냥 "세로로 4.2칸보다 긴 잉크"로 잡았는데, SATB 악보에서 소프라노 머리→
       기둥→알토 머리→기둥이 하나로 이어져 그 길이를 넘겼다. 그래서 왼쪽 세 음이 통째로
       자리표 구간으로 취급돼 사라졌다. 위·아래를 둘 다 넘는지 봐야 기둥과 구분된다.
     박자표 숫자(4, 8 처럼 속에 구멍이 있는 것)는 이 구간을 조금 넘어갈 수 있어 음표로
     오인될 수 있다. 그건 개수가 어긋나게 만들 뿐이고, 개수가 다르면 우리는 아무것도
     덮어쓰지 않으므로 결과가 나빠지지는 않는다(그저 이 단에서 이득을 못 본다). */
  /* ★ v53: 잉크가 **끊겨도** 이어진 것으로 본다. 이전에는 한 칸의 잉크가 한 번도 끊기지
     않고 오선 위아래를 다 넘어야 자리표로 인정했다. 깨끗한 합성 그림에서는 그게 맞지만,
     **실제 사진에서는 단 한 번도 맞은 적이 없다** — 실측으로 확인했다(단 4개 전부 clefEnd=0).
     인쇄된 자리표의 획은 얇고 기울어 있어, 사진·JPEG 로 뭉개진 뒤 이진화하면 한 칸 안에서
     몇 픽셀씩 끊긴다. 그래서 자리표와 조표가 통째로 음표 후보로 들어왔고, 조표의 #이
     음표로 잡혀 개수가 어긋났다(그러면 v49~v50 보정이 조용히 꺼진다).
     끊김 허용치는 기둥 끝을 따라갈 때(tipOf)와 같은 0.35칸을 쓴다. */
  let clefEnd=0;
  const xLim=Math.round(W*0.14), hiEdge=top-sp*0.5, loEdge=bot+sp*0.5;
  const vGap=Math.max(2,Math.round(sp*0.35));
  for(let x=0;x<xLim;x++){
    /* 이 칸의 잉크가 **오선 위로도 아래로도 넘치는가**. 끊김은 세지 않고 맨 위·맨 아래
       잉크만 본다(사진에서는 반드시 끊긴다). 대신 그 범위의 30%는 잉크여야 한다 —
       위아래로 떨어진 티끌 두 개가 자리표로 보이지 않게 하는 최소한의 안전장치다.
       ★ 음표는 이 기준을 못 넘는다: 기둥은 3.5칸이라 위·아래 여백(각 0.5칸)을 둘 다
         넘을 수 없다. 덧줄 음도, 가사 글자도 마찬가지다. 그래서 자리표만 걸린다. */
    let hi=-1, lo=-1, n=0;
    for(let y=y0;y<=y1;y++)if(ink[y*W+x]){ if(hi<0)hi=y; lo=y; n++; }
    if(hi<0)continue;
