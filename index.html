    if(hi<hiEdge&&lo>loEdge&&n>=(lo-hi+1)*0.3){
      /* ★ 자리표는 **맨 왼쪽에 붙어 있는 한 덩어리**다. 여기서 그냥 "조건을 만족한 가장
         오른쪽 칸"을 쓰면 안 된다 — 저 멀리 있는 칸 하나가 걸리는 순간 그 앞의 진짜 음표가
         통째로 자리표 구간으로 빨려 들어간다. 실제로 그런 칸이 생긴다: 위로 뻗은 빔 아래에
         아래로 뻗은 기둥이 겹치는 자리가 오선 위·아래를 다 넘는다(합성 테스트가 잡았다).
         그래서 **왼쪽에서 이어지는 첫 덩어리**만 인정하고, 1칸 넘게 끊기면 거기서 끝낸다. */
      if(clefEnd&&x-clefEnd>sp)break;
      if(window.__CLEFDBG)window.__CLEFDBG.push({x,hi,lo,top:Math.round(top),bot:Math.round(bot),sp:+sp.toFixed(1)});
      clefEnd=x;
    }
  }
  /* ★ 낮은음자리표(𝄢)도 찾는다(v67). 위 판정은 "오선 위·아래를 **둘 다** 넘는 잉크"라
     높은음자리표만 걸린다 — 낮은음자리표는 맨 위 줄 근처에서 시작해 아래 줄 위에서 끝나므로
     **한 번도 걸린 적이 없었다**. 그래서 찬송가처럼 위·아래 두 보표가 묶인 악보(그랜드
     스태프)에서 아래 보표는 자리표·조표가 통째로 음표 후보로 들어왔고, 게다가 그 보표의
     반주 음들이 멜로디로 얹혔다(실측: 「주의 음성을 내가 들으니」 8단 중 4단이 아래 보표).
     판정은 세로 범위다 — 맨 위 줄 언저리에서 시작해 셋째 줄 아래까지 내려오지만 **맨 아래
     줄 밑으로는 넘지 않는** 왼쪽 첫 덩어리. 높은음자리표는 아래로 한 칸 넘게 뻗으므로 갈린다. */
  let clefKind=clefEnd?'treble':null;
  if(!clefEnd){
    /* 왼쪽 첫 덩어리의 세로 범위·폭·밀도를 잰다. 낮은음자리표는 **맨 위 줄 언저리에서
       시작해 셋째 줄 아래까지** 내려오지만 맨 아래 줄 밑으로는 넘지 않고, 폭이 한 칸쯤 되는
       **두툼한** 덩어리다. 기둥(세로 한두 픽셀)과 갈리는 것이 폭·밀도 조건이다. */
    const runs=[]; let R=null;
    for(let x=0;x<xLim;x++){
      let hi=-1,lo=-1,n=0;
      for(let y=y0;y<=y1;y++)if(ink[y*W+x]){ if(hi<0)hi=y; lo=y; n++; }
      const h=hi<0?0:(lo-hi+1);
      const okCol=hi>=0&&hi>=top-sp*0.7&&hi<=top+sp*1.4&&lo>=top+sp*2.0&&lo<=bot+sp*0.35
                  &&h>=sp*1.7&&n>=h*0.3;
      if(okCol){
        if(R&&x-R.last>sp*0.6){ runs.push(R); R=null; }
        if(!R)R={first:x,last:x,hi:hi,lo:lo,n:0};
        R.last=x; R.n+=n; if(hi<R.hi)R.hi=hi; if(lo>R.lo)R.lo=lo;
      }
    }
    if(R)runs.push(R);
    /* ★ 맨 왼쪽 한 덩어리만 보고 끝내면 안 된다 — 그랜드 스태프는 두 보표를 잇는 **세로줄**이
       자리표보다 왼쪽에 있어서 늘 먼저 걸린다(실측: x=37 에서 걸려 x=64 의 진짜 자리표를
       못 봤다). 세로줄은 폭이 한두 픽셀이므로 **폭·밀도 조건에 맞는 첫 덩어리**를 고른다. */
    const hit=runs.find(r=>(r.last-r.first+1)>=sp*0.7&&r.n/((r.last-r.first+1)*(r.lo-r.hi+1))>=0.22);
    if(window.__BASSDBG)window.__BASSDBG.push({runs:runs.map(r=>[r.first,r.last,+((r.last-r.first+1)/sp).toFixed(2),+(r.n/((r.last-r.first+1)*(r.lo-r.hi+1))).toFixed(2)]),sp:+sp.toFixed(1)});
    /* ★ 찾았어도 **clefEnd 는 건드리지 않는다**(v67). 자리표 구간을 건너뛰면 음표 목록이
       달라지고, 그러면 이 단을 (그랜드 스태프가 아니라고 판단해) 그대로 쓸 때 예전과 다른
       결과가 나온다 — 실측으로 한 단을 잃었다. 여기서 정하는 것은 **자리표가 무엇인가**
       하나뿐이고, 그걸 쓸지 말지는 쪽 전체를 보고 addGeomMelody 가 정한다. */
    if(hit)clefKind='bass';
  }
  /* 자리표 뒤에는 조표(#/b 여러 개)와 박자표가 **바싹 붙어** 따라온다. 이것들도 음표가
     아니므로 같이 건너뛰어야 하는데, 개수를 미리 알 수 없다(조표는 0~7개다).
     그래서 세지 않고 **따라간다**: 잉크가 1.1칸보다 넓게 끊기는 곳이 첫 음표 앞의 여백이다.
     ★ 여백 없이 음표가 바로 붙는 조판을 대비해 자리표 끝에서 6칸까지만 따라간다.
       조표 7개 + 박자표가 대략 그 안에 들어오고, 더 가면 진짜 음표를 먹는다. */
  /* ★ 조표를 **세어서 조를 정한다**(v57). 사장님 요청 그대로 — "음도 위치 및 오선보를
     계산해서 읽어라". 지금까지는 조를 **OCR 이 읽은 첫 코드**에서만 얻었는데, 그 한 글자를
     잘못 읽으면 곡 전체의 음이름이 통째로 틀어졌다(실측: Bb장조 찬송가가 A장조로 나왔다).
     조표는 자리표 바로 뒤에 **정해진 순서·정해진 높이**로 서는 기호라, 개수만 세면 조가
     나온다 — 추론이 아니라 세는 일이다.
     #과 b 의 구분: **위쪽 1/3 에 잉크가 어디까지 퍼져 있나**만 보면 된다. #은 세로획이
     둘이라 위쪽에서도 글자 폭 전체에 걸치고, b 는 왼쪽 세로획 하나뿐이라 왼쪽에만 있다. */
  let ksig=null;   /* 전역 함수 keySig() 와 이름이 겹치지 않게 */
  if(clefEnd){
    const gx0=clefEnd, gx1=Math.min(W-1,Math.round(clefEnd+sp*7));
    const gy0=Math.max(y0,Math.round(top-sp*1.7)), gy1=Math.min(y1,Math.round(bot+sp*1.7));
    const mk=new Uint8Array(N), st2=new Int32Array((gx1-gx0+1)*(gy1-gy0+1)+8);
    const glyphs=[];
    for(let y=gy0;y<=gy1;y++)for(let x=gx0;x<=gx1;x++){
      const p0=y*W+x; if(!ink[p0]||mk[p0])continue;
      let sp2=0; st2[sp2++]=p0; mk[p0]=1;
      let ax0=x,ax1=x,ay0=y,ay1=y,ar=0;
      while(sp2>0){
        const q=st2[--sp2], qy=(q/W)|0, qx=q-qy*W; ar++;
        if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          const nx=qx+dx, ny=qy+dy;
          if(nx<gx0||nx>gx1||ny<gy0||ny>gy1)continue;
          const np=ny*W+nx; if(ink[np]&&!mk[np]){mk[np]=1;st2[sp2++]=np;}
        }
      }
      glyphs.push({x0:ax0,x1:ax1,y0:ay0,y1:ay1,area:ar});
    }
    /* 조각난 글자를 묶는다(사진에서는 획이 끊긴다).
       ★ 그냥 "가로로 이웃하면 묶기"로 하면 안 된다 — 조표의 #들은 서로 바싹 붙어 서 있어서
         셋이 통째로 한 덩어리가 된다(실측: 59×102px 짜리 한 덩어리 = 세 개가 뭉친 것).
         **가로로 실제 겹칠 때만** 묶는다(음표 칸 묶기와 같은 규칙). */
    glyphs.sort((a,b)=>a.x0-b.x0);
    const grp=[];
    for(const g of glyphs){
      const L=grp[grp.length-1];
      const ov=L?Math.min(L.x1,g.x1)-Math.max(L.x0,g.x0):-1;
      const mw=L?Math.min(L.x1-L.x0,g.x1-g.x0)+1:1;
      if(L&&ov>mw*0.5){ L.x1=Math.max(L.x1,g.x1); L.y0=Math.min(L.y0,g.y0); L.y1=Math.max(L.y1,g.y1); L.area+=g.area; }
      else grp.push({x0:g.x0,x1:g.x1,y0:g.y0,y1:g.y1,area:g.area});
    }
    const acc=grp.filter(g=>{
      const gw=g.x1-g.x0+1, gh=g.y1-g.y0+1;
      return gh>=sp*1.15&&gh<=sp*3.2&&gw>=sp*0.3&&gw<=sp*1.35&&gh>gw*1.15&&g.area>=sp*sp*0.12;
    });
    if(acc.length>=1&&acc.length<=7){
      let flats=0;
      for(const g of acc){
        const gw=g.x1-g.x0+1, hCut=g.y0+Math.max(1,Math.round((g.y1-g.y0+1)*0.32));
        let lo=g.x1+1, hi=g.x0-1;
        for(let y=g.y0;y<=hCut;y++)for(let x=g.x0;x<=g.x1;x++)
          if(ink[y*W+x]){ if(x<lo)lo=x; if(x>hi)hi=x; }
        if(hi>=lo&&(hi-lo+1)<=gw*0.55)flats++;
      }
      /* 조표 사이 간격이 고른가 — 음표나 박자표가 섞여 들어오면 여기서 걸린다 */
      let even=true;
      for(let i=1;i+1<acc.length;i++){
        const d1=acc[i].x0-acc[i-1].x0, d2=acc[i+1].x0-acc[i].x0;
        if(d2>d1*2.2||d1>d2*2.2)even=false;
      }
      if(even)ksig={n:acc.length,flat:flats*2>acc.length};
    }
    if(window.__KEYDBG)window.__KEYDBG.push({clefEnd,sp:+sp.toFixed(1),ksig,
      grp:grp.map(g=>({x:g.x0,w:g.x1-g.x0+1,h:g.y1-g.y0+1,a:g.area}))});
    /* 조표(#/b)와 박자표 숫자는 **세로로 1.3~3칸짜리** 기호다. 그 성질이 이어지는 동안만
       따라간다. 핵심은 **위쪽 한계**다 — 음표는 기둥이 3.5칸이라 머리까지 합치면 한 칸의
       잉크가 4칸을 넘으므로 여기서 저절로 걸린다.
       ★ 위쪽 한계를 안 두면 안 된다: 처음엔 "1.4칸 이상"만 봤더니 **음표 기둥도 세로로
         길고 좁아서** 따라가기가 빔으로 이은 8분음표를 통째로 지나가 첫 두 음을 먹었다
         (합성 회귀 테스트가 잡았다 — 실제 사진만 봤으면 못 잡았을 종류의 실수다).
       ★ "잉크가 있는 동안 따라가기"도 안 된다 — 빔 때문에 끊기지 않는다. */
    const tallAt=x=>{
      if(x<0||x>=W)return false;
      let hi=-1,lo=-1,n=0;
      for(let y=y0;y<=y1;y++)if(ink[y*W+x]){ if(hi<0)hi=y; lo=y; n++; }
      if(hi<0)return false;
      const h=lo-hi+1;
      return h>=sp*1.3&&h<=sp*3&&n>=h*0.45;
    };
    const hGap=Math.max(3,Math.round(sp*1.2)), stop=clefEnd+Math.round(sp*7);
    let x=clefEnd, blank=0;
    while(x<stop&&x<W){ if(tallAt(x)){blank=0;clefEnd=x;} else if(++blank>hGap)break; x++; }
    clefEnd=Math.min(Math.round(W*0.2),clefEnd+Math.round(sp*0.6));
  }
  /* 디버그 고리: window.__GEOM2={} 를 먼저 두면 이 단의 자리표 끝·오선 자리가 담긴다.
     자리표 구간을 잘못 잡으면 조표의 #/b 가 음표로 들어와 **개수가 어긋나고**, 그러면
     v49~v50 의 보정이 통째로 꺼진다 — 조용히 실패하므로 재 볼 방법이 있어야 한다. */
  if(window.__GEOM2)window.__GEOM2.push({W,sp:+sp.toFixed(1),top:+top.toFixed(1),bot:+bot.toFixed(1),clefEnd});

  /* 3) 속이 찬 머리: 세로·가로 런이 둘 다 머리 크기인 픽셀 */
  /* 세로 런에 상한을 두지 않는 것이 중요하다 — 머리에서 기둥으로 잉크가 이어지면 머리
     픽셀의 세로 런이 기둥 길이만큼 길어지는데, 상한을 두면 그 픽셀들이 빠져서 머리가
     위아래로 쪼개지고(특히 줄 위에 놓인 음) 통째로 사라진다. 기둥 자체는 가로가 얇아
     hr 하한에서 걸러지고, 빔·마디선·쉼표는 아래 덩어리 모양 검사에서 걸러진다. */
  const vLo=Math.max(2,Math.round(sp*0.46));
  const hLo=Math.max(2,Math.round(sp*0.5)), hHi=Math.round(sp*2.7);
  const head=new Uint8Array(N);
  for(let y=y0;y<=y1;y++){ const o=y*W;
    for(let x=clefEnd;x<W;x++){ const p=o+x;
      if(ink[p]&&vr[p]>=vLo&&hr[p]>=hLo&&hr[p]<=hHi)head[p]=1; } }
  const cands=[], seen=new Uint8Array(N), stk=new Int32Array(N);
  const minArea=Math.max(6,Math.round(sp*sp*0.22));
  for(let y=y0;y<=y1;y++)for(let x=clefEnd;x<W;x++){
    const p0=y*W+x; if(!head[p0]||seen[p0])continue;
    let sptr=0; stk[sptr++]=p0; seen[p0]=1;
    let ax0=x,ax1=x,ay0=y,ay1=y,area=0,symY=0;
    while(sptr>0){
      const q=stk[--sptr], qy=(q/W)|0, qx=q-qy*W;
      area++; symY+=qy;
      if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=qx+dx, ny=qy+dy;
        if(nx<clefEnd||nx>=W||ny<y0||ny>y1)continue;
        const np=ny*W+nx; if(head[np]&&!seen[np]){seen[np]=1;stk[sptr++]=np;}
      }
    }
    const bw=ax1-ax0+1, bh=ay1-ay0+1;
    /* 디버그 고리: 콘솔에서 window.__GEOMDBG=[] 을 먼저 두면 후보 덩어리 치수가 담긴다.
       이 알고리즘은 눈에 보이는 출력이 없어서, 이게 없으면 왜 음을 놓쳤는지 알 방법이 없다. */
    if(window.__GEOMDBG)window.__GEOMDBG.push({sp:+sp.toFixed(1),bw,bh,area,cy:+(symY/area).toFixed(1),cx:+((ax0+ax1)/2).toFixed(1),hRatio:+(bh/sp).toFixed(2),wRatio:+(bw/sp).toFixed(2),fill:+(area/(bw*bh)).toFixed(2)});
    if(area<minArea)continue;
    if(bh<sp*0.62||bh>sp*1.7||bw<sp*0.55||bw>sp*2.2)continue;   // 반 칸 높이는 쉼표다
    if(bw<bh*0.8)continue;                     // 음표 머리는 세로보다 가로가 길다
    if(area/(bw*bh)<0.5)continue;
    /* hs = '음표 머리처럼 생겼는가'. 들여보내는 문(위 조건)은 일부러 넉넉하게 두되,
       같은 칸에서 누구를 대표로 삼을지 고를 때는 이걸로 가린다 — 아래 5) 참고. */
    const hs=(bh>=sp*0.75&&bh<=sp*1.5&&bw>=sp*0.8&&bw<=sp*1.8)?1:0;
    cands.push({x0:ax0,x1:ax1,cx:(ax0+ax1)/2,cy:symY/area,hollow:false,hs});
  }

  /* 4) 속이 빈 머리: 잉크로 완전히 둘러싸인 흰 구멍 */
  /* ★★ 두 번 찾는다 (v63에서 잡은 큰 버그).
     음표 머리는 정확히 한 칸 높이라 **칸(줄과 줄 사이)에 놓이면 위·아래 줄에 반드시 닿는다.**
     닿는 자리의 테두리 잉크는 줄 두께 안에 통째로 들어 있어서 줄을 지울 때 같이 지워진다.
     그러면 테두리가 뚫려 속 빈 머리의 흰 속이 바깥과 이어져 버리고, 구멍을 못 찾으니
     그 음이 **통째로 사라졌다.**
     실측(합성 오선 sp=18): 칸에 놓인 2분음표는 **4개 중 0개**, 줄 위에 놓인 것은 4개 중 4개.
     즉 2분·온음표의 절반이 원리적으로 안 보이고 있었다.
     사용자 신고 *"파, 미 인데 파만 나왔다(파가 4박자로 되어 있음)"* 가 정확히 이것이다 —
     칸에 놓인 미가 사라지고, 혼자 남은 파가 마디를 채우려고 4박으로 늘어난다(fitBarBeats).
     잉크 지도를 직접 찍어 보니 테두리가 딱 **2픽셀**(x=340,341 · 행 128) 끊겨 있었다.
     ★ 고치는 법: 지운 줄 자리를 **다시 살렸다고 치고** 한 번 더 찾는다(sealed).
       그러면 칸에 놓인 머리의 구멍이 닫힌다.
     ★ 다만 그렇게만 하면 **줄·자리표·마디선·기둥이 두른 빈 사각형**이 전부 속 빈 머리로
       잡힌다(실측: 자리표와 첫 ♯ 사이 22×17px 짜리 가짜 음). 그래서 **둘레가 진짜 잉크인지**를
       같이 본다 — 음표 구멍은 둘레의 대부분이 머리 테두리(진짜 잉크)고, 가짜 사각형은
       위아래가 통째로 '살렸다고 친 줄'이다.
     ★ 첫 번째 찾기(생 줄 그대로)는 예전과 하나도 달라지지 않는다. 줄 위에 놓인 머리는
       구멍 가운데를 줄이 가로지르므로, 줄을 되살리면 구멍이 반으로 쪼개져 오히려 사라진다
       (먼저 한 번에 되살렸다가 score 테스트에서 3음을 잃고 알았다).
       두 번 찾아 **더하기만** 하는 이유가 그것이다. */
  const bg=new Uint8Array(N), rowN=new Int32Array(H);
  const holes=[];
  const inkS=new Uint8Array(N);
  for(let p=0;p<N;p++)inkS[p]=(ink[p]||erased[p])?1:0;
  const findHoles=(mask,sealed)=>{
    bg.fill(0); let bptr=0;
    const pushBg=(x,y)=>{ if(x<0||x>=W||y<y0||y>y1)return; const p=y*W+x; if(!mask[p]&&!bg[p]){bg[p]=1;stk[bptr++]=p;} };
    for(let x=0;x<W;x++){ pushBg(x,y0); pushBg(x,y1); }
    for(let y=y0;y<=y1;y++){ pushBg(0,y); pushBg(W-1,y); }
    while(bptr>0){ const q=stk[--bptr], qy=(q/W)|0, qx=q-qy*W;
      pushBg(qx-1,qy); pushBg(qx+1,qy); pushBg(qx,qy-1); pushBg(qx,qy+1); }
    for(let y=y0;y<=y1;y++)for(let x=clefEnd;x<W;x++){
      const p0=y*W+x; if(mask[p0]||bg[p0])continue;
      let sptr=0; stk[sptr++]=p0; bg[p0]=1;
      let ax0=x,ax1=x,ay0=y,ay1=y,area=0,symY=0,symX=0,real=0,edge=0;
      while(sptr>0){
        const q=stk[--sptr], qy=(q/W)|0, qx=q-qy*W;
        area++; symY+=qy; symX+=qx; rowN[qy]++;
        if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
          if(Math.abs(dx)+Math.abs(dy)!==1)continue;
          const nx=qx+dx, ny=qy+dy;
          if(nx<0||nx>=W||ny<y0||ny>y1)continue;
          const np=ny*W+nx;
          if(mask[np]){ edge++; if(ink[np])real++; continue; }   // 둘레가 무엇으로 되어 있나
          if(!bg[np]){bg[np]=1;stk[sptr++]=np;}
        }
      }
      const bw=ax1-ax0+1, bh=ay1-ay0+1, cx=symX/area, cyH=symY/area;
      /* 줄마다 몇 픽셀인가 — 위아래가 **좁아지는가**(타원인가, 네모인가)를 보는 데 쓴다 */
      let wMid=0; for(let y=ay0;y<=ay1;y++)if(rowN[y]>wMid)wMid=rowN[y];
      const wTop=rowN[ay0], wBot=rowN[ay1];
      for(let y=ay0;y<=ay1;y++)rowN[y]=0;
      /* 디버그 고리: window.__HOLEDBG=[] (속이 빈 머리 후보) */
      if(window.__HOLEDBG)window.__HOLEDBG.push({sealed,cx:+cx.toFixed(1),cy:+cyH.toFixed(1),bw,bh,area,
        wR:+(bw/sp).toFixed(2),hR:+(bh/sp).toFixed(2),realR:+(real/Math.max(1,edge)).toFixed(2),
        tR:+(wTop/Math.max(1,wMid)).toFixed(2),bR:+(wBot/Math.max(1,wMid)).toFixed(2)});
      if(area<Math.max(3,sp*sp*0.05))continue;
      /* ★ 구멍의 **높이 하한**이 중요하다(v57). 음표 머리는 한 칸 높이고 테두리가 0.2칸쯤이라
         구멍은 최소 0.35칸은 된다. 예전 하한 0.2칸에서는 **빔과 두 기둥이 둘러싼 흰 틈**
         (실측 0.43×0.29칸)이 속 빈 머리로 잡혔고, 그게 같은 칸의 **진짜 음표(바로 아래 덧줄
         음)를 밀어냈다** — "같은 x 면 맨 위" 규칙 때문이다. */
      if(bw<sp*0.28||bw>sp*1.25||bh<sp*0.32||bh>sp*1.0)continue;
      /* ★ "가로가 세로보다 길다"만으로 자르면 안 된다(v57). 작게 인쇄된 온음표·2분음표는
         테두리가 두꺼워 구멍이 **세로로 긴 슬릿**이 된다(실측: 9×14). 진짜 갈라야 할 상대는
         16분음표 꼬리 빈틈과 빔 아래 빈틈인데, 그건 **얼마나 꽉 찼는지**로 확실히 갈린다
         (실측: 음표 구멍 0.70~0.77 / 꼬리 빈틈 0.52). */
      if(bw<bh*1.12&&!(bw>=sp*0.35&&bh>=sp*0.35&&area>=bw*bh*0.62))continue;
      if(sealed){
        /* ★ 되찾으려는 것은 **칸 한가운데 놓인 머리** 하나뿐이다. 그것 말고는 아무것도
           더하지 않는다 — 그러지 않으면 꼬리(8·16분)와 기둥 사이의 빈틈까지 속 빈 머리로
           잡혀 8분음표가 2분음표로 둔갑한다(실측: rhythm 테스트 11개 중 3개가 깨졌다).
           칸 한가운데 = 반칸 눈금이 **홀수**이고 눈금에서 0.3칸 넘게 벗어나지 않은 자리. */
        const qH=(bot-cyH)/(sp/2), stH=Math.round(qH);
        if(Math.abs(qH-stH)>0.3||!(Math.abs(stH)%2))continue;
        /* ★ 그리고 **가로가 세로보다 긴** 구멍만 받는다(음표 머리는 눕힌 타원이다).
           꼬리와 기둥과 줄이 만드는 주머니는 **세로로 길다**(실측 13×18, 0.54×0.75칸) —
           이것 때문에 8분음표 셋이 4분음표로 둔갑했다. 둘레 비율(0.82)로는 안 갈렸다.
           ※ 아주 작게 인쇄된 온음표는 구멍이 세로로 긴 슬릿이 되는데(9×14), 그건 줄 위에
             놓였을 때 얘기이고 그 경우는 첫 번째 찾기가 이미 잡는다. */
        if(bw<=bh||bw<sp*0.55)continue;
        /* ★ 그리고 **위아래가 좁아져야** 한다. 음표 머리의 속은 눕힌 타원이라 맨 윗줄·맨 아랫줄이
           가운데보다 훨씬 좁다(실측 0.17·0.28). 줄·자리표·기둥이 두른 빈 칸은 **네모**라
           위아래가 가운데와 같다(실측 1.00·1.00) — 둘레가 진짜 잉크인지(0.79)로는 못 갈랐다.
           이 검사 하나로 자리표와 첫 ♯ 사이 22×16px 짜리 가짜 음이 사라졌다. */
        if(wTop>wMid*0.75||wBot>wMid*0.75)continue;
        /* ★ 둘레가 **거의 다 진짜 잉크**여야 한다 — 되살린 줄이 두르고 있으면 그건 줄이
           만든 빈 칸이지 음표 구멍이 아니다. 실측한 둘레의 진짜 잉크 비율:
             칸에 놓인 2분음표의 구멍 0.94 / 자리표와 첫 ♯ 사이 빈 칸 0.44
             / 8분음표 꼬리와 기둥과 줄이 두른 주머니 0.5~0.7(이것 때문에 0.5 로는 모자랐다 —
               8분음표 셋이 4분음표로 둔갑했다). */
        if(real<edge*0.78)continue;
        /* 첫 번째에서 이미 찾은 구멍이면 더하지 않는다 */
        if(holes.some(h=>Math.abs(h.cx-cx)<sp*0.7&&Math.abs(h.cy-cyH)<sp*0.7))continue;
      }
      holes.push({x0:ax0,x1:ax1,cx,cy:cyH,hollow:true,
                  hs:(bw>=sp*0.4&&bh>=sp*0.35)?1:0});
    }
  };
  findHoles(ink,false);
  findHoles(inkS,true);
  /* 오선 밖(위·아래)에 구멍이 여럿 흩어져 있으면 그건 음표가 아니라 글자다
     (찬송가는 오선 사이에 가사를 인쇄한다). 그런 구멍은 통째로 버린다. */
  const outside=holes.filter(h=>h.cy<top-sp*0.6||h.cy>bot+sp*0.6);
  const useHoles=(outside.length>3)?holes.filter(h=>h.cy>=top-sp*0.6&&h.cy<=bot+sp*0.6):holes;
  /* ★ 속 빈 머리의 **테두리**가 '속이 찬 덩어리' 검사도 함께 통과하는 일이 흔하다(v57).
     예전에는 그럴 때 구멍을 그냥 버렸고, 그러면 그 음이 **4분음표로 둔갑**했다. 게다가
     기둥까지 못 찾으면(온음표) 통째로 사라졌다 — 실측한 찬송가 2단에서 2분·온음표 4개가
     전부 이 길로 빠졌다. 겹치면 버리지 말고 **속이 빈 것으로 고쳐 준다.** */
  for(const h of useHoles){
    const hit=cands.find(c=>Math.abs(c.cx-h.cx)<sp*0.7&&Math.abs(c.cy-h.cy)<sp*0.7);
    if(hit){ if(!hit.hollow&&Math.abs(hit.cx-h.cx)<sp*0.5&&Math.abs(hit.cy-h.cy)<sp*0.4)hit.hollow=true; continue; }
    cands.push(h);
  }
  if(cands.length<3)return null;

  /* ★ 오선 밖 후보(코드 글자·가사)는 **여기서 먼저** 버린다(v57).
     예전에는 이 검사를 맨 마지막(길이 판정 뒤)에 했는데, 그 전에 "같은 x 면 맨 위만 남긴다"
     규칙이 먼저 도는 게 문제였다 — 음표 **바로 위에 찍힌 코드 글자**가 그 칸의 대표가 되어
     진짜 음표를 밀어내고, 그다음 검사에서 글자가 버려지면서 **음표까지 함께 사라졌다.**
     실측: 찬송가 2·4·5단에서 이 길로 음표가 단마다 두세 개씩 없어졌다.
     규칙 자체는 그대로다 — 오선 밖(위 10반칸·아래 -2반칸 너머)은 덧줄이 있어야 음표다. */
  {
    const half0=sp/2;
    const keep=c=>{
      const step=Math.round((bot-c.cy)/half0);
      if(step<10&&step>-2)return true;
      /* ★ 오선 밖은 코드 글자·가사가 사는 곳이다. 덧줄만으로는 모자랐다(v57 실측):
         빨간 코드 "D" 의 세로획이 바로 아래 **빔**을 덧줄로 착각해 통과했다.
         오선 밖에서는 **음표 머리 모양까지** 갖춰야 음표로 본다 — 글자 획은 대개 좁다
         (실측: "D" 의 조각 0.71칸 폭, 진짜 머리 1.05칸). */
      if(!c.hs)return false;
      const ly=Math.round(bot-(step>=10?10:-2)*half0);
      const x0c=Math.max(0,Math.round(c.cx-sp*0.7)), x1c=Math.min(W-1,Math.round(c.cx+sp*0.7));
      let best=0;
      for(let y=ly-1;y<=ly+1;y++){
        if(y<0||y>=H)continue;
        let n=0; for(let x=x0c;x<=x1c;x++)if(ink[y*W+x])n++;
        best=Math.max(best,n/Math.max(1,x1c-x0c+1));
      }
      return best>=0.7;
    };
    const kept=cands.filter(keep);
    if(kept.length>=3)cands.length=0,Array.prototype.push.apply(cands,kept);
  }
  /* 5) 같은 x 에 쌓인 것은 맨 위만 = 소프라노 */
  cands.sort((a,b)=>a.cx-b.cx);
  let cols=[];
  for(const c of cands){
    const L=cols.length?cols[cols.length-1]:null;
    if(L){
      const ov=Math.min(L.x1,c.x1)-Math.max(L.x0,c.x0);
      const mw=Math.min(L.x1-L.x0,c.x1-c.x0)+1;
      /* 위쪽 것을 고를 때 속 빈 머리인지 여부도 함께 따라가야 한다 — 길이 판정의 재료다 */
      /* ★ "같은 x 면 맨 위" 는 SATB(위가 소프라노)를 위한 규칙인데, 그대로 두면 **음표가
         아닌 것**이 위에 있다는 이유로 대표가 되어 진짜 음표를 밀어낸다. 실측(사용자 악보
         3단): 빔 조각(0.9×0.67칸)이 바로 아래 진짜 머리(1.05×1.19칸)를 밀어냈고, 그다음
         "기둥도 구멍도 없다"로 버려지면서 **음표가 통째로 사라졌다.**
         그래서 **머리처럼 생긴 것끼리 먼저 겨루고**, 그 안에서만 위쪽을 고른다. */
      if(ov>mw*0.5){ L.x0=Math.min(L.x0,c.x0); L.x1=Math.max(L.x1,c.x1);
                     L.ys.push(c.cy);
                     if(c.hs>(L.hs||0)||((c.hs||0)===(L.hs||0)&&c.cy<L.cy)){
                       L.cy=c.cy; L.hollow=c.hollow; L.hs=c.hs; }
                     continue; }
    }
    cols.push({x0:c.x0,x1:c.x1,cx:c.cx,cy:c.cy,hollow:c.hollow,hs:c.hs||0,ys:[c.cy]});
  }
  if(cols.length<3)return null;
  /* ★ 음표 머리 둘은 **한 칸보다 가까이 설 수 없다**(머리 자체가 1.3칸 폭이다). 그보다
     가까이 붙어 있으면 둘 중 하나는 음표가 아니다 — 대개 빔 조각이다(실측: 20×14px 짜리
     빔 토막이 0.76칸 옆의 진짜 머리와 나란히 남아 가짜 음이 하나 더 생겼다).
     그럴 때는 **머리처럼 생긴 쪽**을 남긴다. */
  if(cols.length>2){
    cols=cols.filter((c,i)=>!cols.some((o,j)=>j!==i&&Math.abs(o.cx-c.cx)<sp*0.85&&(o.hs||0)>(c.hs||0)));
  }
  if(cols.length<3)return null;

  /* 6) 반칸 격자에 얼마나 잘 떨어지는지로 신뢰도를 판단한다 */
  const half=sp/2, base=CLEF_BOTTOM[(clef||clefKind)==='bass'?'bass':'treble'];
  /* 길이를 재면서 **가짜 머리도 걸러낸다**(v50). 속이 찬 음표 머리는 기둥이 반드시
     있다(기둥 없는 음표는 온음표뿐이고 그건 속이 비어 있다). 그래서 "속이 찬데 기둥이
     없는 것"은 음표가 아니라 자리표·조표·글자 조각이다.
     ★ 실측: 실제 찬송가 사진에서 단마다 앞에 가짜 음 2개(자리표 자리 x=42,58)가
       잡혀 개수가 어긋났고, 그 때문에 음높이 보정(v49)까지 통째로 못 쓰고 있었다.
       이 한 줄로 개수가 Audiveris 와 정확히 같아졌다. */
  /* 조표(#/b)가 자리표 구간을 빠져나와 음표로 남는 일이 있다. 글자 모양으로는 잘 안 갈리지만
     **간격으로는 확실히 갈린다** — 조표는 서로 한 칸 남짓 붙어 서고, 그다음 진짜 첫 음까지는
     반드시 뚜렷한 여백이 있다(조판 규칙이다). 그래서 맨 왼쪽(폭의 22% 안)에 **1.6칸보다 촘촘히
     붙어 선 무리**가 있고 그 뒤로 2.5칸 넘는 여백이 오면, 그 무리는 조표다.
     ★ 음표에는 이 조건이 안 걸린다 — 가장 촘촘한 16분음표도 2칸 넘게 벌어지고, 무엇보다
       진짜 음표 무리 뒤에는 이런 큰 여백이 없다. */
  if(window.__COLDBG)window.__COLDBG.push({stage:'pre',v:cols.map(c=>({x:+(c.cx/W).toFixed(3),cy:+c.cy.toFixed(0),ho:c.hollow}))});
  if(cols.length>2){
    const xLim2=W*0.22, gapTight=sp*1.6, gapClear=sp*2.5;
    let k=0;
    while(k+1<cols.length&&cols[k+1].cx-cols[k].cx<gapTight&&cols[k+1].cx<xLim2)k++;
    /* ★ 조표(#/b)에는 **속이 빈 타원 구멍이 없다**(v57). 그런데 이 규칙은 모양을 안 보고
       "왼쪽에 촘촘히 붙은 무리"를 통째로 지우므로, 첫 음이 2분·온음표이고 조표 가까이
       붙어 있으면 **진짜 첫 음까지 지웠다** — 실측한 찬송가 2단에서 정확히 그랬다.
       속 빈 머리가 하나라도 끼어 있으면 그 무리는 조표가 아니다. */
    if(k>0&&cols.slice(0,k+1).some(c=>c.hollow))k=0;
    if(k>0&&cols[k].cx<xLim2&&cols[k+1]&&cols[k+1].cx-cols[k].cx>gapClear)cols=cols.slice(k+1);
  }
  if(cols.length<3)return null;
  /* ★ 임시표(♯·♭·♮)를 찾는다 (v60). **음표를 고르는 일이 다 끝난 뒤**에 한 번에 한다 —
     순서가 중요하다. 임시표를 음표 하나하나의 왼쪽에서 따로 찾으면, 임시표 자체가 음표
     후보로 남아 있을 때 "앞 음표 오른쪽부터" 라는 경계가 임시표를 가려 버린다
     (실측: ♭ 의 동그라미가 속 빈 머리로 잡혀 그 음의 ♭ 을 통째로 못 봤다).
     한 번에 찾아 두면 **임시표로 판정된 자리의 가짜 음표를 지우는 일**도 같이 된다. */
  const accMarks=findAccidentals(ink,W,H,sp,y0,y1,Math.max(0,clefEnd));
  if(accMarks.length){
    /* 임시표 자리에 겹치는 음표 후보는 음표가 아니다(그 임시표 자신이다) */
    const keep=cols.filter(c=>!accMarks.some(a=>
      c.cx>=a.x0-1&&c.cx<=a.x1+1&&c.cy>=a.y0-1&&c.cy<=a.y1+1));
    if(keep.length>=3)cols=keep;
  }
  const colAcc=attachAccidentals(accMarks,cols,sp);
  if(window.__ACCDBG)window.__ACCDBG.push({marks:accMarks.map(a=>({k:a.kind,x:a.x0,cy:+a.cy.toFixed(0),w:a.x1-a.x0+1,h:a.y1-a.y0+1})),colAcc});
  if(window.__COLDBG)window.__COLDBG.push({stage:'cols',v:cols.map(c=>({x:+(c.cx/W).toFixed(3),cy:+c.cy.toFixed(0),ho:c.hollow}))});
  const res=[], devs=[];
  cols.forEach((c,ci)=>{
    const nextX0=(ci+1<cols.length)?cols[ci+1].x0:W;
    const d=headDur(ink,vr,hr,W,c,sp,y0,y1,bot,nextX0,(c.ys||[]).filter(v=>Math.abs(v-c.cy)>sp*0.4),lineRow);
    if(window.__COLDBG)window.__COLDBG.push({stage:'dur',x:+(c.cx/W).toFixed(3),cy:+c.cy.toFixed(0),ho:d.hollow,st:d.stem,b:d.beats,step:Math.round((bot-c.cy)/(sp/2))});
    if(!d.hollow&&!d.stem)return;
    const q=(bot-c.cy)/half, step=Math.round(q);
    /* ★ 오선 밖으로 나간 음은 **덧줄이 있어야 진짜 음표다**(v53).
       오선 바깥 자리에는 음표만 있는 게 아니다 — 위에는 **코드 이름(A, E/G♯, F♯m7)** 과
       조표의 #, 아래에는 **가사 글자**가 있다. 이것들이 음표로 섞여 들어오면 개수가 어긋나
       음높이 보정이 통째로 꺼진다(개수가 다르면 아무것도 안 하는 설계라 조용히 그렇게 된다).
       조판 규칙은 딱 떨어진다: 맨 윗줄 바로 위 칸(step 9)까지는 덧줄이 없지만 **step 10
       부터는 반드시 덧줄**이고, 아래도 맨 아랫줄 바로 아래 칸(step -1)까지는 덧줄이 없지만
       **step -2 부터는 반드시 덧줄**이다. 그래서 오선에 가장 가까운 덧줄 자리에 가로줄이
       실제로 있는지만 보면, 글자와 음표가 규칙 하나로 갈린다.
       ★ 글자를 "기둥이 없다"로 거르려 하면 안 된다 — A·D 같은 글자에도 세로획이 있다. */
    if(step>=10||step<=-2){
      const ly=Math.round(bot-(step>=10?10:-2)*half);
      const x0c=Math.round(c.cx-sp*0.7), x1c=Math.round(c.cx+sp*0.7);
      let best=0;
      for(let y=ly-1;y<=ly+1;y++){
        if(y<0||y>=H)continue;
        let n=0; for(let x=Math.max(0,x0c);x<=Math.min(W-1,x1c);x++)if(ink[y*W+x])n++;
        best=Math.max(best,n/Math.max(1,x1c-x0c+1));
      }
      if(best<0.7)return;
    }
    devs.push(Math.abs(q-step));
    res.push({x:c.cx/sc, cy:c.cy, step, abs:base+step, name:diaName(base+step), acc:colAcc[ci]||'',
              beats:d.beats, sure:d.sure, stem:d.stem, bands:d.bands, dot:d.dot, hollow:d.hollow});
  });
  if(res.length<3)return null;
  devs.sort((a,b)=>a-b);
  const med=devs[devs.length>>1];
  if(med>0.26)return null;                     // 격자에 안 맞으면 오선을 잘못 잡은 것이다
  const durSure=res.every(n=>n.sure);
  const total=+res.reduce((a,n)=>a+(n.beats||0),0).toFixed(4);

  /* 7) 마디선 — 사진 위에 "지금 몇째 마디"를 표시하려면 이게 필요하다(v52).
     오선 다섯 줄을 **위아래로 꽉 꿰뚫는 얇은 세로 잉크**만 마디선으로 본다.
     ★ 기둥(stem)을 걸러내는 게 전부다. 기둥은 오선 높이(4칸)가 아니라 3.5칸이고
       머리에 붙은 쪽 끝이 반드시 모자란다 — 아래 줄 음표의 위 기둥은 위쪽으로는
       넘치지만 아래쪽이 반 칸 모자라고, 위 줄 음표의 아래 기둥은 그 반대다.
       그래서 "위로도 아래로도 다 넘치는가"를 보면 기둥은 자동으로 빠진다.
     ★ 오선 줄 지우기(2단계)는 이미 끝난 상태다. 마디선은 세로 런이 길어서 그 단계에
       지워지지 않는다 — 지워지는 건 줄에 붙은 짧은 잉크뿐이다.
     ★★ 위의 "기둥은 3.5칸이라 못 넘는다"는 **틀린 말이었다**(v57에서 실측으로 잡았다).
       오선 **아래쪽**에 놓인 음표의 위 기둥은 머리 높이까지 합치면 4.5칸이라 위아래를
       둘 다 넘는다. 그래서 찬송가 한 단에서 마디선이 4개가 아니라 9개로 잡혔고(음표
       자리와 x 가 정확히 같았다), 20마디짜리 곡이 29마디로 늘어나 사진 하이라이트가
       통째로 어긋났다. 진짜 구분 기준은 **굵기**다 — 마디선은 처음부터 끝까지 얇지만
       기둥에는 반드시 머리(1.3칸 폭)가 붙어 있다. 그래서 오선 높이 전 구간에서
       가로 잉크가 한 번도 0.62칸을 넘지 않아야 마디선으로 인정한다. */
  const bars=[];
  {
    const yA=top+sp*0.25, yB=bot-sp*0.25, ya=Math.round(yA);
    const lim=Math.max(2,Math.round(sp*0.55));
    const thin=Math.max(2,Math.round(sp*0.62));
    const yT0=Math.max(0,Math.round(top-sp*0.2)), yB0=Math.min(H-1,Math.round(bot+sp*0.2));
    const full=new Uint8Array(W);
    /* 자리표·조표 구간에는 마디선이 없다 — 거기서 찾으면 자리표의 세로획이 마디선이 된다 */
    if(ya>=0&&ya<H)for(let x=Math.max(0,clefEnd);x<W;x++){
      if(!ink[ya*W+x])continue;
      let t2=ya; while(t2-1>=0&&ink[(t2-1)*W+x])t2--;
      let b2=ya; while(b2+1<H&&ink[(b2+1)*W+x])b2++;
      if(!(t2<=yA&&b2>=yB)){ if(window.__BARDBG)window.__BARDBG.push({x,why:'짧다',t2,b2,yA:+yA.toFixed(0),yB:+yB.toFixed(0)}); continue; }
      let wide=false, wy=0, wv=0;
      /* ★ **오선 줄이 지나는 행은 빼고** 본다(v64). 마디선 자리에서는 줄이 지워지지 않고
         살아남는다(그 칸의 세로 잉크가 길어서 — 그게 마디선이니까). 그 살아남은 줄 토막이
         마디선과 이어져 가로 잉크가 0.62칸을 넘고, 그러면 **진짜 마디선이 "굵다"로 떨어진다.**
         실측(참 반가운 성도여 · 800px): 1단에서 마디선 3개가 19~26px(문턱 18)로 이 길에
         떨어졌다 — 마디선을 하나밖에 못 찾아 마디 나누기가 통째로 무너졌다.
         기둥은 이 완화로 되살아나지 않는다 — 머리(1.3칸)는 줄 밖 행에도 걸치기 때문이다. */
      for(let y=yT0;y<=yB0;y++){
        if(lineRow[y]||(y>0&&lineRow[y-1])||(y+1<H&&lineRow[y+1]))continue;
        if(hr[y*W+x]>thin){ wide=true; wy=y; wv=hr[y*W+x]; break; } }
      /* 디버그 고리: window.__BARDBG=[] 를 먼저 두면 마디선 후보가 왜 떨어졌는지 담긴다 */
      if(window.__BARDBG&&wide)window.__BARDBG.push({x,why:'굵다',wy,wv,thin});
      if(!wide)full[x]=1;
    }
    let s2=-1;
    for(let x=0;x<=W;x++){
      const on=x<W&&full[x];
      if(on){ if(s2<0)s2=x; }
      else if(s2>=0){ if(x-s2<=lim)bars.push(((s2+x-1)/2)/sc); s2=-1; }
    }
    /* 단 끝 마디선 보충 — 오선이 끝나는 자리에 마디선이 없으면 거기에 하나 둔다.
       겹세로줄(끝마디)이나 굵은 줄은 위의 '얇아야 한다' 검사에서 빠질 수 있다. */
    if(staffX1>sp*4&&!bars.some(b=>Math.abs(b*sc-staffX1)<sp*1.6))bars.push(staffX1/sc);
    bars.sort((a,b)=>a-b);
  }
  /* ★ 마디선 자리에는 음표가 없다(v57). 겹세로줄(끝마디)은 굵어서, 오선 줄을 지우고 나면
     토막토막 남아 음표 머리 크기의 덩어리가 된다 — 실측: 단 끝 겹세로줄이 E5 음표 하나로
     잡혔다. 마디선을 다 찾은 **뒤**라 이 자리를 아는 것이 공짜다. */
  if(bars.length){
    const near=sp*0.4/sc;
    for(let i=res.length-1;i>=0;i--)
      if(bars.some(b=>Math.abs(b-res[i].x)<near))res.splice(i,1);
    /* ★ 마지막 마디선 **뒤**에 남은 잉크도 지운다(v65). 단은 언제나 마디선으로 끝난다
       (못 찾으면 위에서 끝자리에 하나 보충해 둔다) — 그 뒤에 남는 건 겹세로줄 장식이나
       인쇄 얼룩이지 다음 마디를 여는 음표가 아니다. 0.4칸 문턱은 너무 좁아서 못 걸렀다:
       실측(「무덤에 머물러」 5단) 마지막 마디선 14px(0.67칸) 뒤에 가짜 E5 하나가
       남아 있었다 — 실제 마지막 음(A4, 온음표)은 정상히 잡혀 있는데 그 뒤에 덧붙어
       "맨 끝 음이 다르다"는 신고로 이어졌다. */
    const lastBar=bars[bars.length-1];
    for(let i=res.length-1;i>=0;i--) if(res[i].x>lastBar+near) res.splice(i,1);
  }
  if(res.length<3)return null;

  /* w: notes[].x · bars[] 가 어떤 폭을 기준으로 한 값인지. 사진 위 비율로 바꿀 때 쓴다. */
  /* iw: top/bot/sp 가 사는 내부 캔버스 폭. 원본 그림 좌표로 되돌릴 때 쓴다(코드 띠 오려내기). */
  return {sp,top,bot,med,notes:res,durSure,total,w:img.width,iw:W,bars,keySig:ksig,clef:clef||clefKind||'treble'};
}
/* AI 결과의 ♪ 줄 음이름을 우리가 센 것으로 덮어쓴다. 개수가 정확히 같을 때만 한다.
   accs: 우리가 **그림에서 직접 읽은** 임시표(v60). ''=못 봤음 · '#'·'b'=붙어 있음 · 'n'=제자리표.
   ★ 못 본 자리에서는 AI 가 적어 온 임시표를 그대로 둔다 — 여태 해 오던 대로다.
     우리가 본 자리에서만 덮어쓴다. 그래야 새 검출기가 놓쳐도 지금보다 나빠지지 않는다. */
function applyGeomPitch(text,names,accs){
  if(!names||!names.length)return {text,changed:0,matched:false};
  const lines=text.split('\n');
  const idx=[]; lines.forEach((l,i)=>{ if(/^\s*♪/.test(l))idx.push(i); });
  if(idx.length!==1)return {text,changed:0,matched:false};      // 줄이 쪼개졌으면 정렬 근거가 없다
  const i0=idx[0], toks=lines[i0].replace(/^\s*♪\s*/,'').split(/\s+/).filter(Boolean);
  const NT=/^([A-G])([#♯b♭]?)(-?\d+)(:[\d.]+)?$/;
  const pos=[]; toks.forEach((t,k)=>{ if(NT.test(t))pos.push(k); });
  if(pos.length!==names.length)return {text,changed:0,matched:false};
  let changed=0;
  pos.forEach((k,n)=>{
    const m=toks[k].match(NT), want=names[n];
    const wl=want[0], wo=want.slice(1);
    const seen=accs&&accs[n];
    /* 우리가 그림에서 본 것이 있으면 그걸 쓰고(♮ 은 임시표를 뗀다),
       못 봤으면 여태처럼 AI 것을 유지한다(음이름이 그대로일 때만). */
    const acc=(seen==='#'||seen==='b')?seen
             :(seen==='n')?''
             :((m[1].toUpperCase()===wl)?m[2]:'');
    const nt=wl+acc+wo+(m[4]||'');
    if(nt!==toks[k])changed++;
    toks[k]=nt;
  });
  lines[i0]='♪ '+toks.join(' ');
  return {text:lines.join('\n'),changed,matched:true};
}

/* 우리가 잰 음표 길이를 AI 결과의 ♪ 줄에 써 넣는다(v50).
   음이름(applyGeomPitch)보다 훨씬 조심해야 한다 — 박자는 한 음만 틀려도 그 뒤가 다 밀리고,
   음이름과 달리 "귀로 들어 이상하다"는 것도 늦게 알아차린다. 그래서 문을 세 개 둔다:
     1) 잰 음표 개수가 AI 가 적은 음표 개수와 정확히 같아야 한다(정렬 근거)
     2) 모든 음의 길이를 확신해야 한다(하나라도 애매하면 통째로 포기)
     3) 합계가 말이 돼야 한다 — 박자표의 정수 배(마디가 딱 떨어짐)이거나,
        AI 가 적은 합계와 거의 같아야 한다(서로 다른 두 방법이 같은 답을 냈다는 뜻)
   셋 중 하나라도 어긋나면 아무것도 하지 않는다. */
function applyGeomDur(text,notes,perBar){
  const none={text,changed:0,matched:false,why:''};
  if(!notes||!notes.length)return none;
  if(!notes.every(n=>n.sure&&n.beats>0))return {...none,why:'길이가 애매한 음이 있음'};
  const lines=text.split('\n');
  const idx=[]; lines.forEach((l,i)=>{ if(/^\s*♪/.test(l))idx.push(i); });
  if(idx.length!==1)return {...none,why:'♪ 줄이 하나가 아님'};
  const i0=idx[0], toks=lines[i0].replace(/^\s*♪\s*/,'').split(/\s+/).filter(Boolean);
  const NT=/^([A-G][#♯b♭]?-?\d+)(?::([\d.]+))?$/;
  const RT=/^r(?::([\d.]+))?$/i;
  const pos=[]; toks.forEach((t,k)=>{ if(NT.test(t))pos.push(k); });
  if(pos.length!==notes.length)return {...none,why:'개수 불일치'};
  const mine=notes.reduce((a,n)=>a+n.beats,0);
  const rests=toks.reduce((a,t)=>{ const m=t.match(RT); return a+(m?(m[1]?parseFloat(m[1]):1):0); },0);
  const aiTotal=toks.reduce((a,t)=>{
    const m=t.match(NT); if(m)return a+(m[2]?parseFloat(m[2]):1);
    const r=t.match(RT); if(r)return a+(r[1]?parseFloat(r[1]):1);
    return a; },0);
  const withRests=mine+rests;
  const per=perBar||4;
  const k=Math.round(withRests/per);
  const fitsBar=k>=1&&Math.abs(withRests-k*per)<=0.13;
  const fitsAI=Math.abs(withRests-aiTotal)<=0.26;
  if(!fitsBar&&!fitsAI)
    return {...none,why:'합계가 안 맞음('+withRests+'박)'};
  let changed=0;
  pos.forEach((k2,n)=>{
    const m=toks[k2].match(NT), want=notes[n].beats;
    const had=m[2]?parseFloat(m[2]):1;
    if(Math.abs(had-want)>1e-6)changed++;
    toks[k2]=m[1]+':'+want;
  });
  lines[i0]='♪ '+toks.join(' ');
  return {text:lines.join('\n'),changed,matched:true,why:fitsBar?'마디가 딱 맞음':'AI와 합계 일치'};
}

/* ============ 마디 단위로 맞추기 (v62) ============
   ★★ v61까지 가장 큰 구멍이 여기 있었다. 우리가 픽셀로 **정확히 잰 것을 버리고 있었다.**
   사용자 신고: *"업데이트 된 버전으로 돌려도 같은곳에 파, 미 라고 표기 해야하는데
   파(4박자로 되어 있음)"* — 실제 악보 사진을 앱의 실제 경로로 태워 재 보니
   `staffGeom` 은 그 마디를 **`F4:2 E4:2` 로 정확히 읽고 있었다.** 그런데 AI 는 그 둘을
   온음표 하나로 읽었고, `applyGeomPitch` 는 "개수가 다르면 아무것도 안 한다"는 규칙 때문에
   **잰 값을 통째로 버리고 AI 의 틀린 값을 그대로 내보냈다.**

   그 규칙 자체는 옳다 — 줄 전체를 한 줄로 늘어놓고 맞추면 하나만 어긋나도 뒤가 전부 밀린다.
   틀린 것은 **맞추는 단위**였다. 마디선은 우리가 픽셀로 따로 잰 값이고(v52) 음표 검출보다
   훨씬 튼튼하다. 그러니 **마디 단위로 맞추면** 한 마디가 어긋나도 그 마디 안에 갇힌다.

   마디마다 셋 중 하나를 한다:
     ① 개수가 같다 → 음이름·임시표·길이를 잰 값으로 덮어쓴다(여태 하던 일, 범위만 마디로)
     ② 잰 것이 **더 많다** → 그 마디를 잰 값으로 통째로 바꾼다(AI 가 음표를 뭉쳐 읽은 것이다)
     ③ 잰 것이 **더 적다** → 손대지 않는다. 우리가 놓쳤을 수 있고, 지우는 것은 되돌릴 수 없다.
   ★ ②③ 의 비대칭이 핵심이다 — **채우기만 하고 지우지는 않는다.**
   ★ 어느 경우든 그 마디의 박수 합이 박자표와 정확히 같을 때만 손댄다(`fitBeatsToBars` 가
     마디선에 맞춰 길이를 이미 바로잡아 둔다). 합이 안 맞으면 마디가 밀리므로 포기한다. */
const GB_NT=/^([A-G])([#♯b♭]?)(-?\d+)(?::([\d.]+))?$/;
/* AI 가 이 단에서 쓴 조표를 그 줄에서 되짚는다 — 같은 음이름에 가장 자주 붙인 임시표.
   바꿔 넣는 마디가 나머지 줄과 어긋나지 않게 하려는 것이라, 밖에서 조를 받아올 필요가 없다. */
function sigFromTokens(toks){
  const cnt={};
  toks.forEach(t=>{ const m=t.match(GB_NT); if(!m)return;
    const L=m[1].toUpperCase(), a=(m[2]||'').replace('♯','#').replace('♭','b');
    (cnt[L]=cnt[L]||{})[a]=(cnt[L][a]||0)+1; });
  const out={};
  for(const L in cnt){ let best='',bn=0;
    for(const a in cnt[L])if(cnt[L][a]>bn){bn=cnt[L][a];best=a;}
    if(best)out[L]=best; }
  return out;
}
function applyGeomBars(text,geo,accs,perBar){
  const none={text,changed:0,filled:0,matched:false,why:''};
  if(!geo||!geo.notes||geo.notes.length<3)return none;
  const per=perBar||4;
  const lines=text.split('\n');
  const idx=[]; lines.forEach((l,i)=>{ if(/^\s*♪/.test(l))idx.push(i); });
  if(idx.length!==1)return {...none,why:'♪ 줄이 하나가 아님'};
  const i0=idx[0];
  const toks=lines[i0].replace(/^\s*♪\s*/,'').split(/\s+/).filter(Boolean);
  const aiBars=[[]];
  for(const t of toks){ if(/^\|+$/.test(t))aiBars.push([]); else aiBars[aiBars.length-1].push(t); }

  const og=origGeomOf(geo);
  const seg=(og&&og.seg&&og.seg.length>1)?og.seg:null;
  if(!seg)return {...none,why:'마디선을 못 찾음'};
  fitBeatsToBars(geo,seg,per);          // 마디마다 합을 박자표에 맞춰 둔다(v57)
  if(aiBars.length!==seg.length)
    return {...none,why:'마디 수 불일치(AI '+aiBars.length+' / 잰 것 '+seg.length+')'};

  const sig=sigFromTokens(toks);
  let changed=0, filled=0;
  const gTok=j=>{
    const nm2=geo.notes[j].name, L=nm2[0], oc=nm2.slice(1);
    const seen=accs&&accs[j];
    const acc=(seen==='#'||seen==='b')?seen:(seen==='n')?'':(sig[L]||'');
    return L+acc+oc+':'+geo.notes[j].beats;
  };
  const outBars=aiBars.map((bar,bi)=>{
    const sg=seg[bi];
    const gi=[]; for(let j=sg.i0;j<sg.i0+sg.cnt;j++)if(geo.notes[j])gi.push(j);
    if(!gi.length)return bar;
    const sum=+gi.reduce((a,j)=>a+(geo.notes[j].beats||0),0).toFixed(4);
    if(Math.abs(sum-per)>0.02)return bar;          // 합이 박자표와 다르면 손대지 않는다
    const pos=[]; bar.forEach((t,k)=>{ if(GB_NT.test(t))pos.push(k); });
    if(pos.length===gi.length){
      const nb=bar.slice();
      pos.forEach((k,n)=>{
        const m=nb[k].match(GB_NT), j=gi[n];
        const nm3=geo.notes[j].name, L=nm3[0], oc=nm3.slice(1);
        const seen=accs&&accs[j];
        /* 임시표를 직접 본 자리만 덮어쓰고, 못 본 자리는 AI 것을 유지한다(v60 과 같은 원칙) */
        const acc=(seen==='#'||seen==='b')?seen
                 :(seen==='n')?''
                 :((m[1].toUpperCase()===L)?(m[2]||''):'');
        const nt=L+acc+oc+':'+geo.notes[j].beats;
        if(nt!==nb[k])changed++;
        nb[k]=nt;
      });
      /* 이 마디의 쉼표는 버린다 — 잰 길이만으로 이미 박자표를 채웠으므로 더하면 넘친다 */
      return nb.filter((t,k)=>pos.indexOf(k)>=0);
    }
    if(gi.length>pos.length){                       // ② 잰 것이 더 많다 = AI 가 뭉쳐 읽었다
      filled+=gi.length-pos.length;
      changed+=gi.length;
      return gi.map(gTok);
    }
    return bar;                                     // ③ 잰 것이 더 적다 → 손대지 않는다
  });
  const flat=[];
  outBars.forEach((b,i)=>{ if(i)flat.push('|'); flat.push.apply(flat,b); });
  lines[i0]='♪ '+flat.join(' ');
  return {text:lines.join('\n'),changed,filled,matched:true,why:''};
}

/* ============ AI 없이 멜로디 만들기 (v51) ============
   staffGeom/headDur 은 픽셀을 재는 계산이라 AI 와 아무 상관이 없다. 그런데 v50 까지는
   그 결과를 "AI가 적어 온 ♪ 줄을 덮어쓰는" 데만 썼다 — 그래서 Gemini 가 없거나
   한도에 걸리면 멜로디가 통째로 사라졌다(사용자 지적: "제미나이가 없더라도 완료가
   되어야 하는데 안 되어 있다"). 맞는 지적이다. 잰 값만으로 ♪ 줄을 직접 만든다.

   솔직히 밝혀 둘 한계 두 가지 — 둘 다 AI가 채워 주던 것이다:
     1) 조표·임시표: 오선 위 '자리'만 잰 것이라 #/b 를 모른다. 조표는 OCR로 읽은
        첫 코드에서 추정해 입힌다(keySigSet). 마디 안 임시표는 알 길이 없다.
     2) 쉼표: 소리가 없는 자리라 잴 대상이 없다. 그래서 마디선은 길이를 전부 확신하고
        합계가 마디에 딱 떨어질 때만 넣는다 — 틀린 마디선은 없느니만 못하다. */
function keySigSet(chord){
  if(!chord)return {};
  /* detectKey 와 같은 규칙(첫 코드를 으뜸음으로 본다). 단조는 나란한 장조로 바꿔 센다 —
     Gm 의 조표는 G장조의 #1개가 아니라 Bb장조의 b2개다. */
  const pc=sigPc(chord.root,/^m(?!aj)/.test(chord.suffix||''));
  const [sgn,cnt]=keySig(pc);
  const ord=sgn==='#'?SHARP_ORD:FLAT_ORD, out={};
  for(let i=0;i<cnt;i++)out[ord[i]]=sgn;
  return out;
}
/* ============ 멜로디에서 코드를 짐작한다 (v54) ============
   사용자 제안 그대로 — *"AI로 굳이 안 읽어도, 네가 마디로 음표 높이를 읽었다고 하면
   코드 못 읽거나 식별 어려운 것은 마디의 음을 보고 무슨 코드가 들어가는지 짐작해서 넣으면
   되잖아!"* 맞는 말이다. 음악에서 이걸 '화성 붙이기'라고 부르고, 찬송가·복음성가처럼
   조성이 뚜렷하고 화성이 단순한 곡에서는 규칙만으로도 꽤 맞는다.
   코드 기호를 **글자로 읽는 것**(OCR)은 ♯ 하나 때문에 무너지지만, 코드를 **음에서 되짚는
   것**은 우리가 이미 픽셀로 재 놓은 값만 쓰므로 AI도 OCR도 필요 없다.

   ★ 마디마다 따로 제일 좋은 코드를 고르면 안 된다. 화성은 앞뒤 관계가 절반이라,
     낱개로 고르면 "마디마다는 그럴듯한데 이어 놓으면 음악이 아닌" 결과가 나온다.
     그래서 마디 점수(그 마디 음이 코드음인가)와 이음 점수(흔한 진행인가)를 함께 놓고
     **곡 전체를 한 번에** 최적으로 고른다(비터비).
   ★ 이건 어디까지나 **짐작이다.** 원보와 다를 수 있다는 것을 숨기지 말 것 —
     짐작한 코드는 화면에 따로 표시하고(.guess), 결과 안내에도 몇 개인지 밝힌다. */

/* 그 조에서 실제로 쓰는 코드만 후보로 둔다. 후보를 늘리면 점수가 비슷한 것들이 많아져
   오히려 더 많이 틀린다 — vii°(감3화음)은 찬송가에서 드물어 넣지 않는다. */
function chordCandidates(keyPc,minor){
  const T=mod(keyPc);
  const mk=(deg,off,sfx,ivs)=>({deg,root:mod(T+off),sfx,pcs:ivs.map(v=>mod(T+v))});
  if(minor)return [
    mk(0,0,'m',[0,3,7]),      // i
    mk(2,3,'', [3,7,10]),     // III
    mk(3,5,'m',[5,8,0]),      // iv
    mk(4,7,'', [7,11,2]),     // V  (화성단음계 — 단조 종지의 기본)
    mk(4,7,'m',[7,10,2]),     // v  (자연단음계)
    mk(5,8,'', [8,0,3]),      // VI
    mk(6,10,'',[10,2,5])      // VII
  ];
  return [
    mk(0,0,'', [0,4,7]),      // I
    mk(1,2,'m',[2,5,9]),      // ii
    mk(2,4,'m',[4,7,11]),     // iii
    mk(3,5,'', [5,9,0]),      // IV
    mk(4,7,'', [7,11,2]),     // V
    mk(5,9,'m',[9,0,4]),      // vi
    mk(4,7,'7',[7,11,2,5])    // V7
  ];
}
const SCALE_MAJ=[0,2,4,5,7,9,11], SCALE_MIN=[0,2,3,5,7,8,10];

/* 이 마디의 음들이 이 코드에 얼마나 맞는가 (−1 ~ +1.3).
   ★ 마디 첫 음(강박)에 가중치를 크게 준다 — 화성을 정하는 건 강박이다.
     지나가는 음(비화성음)은 대개 약박에 있고, 그걸 같은 무게로 세면 엉뚱한 코드가 이긴다. */
function chordFit(notes,c,keyPc,minor){
  if(!notes||!notes.length)return 0;
  const scale=minor?SCALE_MIN:SCALE_MAJ;
  let s=0,w=0;
  notes.forEach((nt,j)=>{
    let k=Math.max(0.1,nt.beats||1);
    if(j===0)k*=1.7; else if(j===notes.length-1)k*=1.2;
    w+=k;
    const pc=mod(nt.midi), i=c.pcs.indexOf(pc);
    if(i===0)s+=k*1.30;            // 근음
    else if(i===1)s+=k*1.15;       // 3음 — 장단을 가르는 음이라 근음 다음으로 세다
    else if(i===2)s+=k*1.00;       // 5음
    else if(i>2)s+=k*0.80;         // 7음
    /* 코드음이 아니어도 **그 조의 음계 안**이면 지나가는 음일 수 있으니 덜 깎고,
       음계 밖의 음이면 그 코드가 아니라는 강한 증거다. */
    else s+=k*(scale.indexOf(mod(pc-keyPc))>=0?-0.50:-1.05);
  });
  return w>0?s/w:0;
}
/* 흔한 화성 진행에 가산점, 어색한 진행에 감점 (앞도수>뒤도수). 전부 음악 이론의 관습이다. */
const PROG_GOOD={'4>0':.55,'3>0':.40,'1>4':.50,'3>4':.45,'5>1':.40,'5>3':.35,
                 '0>3':.35,'0>4':.35,'0>5':.30,'5>4':.30,'3>1':.25,'2>3':.30,'6>2':.35,'4>5':.20};
const PROG_BAD ={'4>3':-.45,'1>0':-.30,'2>0':-.30,'5>2':-.25,'6>0':-.20};

/* 읽어 낸 코드를 그 조의 몇 도인지로 바꾼다(이음 점수를 매기려면 도수가 필요하다).
   조성에 없는 코드(차용화음 등)는 가장 가까운 도수로 본다 — 이음 점수에만 쓰므로 충분하다. */
function chordDegree(root,keyPc,minor){
  const sc=minor?SCALE_MIN:SCALE_MAJ, d=mod(root-keyPc);
  let bi=0,bd=99;
  for(let i=0;i<sc.length;i++){ const g=Math.min(mod(sc[i]-d),mod(d-sc[i])); if(g<bd){bd=g;bi=i;} }
  return bi;
}
/* 마디별 음 목록 → 마디별 코드.
     bars[i] = [{midi,beats}, …]  그 마디에 울리는 멜로디(없으면 빈 배열)
     opt.fixed[i] = 이미 읽어 낸 코드 객체(있으면 **그대로 둔다**) 또는 null
   ★ 읽어 낸 코드는 짐작이 절대 이기지 못한다. 읽은 것이 진실이고, 짐작은 빈칸을 메울 뿐이다.
     그리고 읽은 코드는 **닻** 노릇을 한다 — 그 사이를 잇는 짐작이 음악적으로 맞아떨어진다. */
function guessChords(bars,keyPc,minor,opt){
  opt=opt||{};
  keyPc=mod(keyPc||0);
  const n=(bars||[]).length; if(!n)return [];
  const base=chordCandidates(keyPc,minor);
  const fixed=opt.fixed||[];
  const TW=opt.progW===undefined?0.9:opt.progW;
  /* 마디마다 쓸 수 있는 후보 목록. 읽어 낸 마디는 후보가 그 코드 하나뿐이다. */
  const states=[];
  for(let t=0;t<n;t++){
    const f=fixed[t];
    if(f&&f.root!==undefined)
      states.push([{deg:chordDegree(f.root,keyPc,minor),root:f.root,sfx:f.suffix||'',
                    bass:(f.bass===undefined?null:f.bass),pcs:[],fix:true}]);
    else states.push(base);
  }
  /* 마디 점수 */
  const em=states.map((st,t)=>st.map(c=>c.fix?0:chordFit(bars[t],c,keyPc,minor)));
  /* 처음과 끝은 으뜸화음이기 쉽다 — 특히 마지막 마디는 거의 예외가 없다(종지) */
  states[0].forEach((c,j)=>{ if(!c.fix&&c.deg===0)em[0][j]+=0.45; });
  if(n>1)states[n-1].forEach((c,j)=>{ if(c.fix)return;
    if(c.deg===0)em[n-1][j]+=1.20; else if(c.deg===4)em[n-1][j]-=0.35; });
  if(n>2)states[n-2].forEach((c,j)=>{ if(!c.fix&&c.deg===4)em[n-2][j]+=0.40; });
  /* 비터비 — 마디마다 따로 고르지 않고 곡 전체를 한 번에 고른다 */
  const dp=[em[0].slice()], bk=[];
  for(let t=1;t<n;t++){
    const m=states[t].length, cur=new Array(m).fill(-Infinity), b=new Array(m).fill(0);
    for(let j=0;j<m;j++){
      let best=-Infinity, bi=0;
      for(let i=0;i<states[t-1].length;i++){
        const A=states[t-1][i], B=states[t][j], key=A.deg+'>'+B.deg;
        let tr=(PROG_GOOD[key]||0)+(PROG_BAD[key]||0);
        if(A.deg===B.deg)tr+=(A.sfx===B.sfx?0.12:-0.05);
        const v=dp[t-1][i]+TW*tr;
        if(v>best){best=v;bi=i;}
      }
      cur[j]=best+em[t][j]; b[j]=bi;
    }
    dp.push(cur); bk.push(b);
  }
  let bi=0; for(let j=1;j<dp[n-1].length;j++)if(dp[n-1][j]>dp[n-1][bi])bi=j;
  const path=new Array(n); path[n-1]=bi;
  for(let t=n-1;t>0;t--)path[t-1]=bk[t-1][path[t]];
  return path.map((j,t)=>{ const c=states[t][j];
    return {root:c.root,suffix:c.sfx,bass:c.bass===undefined?null:c.bass,guess:!c.fix,deg:c.deg}; });
}
/* 코드를 하나도 못 읽었을 때 멜로디만으로 조를 어림한다(Krumhansl 음고 프로파일).
   음 길이를 가중치로 음고류 히스토그램을 만들고 24개 조의 프로파일과 견준다. */
const KS_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KS_MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function guessKeyFromMelody(notes){
  const h=new Array(12).fill(0);
  for(const n of (notes||[])){ if(n.midi===undefined)continue; h[mod(n.midi)]+=Math.max(0.1,n.beats||1); }
  const tot=h.reduce((a,b)=>a+b,0); if(!tot)return {pc:0,minor:false};
  const last=(notes||[]).filter(n=>n.midi!==undefined).pop();
  const corr=(prof,rot)=>{
    let s=0; for(let i=0;i<12;i++)s+=(h[mod(i+rot)]/tot)*prof[i];
    return s;
  };
  let best={pc:0,minor:false,s:-1};
  for(let r=0;r<12;r++){
    for(const mi of [false,true]){
      let s=corr(mi?KS_MIN:KS_MAJ,r);
      if(last&&mod(last.midi)===r)s+=0.35;     // 곡은 으뜸음으로 끝나는 일이 압도적으로 많다
      if(s>best.s)best={pc:r,minor:mi,s};
    }
  }
  return {pc:best.pc,minor:best.minor};
}

/* 잰 음높이를 믿어도 되는가 — 노래 선율로서 말이 되는지만 본다(v53).
   왜 필요한가: 실제 사진에서는 가사 글자·코드 글자·조표의 #이 음표 후보로 섞여 들어올 수
   있다. 그런 값이 섞인 목록을 **프롬프트에 "우리가 센 음이름"이라고 넣으면 AI 를 오히려
   헷갈리게 만든다** — 안 재느니만 못한 상태다. 그래서 통째로 손을 떼는 문을 하나 둔다.
   판정은 음악적 상식 하나뿐이다: 노래 선율은 이웃한 음끼리 크게 뛰지 않는다.
   ★ 마디선(`geo.bars`)은 이 판정과 **상관없이 그대로 쓴다.** 마디선은 음표 검출과 무관하게
     '오선을 위아래로 꿰뚫는 세로줄'만 보고 찾은 것이라 훨씬 믿을 만하고, 사진 위
     '지금 몇째 마디' 표시가 여기에 달려 있다. 음높이가 못 미더워도 마디는 맞다. */
function geomSane(notes){
  if(!notes||notes.length<3)return false;
  const st=notes.map(n=>n.step);
  const gaps=[]; for(let i=1;i<st.length;i++)gaps.push(Math.abs(st[i]-st[i-1]));
  const big=gaps.filter(g=>g>7).length;                 // 옥타브 넘는 도약
  if(big>gaps.length*0.2)return false;
  const srt=gaps.slice().sort((a,b)=>a-b);
  if(srt[srt.length>>1]>3)return false;                 // 이웃 음 간격의 중앙값이 4도 넘음
  const lo=Math.min.apply(null,st), hi=Math.max.apply(null,st);
  return (hi-lo)<=21;                                   // 한 단의 음역이 3옥타브를 넘을 수 없다
}
/* 읽어 낸 임시표를 **마디 끝까지 이어 준다**(조판 규칙, v60).
   악보에서 임시표는 한 번만 찍고 그 마디가 끝날 때까지 같은 줄·칸의 음에 계속 적용된다.
   이걸 안 하면 "레♯ 라 라 레" 에서 뒤의 레만 제자리음으로 울려 그 마디가 무너진다.
   ★ 같은 **줄·칸(step)** 에만 적용된다 — 한 옥타브 위의 같은 음이름에는 옮겨 가지 않는다.
   돌려주는 값은 우리가 **직접 본** 것뿐이다('' 은 "임시표를 못 봤다"이지 "제자리음"이 아니다).
   조표는 여기서 입히지 않는다 — 부르는 쪽에서 합친다. */
function geomAccs(geo){
  if(!geo||!geo.notes)return [];
  const bars=(geo.bars||[]).slice().sort((a,b)=>a-b);
  const out=[]; let state={}, bi=0;
  geo.notes.forEach(n=>{
    while(bi<bars.length&&bars[bi]<=n.x){ state={}; bi++; }
    if(n.acc){ state[n.step]=n.acc; out.push(n.acc); }
    else out.push(state[n.step]||'');
  });
  return out;
}
/* 음이름에 붙일 **최종** 임시표: 직접 읽은 것이 있으면 그것(♮ 은 빈 문자열), 없으면 조표 */
function accOf(letter,acc,sig){
  if(acc==='n')return '';
  if(acc==='#'||acc==='b')return acc;
  return (sig&&sig[letter])||'';
}
/* 잰 음표 하나를 실제 음높이(midi)로. 조표(sig)를 입혀야 Bb조 찬송가가 B 로 울리지 않는다. */
function geomMidi(name,sig,acc){
  const m=/^([A-G])(-?\d+)$/.exec(name||''); if(!m)return null;
  const s=accOf(m[1],acc,sig);
  return (parseInt(m[2],10)+1)*12+LET_SEMI[m[1]]+(s==='#'?1:s==='b'?-1:0);
}
/* 잰 음표로 ♪ 줄을 만든다.
   ★ 마디선은 **사진에서 잰 마디선(seg)** 을 그대로 쓴다(v54). 예전에는 음표 길이를 더해
     박자표에 닿을 때마다 끊었는데, 길이를 하나만 잘못 재도 그 뒤 마디가 전부 밀렸다.
     마디선은 오선을 꿰뚫는 세로줄이라 음표 길이보다 훨씬 정확하게 잡힌다. */
/* 마디 안 음표 길이를 **박자표에 맞춰 바로잡는다** (v57).
   조판에는 흔들리지 않는 규칙이 하나 있다: **한 마디는 정확히 박자표만큼이다.**
   우리가 픽셀로 잰 길이는 스캔 상태에 따라 흔들리지만(실측: 4분음표만 있는 마디가
   0.125박으로 읽히기도 한다), 마디선 위치는 훨씬 튼튼하게 읽힌다. 그래서 **마디선을
   믿고 길이를 거기에 맞춘다** — 비율은 잰 대로 두고 합계만 박자표에 맞춘 뒤, 흔한
   음표 길이로 스냅한다.
   ★ 이게 사진과 소리의 싱크를 **원리적으로** 보장한다. 마디마다 합이 딱 맞으므로
     오차가 다음 마디로 넘어가지 못한다.
   ★ 안 건드리는 경우: 이미 맞는 마디(그대로), 늘이거나 줄이는 배율이 터무니없는 마디
     (못갖춘마디·마지막 마디일 수 있다 — 건드리면 더 나빠진다). */
const BEAT_GRID=[0.125,0.25,0.375,0.5,0.75,1,1.5,2,3,4,6,8];
/* 한 마디의 길이 어림값을 **악보에 쓸 수 있는 길이로** 고르되, 합이 정확히 한 마디가
   되게 한다(v59). 둘을 따로 놓고 보면 쉬워 보이지만 함께 만족하기는 어렵다 — 예전에는
   낱낱이 가장 가까운 길이로 스냅하고 남는 박을 가장 긴 음표에 떠넘겼고, 그게 안 되면
   스냅을 포기했다. 그래서 0.875 · 0.375 · 2.5 같은 **악보에 없는 길이**가 그대로 나갔다
   (실측: 점8분+16분 리듬이 있는 단 세 개가 전부 이렇게 나왔다).

   지금은 **동적계획법**으로 한 번에 푼다. 칸은 1/8박, 값은 BEAT_GRID 만 쓴다.
   비용은 두 가지를 더한다:
     ① 어림값과의 비율 오차 log(g/v)² — 길이는 비율로 틀리므로 차가 아니라 비율로 재야 한다
        (2박이 2.5박으로 읽힌 것보다 0.25박이 0.5박으로 읽힌 게 훨씬 큰 잘못이다).
     ② **박자리 벌점** — 조판 규칙이다: 1박 이상은 정박에서, 반박 이상은 반박자리에서
        시작한다. 이게 없으면 합이 맞는 **다른** 조합이 더 싸게 나온다(실측: 진짜 1·0.75·0.25 를
        0.75·0.75·0.5 로 골랐다). 싱코페이션을 막을 만큼 세게 주지는 않는다(0.25). */
function snapBeats(v,per,v2,w1){
  const U=8, T=Math.round(per*U), n=v.length;
  if(!(T>0)||!n||n>64)return null;
  const G=BEAT_GRID, NG=G.length, gu=G.map(g=>Math.round(g*U));
  const un=G.map(g=>g>=1?U:g>=0.5?U/2:g>=0.25?U/4:1);   // 그 길이가 시작해야 하는 자리의 간격
  const w=(v2&&v2.length===n)?Math.max(0,Math.min(1,w1)):1;
  const LAM=0.25, INF=1e30;
  let prev=new Float64Array(T+1).fill(INF); prev[0]=0;
  const pick=[];
  for(let i=0;i<n;i++){
    const cur=new Float64Array(T+1).fill(INF), ch=new Int8Array(T+1).fill(-1);
    const a=(v[i]>1e-6?v[i]:1e-6), b=(w<1&&v2[i]>1e-6)?v2[i]:a;
    for(let t=0;t<=T;t++){
      if(prev[t]>=INF)continue;
      for(let k=0;k<NG;k++){
        const t2=t+gu[k]; if(t2>T)continue;
        const da=Math.log(G[k]/a), db=Math.log(G[k]/b);
        const c=prev[t]+w*da*da+(1-w)*db*db+((t%un[k])?LAM:0);
        if(c<cur[t2]){ cur[t2]=c; ch[t2]=k; }
      }
    }
    pick.push(ch); prev=cur;
  }
  if(prev[T]>=INF)return null;
  const out=new Array(n); let t=T;
  for(let i=n-1;i>=0;i--){ const k=pick[i][t]; if(k<0)return null; out[i]=G[k]; t-=gu[k]; }
  return out;
}
/* bs = 재서 알아낸 길이, gaps = 간격으로 되짚은 길이(합이 이미 per), durSure = 잰 길이가
   스스로 앞뒤가 맞는가.

   ★ 잰 길이를 믿는 기준을 "합이 맞는가" 에서 "스스로 앞뒤가 맞는가(durSure)" 로 바꿨다(v59).
   headDur 는 기둥·꼬리·빔을 세지만 **점(·)은 보지 못한다**. 그래서 점음표 리듬을 항상
   ‘같은 8분음표 둘’로 읽고(3·0.75·0.25 → 3·0.5·0.5), 그러면 **합은 우연히 맞는다**.
   합만 보고 믿으면 그런 마디는 영영 못 고친다. 잰 길이가 흔들리는 단(durSure=false)에서는
   **간격만** 본다 — 이 악보에서 잰 길이를 조금이라도 섞으면(0.1~0.3) 점음표 마디가 다시 무너졌다
   (실측: 0 → 스무 마디 전부 정답, 0.1 → 1마디 틀림, 0.3 → 6마디 틀림). */
function fitBarBeats(bs,per,gaps,durSure,edge){
  const sum=bs.reduce((a,b)=>a+(b>0?b:0),0);
  if(!(sum>0)||!(per>0))return bs;
  const gp=(gaps&&gaps.length===bs.length)?gaps:null;
  if(Math.abs(sum-per)<=0.06&&bs.every(b=>BEAT_GRID.some(g=>Math.abs(g-b)<1e-6))
     &&(durSure||!gp))return bs;
  /* ★★ 단의 **첫 조각·마지막 조각**은 한 마디가 아닐 수 있다 (v64).
     못갖춘마디로 시작하는 악보는 **줄바꿈이 마디 한가운데에서** 일어난다.
     실측(참 반가운 성도여): 1단이 `참 | 반가운 | 성도여 | 다·이리 | 와서(3박)` 로 끝나고,
     2단이 `베(1박) | 들레헤 | …` 로 시작한다 — 3+1 로 한 마디다. 다섯 단 전부 그렇다.
     그런 조각을 억지로 4박으로 늘리면 **못갖춘마디의 한 음이 온음표가 되고**(실측: E4:1 → E4:4),
     그 뒤 반주·가사가 통째로 밀린다.
     ★ 잰 길이가 스스로 앞뒤가 맞고(durSure) 그 합이 한 마디보다 **확실히 작을 때만**
       손대지 않는다. 잰 값이 믿을 만하지 않으면(durSure=false) 예전대로 마디에 맞춘다 —
       그때는 맞추는 쪽이 더 낫다는 것을 이미 여러 번 확인했다. */
  if(edge&&durSure){
    const snap=bs.map(b=>BEAT_GRID.reduce((a,g)=>Math.abs(g-b)<Math.abs(a-b)?g:a,BEAT_GRID[0]));
    const s2=snap.reduce((a,b)=>a+b,0);
    /* ★ 다만 **잰 값이 전부 제대로 된 길이일 때만** 그렇게 본다. 0.25박짜리가
       줄줄이 나오면 그건 조각 마디가 아니라 **잰 것이 무너진 마디**다 — 그때는
       마디에 맞추는 쪽이 낫다(실측: 3단 끝마디가 0.25·0.25·0.5·0.5 로 읽혀 1.5박이 됐다.
       거기는 가사가 네 음절 다 들어 있는 **온전한 마디**였다). */
    /* ★ 문턱은 **한 마디의 3/4 이하**로 둔다. 조각 마디는 보통 1·2·3박이고,
       3.5박처럼 한 박도 안 모자라는 것은 조각이 아니라 **한 음을 짧게 읽은 온전한
       마디**다(회귀 테스트가 바로 잡았다 — 2·1·0.5 로 읽힌 2·1·1 마디). */
    if(s2<=per*0.75+1e-9&&s2>0&&snap.every(v=>v>=0.5))return snap;
  }
  const k=per/sum;
  if(k<0.2||k>6)return bs;                      // 못갖춘마디로 보이면 손대지 않는다
  const sc=bs.map(b=>(b>0?b:0)*k);
  return snapBeats(sc,per,gp,durSure?0.7:0)||sc.map(v=>+v.toFixed(4));   // 풀 수 없으면 비례만 맞춘다
}
/* ★ 잰 길이의 합이 박자표와 안 맞으면 **음표 사이 간격**으로 갈아탄다(v57).
   조판 규칙이 하나 더 있다: 긴 음표일수록 다음 음표까지 넓게 띄운다. 찬송가처럼 단순한
   조판에서는 마디 안 간격만으로 길이를 되짚을 수 있다(단, 아래 ★ 대로 비례는 아니다).
   실측 검증: 잰 길이가 **정확했던 단**(1단)에서 간격으로 되짚은 값이 네 마디 모두
   (2,1,1)(1,1,2)(2,1,1)(2,2) 로 정확히 같았다. 그리고 잰 길이가 무너진 단(2단 1마디,
   실제 2,1,1 인데 2,0.125,0.125 로 읽힘)에서는 간격이 2,1,1 을 되찾았다.
   ★ v59 부터는 둘 중 하나를 고르지 않고 **둘 다 비용에 넣어** 한 번에 고른다(fitBarBeats).
   합만 맞으면 잰 것을 믿던 예전 규칙은, 점이 안 보여 3·0.75·0.25 를 3·0.5·0.5 로 읽은
   마디처럼 **우연히 합이 맞는 틀린 답**을 영영 못 고쳤다(실측). */
/* ══ 쌓이는 분석 ①: 음표 간격 모델 (v68) ══════════════════════════════════
   사용자 요청 그대로 — *"AI 없이 앱 하나로 데이터를 많이 분석할수록 정확도를 올려보자.
   데이터 분석하는 걸 점점 쌓아라. 용량은 커져도 된다."*
   조판에는 규칙이 있다: **마디 폭 = (음표마다 차지하는 고정분) + (길이에 비례하는 분)**.
     마디폭 W = c0·(오선 한 칸)·(음표 수) + k·(마디 박수)
   여기서 c0 는 악보마다 조금씩 다른 상수다(글꼴·조판기). 예전에는 **1.05 로 박아** 뒀는데,
   그건 악보 한 장에서 잰 값이었다. 이제는 **그 쪽에서 박수가 확실한 마디들을 모아
   최소제곱으로 c0 와 k 를 푼다** — 마디가 많을수록 정확해진다. 그리고 쪽마다 푼 값을
   localStorage 에 쌓아 두었다가(konti:learn) 근거가 모자란 쪽에서는 **여태 배운 평균**을
   쓴다. 악보를 넣으면 넣을수록 다음 악보가 더 잘 읽히는 부분이 바로 여기다. */
const SPACE={c0:1.05,src:'기본값',n:0,useGap:true,r:null};
const LEARN_KEY='konti:learn';
function learnLoad(){
  try{ const o=JSON.parse(localStorage.getItem(LEARN_KEY)||'null');
       if(o&&o.ver===1&&Array.isArray(o.pages))return o; }catch(e){}
  return {ver:1,pages:[]};
}
function learnSave(o){ try{ localStorage.setItem(LEARN_KEY,JSON.stringify(o)); }catch(e){} }
/* 쪽마다 배운 것을 한 줄씩 쌓는다. 사진은 절대 담지 않는다 — 숫자뿐이다(한 줄 100바이트쯤).
   500쪽까지 들고 있는다(50KB 안팎). 용량보다 **오래된 것도 계속 쓸 수 있게** 두는 쪽이 낫다. */
function learnAdd(rec){
  if(!rec)return;
  const o=learnLoad();
  o.pages.push(Object.assign({t:Date.now()},rec));
  if(o.pages.length>500)o.pages=o.pages.slice(-500);
  learnSave(o);
  return o;
}
/* 여태 배운 c0 의 **가중 평균**(마디 수로 가중). 근거가 적은 쪽은 자연히 덜 반영된다. */
function learnC0(){
  const o=learnLoad(); let w=0,sum=0;
  o.pages.forEach(p=>{ if(p.c0>0.3&&p.c0<6&&p.mn>0){ sum+=p.c0*p.mn; w+=p.mn; } });
  return w>=6?{c0:+(sum/w).toFixed(3),n:o.pages.length,mn:w}:null;
}
/* 이 쪽에서 c0·k 를 푼다. 쓰는 마디는 **박수가 확실하고 합이 박자표와 맞는 마디**뿐이다 —
   틀린 마디로 상수를 배우면 다음 쪽까지 망친다. */
function fitSpacing(sysList,per){
  /* ★ 마디 하나를 한 줄로 쓰면 자료가 너무 적고(쪽마다 열 줄 남짓) 첫 마디에는 자리표가
     끼어 있어 폭이 딴판이다 — 실측으로 c0 가 2.6칸까지 튀었다. 그래서 **음표 사이 간격
     하나하나**를 한 줄로 쓴다. 한 쪽에서 백 줄 넘게 나오고, 길이도 여러 가지가 섞여
     방정식이 훨씬 안정된다. 쓰는 것은 **길이가 스스로 앞뒤가 맞는 단(durSure)** 뿐이다. */
  const rows=[];
  (sysList||[]).forEach(s=>{
    const g=s.geo; if(!g||!g.durSure||!g.notes||!g.w)return;
    const spn=(g.sp>0&&g.iw>0)?g.sp/g.iw:0; if(!spn)return;
    const og=origGeomOf(g), seg=(og&&og.seg)||[];
    seg.forEach(sg=>{
      if(sg.cnt<2)return;
      for(let j=sg.i0;j<sg.i0+sg.cnt-1;j++){
        const n1=g.notes[j], n2=g.notes[j+1];
        if(!n1||!n2)continue;
        const gap=(n2.x-n1.x)/g.w, bt=(n1.beats>0?n1.beats:1);
        if(!(gap>0)||gap>0.5)continue;
        rows.push({g:gap,b:bt,spn});
      }
    });
  });
  if(rows.length<8)return null;
  /* gap = c0·(오선 한 칸) + k·(그 음표의 박수) — 미지수 둘, 최소제곱 */
  let a11=0,a12=0,a22=0,b1=0,b2=0;
  rows.forEach(r=>{ const x1=r.spn, x2=r.b;
    a11+=x1*x1; a12+=x1*x2; a22+=x2*x2; b1+=x1*r.g; b2+=x2*r.g; });
  const det=a11*a22-a12*a12;
  if(!det)return null;
  const c0=(b1*a22-b2*a12)/det, k=(a11*b2-a12*b1)/det;
  /* ★ c0 를 1.05칸 언저리로 못 박으면 안 된다 — 조판마다 정말 다르다(실측: 찬송가 1.0칸,
     한국 CCM 리드시트 3.8칸). 말이 되는 범위만 막고 나머지는 **자료가 정하게** 둔다. */
  if(!(c0>0.3&&c0<6)||!(k>0))return null;
  /* ★★ 더 중요한 것: **이 악보의 간격이 길이를 말해 주기는 하는가.** 음절마다 같은 폭으로
     짜는 악보(한국 CCM 리드시트가 그렇다)에서는 8분음표와 16분음표의 간격이 똑같다.
     그런 쪽에서 간격으로 길이를 되짚으면 **제대로 잰 리듬을 오히려 뭉갠다**(점8분+16분이
     같은 길이 둘로 펴진다). 그래서 간격과 박수의 **상관계수**를 재어, 낮으면 간격을
     아예 쓰지 않는다 — "쓸 수 있는 근거인지"를 자료로 정하는 것이다.
     실측: 「하나님의 부르심」 r=0.1(간격이 길이를 전혀 안 알려 준다), 「무덤에 머물러」 r=0.6. */
  let mg=0,mb=0; rows.forEach(r=>{mg+=r.g;mb+=r.b;}); mg/=rows.length; mb/=rows.length;
  let sgb=0,sgg=0,sbb=0;
  rows.forEach(r=>{ const dg=r.g-mg, db=r.b-mb; sgb+=dg*db; sgg+=dg*dg; sbb+=db*db; });
  const r=(sgg>0&&sbb>0)?sgb/Math.sqrt(sgg*sbb):0;
  return {c0:+c0.toFixed(3),k:+k.toFixed(5),mn:rows.length,r:+r.toFixed(2),useGap:r>=0.35};
}
/* 이 쪽에 쓸 c0 를 정한다: 이 쪽에서 푼 값 > 여태 배운 평균 > 기본값(1.05). */
function useSpacing(sysList,per){
  const fit=window.__NOFIT?null:fitSpacing(sysList,per);
  if(fit){
    SPACE.c0=fit.c0; SPACE.src='이 악보에서 잼'; SPACE.n=fit.mn; SPACE.useGap=fit.useGap; SPACE.r=fit.r;
    learnAdd({c0:fit.c0,k:fit.k,mn:fit.mn,r:fit.r});
    return fit;
  }
  const L=learnC0();
  SPACE.useGap=true; SPACE.r=null;
  if(L){ SPACE.c0=L.c0; SPACE.src='여태 배운 평균'; SPACE.n=L.mn; return null; }
  SPACE.c0=1.05; SPACE.src='기본값'; SPACE.n=0; return null;
}
function fitBeatsToBars(geo,seg,per){
  if(!geo||!geo.notes||!seg||seg.length<2)return false;
  let changed=false;
  for(const sg of seg){
    if(!sg.cnt)continue;
    const bs=[], xs=[];
    for(let j=sg.i0;j<sg.i0+sg.cnt;j++){
      bs.push(geo.notes[j]?(geo.notes[j].beats>0?geo.notes[j].beats:1):1);
      xs.push(geo.notes[j]?geo.notes[j].x/(geo.w||1):0);
    }
    let gp=null;
    {
      /* ★ 간격은 길이에 **그대로 비례하지 않는다**(v59). 어느 음표든 머리 폭과
         최소 여백은 같이 차지하므로, 실제 간격 = (고정분) + (길이에 비례하는 분) 이다.
         그 고정분을 빼지 않고 비례로만 나누면 **짧은 음이 실제보다 길게** 나온다 —
         실측으로 16분음표(0.25박)가 0.4박으로 읽혔고, 그 때문에 점8분+16분 리듬이 전부
         무너졌다. 고정분은 오선 간격과 같은 단위로 재는 게 맞다(머리 폭 ≈ 오선 한 칸).
         1.05칸은 이 악보 스무 마디를 전부 맞추는 값이고, 0.9~1.2 칸 사이에서 결과가 같다. */
      const sp=(geo.sp>0&&geo.iw>0)?geo.sp/geo.iw:0, c0=sp*(SPACE.c0>0?SPACE.c0:1.05), fl=sp>0?sp*0.15:1e-4;  // sp 는 재는 그림(iw) 기준, x 는 원본 폭(w) 기준 — 비율로 맞춤
      /* ★ 간격이 길이를 거의 안 알려 주는 악보(r 낮음)에서는 **간격을 아예 끄는** 것도
         해 봤는데, 되레 나빠졌다 — 간격이 없으면 snapBeats 가 격자에 못 맞춰 0.375박 같은
         **악보에 없는 길이**가 나온다(실측: 「하나님의 부르심」 한 마디에서 두 개). 그래서
         r 은 진단용으로만 두고 간격은 늘 쓴다. 대신 c0 는 이 악보에서 배운 값이다. */
      const gaps=xs.map((x,i)=>Math.max(fl,(i+1<xs.length?xs[i+1]:sg.x1)-x-c0));
      const t=gaps.reduce((a,b)=>a+b,0);
      if(t>0)gp=gaps.map(v=>v/t*per);
    }
    const fx=fitBarBeats(bs,per,gp,!!geo.durSure,sg===seg[0]||sg===seg[seg.length-1]);
    for(let j=sg.i0,k=0;j<sg.i0+sg.cnt;j++,k++)
      if(geo.notes[j]&&geo.notes[j].beats!==fx[k]){ geo.notes[j].beats=fx[k]; changed=true; }
  }
  if(changed)geo.total=+geo.notes.reduce((a,n)=>a+(n.beats||0),0).toFixed(4);
  return changed;
}
/* ── 악보 규칙 채점기 (v67) ──────────────────────────────────────────────
   사용자 요청: *"데이터들이 쌓여서 정확도·위치·박자·악보 규칙대로 점점 발전하게,
   여러 가지 대안으로 만들 수 있도록 개선해라."*
   픽셀 측정은 사진 한 장 안에서 늘 조금씩 흔들린다. 그래서 **한 번 재고 끝내지 않고**
   같은 단을 여러 방법으로 재어 **악보 규칙에 가장 잘 맞는 것**을 고른다. 규칙은 셋이다.
     ① 마디의 박수 합은 박자표와 같아야 한다 (가장 강한 규칙)
     ② 잰 길이가 스스로 앞뒤가 맞아야 한다 (durSure)
     ③ 마디에는 음표가 있어야 한다 (빈 마디는 못 읽은 마디다)
   점수는 0~120 쯤이며 100 을 넘으면 "규칙에 다 맞는다"는 뜻이다. */
/* 읽어 낸 **코드들**로 조를 되짚는다 (v68).
   왜 필요한가 — 조표를 픽셀로 세는 일(v57)은 단마다 흔들린다. 실측(「하나님의 부르심」,
   실제 조표는 #3개): 여섯 단에서 나온 값이 [없음, 없음, #1, #4, #2, #4] 였고, 다수결이
   **#4(E장조)** 를 골랐다. 그러면 악보의 모든 레(D)가 레♯으로 적힌다 — 사용자가 신고한
   "음 위치가 안 맞는다"가 바로 이것이다.
   코드는 완전히 **다른 출처**다(글자 인식). A · E · Bm · F#m · D 가 읽혔다면 조는 A장조다.
   서로 다른 두 출처가 어긋나면, **여러 개가 모여 한 목소리를 내는 쪽**을 믿는다.
   ★ 이것도 짐작이므로 **뚜렷할 때만** 쓴다(코드 4개 이상, 2등과 점수 차 1.2 이상 —
     코드 하나어치보다 더 벌어져야 한다는 뜻이다). */
function keyFromChords(chords){
  const list=(chords||[]).filter(c=>c&&c.root!==undefined);
  if(list.length<3)return null;
  const DEG=[0,2,4,5,7,9,11];
  const MINOR_DEG={2:1,4:1,9:1};          // ii · iii · vi 는 단3화음
  const score=[];
  for(let k=0;k<12;k++){
    let sc=0;
    for(const c of list){
      const d=mod(c.root-k), i=DEG.indexOf(d);
      if(i<0){ sc-=0.7; continue; }        // 조에 없는 근음
      const isMin=/^m(?!aj)/.test(c.suffix||'');
      const wantMin=!!MINOR_DEG[d];
      sc+=(isMin===wantMin)?1:0.45;
      if(d===0||d===7)sc+=0.25;            // 으뜸·딸림은 그 조를 훨씬 강하게 가리킨다
    }
    score.push(sc);
  }
  let b=0; for(let k=1;k<12;k++)if(score[k]>score[b])b=k;
  const rest=score.slice(); rest.splice(b,1);
  const second=Math.max.apply(null,rest);
  /* 장조냐 나란한단조냐는 조표가 같으므로 여기서 갈라도 조표는 안 바뀐다 —
     첫 코드와 마지막 코드가 vi 이면 단조로 본다. */
  const first=list[0], last=list[list.length-1];
  const isVi=c=>c&&mod(c.root-b)===9&&/^m(?!aj)/.test(c.suffix||'');
  const minor=isVi(first)&&isVi(last);
  return {pc:minor?mod(b+9):b,minor,n:list.length,margin:+(score[b]-second).toFixed(2)};
}
function geoRuleScore(geo,per){
  if(!geo||!geo.notes||geo.notes.length<3)return -1;
  const P4=per||4;
  const og=origGeomOf(geo), segs=(og&&og.seg)||[];
  const bt=geo.notes.map(n=>(n.beats>0?n.beats:1));
  let ok=0,cnt=0,err=0,empty=0;
  segs.forEach(sg=>{
    if(!sg.cnt){ empty++; return; }
    cnt++;
    let t=0; for(let j=sg.i0;j<sg.i0+sg.cnt;j++)t+=bt[j];
    const d=Math.abs(t-P4*Math.max(1,Math.round(t/P4)));
    if(d<=0.13)ok++;
    err+=Math.min(P4,d);
  });
  /* ★ 노래가 될 수 없는 읽기(geomSane)는 규칙 점수가 아무리 높아도 고르면 안 된다.
     실측으로 잡았다 — 키운 사본이 마디 박수는 딱 맞는데 음이 널뛰어, 그 단의 멜로디가
     통째로 버려졌다(geomSane 이 뒤에서 걸러 내므로 **아무 줄도 안 나온다**). */
  const sane=geomSane(geo.notes)?0:-1000;
  return sane+(cnt?ok/cnt*100:0)-err*3-empty*6+(geo.durSure?8:0)+Math.min(12,geo.notes.length*0.4);
}
/* 놓친 마디선을 **쪽 전체의 조판**으로 되찾는다 (v67).
   마디선 하나를 못 보면 두 마디가 한 마디로 붙고, 그 뒤 코드·가사가 통째로 밀린다
   (실측: 「곤한 내 영혼」 2단이 세 마디인데 한 마디 8.4박으로 읽혔다).
   되찾는 근거는 두 가지가 **함께** 맞을 때만 쓴다 —
     ① 폭: 조판에서 마디 폭은 든 음표 수에 비례하므로, 쪽 전체 마디 폭의 중앙값의
        k배(±0.35)면 그 안에 k 마디가 들어 있다는 뜻이다. **쪽이 쌓일수록 정확해진다.**
     ② 박수: 그 마디의 박수 합도 한 마디의 k배쯤이어야 한다.
   두 근거가 어긋나면 아무것도 하지 않는다 — 없는 마디선을 넣는 쪽이 훨씬 해롭다.
   v66 의 '가짜 마디선 지우기' 와 정확히 짝을 이루는 규칙이다(그쪽은 너무 좁은 마디를 지운다). */
function refineSysBars(sysList,per){
  const P4=per||4;
  const segOf=g=>{ const o=origGeomOf(g); return (o&&o.seg)||[]; };
  const wid=[];
  sysList.forEach(s=>{ if(s.geo)segOf(s.geo).forEach(sg=>{ if(sg.cnt)wid.push(sg.x1-sg.x0); }); });
  if(wid.length<3)return 0;
  const med=wid.slice().sort((a,b)=>a-b)[wid.length>>1];
  if(!(med>0.03))return 0;
  let added=0;
  sysList.forEach(s=>{
    const g=s.geo; if(!g||!g.notes)return;
    const add=[];
    segOf(g).forEach(sg=>{
      const wr=(sg.x1-sg.x0)/med, kw=Math.round(wr);
      let t=0; for(let j=sg.i0;j<sg.i0+sg.cnt;j++)t+=(g.notes[j].beats>0?g.notes[j].beats:1);
      const kb=Math.round(t/P4);
      if(kw<2||kb<2||Math.abs(wr-kw)>0.35)return;
      if(sg.cnt<kw*2)return;                       // 한 마디에 음표가 둘은 있어야 나눌 뜻이 있다
      for(let i=1;i<kw;i++){
        const target=t*i/kw;
        let acc=0,bj=-1,bd=1e9;
        for(let j=sg.i0;j<sg.i0+sg.cnt-1;j++){
          acc+=(g.notes[j].beats>0?g.notes[j].beats:1);
          const d=Math.abs(acc-target); if(d<bd){ bd=d; bj=j; }
        }
        if(bj>=0)add.push((g.notes[bj].x+g.notes[bj+1].x)/2);
      }
    });
    if(add.length){ g.bars=(g.bars||[]).concat(add).sort((a,b)=>a-b); added+=add.length; }
  });
  return added;
}
function geomMelodyLine(geo,perBar,sig,seg){
  if(!geo||!geo.notes||geo.notes.length<3)return '';
  const per=perBar||4;
  const accs=geomAccs(geo);
  const nts=geo.notes.map((n,i)=>{
    const m=/^([A-G])(-?\d+)$/.exec(n.name||'');
    return {tok:m?(m[1]+accOf(m[1],accs[i],sig)+m[2]):String(n.name||''),
            beats:(n.beats>0?n.beats:1)};
  });
  const out=[];
  if(seg&&seg.length>1){
    seg.forEach((sg,si)=>{
      if(!sg.cnt)out.push('r:'+per);                 // 음표를 못 찾은 마디는 쉼표 한 마디로
      for(let j=sg.i0;j<sg.i0+sg.cnt;j++){ const n=nts[j]; if(n)out.push(n.tok+':'+n.beats); }
      if(si<seg.length-1)out.push('|');
    });
  }else{
    const total=+nts.reduce((a,n)=>a+n.beats,0).toFixed(4);
    const k=Math.round(total/per);
    const bars=!!geo.durSure&&k>=1&&Math.abs(total-k*per)<=0.13;
    let acc=0;
    for(const n of nts){
      out.push(n.tok+':'+n.beats);
      if(bars){
        acc=+(acc+n.beats).toFixed(4);
        if(acc>=per-1e-6){ out.push('|'); acc=Math.max(0,+(acc-per).toFixed(4)); }
      }
    }
  }
  while(out.length&&out[out.length-1]==='|')out.pop();
  return out.length?'♪ '+out.join(' '):'';
}
/* 그림을 키워서 다시 그린 사본을 만든다(v65, "1번 읽고 2번째 읽어서 비교" 용).
   흐릿하게 뭉친 두 음이 커지면 갈릴 때가 있다 — 되레 조건 없이 늘 두 번 재면 무료
   한도와 무관하게(픽셀 계산이라 API 호출이 없다) 느려지기만 하므로, 첫 번째 결과가
   못 미더울 때만(아래 addGeomMelody 참고) 쓴다. */
function upscaleUrl(url,factor){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=Math.round(img.width*factor), h=Math.round(img.height*factor);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/png'));
      }catch(e){res(null)}
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}
/* OCR 초안(코드·가사)에 픽셀로 잰 멜로디를 얹고, **코드가 빈 마디를 멜로디로 채운다**(v54).
   Tesseract 를 다시 돌리지 않고 ocrDraft 가 이미 잘라 둔 단 그림만 다시 재므로 싸다. */
async function addGeomMelody(draft,say){
  if(!draft||!draft.sys||!draft.sys.length)return draft;
  const N=draft.sys.length;
  let bigLeft=2;            // 1.7배 다시 재기는 한 쪽에 두 단까지만 (v67, 시간 예산)
  for(let i=0;i<N;i++){
    const s=draft.sys[i];
    if(!s.url||s.whole||s.geo)continue;   // 단 분리에 실패한 쪽은 첫 단만 재게 되어 뜻이 없다
    say&&say((N>1?(i+1)+'/'+N+'단 ':'')+'음표 자리와 길이를 재는 중…');
    try{
      let geo=await staffGeom(s.url);
      /* ★ 한 번 재서 못 미더우면(길이 확신 없음 · 마디당 음표가 지나치게 적음) 그림을
         1.35배 키워 **한 번 더** 잰다(v65, "1번 읽고 2번째 읽어서 비교"). 흐릿하게 뭉친
         두 음이 커지면서 갈릴 때가 있다 — 둘을 겨루게 해서 **더 많이·더 확실히** 잰
         쪽을 쓴다. API 호출이 없는 픽셀 계산이라 무료 한도와는 무관하고, 이미 못 미더운
         단에서만 도니 비용도 적다. */
      /* ★ v67: 한 번 재고 끝내지 않고 **여러 대안을 겨루게 한다**. 그림을 키워 다시 재면
         흐릿하게 뭉친 두 음이 갈리기도 하고, 되레 번져 나빠지기도 한다 — 그래서 어느 쪽이
         나은지를 눈이 아니라 **악보 규칙 점수**(geoRuleScore)로 정한다. 규칙에 이미 다
         맞으면(95점) 더 재지 않는다. 픽셀 계산이라 API 호출이 없다(무료 한도와 무관). */
      let best=geo, bestSc=geoRuleScore(geo,P.beats);
      /* 아래 보표로 보이는 단(바로 앞이 위 보표)에는 다시 재는 값을 쓰지 않는다 —
         어차피 멜로디로 안 쓸 가능성이 크다. 찬송가 한 쪽에서 시간이 절반으로 준다. */
      const prevG=i>0?draft.sys[i-1].geo:null;
      const looksAcc=geo&&geo.clef==='bass'&&prevG&&(prevG.clef||'treble')!=='bass';
      const ALT_MIN=looksAcc?-1e9:(window.__ALTMIN!==undefined?window.__ALTMIN:95);
      if(bestSc<ALT_MIN){
        /* 1.7배까지 가는 건 **아주 못 읽은 단**뿐이다 — 크게 그린 사본을 다시 재는 값이
           단마다 2초쯤이라, 조금 아쉬운 단마다 태우면 한 쪽에 20초가 더 붙는다(실측). */
        const facs=window.__ALTF||((bestSc<55&&bigLeft>0)?(bigLeft--,[1.35,1.7]):[1.35]);
        for(const f of facs){
          const up=await upscaleUrl(s.url,f);
          const g2=up?await staffGeom(up):null;
          const sc2=geoRuleScore(g2,P.beats);
          /* ★ **확실히 나을 때만** 갈아탄다. 점수가 엇비슷하면 처음 잰 것을 둔다 —
             키운 사본은 음표를 몇 개 흘리면서 마디 박수만 맞추는 일이 있는데, 그 둘이
             비기면 음표가 성한 쪽이 낫다(실측: 한 쪽에서 음표 5개가 사라졌다). */
          /* ★ **확실히 나을 때만** 갈아탄다(+6점). 점수가 엇비슷하면 처음 잰 것을 둔다.
             v65 는 "더 많이 잰 쪽"을 골랐는데, 그러면 키운 사본이 빔 조각을 음표로 주워
             담아도 이긴다 — 5장으로 재 보니 규칙 점수만 보는 쪽이 마디 네 개를 더 맞혔다
             (음표 수를 함께 보게 했더니 되레 하나를 잃었다. 실측으로 고른 규칙이다). */
          if(sc2>bestSc+6){ best=g2; bestSc=sc2; }
          if(bestSc>=ALT_MIN)break;
        }
      }
      if(best&&best.notes.length>=3){ s.geo=best; s.clef=best.clef||'treble'; }
