    catch(e){ /* 한 단을 못 재도 나머지는 그대로 간다 */ }
  }
  /* ★ 그랜드 스태프(피아노 보표)의 **아래 보표는 멜로디가 아니다**(v67).
     찬송가 악보는 위 보표(멜로디)와 아래 보표(반주)가 한 벌로 묶여 있는데, 단 나누기는
     그 둘을 각각 한 단으로 잘라 준다. 여태 아래 보표까지 멜로디로 읽어 **반주 음이 노래에
     줄줄이 붙었다**(실측: 「주의 음성을 내가 들으니」 8단 중 4단이 아래 보표였다).
     ★ 건너뛰는 조건을 "낮은음자리표면 무조건"이 아니라 **"바로 위 단이 높은음자리표인
       낮은음자리표 단"**으로 둔다 — 그게 그랜드 스태프의 생김새 그대로이고, 자리표를
       잘못 읽었을 때 멜로디를 통째로 잃는 사고를 막아 준다(낮은음자리표만 있는 악보는
       손대지 않는다). */
  {
    /* ★ 판정은 **단 하나만 보고 하지 않는다** — 쪽 전체가 위·아래 번갈아 서 있는지를 본다.
       그랜드 스태프는 반드시 (위 보표, 아래 보표) 짝이 번갈아 나온다. 번갈이가 깨지면
       자리표를 잘못 읽었거나 단 나누기가 어긋난 것이므로 **아무것도 건드리지 않는다**
       (실측: 스캔이 흐린 악보에서 단 나누기가 두 보표를 한 단으로 묶어 버려, 그대로
       건너뛰었다면 멜로디를 통째로 잃을 뻔했다). 고치려다 잃는 쪽이 늘 더 나쁘다. */
    const cf=draft.sys.map(s=>s.geo?(s.geo.clef||'treble'):null);
    const nb=cf.filter(c=>c==='bass').length;
    const alt=cf.length>=4&&cf.length%2===0&&nb>=2
              &&cf.every((c,i)=>c===null||c===(i%2?'bass':'treble'));
    let dropped=0;
    if(alt)draft.sys.forEach((s,i)=>{
      if(cf[i]==='bass'){ s.bassGeo=s.geo; s.geo=null; dropped++; }
    });
    if(dropped)draft.gsDrop=dropped;
  }
  /* 놓친 마디선을 쪽 전체의 조판으로 되찾는다(v67) */
  draft.barsAdd=refineSysBars(draft.sys,P.beats);
  /* 이 쪽의 음표 간격 상수를 푼다(v68) — 못 풀면 여태 배운 평균을 쓴다 */
  draft.space=useSpacing(draft.sys,P.beats)||{c0:SPACE.c0,src:SPACE.src,mn:SPACE.n};
  /* 조. 읽어 낸 코드가 있으면 그걸 쓰고(가장 믿을 만하다), 하나도 없으면 멜로디로 어림한다.
     ★ 코드를 하나도 못 읽었으면 조표를 알 길이 없어 멜로디가 전부 제자리음(C조)으로 적힌다.
       그래도 **조 안에서의 관계는 맞으므로** 사용자가 이조 한 번으로 맞출 수 있다. */
  /* ★ 조는 **조표를 세어서** 정한다(v57). 예전에는 OCR 이 읽은 첫 코드 하나에만 매달렸고,
     그 한 글자를 잘못 읽으면 곡 전체 음이름이 통째로 틀어졌다(실측: Bb장조 찬송가 → A장조).
     조표는 단마다 똑같이 인쇄되어 있으므로 **여러 단에서 세어 다수결**을 하면 훨씬 튼튼하다.
     장/단조 구분은 조표만으로는 알 수 없으니(나란한조는 조표가 같다) 거기서만 멜로디·코드를
     쓴다 — 조표가 정하는 것(#/b 몇 개)과 멜로디가 정하는 것(으뜸음)을 나눠 맡긴다. */
  let ksv=null;
  {
    const votes={}; let tot=0;
    draft.sys.forEach(s=>{ const k=s.geo&&s.geo.keySig;
      if(k&&k.n>=0&&k.n<=7){ const t=(k.flat?'b':'#')+k.n; votes[t]=(votes[t]||0)+1; tot++; } });
    let bestT=null,bestN=0;
    for(const t in votes)if(votes[t]>bestN){bestN=votes[t];bestT=t;}
    /* ★ **과반이어야 믿는다**(v68). 예전에는 2표만 넘으면 이겼는데, 넷 중 둘(나머지가
       1+1)이면 그건 다수가 아니라 **흔들린다는 뜻**이다 — 실측(「하나님의 부르심」)에서
       [#1,#4,#2,#4] 의 #4 가 그렇게 뽑혀 조가 통째로 틀어졌다(모든 레가 레♯이 됐다). */
    if(bestT&&bestN>=2&&bestN*2>tot)ksv={flat:bestT[0]==='b',n:+bestT.slice(1)};
    /* 코드로 되짚은 조가 뚜렷하면 그쪽을 쓴다 — 조표 세기와 완전히 다른 출처다 */
    const allCh=[];
    draft.sys.forEach(s=>((s.words&&s.words.c)||[]).forEach(cw=>{
      const c=parseChord(fixChordToken((cw.text||'').trim())); if(c)allCh.push(c); }));
    const ck=keyFromChords(allCh);
    if(ck&&ck.n>=4&&ck.margin>=1.2){
      const [sgn,cnt]=keySig(sigPc(ck.pc,ck.minor));
      const want={flat:sgn==='b',n:cnt};
      if(!ksv||ksv.n!==want.n||ksv.flat!==want.flat){
        draft.keyFix=(ksv?((ksv.flat?'b':'#')+ksv.n):'없음')+'→'+(sgn+cnt);
        ksv=want;
      }
    }
    draft.keyWhy={votes,ck:ck||null,used:ksv?((ksv.flat?'b':'#')+ksv.n):'없음'};
  }
  let key=draft.key?{pc:draft.key.root,minor:/^m(?!aj)/.test(draft.key.suffix||'')}:null;
  let sig=keySigSet(draft.key);
  if(ksv){
    const ord=ksv.flat?FLAT_ORD:SHARP_ORD, sgn=ksv.flat?'b':'#';
    sig={}; for(let i=0;i<ksv.n;i++)sig[ord[i]]=sgn;
    /* 그 조표에 맞는 장조와 나란한단조 */
    const MAJ_SH=[0,7,2,9,4,11,6,1], MAJ_FL=[0,5,10,3,8,1,6,11];
    const majPc=(ksv.flat?MAJ_FL:MAJ_SH)[ksv.n], minPc=mod(majPc-3);
    /* 첫 코드가 둘 중 하나와 맞으면 그걸 믿는다(장/단조까지 알려 준다) */
    if(key&&(mod(key.pc)===majPc||mod(key.pc)===minPc)){
      key={pc:mod(key.pc),minor:mod(key.pc)===minPc?true:(mod(key.pc)===majPc?false:key.minor)};
    }else{
      const all=[];
      draft.sys.forEach(s=>{ if(s.geo&&geomSane(s.geo.notes)){ const ac=geomAccs(s.geo);
        s.geo.notes.forEach((n,i)=>{ const mm=geomMidi(n.name,sig,ac[i]); if(mm!==null)all.push({midi:mm,beats:n.beats||1}); }); } });
      const g=all.length>=6?guessKeyFromMelody(all):null;
      key=(g&&mod(g.pc)===minPc)?{pc:minPc,minor:true}:{pc:majPc,minor:false};
    }
  }
  if(!key){
    const all=[];
    draft.sys.forEach(s=>{ if(s.geo&&geomSane(s.geo.notes)){ const ac=geomAccs(s.geo);
      s.geo.notes.forEach((n,i)=>{ const mm=geomMidi(n.name,sig,ac[i]); if(mm!==null)all.push({midi:mm,beats:n.beats||1}); }); } });
    key=all.length>=6?guessKeyFromMelody(all):{pc:0,minor:false};
  }
  let melN=0, melSys=0, melSure=0, guessN=0, keepN=0;
  const pages=draft.sys.map(s=>{
    const ok=s.geo&&geomSane(s.geo.notes);
    /* 마디선을 먼저 잡고(og0) → 그 마디에 맞춰 길이를 바로잡고 → 다시 잰다(og).
       두 번 재는 이유: 마디 안 '몇 박째 → 가로 어디' 표(pb/px)가 고친 길이로 만들어져야
       사진 위 하이라이트가 소리와 같은 자리를 가리킨다. */
    let og=ok?origGeomOf(s.geo):null;
    if(og&&og.seg&&og.seg.length>1&&fitBeatsToBars(s.geo,og.seg,P.beats))og=origGeomOf(s.geo);
    const seg=(og&&og.seg&&og.seg.length>1)?og.seg:null;
    const mel=ok?geomMelodyLine(s.geo,P.beats,sig,seg):'';
    if(mel){ melN+=s.geo.notes.length; melSys++; if(s.geo.durSure)melSure++; }
    /* 마디선을 못 찾았으면 코드 줄을 새로 짜지 않는다 — 어느 마디인지 모르는 채로
       코드를 늘어놓으면 없느니만 못하다. 그때는 OCR 이 읽은 줄을 그대로 쓴다. */
    if(!seg)return (s.out=[mel,s.txt].filter(t=>t&&t.trim()).join('\n'));
    const w=s.geo.w||1;
    const sacc=geomAccs(s.geo);
    const bars=seg.map(sg=>{
      const a=[];
      for(let j=sg.i0;j<sg.i0+sg.cnt;j++){
        const mm=geomMidi(s.geo.notes[j].name,sig,sacc[j]);
        if(mm!==null)a.push({midi:mm,beats:s.geo.notes[j].beats||1});
      }
      return a;
    });
    /* 읽어 낸 코드를 가로 자리로 마디에 배정한다 — 글자 칸이 아니라 **사진 위 x** 로 맞춘다 */
    const cws=((s.words&&s.words.c)||[]).map(cw2=>({
      ch:parseChord(fixChordToken((cw2.text||'').trim())),
      f:(s.cw>0?cw2.bbox.x0/s.cw:-1)})).filter(o=>o.ch&&o.f>=0);
    const fixed=seg.map(sg=>{
      const hit=cws.filter(o=>o.f>=sg.x0-0.005&&o.f<sg.x1);
      return hit.length?hit[0].ch:null;
    });
    const got=guessChords(bars,key.pc,key.minor,{fixed});
    /* 코드 줄을 다시 짠다. 가사와 칸을 맞춰야 하므로 **원래 낱말 배치기(wordsToChart)** 에
       코드를 마디 시작 자리의 낱말로 끼워 넣는다 — 그러면 가사 칸이 저절로 맞는다. */
    /* 새로 짜는 코드 줄은 **반드시 가사 줄보다 위에** 높여야 한다.
       wordsToChart 는 낱말을 y 로 줄을 묶고, parseChart 는 코드 줄 **바로 아랫줄**을
       가사로 붙인다. 그래서 y 를 잘못 주면 코드가 가사 아래로 가 버리고, 그럼 코드에
       엉뚱한 가사가 붙는다(실측으로 잡았다 — 2절 가사 줄이 코드 위로 올라갔다). */
    const ys=[].concat(((s.words&&s.words.c)||[]).map(o=>o.bbox.y0),
                       ((s.words&&s.words.l)||[]).map(o=>o.bbox.y0),
                       ((s.words&&s.words.v)||[]).map(o=>o.bbox.y0));
    const topY=ys.length?Math.min.apply(null,ys):0;
    const cy={y0:topY-24,y1:topY-6};
    /* ★ 한 마디에 코드가 **둘 이상**인 조판이 흔하다(E E7 / F#m B7 / Esus4 E …).
       예전에는 마디마다 코드를 하나만 내보내서, 읽어 낸 코드의 절반 가까이를 버리고 있었다
       (실측: 27개를 다 읽어 놓고 16개만 썼다). 읽어 낸 코드가 있으면 **잰 가로 자리 그대로**
       전부 내보낸다. 하나도 못 읽은 마디에서만 짐작한 코드를 쓴다. */
    const cwords=[]; let keep2=0, guess2=0;
    const pref=PREF[mod(key.pc)]||'sharp';
    seg.forEach((sg,i)=>{
      const x=Math.round(sg.x0*(s.cw||w));
      if(i)cwords.push({text:'|',bbox:{x0:x-2,x1:x,y0:cy.y0,y1:cy.y1},kind:'c'});
      const hits=cws.filter(o=>o.f>=sg.x0-0.01&&o.f<sg.x1);
      if(hits.length){
        hits.forEach(h=>{
          const hx=Math.max(x+2,Math.round(h.f*(s.cw||w)));
          cwords.push({text:showChord(h.ch,0,pref),bbox:{x0:hx,x1:hx+30,y0:cy.y0,y1:cy.y1},kind:'c'});
          keep2++;
        });
      }else{
        cwords.push({text:showChord(got[i],0,pref),bbox:{x0:x+2,x1:x+30,y0:cy.y0,y1:cy.y1},kind:'c'});
        guess2++;
      }
    });
    guessN+=guess2; keepN+=keep2;
    const txt=wordsToChart(cwords.concat((s.words&&s.words.l)||[]).concat((s.words&&s.words.v)||[]));
    /* 다시 짜인 단 텍스트를 남긴다 — 사진 하이라이트용 단별 코드 개수(ch)는
       예전 OCR 텍스트가 아니라 **이걸** 세야 마디가 맞는다. */
    return (s.out=[mel,txt].filter(t=>t&&t.trim()).join('\n'));
  }).filter(t=>t.trim());
  return Object.assign({},draft,{text:pages.join('\n\n'),melN,melSys,melSure,
    sigN:Object.keys(sig).length,guessN,keepN,key2:key});
}
/* 오선이 모인 줄(단)을 찾아 한 단씩 잘라낸다.
   한 번에 보는 음표가 줄면 음높이 인식이 훨씬 정확해진다.
   반드시 가장 큰 사본(prepImage 의 hiUrl)에서 잘라야 한다 — 줄여 놓은 그림에서 오려내면
   오선 간격이 몇 픽셀로 뭉개져서, 잘라 보내는 의미가 없어진다. */
function splitSystems(url,targetW){
  return new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const W=img.width,H=img.height;
        const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
        const d=ctx.getImageData(0,0,W,H).data;
        /* ★ 잉크 문턴값을 고정으로 두면 안 된다(v54에서 고친 버그).
           예전에는 "밝기 150 미만 = 잉크, 그런 칸이 가로로 45% 넘으면 오선" 이었다.
           그런데 prepImage 의 fitCanvas 가 **밝기를 1.05배 올려** 넣어서, 얇은 회색 오선이
           150 위로 올라가 버렸다. 그 결과 **실제 사진에서는 단을 하나도 못 찾고**(null)
           쪽 전체를 통짜로 넘겼고, 그러면 음표 측정(staffGeom)이 통째로 꺼진다 —
           조용한 실패라 눈치채기 어려웠다(showUrl 은 보정을 안 거쳐서 혼자 잘 돌았다).
           지금은 그림마다 문턴값을 직접 정하고(오츠), 오선 판정도 **가장 진한 행에 대한
           비율**로 본다. 사진 밝기가 어떻든 같은 결과가 나오게 하는 게 핵심이다. */
        const hist=new Uint32Array(256);
        for(let i=0;i<d.length;i+=4)hist[(d[i]*.3+d[i+1]*.59+d[i+2]*.11)|0]++;
        const th=Math.min(215,Math.max(60,otsuTh(hist,W*H)));
        const rows=new Float32Array(H); let rmax=0;
        for(let y=0;y<H;y++){
          let c=0,o=y*W*4;
          for(let x=0;x<W;x++){const i=o+x*4;
            if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)<th)c++;}
          rows[y]=c/W; if(rows[y]>rmax)rmax=rows[y];
        }
        const lineTh=Math.max(0.28,Math.min(0.45,rmax*0.55));
        const isLine=y=>rows[y]>lineTh;            // 가로로 길게 이어진 줄 = 오선
        const bands=[]; let st=-1;
        for(let y=0;y<H;y++){
          if(isLine(y)){ if(st<0)st=y; }
          else if(st>=0){ bands.push([st,y]); st=-1; }
        }
        if(st>=0)bands.push([st,H-1]);
        // 가까운 오선들을 한 단으로 묶는다
        const sys=[]; let cur=null;
        for(const [a,b] of bands){
          if(cur&&a-cur[1]<H*0.045){ cur[1]=b; }
          else { if(cur)sys.push(cur); cur=[a,b]; }
        }
        if(cur)sys.push(cur);
        let good=sys.filter(x=>x[1]-x[0]>H*0.008);
        /* ★ 구제책 — 위 방식이 단을 못 찾을 때(v55).
           위 방식은 "행 잉크 비율이 문턴값을 넘으면 오선 줄"이라는 **밀도 기준**이다.
           해상도가 낮으면 통째로 무너진다: 오선이 두 행에 번져 어느 행도 진해지지 못한다.
           실측 — 사용자가 보내 준 실제 악보(620×719, 한 쪽에 6단, 줄 간격 **5px**)에서
           가장 진한 행조차 0.365 밖에 안 됐고 단을 **하나도 못 찾았다**(멜로디 0음).
           research/omr-pitch/RESULTS.md 에 답이 적혀 있다: "밀도가 0.13까지 떨어져도
           주변 중간값을 빼면 또렷한 봉우리가 된다. 절대 임계값을 쓴 것이 실패 원인이었다."
           그래서 밀도가 아니라 **구조**로 찾는다. */
        if(good.length<2){
          const ink=new Uint8Array(W*H);
          for(let y=0;y<H;y++){const o=y*W*4;for(let x=0;x<W;x++){const i=o+x*4;
            if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)<th)ink[y*W+x]=1;}}
          /* ① 줄 간격을 세로 런렝스로 — **얇은 검은 줄 사이에 낀 흰 구간**만 센다.
             그냥 모든 흰 구간을 세면 가사 글자 속 빈틈이 최빈값을 차지해 버린다.
             오선은 얇고(1~3px) 일정 간격으로 다섯 번 반복되는 유일한 구조다. */
          let spG=0;
          {
            const bk=new Uint32Array(60), wh=new Uint32Array(200);
            const xs=Math.max(1,Math.round(W/500));
            for(let x=0;x<W;x+=xs){
              const runs=[]; let y=0;
              while(y<H){ const v=ink[y*W+x]; let e=y;
                while(e+1<H&&ink[(e+1)*W+x]===v)e++; runs.push([v,e-y+1]); y=e+1; }
              for(let i=0;i<runs.length;i++){
                const v=runs[i][0], L=runs[i][1];
                if(v){ if(L<60)bk[L]++; }
                else if(L>1&&L<200&&i>0&&i+1<runs.length&&runs[i-1][1]<=3&&runs[i+1][1]<=3)wh[L]++;
              }
            }
            let bi=1,bv=0; for(let i=1;i<60;i++)if(bk[i]>bv){bv=bk[i];bi=i;}
            let wi=2,wv=0; for(let i=2;i<200;i++)if(wh[i]>wv){wv=wh[i];wi=i;}
            spG=bi+wi;
          }
          if(spG>=3.5&&spG<H/6){
            /* ② 배경 제거 — 조명·인쇄 농도가 어떤든 국소 봉우리만 남는다.
               ★ 배경을 빼는 창은 **훑는 간격마다 다시** 잡아야 한다. 하나로 고정해 두면 그 창에
                 잘 맞는 간격만 유리해져, 실측에서 진짜 간격(5px)이 지고 엉뚱한 값이 이겼다. */
            const med=a=>{const b=a.slice().sort((p,q)=>p-q);return b[b.length>>1];};
            const bgRemove=sp2=>{
              const win=Math.max(5,Math.round(sp2*2)|1), out=new Float32Array(H);
              const st=Math.max(1,Math.round(win/15));
              for(let y=0;y<H;y++){
                const b=[]; for(let k=-(win>>1);k<=(win>>1);k+=st){const yy=y+k; if(yy>=0&&yy<H)b.push(rows[yy]);}
                out[y]=Math.max(0,rows[y]-med(b));
              }
              return out;
            };
            /* ③ 그 간격 근처만 훑어 다섯 줄 빗살을 맞춘다.
               ★ 고르는 기준은 점수 합계가 아니라 **찾은 단들이 고르게 늘어섰는가**(간격의
                 변동계수)다. 악보의 단은 쪽 아래로 일정한 간격으로 내려간다 — 합계로 고르면
                 엉뚱한 간격이 잡동사니를 잔뜩 집어 이긴다(실측: 간격 7px 이 11개를 집었다). */
            let best=null;
            for(let sp2=Math.max(3.5,spG*0.8);sp2<=spG*1.8;sp2+=0.25){
              const span=Math.round(sp2*4); if(span>=H)break;
              const hp=bgRemove(sp2);
              const tol=Math.max(1,Math.round(sp2*0.25)), pk=new Float32Array(H);
              for(let y=0;y<H;y++){let m=0;for(let k=-tol;k<=tol;k++){const yy=y+k;if(yy>=0&&yy<H&&hp[yy]>m)m=hp[yy];}pk[y]=m;}
              const sc=new Float32Array(H);
              let smax=0;
              for(let y=0;y+span<H;y++){
                const v=[pk[y],pk[Math.round(y+sp2)],pk[Math.round(y+sp2*2)],pk[Math.round(y+sp2*3)],pk[y+span]].sort((a,b)=>a-b);
                sc[y]=v[2]; if(sc[y]>smax)smax=sc[y];
              }
              if(smax<=0)continue;
              const order=[]; for(let y=0;y+span<H;y++)if(sc[y]>=smax*0.45)order.push(y);
              order.sort((a,b)=>sc[b]-sc[a]);
              const tops=[];
              for(const y of order){ if(tops.some(t=>Math.abs(t-y)<sp2*5))continue; tops.push(y); if(tops.length>=16)break; }
              if(tops.length<2)continue;
              tops.sort((a,b)=>a-b);
              const g=[]; for(let i=1;i<tops.length;i++)g.push(tops[i]-tops[i-1]);
              const mu=g.reduce((a,b)=>a+b,0)/g.length;
              const sd=Math.sqrt(g.reduce((a,b)=>a+(b-mu)*(b-mu),0)/g.length);
              const score=tops.length*Math.exp(-4*(mu>0?sd/mu:9));
              if(!best||score>best.score)best={score,sp:sp2,span,tops};
            }
            if(best)good=best.tops.map(t=>[t,t+best.span]);
          }
        }
        if(good.length<2||good.length>14){ res(null); return; }
        const out=[];
        for(let i=0;i<good.length;i++){
          const prevEnd=i>0?good[i-1][1]:0;
          const nextStart=i<good.length-1?good[i+1][0]:H;
          const top=Math.max(0,Math.floor((good[i][0]+prevEnd)/2)-6);
          const bot=Math.min(H,Math.ceil((good[i][1]+nextStart)/2)+6);
          const hh=bot-top; if(hh<20)continue;
          /* ★ 단 하나를 **오선 간격이 22px 이 되도록** 키우거나 줄인다(v53).
             예전에는 폭을 1800px 으로 맞췄는데, 그건 **사진 해상도에 따라 오선 간격이
             제멋대로가 된다는 뜻**이다. 3000px 짜리 사진 한 쪽은 1800px 으로 **줄어들면서**
             오선 간격이 24px → 14px 로 깎였다. 음표 머리·빔·기둥을 재는 일은 전부 오선
             간격을 기준으로 한 문턱값이라, 이 숫자가 곧 정확도다(v50 에서 1200→2000px 으로
             올린 것도 같은 이유였지만, 폭으로 맞춰서는 해상도가 바뀌면 또 어긋난다).
             오선 다섯 줄의 띠 높이가 4칸이므로 `띠높이/4` 가 지금 오선 간격이다 — 이미
             재 놓은 값이라 공짜로 얻는다. 22px 은 research/omr-pitch 가 실측으로 고른 값이다.
             ★ 사진이 나쁜데 무작정 키우면 흐린 것을 크게 만들 뿐이므로 3배까지만 키운다.
               반대로 아주 큰 사진은 줄여도 되지만 원본보다 작게는 가지 않는다(0.5배 하한). */
          const spNow=Math.max(1,(good[i][1]-good[i][0])/4);
          const want=22/spNow;
          /* ★ 확대 상한을 3배 → 6배로(v55). 사용자 악보는 620px 에 줄 간격이 5px 이라
             22px 에 닿으려면 4.4배가 필요했는데 3배에서 막혀 측정이 전부 실패했다.
             흐린 것을 크게 만든다고 없던 정보가 생기진 않지만, 뒤따르는 모든 판정이
             '줄 간격' 기준의 문턱값이라 **같은 조건에서 돌게 하는 것**이 핵심이다. */
          const sc=Math.max(0.5,Math.min(6,targetW?Math.min(3,targetW/W):want,4200/W));
          const c2=document.createElement('canvas');
          c2.width=Math.round(W*sc); c2.height=Math.round(hh*sc);
          const x2=c2.getContext('2d');
          x2.fillStyle='#fff'; x2.fillRect(0,0,c2.width,c2.height);
          /* 여기서도 대비를 올리지 않는다(v54) — 이 조각은 staffGeom 이 **재는** 그림이다.
             얇은 오선을 살려 보내는 게 먼저다. 이진화는 staffGeom 이 오츠로 알아서 한다. */
          x2.drawImage(img,0,top,W,hh,0,0,c2.width,c2.height);
          const u=c2.toDataURL('image/jpeg',.95);
          /* t0/t1: 이 단이 원본 사진에서 차지한 세로 구간(0~1). 원본을 어떤 크기로 보여 주든
             비율은 그대로라, 사진 위에 하이라이트를 얹을 때 이 값을 그대로 쓴다. */
          out.push({url:u,b64:u.split(',')[1],t0:top/H,t1:bot/H});
        }
        res(out.length>=2?out:null);
      }catch(e){ res(null); }
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}

let camStream=null;
function closeCam(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  const w=$('camwrap'); if(w)w.style.display='none';
}
async function openCam(){
  const box=$('scanstate');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}}});
    const w=$('camwrap'); w.style.display='block';
    const v=$('cam'); v.srcObject=camStream; v.setAttribute('playsinline',''); v.muted=true; await v.play();
    if(box){box.className='';box.textContent='';}
  }catch(e){
    closeCam();
    if(box){box.className='callout err';box.textContent='이 환경에서는 카메라를 쓸 수 없습니다. 파일 선택이나 붙여넣기를 써 주세요.';}
  }
}
function shoot(){
  const v=$('cam'); if(!v||!v.videoWidth){toast('아직 화면이 준비되지 않았습니다.');return;}
  const fit=cap=>{
    const sc=Math.min(1,cap/Math.max(v.videoWidth,v.videoHeight));
    const cv=document.createElement('canvas');
    cv.width=Math.round(v.videoWidth*sc); cv.height=Math.round(v.videoHeight*sc);
    const c=cv.getContext('2d');
    c.filter='grayscale(1) contrast(1.25) brightness(1.05)';
    c.drawImage(v,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.9);
  };
  const out=fit(1600), ocrOut=fit(2200);
  closeCam();
  S.photos.push({url:out,b64:out.split(',')[1],ocrUrl:ocrOut});
  openPanel('scan');
}

/* ============ OCR: API 키 없이 코드와 가사 읽기 ============
   Tesseract.js 는 "글자"를 읽는다. 오선보의 음표는 못 읽는다.
   그래서 코드 심볼과 가사까지만 가져오고 멜로디는 포기한다. */
let wChord=null, wLyric=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.onload=()=>res(); el.onerror=()=>rej(new Error('스크립트를 불러오지 못했습니다'));
    document.head.appendChild(el);
  });
}
/* 오선을 지운다. 가로로 길게 이어진 어두운 줄만 하얗게 만든다.
   음표는 일부 깎이지만 우리가 읽을 건 글자라 상관없다. */
function stripStaff(srcUrl,scale){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const W=Math.round(img.width*scale),H=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,0,0,W,H);
      const d=ctx.getImageData(0,0,W,H), px=d.data;
      const dark=new Uint8Array(W*H);
      for(let i=0,p=0;i<px.length;i+=4,p++){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        dark[p]=v<150?1:0;
      }
      const rowCount=new Int32Array(H);
      for(let y=0;y<H;y++){let c=0;const o=y*W;for(let x=0;x<W;x++)c+=dark[o+x];rowCount[y]=c;}
      for(let y=0;y<H;y++){
        if(rowCount[y]<W*0.45)continue;
        const o=y*W;
        for(let x=0;x<W;x++){
          if(!dark[o+x])continue;
          // 위아래 3px 안이 비어 있으면 오선으로 보고 지운다(음표 기둥은 살린다)
          let up=0,dn=0;
          for(let k=1;k<=3;k++){
            if(y-k>=0&&dark[(y-k)*W+x])up++;
            if(y+k<H&&dark[(y+k)*W+x])dn++;
          }
          if(up<=1&&dn<=1){const i=(o+x)*4;px[i]=px[i+1]=px[i+2]=255;}
        }
      }
      // 대비 강화
      for(let i=0;i<px.length;i+=4){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        const t=v<170?0:255;
        px[i]=px[i+1]=px[i+2]=t;
      }
      ctx.putImageData(d,0,0);
      res(cv.toDataURL('image/png'));
    };
    img.onerror=()=>rej(new Error('이미지 처리 실패'));
    img.src=srcUrl;
  });
}
function fixChordToken(t){
  let x=t.replace(/[♭]/g,'b').replace(/[♯]/g,'#').replace(/[·•,.]$/,'').trim();
  /* ★ 실측한 오인(v57) — 굵은 세리프체 코드 글자를 Tesseract 로 읽으면 이렇게 나온다:
       "F#m"→"Fim" / "Esus4"→"Esusd" / "A#"→"Ao". ♯ 은 eng 모델에 없는 글자라 어쩔 수 없다.
       고칠 수 있는 건 **자리가 정해진 것뿐**이다 — 으뜸음 바로 뒤, 그리고 sus 뒤의 숫자. */
  x=x.replace(/^([A-G])[il1!|](?=m|maj|M|\d|$)/,'$1#');
  x=x.replace(/^([A-G])[oO0](?=m(?!aj))/,'$1#');
  x=x.replace(/sus[dDoOiIlL1!|](?![0-9])/,'sus4');
  x=x.replace(/^([A-G])[|1lI](?=[A-G])/,'$1/');
  x=x.replace(/([A-G][#b]?)[|lI]([A-G][#b]?)$/,'$1/$2');
  x=x.replace(/^([A-G])[oO0](?![a-z])/,'$1');
  x=x.replace(/^([A-G][#b]?)rn/,'$1m');
  x=x.replace(/^([A-G][#b]?)M(?=7|$)/,'$1maj');
  /* 숫자만 남은 꼬리에 잡숫자가 끼어 든다(실측: "B7"→"B71", "B87"). 코드에서 쓰는 숫자는
     정해져 있으니(2·4·5·6·7·9·11·13) 그것만 남긴다. */
  x=x.replace(/^([A-G][#b]?)([0-9]{2,})$/,(m,r,d)=>{
    if(/11/.test(d))return r+'11';
    if(/13/.test(d))return r+'13';
    const c=d.split('').find(v=>'245679'.indexOf(v)>=0);
    return c?r+c:r;
  });
  x=x.replace(/[^A-Ga-g#b\/0-9msuadijMΔ°+()\-]/g,'');
  if(/^[A-G]/.test(x))x=x[0].toUpperCase()+x.slice(1);
  return x;
}
/* OCR 가사 낱말에서 흔한 잡음만 가볍게 정리한다(사전 대조 없는 규칙 기반).
   실제 한글 사전으로 오타를 고치는 건 별도 작업 — 이건 "글자 아닌 것"만 걷어낸다. */
function cleanOcrLyricToken(t){
  return t
    .replace(/[|Il~`^*_<>{}\[\]0-9]/g,'')     // 오선·바코드성 잡음이 섞여 들어온 자리(가사에 나올 일 없는 문자)
    .replace(/[.,·•‥…]+$/,'')                  // 끝에 붙은 구두점 잡음
    .trim();
}
function wordsFrom(data){
  if(data.words&&data.words.length)return data.words;
  const out=[];
  const walk=n=>{ if(!n)return;
    if(Array.isArray(n)){n.forEach(walk);return;}
    if(n.text!==undefined&&n.bbox&&!n.words&&!n.lines&&!n.paragraphs){out.push(n);return;}
    ['blocks','paragraphs','lines','words'].forEach(k=>{if(n[k])walk(n[k])});
  };
  walk(data.blocks||data);
  return out;
}
function wordsToChart(words){
  const ws=words.filter(w=>w.text&&w.text.trim())
    .map(w=>({t:w.text.trim(),kind:w.kind,x0:w.bbox.x0,x1:w.bbox.x1,yc:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}));
  if(!ws.length)return '';
  const medH=ws.map(w=>w.h).sort((a,b)=>a-b)[Math.floor(ws.length/2)]||20;
  ws.sort((a,b)=>a.yc-b.yc);
  /* 절 번호('v', 예: 전통 찬송가의 왼쪽 여백 "1." "2." "3.")는 코드('c')와는 다른 줄이지만
     그 옆 가사('l')와는 같은 줄이다 — 묶을 때는 코드만 따로, 가사+절번호는 한 묶음으로 본다. */
  const grp=k=>k==='c'?'c':'l';
  const lines=[];
  for(const w of ws){
    const L=lines[lines.length-1];
    if(L&&Math.abs(w.yc-L.yc)<medH*0.7&&grp(L.kind)===grp(w.kind)){
      L.items.push(w); L.yc=(L.yc*(L.items.length-1)+w.yc)/L.items.length;
    } else lines.push({yc:w.yc,items:[w],kind:w.kind});
  }
  const charW=Math.max(6,medH*0.6);
  const minX=Math.min(...ws.map(w=>w.x0));
  const out=[];
  for(const L of lines){
    L.items.sort((a,b)=>a.x0-b.x0);
    const isChord=L.kind==='c';
    let line='',vcol=0;
    /* line.length(문자 수)가 아니라 vcol(보이는 너비 누적)로 위치를 맞춘다 —
       한글 단어는 chord 폰트 기준 charW 단위보다 넓어서, 문자 수 기준으로
       칸을 세면 한글이 쌓일수록 실제 픽셀 위치보다 뒤처져 다음 코드와
       어긋난다(parseChart의 colToIndex와 같은 단위를 써야 함). */
    for(const w of L.items){
      /* 절 번호 1은 표시하지 않음(코드 붙은 기본 절), 2 이상만 "2) " 형식으로 —
         나머지 파서가 그 형식으로 다음 절 가사를 알아본다. */
      /* '|' 는 마디선 표시다 — 코드로 고치려 들면 문자가 없어져 마디가 사라진다(v54) */
      const text=isChord?(w.t==='|'?'|':fixChordToken(w.t)):(w.kind==='v'?(w.t==='1'?'':w.t+') '):w.t);
      if(!text)continue;
      const col=Math.round((w.x0-minX)/charW);
      while(vcol<col){line+=' ';vcol++;}
      if(line.length&&line[line.length-1]!==' '){line+=' ';vcol++;}
      line+=text;vcol+=strDispW(text);
    }
    if(line.trim())out.push(line.replace(/\s+$/,''));
  }
  return out.join('\n');
}
async function ensureOcrWorkers(say){
  if(!window.Tesseract){
    say&&say('OCR 엔진을 내려받는 중…');
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }
  const SPARSE=(window.Tesseract&&Tesseract.PSM&&Tesseract.PSM.SPARSE_TEXT)||'11';
  if(!wChord){
    say&&say('코드 인식 준비 중…');
    wChord=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!==undefined)say&&say('코드 인식 준비 '+Math.round(m.progress*100)+'%')}});
    await wChord.setParameters({
      tessedit_pageseg_mode:SPARSE,
      tessedit_char_whitelist:'ABCDEFGabdgijmosu#/0123456789'
    });
  }
  if(!wLyric){
    say&&say('한글 인식 데이터를 내려받는 중… 처음 한 번만 오래 걸립니다.');
    wLyric=await Tesseract.createWorker(['kor','eng'],1,{logger:m=>{if(m.progress!==undefined)say&&say('한글 준비 '+Math.round(m.progress*100)+'%')}});
  }
}
/* 사진 여러 장을 OCR로 읽어 "코드+가사" 초안 텍스트를 만든다(음표는 못 읽음).
   - 단독으로 쓰면 키 없는 OCR 결과
   - runScan()에서 API 프롬프트에 참고 힌트로 얹으면 AI 채보 정확도를 보정하는 용도로도 쓴다 */
/* ===== 코드 이름만 따로 오려서 읽는다 (v57) =====
   왜 필요한가. 실측: 실제 찬송가 한 쪽에서 눈에 뻔히 보이는 코드 27개 중 **8개만** 읽혔다.
   단 그림을 통째로 넣으면 Tesseract 가 보는 건 오선·음표·빔·가사·절번호가 뒤엉킨 그림이고,
   그 안에서 글자 줄을 잡아내는 데 실패한다(1단만 겨우 읽혔다).
   코드는 **오선 바로 위 좁은 띠**에만 산다. 그 띠만 오려 내면 남는 건 글자뿐이다.
   ★ 한국 찬송가·콘티 악보는 코드를 **빨간 글씨**로 찍는 일이 아주 많다. 색이 있으면 그
     색만 남기는 것만으로 오선·음표·가사가 통째로 사라진다 — 가장 싸고 확실한 분리다.
   ★ 그리고 띠를 통째로 넣어도 안 된다(실측: 4000×130 짜리 띠에서 "A mDi sus4" 가 나왔다).
     너무 납작해서 Tesseract 의 줄 찾기가 무너진다. **낱말 단위로 잘라 한 글자 뭉치씩**
     넣으면(PSM 8 + 화이트리스트) 같은 띠에서 "D | A | F#m | B7 | Esus4E" 가 나온다. */
function chordBandCanvas(url,geo){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const k=(geo.w||img.width)/(geo.iw||geo.w||img.width);   // 내부 캔버스 → 원본 좌표
        const sp=geo.sp*k, top=geo.top*k;
        const bandTop=Math.max(0,Math.round(top-sp*3.3));
        const bandBot=Math.max(bandTop+4,Math.round(top-sp*0.15));
        const bw=img.width, bh=Math.min(img.height,bandBot)-bandTop;
        if(bh<6){ rej(new Error('띠가 너무 얇다')); return; }
        const sc=Math.max(1,Math.min(5,130/bh));
        const W=Math.round(bw*sc), H=Math.round(bh*sc);
        const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        const g=cv.getContext('2d',{willReadFrequently:true});
        g.fillStyle='#fff'; g.fillRect(0,0,W,H);
        g.drawImage(img,0,bandTop,bw,bh,0,0,W,H);
        const d=g.getImageData(0,0,W,H), px=d.data;
        let chrom=0, dark=0;
        for(let i=0;i<px.length;i+=4){
          const r=px[i],gg=px[i+1],b=px[i+2];
          const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), lum=r*.299+gg*.587+b*.114;
          if(lum<190)dark++;
          if(mx-mn>55&&mx>90&&lum<225)chrom++;
        }
        const useColor=chrom>W*H*0.003&&chrom>dark*0.18;
        for(let i=0;i<px.length;i+=4){
          const r=px[i],gg=px[i+1],b=px[i+2];
          const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), lum=r*.299+gg*.587+b*.114;
          const on=useColor?(mx-mn>55&&mx>90&&lum<225):(lum<170);
          px[i]=px[i+1]=px[i+2]=on?0:255;
        }
        g.putImageData(d,0,0);
        res({cv,W,H,color:useColor});
      }catch(e){ rej(e); }
    };
    img.onerror=()=>rej(new Error('이미지 처리 실패'));
    img.src=url;
  });
}
/* 띠를 낱말 뭉치로 자른다. 글자 높이의 0.5배보다 넓게 벌어지면 다른 낱말로 본다. */
function chordBandTokens(band){
  const {cv,W,H}=band;
  const px=cv.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const col=new Int32Array(W); let ty0=H,ty1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)
    if(px[(y*W+x)*4]<128){ col[x]++; if(y<ty0)ty0=y; if(y>ty1)ty1=y; }
  if(ty1<ty0)return [];
  const gapTh=Math.max(2,Math.round((ty1-ty0+1)*0.5));
  const runs=[]; let s=-1,gap=0;
  for(let x=0;x<=W;x++){
    if(x<W&&col[x]>0){ if(s<0)s=x; gap=0; }
    else if(s>=0){ if(++gap>gapTh){ runs.push([s,x-gap]); s=-1; } }
  }
  if(s>=0)runs.push([s,W-1]);
  const out=[];
  for(const [a,b] of runs){
    if(b-a<4)continue;
    let ry0=H,ry1=-1;
    for(let y=0;y<H;y++)for(let x=a;x<=b;x++)if(px[(y*W+x)*4]<128){ if(y<ry0)ry0=y; if(y>ry1)ry1=y; }
    if(ry1<ry0)continue;
    const h=ry1-ry0+1;
    if(h<6||h>H)continue;
    /* Tesseract 는 글자 높이 100px 언저리에서 가장 잘 읽는다. 둘레에 흰 여백을 넉넉히 둬야
       한다 — 글자가 그림 가장자리에 닿아 있으면 통째로 못 읽는 일이 잦다. */
    const sc=Math.max(1,Math.min(6,110/h)), pad=Math.round(h*0.45*sc);
    const cw=Math.round((b-a+1)*sc)+pad*2, ch=Math.round(h*sc)+pad*2;
    const o=document.createElement('canvas'); o.width=cw; o.height=ch;
    const og=o.getContext('2d');
    og.fillStyle='#fff'; og.fillRect(0,0,cw,ch);
    og.imageSmoothingEnabled=true; og.imageSmoothingQuality='high';
    og.drawImage(cv,a,ry0,b-a+1,h,pad,pad,Math.round((b-a+1)*sc),Math.round(h*sc));
    out.push({f:a/W,fw:(b-a+1)/W,url:o.toDataURL('image/png')});
  }
  return out;
}
/* 한 뭉치가 코드 둘이 붙은 것일 수 있다(예: "Esus4E" = Esus4 + E). 통째로는 못 읽히니
   **앞에서부터 가장 긴 코드**를 떼어 내고 나머지를 다시 본다. */
function splitChordRun(t){
  const out=[], seen={};
  let rest=fixChordToken(t||'');
  for(let n=0;n<3&&rest;n++){
    const whole=parseChord(rest);
    if(whole){ out.push(rest); break; }
    let cut=0;
    for(let i=rest.length-1;i>=1;i--){
      const head=rest.slice(0,i);
      if(/^[A-G]/.test(rest.slice(i))&&parseChord(head)){ cut=i; break; }
    }
    if(!cut)break;
    out.push(rest.slice(0,cut)); rest=rest.slice(cut);
  }
  /* 끝내 못 읽으면 **으뜸음만이라도** 건진다. "Esus4" 를 "E" 로 적는 것은 반주로서 틀리지
     않고(같은 화음 위다), 통째로 버려서 짐작 코드가 들어가는 것보다 훨씬 낫다. */
  if(!out.length){
    const m=/^([A-G][#b]?)/.exec(fixChordToken(t||''));
    if(m&&parseChord(m[1]))out.push(m[1]);
  }
  return out.filter(x=>!seen[x]&&(seen[x]=1)&&parseChord(x));
}
async function ocrDraft(photoUrls,say){
  await ensureOcrWorkers(say);
  /* sys: 단마다 {txt, url, page, t0, t1, whole} — 나중에 addGeomMelody 가 이 그림을
     다시 재서 ♪ 줄을 얹고, 폴백 화면이 원본 사진 위 하이라이트 구간으로도 쓴다. */
  const sys=[]; let chordN=0, lyricN=0, key1=null;
  for(let i=0;i<photoUrls.length;i++){
    const tag=photoUrls.length>1?(i+1)+'/'+photoUrls.length+'쪽 ':'';
    /* 한 장에 단이 여러 개 있으면(전통 찬송가 등) 단 단위로 잘라 한 단씩 읽는다 —
       한 장 통째로 넣으면 밀도가 높아 코드·글자 인식이 훨씬 부정확해진다. */
    let shots=[{url:photoUrls[i],t0:0,t1:1,whole:true}];
    /* 단 단위로 자르면 그 조각 안에서 다시 확대할 여유가 생긴다(전체 페이지를 한 번에 키우는
       것보다 훨씬 싸다) — 그래서 여기서는 목표 해상도를 크게 잡는다. */
    /* ★ 목표 폭을 억지로 2200 으로 밀지 않는다(v57). splitSystems 는 아무 것도 안 주면
       **오선 간격이 22px 이 되도록** 키워 주는데, 그게 staffGeom 이 맞춰 놓은 눈금이다.
       2200 을 강요하면 단 폭에 따라 눈금이 흔들려 마디선 개수가 달라졌다(실측: 4마디가
       3마디로). 글자 인식은 코드 띠·가사가 각자 다시 키우므로 여기서 키울 필요가 없다. */
    try{ const parts=await splitSystems(photoUrls[i]);
         if(parts&&parts.length)shots=parts.map(p=>({url:p.url,t0:p.t0,t1:p.t1,whole:false})); }catch(e){}
    for(let j=0;j<shots.length;j++){
      const tag2=shots.length>1?tag+(j+1)+'/'+shots.length+'단 ':tag;
      say&&say(tag2+'오선을 지우는 중…');
      /* 단 단위로 잘랐으면 이미 위에서 충분히 확대했으니 그대로, 통째로(단 분리 실패) 넣을 땐
         한 번 더 키운다 — 어느 쪽이든 작은 글자가 인식 가능한 크기가 되도록. */
      const clean=await stripStaff(shots[j].url,shots.length>1?1:1.4);
      say&&say(tag2+'오선을 재는 중…');
      /* 오선을 **여기서** 먼저 잰다(v57). 코드 띠를 오려내려면 오선 위치가 있어야 하고,
         어차피 addGeomMelody 가 곧 같은 일을 하므로 결과를 들고 가면 한 번만 재면 된다. */
      let geo=null; try{ geo=await staffGeom(shots[j].url); }catch(e){}
      say&&say(tag2+'코드 심볼을 읽는 중…');
      const rc=await wChord.recognize(clean,{},{blocks:true,text:false});
      const asChord=(ws,scaleW)=>ws
        .filter(w=>w.text&&w.text.trim()&&(w.confidence===undefined||w.confidence>40))
        .filter(w=>parseChord(fixChordToken(w.text.trim())))
        .map(w=>({text:w.text,bbox:w.bbox,kind:'c',f:scaleW>0?w.bbox.x0/scaleW:-1}));
      let cwFull=0; try{ cwFull=(await imgFrom(clean)).width; }catch(e){}
      let chordWords=asChord(wordsFrom(rc.data),cwFull);
      /* ★ 오선 바로 위 띠만 따로, **낱말 하나씩** 읽는다 — 여기서 대부분이 나온다 */
      if(geo)try{
        const band=await chordBandCanvas(shots[j].url,geo);
        const toks=chordBandTokens(band);
        const bandWords=[];
        if(toks.length){
          const SPARSE=(window.Tesseract&&Tesseract.PSM&&Tesseract.PSM.SPARSE_TEXT)||'11';
          await wChord.setParameters({tessedit_pageseg_mode:'8'});   // 한 낱말짜리 그림
          for(const tk of toks){
            let txt='';
            try{ const r=await wChord.recognize(tk.url,{},{blocks:true,text:true}); txt=(r.data.text||'').trim(); }catch(e){}
            const parts=splitChordRun(txt);
            parts.forEach((c,ci)=>bandWords.push({
              text:c,kind:'c',f:tk.f+(parts.length>1?tk.fw*ci/parts.length:0),
              bbox:{x0:0,x1:1,y0:0,y1:1}}));
          }
          await wChord.setParameters({tessedit_pageseg_mode:SPARSE});
        }
        if(bandWords.length){
          /* 띠에서 읽은 것을 기준으로 삼고, 통짜 그림에서 읽은 것 중 **겹치지 않는 것만** 더한다.
             둘 다 놓치는 자리가 서로 다르므로 합치면 회수가 올라간다. */
          const merged=bandWords.slice();
          for(const w of chordWords)
            if(w.f>=0&&!merged.some(m=>Math.abs(m.f-w.f)<0.025))merged.push(w);
          /* 좌표계를 **통짜 그림(clean) 픽셀**로 통일한다 — 아래 wordsToChart 와
             addGeomMelody 가 그 단위로 가사와 칸을 맞춘다. 코드는 늘 맨 위 줄이므로
             y 는 0~30 으로 고정해 준다(그래야 가사보다 확실히 위로 묶인다). */
          const gh=Math.max(14,Math.round((cwFull||1000)*0.02));
          chordWords=merged.sort((a,b)=>a.f-b.f)
            .map(w=>({text:w.text,kind:'c',
                      bbox:{x0:w.f*(cwFull||1000),x1:w.f*(cwFull||1000)+gh*1.5,y0:0,y1:gh}}));
        }
      }catch(e){}
      say&&say(tag2+'가사를 읽는 중…');
      const rl=await wLyric.recognize(clean,{},{blocks:true,text:false});
      const rawLyric=wordsFrom(rl.data).filter(w=>w.text&&w.text.trim());
      /* ★ **오선보다 위에 있는 글자는 가사가 아니다**(v68, 사용자 신고 사진에서 잡았다).
         곡 제목·작사/작곡·성경 구절·빠르기말(♩=65)이 첫 단 띠에 같이 잘려 들어오는데,
         여태 그대로 가사가 됐다 — 실측(「하나님의 부르심」): 1마디 가사가 "로 마 서",
         3마디가 "손 경 민 작 곡" 이었다. 코드는 오선 위에 살지만 **가사는 반드시 오선
         아래**이므로, 맨 윗줄보다 위에서 시작하는 낱말은 통째로 버린다.
         (geo.top 은 재는 그림(iw) 기준이라 글자 그림(cwFull) 기준으로 바꿔서 쓴다) */
      const lyMin=(geo&&cwFull>0&&geo.iw>0)?geo.top*cwFull/geo.iw:-1;
      const belowStaff=w=>lyMin<0||(w.bbox&&w.bbox.y0>=lyMin);
      const lyricWords=rawLyric
        .filter(w=>w.confidence===undefined||w.confidence>40)   // 확신도 낮은 잡음 토큰은 애초에 버린다(코드 인식과 동일 기준)
        .filter(belowStaff)
        .filter(w=>/[가-힣]/.test(w.text))
        .map(w=>({text:cleanOcrLyricToken(w.text),bbox:w.bbox,kind:'l'}))
        .filter(w=>w.text);
      /* 전통 찬송가는 절 가사 왼쪽에 "1. 2. 3. 4."로 번호가 붙어 있다.
         한글이 없어 위 필터에서 빠지므로, 홀로 있는 한 자리 숫자(+점)만 절 번호 후보로 따로 챙긴다. */
      const verseWords=rawLyric.filter(w=>{
          const t=w.text.trim();
          if(!belowStaff(w))return false;                        // 위쪽 머리글의 숫자(연도·장절)를 절 번호로 오인하지 않는다
          if(!/^[1-9][.).]?$/.test(t))return false;
          if(w.confidence!==undefined&&w.confidence<70)return false;   // 잘못 읽은 낱자 숫자(페이지 번호·연도 조각 등)를 절 번호로 오인하지 않도록 엄격하게
          return +t.replace(/[.).]/g,'')<=6;   // 찬송가 절이 6개를 넘는 경우는 거의 없다
        })
        .map(w=>({text:w.text.trim().replace(/[.).]/g,''),bbox:w.bbox,kind:'v'}));
      chordN+=chordWords.length; lyricN+=lyricWords.length;

         조표가 없어서, 이게 없으면 Bb 조 찬송가의 멜로디가 전부 B 로 나온다. */
      if(!key1&&chordWords.length){
        const first=chordWords.slice().sort((a,b)=>a.bbox.x0-b.bbox.x0)[0];
        key1=parseChord(fixChordToken(first.text.trim()))||null;
      }
      const txt=wordsToChart(chordWords.concat(lyricWords).concat(verseWords));
      /* 낱말들을 그대로 들고 간다(v54). 나중에 addGeomMelody 가 **사진에서 재 마디선**에
         맞춰 코드 줄을 다시 짭는데, 그때 문자 인식이 읽은 코드를 **어느 마디에 놓을지**
         가로 자리(x)로 정해야 하기 때문이다. 글자 칸 수로 맞추는 것보다 훨씬 튼튼하다.
         cw = 그 bbox 들이 사는 그림의 폭(비율로 바꾸려면 필요하다). */
      const cw=cwFull||0;
      sys.push({txt,url:shots[j].url,page:i,t0:shots[j].t0,t1:shots[j].t1,whole:shots[j].whole,
                cw,geo:(geo&&geo.notes&&geo.notes.length>=3)?geo:null,
                words:{c:chordWords,l:lyricWords,v:verseWords}});
    }
  }
  return {text:sys.map(s=>s.txt).filter(t=>t.trim()).join('\n\n'),chordN,lyricN,sys,key:key1};
}
/* ★ 악보 맨 위(첫 단보다 위)에 인쇄된 **제목**을 읽는다(v66, 사용자 요청).
   첫 단이 시작하는 자리(t0)를 이미 알고 있으므로 그 위쪽 띠만 오려 내면 된다 —
   거기에는 제목·번호·작곡자만 있고 오선·가사가 없어 글자 인식이 훨씬 잘 된다.
   한글이 가장 많이 든 줄을 제목으로 본다(찬송가 번호·영문 원제·작곡자를 이걸로 거른다). */
async function ocrTitle(url,t0){

    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    /* ★ 띠 높이는 **넉넉히** 잡는다(실측). 첫 단이 시작하는 자리(t0)를 그대로 쓰면
       띠가 얇아져 제목 글자의 아랫부분이 잘리고 그러면 아무것도 못 읽는다
       (t0≈0.15 → 195px 는 실패, 0.18 → 251px 는 "무덤에 머물러" 성공). */
    const h=Math.max(24,Math.round(img.height*Math.min(0.30,Math.max(0.16,t0||0.2))));
    const k=Math.min(3,Math.max(1,1400/Math.max(1,img.width)));

    cv.width=Math.round(img.width*k); cv.height=Math.round(h*k);
    const g=cv.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    g.drawImage(img,0,0,img.width,h,0,0,cv.width,cv.height);
    const r=await wLyric.recognize(cv.toDataURL('image/png'));
    let best='',bn=0;

async function geminiModels(gkey){

    if(r.ok){

        .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>String(m.name||'').replace(/^models\//,''))
        .filter(n=>/gemini/i.test(n)&&!/embedding|aqa|tts|image|audio|native|thinking-exp/i.test(n));
      const score=n=>{
        let s=0;
        if(/flash/i.test(n))s+=100;          // 무료 등급은 flash 계열
        if(/lite/i.test(n))s-=20;            // lite 는 정확도가 낮다
        if(/latest/i.test(n))s+=15;
        if(/preview|exp/i.test(n))s-=30;
        const v=parseFloat((n.match(/(\d+(?:\.\d+)?)/)||[])[1]||0);
        s+=v*3;
        return s;
      };
      ok.sort((x,y)=>score(y)-score(x));
      /* 라운드로빈으로 하루 한도를 나눠 쓰므로 후보는 넉넉할수록 좋다(6 → 10).
         무료 등급은 모델마다 하루 20회라 10개면 하루 200회다. */
      if(ok.length){GMODELS=ok.slice(0,10);return GMODELS;}
    }else if(r.status===403){
      throw new Error('키가 거부되었습니다. AI Studio에서 키를 다시 확인해 주세요');
    }
  }catch(e){ if(/거부/.test(e.message))throw e; }
  return GEMINI_MODELS;   // 목록 조회 실패 시 예비 목록 — 실패는 캐시하지 않아 다음 시도 때 다시 조회한다
}
/* 읽어 온 멜로디가 "악보로서 말이 되는지" 스스로 채점한다.
   음높이 정답을 우리가 알 수는 없지만, 틀렸을 때 거의 항상 함께 나타나는 흔적은 알 수 있다.
     - 마디 박수 합이 박자표와 안 맞는다 (음표나 쉼표를 놓쳤거나 더 봤다)
     - 음역을 벗어난 음이 있다 (자리표·덧줄 오독)
     - 옥타브를 넘는 도약이 있다 (옥타브 숫자 오독)
   돌려주는 값은 {score:0~1, why:'사람이 읽을 설명'}. score 가 낮은 단만 다시 읽는다 —
   모든 단을 두 번 읽으면 Gemini 무료 한도를 두 배로 쓰게 되므로 문제가 있는 단에만 쓴다. */
function melScore(txt){
  const lines=(txt||'').split('\n').filter(l=>MEL_RE.test(l));
  if(!lines.length)return null;                 // 멜로디가 아예 없으면 채점 대상이 아니다
  let bars=0,badBar=0,notes=0,outRange=0,bigLeap=0;
  for(const l of lines){
    const clef=/^\s*♫/.test(l)?'bass':'treble';
    const [LO,HI]=MEL_RANGE[clef];
    const nts=parseMelody(l);
    const groups=[[]];
    for(const n of nts){ if(n.bar)groups.push([]); else groups[groups.length-1].push(n); }
    const gs=groups.filter(g=>g.length);
    gs.forEach((g,i)=>{
      const sum=g.reduce((a,n)=>a+(n.beats||1),0);
      if(i===0&&gs.length>1&&sum<P.beats-0.01)return;    // 못갖춘마디는 예외
      bars++; if(Math.abs(sum-P.beats)>0.26)badBar++;
    });
    let prev=null;
    for(const n of nts){
      if(n.bar||n.rest||n.midi===undefined)continue;
      notes++;
      if(n.midi<LO||n.midi>HI)outRange++;
      if(prev!==null&&Math.abs(n.midi-prev)>12)bigLeap++;
      prev=n.midi;
    }
  }
  if(!bars&&!notes)return null;
  const barBad=bars?badBar/bars:0, pitchBad=notes?(outRange+bigLeap)/notes:0;
  const why=[];
  if(badBar)why.push(bars+'마디 중 '+badBar+'마디가 박자표와 안 맞습니다');
  if(outRange)why.push('노래할 수 없는 음역의 음이 '+outRange+'개 있습니다');
  if(bigLeap)why.push('옥타브를 넘는 도약이 '+bigLeap+'군데 있습니다');
  return {score:Math.max(0,1-barBad-pitchBad*1.5),why:why.join('. ')};
}
/* 단 기록(sysRec)을 원본 사진 보기용 구조로 바꾼다.
   각 단에 곡 전체 진행도 구간 [b0,b1) 을 붙여, 재생 위치 → 어느 단인지 바로 찾게 한다.
   길이는 sysWeight 로 잰 박수 비율이라 재생 엔진의 계산과 완전히 같지는 않다 —
   눈으로 따라가는 보조 표시라 한 마디 정도 오차는 문제되지 않는다. */
/* staffGeom 이 픽셀로 잰 음표·마디선 자리를 '사진 폭의 몇 %' 로 바꾼다(v52).
   사진을 어떤 크기로 띄우든 비율은 그대로라, 그 위에 마디 상자와 재생선을 얹을 수 있다.
     seg = 마디 구간 [{x0,x1,i0,cnt}] — 마디선 사이를 잘라 **음표가 든 칸만** 남긴다.
           맨 앞 자리표 칸과 맨 뒤 빈 칸이 이걸로 저절로 빠진다(따로 세지 않는다).
     kb/kx = 진행도(0~1) → 가로 자리(0~1) 꺾은선.

   ★ 꺾은선을 음표 자리만으로 잇지 않는 이유(실측으로 잡은 버그다):
     마디의 **마지막 음** 머리에서 다음 마디 **첫 음** 머리로 곧장 이으면, 그 사이에
     마디선이 놓여 있어서 마지막 음이 아직 울리는 동안 재생선이 이미 마디선을 넘는다.
     실제로 25번 재 보니 마디가 바뀌는 지점마다 표시가 **반 박 먼저** 넘어갔다.
     그래서 마디의 끝 박은 **그 마디의 마디선(seg.x1)** 으로 이어 두고, 다음 마디는
     첫 음 머리에서 새로 시작한다 — 같은 박에 점이 둘이지만 그게 실제 조판이다. */
function origGeomOf(geo){
  if(!geo||!geo.w||!geo.notes||geo.notes.length<2)return null;
  const w=geo.w, cl=v=>Math.max(0,Math.min(1,v));
  const nx=geo.notes.map(n=>cl(n.x/w));
  const bt=geo.notes.map(n=>(n.beats>0?n.beats:1));
  const tot=bt.reduce((a,b)=>a+b,0)||1;
  const nb=[]; let acc=0;
  for(const b of bt){ nb.push(acc/tot); acc+=b; }

     되어 있다 — 5마디는 없는 건데 새로 생겼다"*). 인식이 마디선을 하나 더 만들면 한 마디가
     둘로 갈라지고, 갈라진 조각은 **이웃 마디의 절반도 안 되는 폭**으로 남는다. 조판에서
     마디 폭은 그 안에 든 음표 수에 대략 비례하므로, 음표가 한 개뿐인데 폭이 중앙값의 38%도
     안 되는 **안쪽** 마디는 실제 마디가 아니다 — 그 오른쪽 마디선을 지워 뒤 마디와 합친다.
     ★ 맨 앞·맨 뒤 조각은 절대 건드리지 않는다 — 못갖춘마디와 단 끝에 걸친 조각은 원래
       짧은 것이 맞다(45번 항목 d). 그래서 안쪽(i=1…끝-1)만 본다. */
  const bars=(()=>{

    const a=edges[i], b=edges[i+1];
    if(b-a<0.02)continue;

    nx.forEach((x,j)=>{ if(x>=a&&x<b){ if(i0<0)i0=j; cnt++; } });

       사이에 낀 것만. 예전에는 통째로 버렸는데, 그러면 그 단의 마디 수가 실제보다 하나
       적어져 사진 위 마디 표시가 그 뒤로 전부 한 칸씩 밀렸다(실측: 온음표 한 마디를
       놓쳐 4마디가 3마디가 됐다). 쉼표 한 마디로 두면 마디 수가 악보와 같아진다.
       맨 앞·맨 뒤의 빈 구간은 마디가 아니다(자리표 앞, 마지막 마디선 뒤) — 버린다. */
    if(!cnt){
      /* ★ '뒤에 음표가 하나라도 남아 있는' 빈 구간만 마디로 센다(v67).
         마지막 마디선 뒤에 남는 넓은 여백에 마디선이 하나 더 잡히면(겹세로줄·오선 끝)
         그 사이가 **안쪽 빈 마디**로 보여 없는 마디가 하나 생겼다(회귀 테스트 barTest 가
         [4,4] 를 기대하는데 [4,4,0] 이 나오던 것이 이 모양이다). v57 이 적어 둔 뜻
         ("맨 앞·맨 뒤의 빈 구간은 마디가 아니다") 그대로 고친 것이다. */
      const inner=i>0&&i<edges.length-2&&nx.some(x=>x>=b);
      if(!inner||b-a<0.04)continue;
      seg.push({x0:a,x1:b,i0:-1,cnt:0,pb:[0,1],px:[a,b]});
      continue;
    }
    /* 마디 **안에서** '몇 박째 → 가로 어디'를 따로 갖고 있는다(v53). 마디 경계는
       재생 타임라인이 정확히 알고 있으므로(origBeats), 여기서 쓰는 음표 길이 어림이
       조금 틀려도 **오차가 그 마디를 넘어가지 않는다** — 마디선마다 저절로 맞춰진다. */
    let tot2=0; for(let j=i0;j<i0+cnt;j++)tot2+=bt[j];
    const pb=[], pxs=[]; let a2=0;
    for(let j=i0;j<i0+cnt;j++){ pb.push(tot2>0?a2/tot2:0); pxs.push(nx[j]); a2+=bt[j]; }
    pb.push(1); pxs.push(Math.max(nx[i0+cnt-1],b));   // 마디 끝 = 마디선
    seg.push({x0:a,x1:b,i0,cnt,pb,px:pxs});
  }
  const kb=[], kx=[];
  if(seg.length){
    seg.forEach(sg=>{
      for(let j=sg.i0;j<sg.i0+sg.cnt;j++){ kb.push(nb[j]); kx.push(nx[j]); }
      const last=sg.i0+sg.cnt-1;
      kb.push(ends[last]); kx.push(Math.max(nx[last],sg.x1));   // 마디 끝 = 마디선
    });
  }else{
    nb.forEach((v,i)=>{ kb.push(v); kx.push(nx[i]); });
    kb.push(1); kx.push(Math.min(1,nx[nx.length-1]+0.03));
  }
  return {seg:seg.length?seg:null,kb,kx};
}
/* 단마다 '곡 전체에서 차지하는 구간'과 '그 단에 든 마디들'을 **재생 타임라인에서 그대로
   읽어** 정한다(v53). 어림이 없다 — 사진과 소리가 원리적으로 어긋날 수 없게 만드는 부분이다.

   예전에는 `sysWeight` 로 단마다 박수를 어림해 비율로 나눴다. 어림은 재생 엔진의 계산과
   조금씩 다를 수밖에 없고, 그 차이가 단마다 쌓여 뒤로 갈수록 벌어진다. v52에서 세는 대상을
   고쳐 많이 나아졌지만 **원리적으로는 여전히 딴 데서 센 숫자**였다.
   지금은 단마다 "몇 번째 코드부터인지"(`ch` 의 누적)만 알면 되고, 그 코드가 몇 박에 놓였는지는
   재생 엔진이 이미 알고 있다(`tl.bars[].idx0`). 물어보기만 하면 된다.

   ★ 안전한 실패: 단별 코드 개수의 합이 지금 악보의 코드 개수와 다르면(사용자가 텍스트를
     고쳤다) **아무것도 하지 않고** null 을 돌려준다. 그러면 예전 방식(b0/b1)이 그대로 쓰인다.
     어긋난 채로 짝지으면 엉뚱한 마디를 가리켜 없느니만 못하다 — `applyGeomPitch` 와 같은 원칙. */
function origBeats(o){
  if(!o||!o.pages)return null;
  const sys=[]; o.pages.forEach(p=>(p.sys||[]).forEach(s=>sys.push(s)));
  if(!sys.length)return null;
  const tl=buildTimeline(), tb=tl.bars||[], tot=tl.total||1;
  if(!tb.length)return null;
  const nch=blocks.reduce((a,b)=>a+(b.k==='pairs'?b.pairs.filter(p=>p.chord).length:0),0);
  const n=sys.length;
  const haveCh=nch>0&&sys.every(s=>typeof s.ch==='number')
             &&sys.reduce((a,s)=>a+(s.ch||0),0)===nch;
  const edge=new Array(n+1).fill(null);
  edge[0]=0; edge[n]=tot;

  if(haveCh){
    /* 정확한 길: 단마다 "몇 번째 코드부터"를 알고 있으므로 그 코드가 든 마디를 그대로 집는다 */
    let c0=0;
    for(let i=0;i<n;i++){
      const c1=c0+(sys[i].ch||0);
      const ms=tb.filter(b=>b.idx0>=c0&&b.idx0<c1);
      if(ms.length){ if(i)edge[i]=ms[0].at; edge[i+1]=ms[ms.length-1].at+ms[ms.length-1].beats; }
      c0=c1;
    }
    edge[n]=tot;
    /* 코드가 하나도 없는 단(멜로디만 적힌 단)은 앞뒤 사이를 어림값(w) 비율로 나눠 갖는다 */
    for(let i=1;i<n;i++){
      if(edge[i]!=null)continue;
      let a=i-1; while(a>0&&edge[a]==null)a--;
      let b=i+1; while(b<n&&edge[b]==null)b++;
      const span=(edge[b]==null?tot:edge[b])-(edge[a]==null?0:edge[a]);
      let all=0, upto=0;
      for(let k=a;k<b;k++){ const w=Math.max(0.001,sys[k].w||1); if(k<i)upto+=w; all+=w; }
      edge[i]=(edge[a]==null?0:edge[a])+span*(all>0?upto/all:0);
    }
  }else{
    /* 덜 정확한 길 — **이 버전 전에 저장해 둔 곡**에는 단별 코드 개수(ch)가 없다.
       그래도 예전보다는 낫게 만들 수 있다: 예전 어림값(w)으로 나눈 뒤 그 경계를
       **가장 가까운 진짜 마디선에 붙인다.** 어느 마디에서 단이 바뀌는지는 어림이지만,
       적어도 **단이 바뀌는 순간은 언제나 마디 첫 박**이 된다 — 마디 한가운데에서
       하이라이트가 건너뛰는 어색함이 사라지고, 마디 단위 표시도 쓸 수 있게 된다.
       ★ 옛 곡을 마디까지 정확히 맞추려면 사진을 다시 인식하는 수밖에 없다. */
    const tw=sys.reduce((a,s)=>a+Math.max(0,s.w||0),0);
    let acc=0, used=0;
    for(let i=1;i<n;i++){
      acc+=Math.max(0,sys[i-1].w||0);
      const want=tw>0?tot*acc/tw:tot*i/n;
      let bestJ=-1, bestD=Infinity;
      tb.forEach((b,j)=>{ const d=Math.abs(b.at-want); if(j>used&&d<bestD){bestD=d;bestJ=j;} });
      if(bestJ<0){ edge[i]=edge[i-1]; continue; }
      used=bestJ; edge[i]=tb[bestJ].at;
    }
  }
  /* 단조 증가로 다듬는다(어느 길이든 앞 단을 뚫고 들어가지 않게) */
  for(let i=1;i<=n;i++)if(edge[i]<edge[i-1])edge[i]=edge[i-1];
  const mine=[];
  for(let i=0;i<n;i++)mine.push(tb.filter(b=>b.at>=edge[i]-1e-9&&b.at<edge[i+1]-1e-9));
  return sys.map((s,i)=>({b0:Math.max(0,Math.min(1,edge[i]/tot)),
                          b1:Math.max(0,Math.min(1,edge[i+1]/tot)),
                          bars:mine[i],tot,exact:haveCh}));
}
function buildOrig(sysRec){
  const recs=(sysRec||[]).filter(r=>r&&S.photos[r.page]);
  if(!recs.length)return null;
  const tot=recs.reduce((a,r)=>a+Math.max(0,r.w||0),0);
  const pages=S.photos.map(ph=>({url:ph.showUrl||ph.url,sys:[]}));
  let acc=0, n=0;
  recs.forEach(r=>{
    const w=Math.max(0,r.w||0);
    const b0=tot>0?acc/tot:0; acc+=w;
    const b1=tot>0?acc/tot:1;
    /* ch = 이 단에 든 코드 개수. 재생 타임라인과 짝짓는 유일한 열쇠다(origBeats).
       b0/b1 은 그게 안 될 때만 쓰는 어림값으로 남겨 둔다. */
    pages[r.page].sys.push(Object.assign({t0:r.t0,t1:r.t1,b0,b1,w,ch:r.ch||0,n:++n+'단'},origGeomOf(r.geo)||{}));
  });
  const out={pages:pages.filter(p=>p.url&&p.sys.length),approx:recs.some(r=>r.whole)};
  return out.pages.length?out:null;
}
/* 이 단(사진 한 줄)이 곡 전체에서 차지하는 길이를 박 단위로 어림한다.
   원본 사진 위 하이라이트를 재생 위치에 맞춰 옮기려면 단마다 "몇 박짜리인가"가 필요하다.
   멜로디를 읽었으면 그 박수가 곧 정답이고, 못 읽었으면 마디·코드 개수로 어림한다.
   재생 엔진과 완전히 같은 계산은 아니다 — 눈으로 따라가는 보조 표시라 이 정도면 충분하다. */
/* 이 단 텍스트에 든 코드 개수. `reparse` 가 코드마다 매기는 전역 번호(p.idx)와 같은 규칙으로
   세야 하므로 같은 파서를 쓴다. 이 숫자 하나가 사진의 단과 재생 타임라인을 잇는다(origBeats).
   합이 전체 코드 개수와 안 맞으면 origBeats 가 알아서 손을 떼므로, 여기서 틀려도 안전하다. */
function sysChords(txt){
  return parseChart(txt||'').reduce((a,b)=>a+(b.k==='pairs'?b.pairs.filter(p=>p.chord).length:0),0);
}
function sysWeight(txt){
  /* ★ v52에서 세는 대상을 바꿨다 — 예전엔 **멜로디 박수**를 셌다. 그런데 실제 재생 길이를
     정하는 건 멜로디가 아니라 **코드 마디**다: buildTimeline 은 마디마다 멜로디를
     P.beats 로 늘려 맞추고(`put(g,barStarts[i],P.beats,…)`), 마디 길이는 코드가 정한다.
     그래서 한 마디가 3박으로 적힐 단(2/4로 바뀌는 곳, 못갖춘마디, 못 읽은 음)이 하나만
     있어도 하이라이트가 재생보다 앞서 나가고, 그 오차가 단마다 쌓인다 —
     사용자가 "재생이랑 표시가 안 맞는다"고 한 것이 이것이다.
     여기서 세는 방식은 buildTimeline 의 flush() 와 같은 규칙이어야 한다. */
  const bl=parseChart(txt||'');
  const hasBar=bl.some(b=>b.k==='pairs'&&b.pairs.some(p=>p.bar));
  let bars=0;
  for(const b of bl){
    if(b.k!=='pairs')continue;
    let cur=0;
    for(const pr of b.pairs){
      if(pr.bar){ if(hasBar&&cur){bars++;cur=0;} continue; }
      if(pr.chord){ if(hasBar)cur++; else bars++; }
    }
    if(cur){bars++;cur=0;}
  }
  if(bars>0)return bars*(P.beats||4);
  /* 코드가 하나도 없는 단(멜로디만 적힌 단)은 멜로디 박수로 어림하는 수밖에 없다 */
  let beats=0;
  for(const l of (txt||'').split('\n')){
    if(!/^\s*♪/.test(l))continue;
    for(const n of parseMelody(l))if(!n.bar)beats+=(n.beats||1);
  }
  return beats>0.5?beats:(P.beats||4);
}
/* 채보한 멜로디의 마지막 음이름 — 다음 단을 읽을 때 옥타브 기준으로 알려 준다 */
function stripFence(t){ return (t||'').trim().replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim(); }
function lastMelNote(txt){
  const lines=(txt||'').split('\n').filter(l=>/^\s*♪/.test(l));
  for(let i=lines.length-1;i>=0;i--){
    const nts=parseMelody(lines[i]).filter(n=>!n.bar&&!n.rest&&n.midi!==undefined);
    if(nts.length){ const m=nts[nts.length-1].midi; return nm(m,'sharp')+(Math.floor(m/12)-1); }
  }
  return '';
}
/* Gemini 의 429 에는 성격이 아주 다른 두 가지가 섞여 있다.
     · 분당 한도(RPM) — 잠깐 기다리면 그대로 풀린다. 이 앱은 한 곡에서 단 수만큼
       요청을 보내므로 **여기에 걸리는 게 정상에 가깝다.**
     · 하루 한도(RPD) — 태평양 시간 자정까지 정말로 못 쓴다.
   v50 까지는 이 둘을 구분하지 않고 429 를 한 번 더 맞으면 무조건 "하루 한도 소진"으로
   단정하고 OCR 폴백으로 내려갔다. 그래서 **한도를 거의 안 쓴 사용자가 "무료 한도를 다
   썼습니다"를 보고 멜로디 없는 결과를 받았다.** 응답 body 의 QuotaFailure 에 어느
   쪽인지가 적혀 있으니 그걸 읽는다(없으면 메시지 문구로 추정하되, 기본은 분당으로 본다 —
   덜 위험한 쪽으로 틀리는 게 낫다). RetryInfo 에는 서버가 알려주는 대기 시간도 있다. */
function quotaKind(d){
  const det=(d&&d.error&&d.error.details)||[];
  let perDay=false, perMin=false, delay=0;
  for(const x of det){
    const t=String(x['@type']||'');
    if(/QuotaFailure/i.test(t))for(const v of (x.violations||[])){
      const s=(v.quotaId||'')+' '+(v.quotaMetric||'');
      if(/per_?day/i.test(s))perDay=true;
      if(/per_?min/i.test(s))perMin=true;
    }
    if(/RetryInfo/i.test(t)){ const m=String(x.retryDelay||'').match(/([\d.]+)\s*s/); if(m)delay=parseFloat(m[1]); }
  }
  if(!perDay&&!perMin){
    const msg=String((d&&d.error&&d.error.message)||'');
    if(/per day|daily|PerDay/i.test(msg))perDay=true; else perMin=true;
  }
  return {perDay:perDay&&!perMin,perMin:perMin||!perDay,delay};
}
/* ============ 무료 한도를 실제 수치에 맞춰 다룬다 (v51) ============
   사용자가 AI Studio '비율 제한' 화면을 찍어 보내 줘서 실제 숫자를 처음 알았다.
   **무료 등급은 모델마다 따로 분당 5회(RPM) · 하루 20회(RPD) 다.**
   그 화면에서 실제로 벌어진 일:
     Gemini 3.8 Flash  RPM 6/5(초과) · RPD 24/20(초과)   ← 앱이 늘 이것만 골라 썼다
     Gemini 3.5 Flash  RPM 1/5       · RPD  2/20         ← 거의 안 씀
     Gemini 3.6 Flash  RPM 1/5       · RPD  2/20         ← 거의 안 씀
     Gemini 3.7 Flash  RPM 1/5       · RPD  4/20         ← 거의 안 씀
   즉 **한도가 남아 있는 모델이 셋이나 있는데 앱이 한 모델만 두들기다 죽었다.**
   찬송가 한 장이 12단이면 요청 12회다 — 한 모델(하루 20회)로는 하루 한 곡 반이지만,
   네 모델을 돌려 쓰면 80회, 여섯 모델이면 120회다. 그래서 두 가지를 한다.

   1) **모델 라운드로빈** — 요청마다 다음 모델로 넘긴다(실패했을 때만이 아니라 평소에).
      하루 한도가 모델별로 따로 세지므로 이게 곧 하루 한도를 네 배로 늘리는 일이고,
      분당 한도도 모델별이라 전체 속도도 같이 빨라진다.
   2) **모델별 간격 지키기 + 지수 백오프** — 분당 5회는 모델당 12초에 한 번이다.
      한 번이라도 분당 한도에 걸리면 그 뒤로는 무료 등급 간격으로 스스로 늦추고,
      재시도 간격은 서버가 알려 준 retryDelay 를 우선하되 없으면 2배씩 늘린다.
      "무료 키였다"는 사실은 localStorage 에 남겨 다음에 처음부터 지키게 한다. */
const GEM_FAST_GAP=1200;          // 유료 키를 처음부터 느리게 만들지 않기 위한 기본 간격
const GEM_FREE_GAP=12500;         // 무료 등급 분당 5회 = 모델당 12초에 한 번
const GEM_RETRY=4;                // 같은 모델 재시도 횟수(지수 백오프)
const GEM_STATE={};               // 모델 → {last, until, dayOut}
let GEM_RR=0;                     // 라운드로빈 위치
let GEM_GAP=(()=>{ try{ return localStorage.getItem('konti.gemfree')?GEM_FREE_GAP:GEM_FAST_GAP; }catch(e){ return GEM_FAST_GAP; } })();
function gemFreeTier(){ GEM_GAP=Math.max(GEM_GAP,GEM_FREE_GAP); try{ localStorage.setItem('konti.gemfree','1'); }catch(e){} }
/* 하루 한도는 태평양 시간 자정에 풀린다 — 그 날짜를 도장처럼 찍어 두면 새로고침해도
   이미 소진된 모델에 요청을 또 낭비하지 않는다(요청 한 번이 하루 20회 중 하나다). */
const gemToday=()=>{ try{ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'}); }catch(e){ return new Date().toISOString().slice(0,10); } };
function gemDayOut(model,set){
  let m={}; try{ m=JSON.parse(localStorage.getItem('konti.gemday')||'{}')||{}; }catch(e){}
  if(set){ m[model]=gemToday(); try{ localStorage.setItem('konti.gemday',JSON.stringify(m)); }catch(e){} }
  return m[model]===gemToday();
}
/* 살아 있는 모델부터, 쉬는 중인 모델, 오늘 다 쓴 모델 순으로 늘어놓는다.
   살아 있는 것들 안에서는 라운드로빈으로 시작점을 옮긴다. */
function gemOrder(models){
  const now=Date.now(), live=[], cool=[], dead=[];
  models.forEach(m=>{
    const s=GEM_STATE[m]||(GEM_STATE[m]={});
    if(s.dayOut||gemDayOut(m))dead.push(m);
    else if((s.until||0)>now)cool.push(m);
    else live.push(m);
  });
  if(live.length>1)live.push(...live.splice(0,GEM_RR%live.length));
  /* 오늘 다 쓴 게 확실한 모델에는 요청을 보내지 않는다 — 거절당하는 것도 요청이다.
     다만 살아 있는 모델이 하나도 없으면 도장이 낡았을 수 있으니 그때는 다시 두드려 본다. */
  const order=live.concat(cool);
  return order.length?{order,dead:dead.length}:{order:dead,dead:0};
}
async function gemPace(model,say){
  const s=GEM_STATE[model]||(GEM_STATE[model]={});
  const wait=GEM_GAP-(Date.now()-(s.last||0));
  if(wait>0){
    if(wait>2500&&say)say('무료 분당 한도(모델당 5회/분)를 지키려고 '+Math.ceil(wait/1000)+'초 쉬는 중…');
    await new Promise(z=>setTimeout(z,wait));
  }
  s.last=Date.now();
}
async function geminiScan(gkey,prompt,b64,say){
  const models=await geminiModels(gkey);
  const {order,dead}=gemOrder(models);
  if(!order.length){
    const qe=new Error('무료 키로 쓸 수 있는 모델이 모두 오늘 하루 한도(모델당 20회)를 다 썼습니다. '
      +'태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다');
    qe.quota=true; qe.perDay=true; throw qe;
  }
  GEM_RR++;                                  // 다음 요청은 다음 모델부터 — 하루 한도를 고루 쓴다
  let lastErr='', dayOut=0, minOut=0;
  /* ★ 순서가 중요하다: **먼저 모델을 전부 한 바퀴 돌고, 그래도 안 되면 그때 기다린다.**
     분당 한도는 모델마다 따로 세므로 옆 모델로 옮기는 건 공짜이고 즉시 되는데,
     한 모델을 붙들고 5→10→20→40초를 먼저 태우면 75초를 버리고 나서야 옆 모델을 본다.
     그래서 바깥 고리 = 재시도 라운드(지수 백오프), 안쪽 고리 = 모델 한 바퀴. */
  for(let round=1;round<=GEM_RETRY;round++){
    let tried=0; minOut=0;
    const live=order.filter(m=>!(GEM_STATE[m]||{}).dayOut);
    if(!live.length)break;
    for(const model of live){
      tried++;
      const tag=live.length>1?' ('+model+', '+tried+'/'+live.length+'번째 모델)':' ('+model+')';
      if(say)say('읽는 중…'+tag+(round>1?' · '+round+'번째 시도':''));
      await gemPace(model,say);
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(gkey);
      let r;
      try{
        r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({
            contents:[{role:'user',parts:[
              {inline_data:{mime_type:'image/jpeg',data:b64}},
              {text:prompt}
            ]}],
            generationConfig:{temperature:0,maxOutputTokens:8192,thinkingConfig:{thinkingBudget:0}}
          })});
      }catch(e){ throw new Error('네트워크 오류 — 인터넷 연결을 확인해 주세요'); }

      let d=null;
      try{ d=await r.json(); }catch(e){}
      if(r.ok){
        const cand=(d&&d.candidates&&d.candidates[0])||null;
        const txt=(cand&&cand.content&&cand.content.parts)
          ? cand.content.parts.map(x=>x.text||'').join('') : '';
        if(txt.trim()){
          if(cand.finishReason==='MAX_TOKENS')LAST_TRUNCATED=true;
          if(GEM_USED.indexOf(model)<0)GEM_USED.push(model);
          return txt;
        }
        lastErr='빈 응답'+(cand&&cand.finishReason?' ('+cand.finishReason+')':'');
        continue;
      }
      const msg=(d&&d.error&&d.error.message)||('서버 응답 '+r.status);
      if(r.status===403) throw new Error('키가 거부되었습니다: '+msg);
      if(r.status===429){
        const q=quotaKind(d);
        gemFreeTier();               // 429 를 봤다는 건 무료 등급이라는 뜻이다 — 이제부터 간격을 지킨다
        const st=GEM_STATE[model]||(GEM_STATE[model]={});
        if(q.perDay){
          /* 이 모델은 오늘 끝이다. 도장을 찍어 두고 **다음 모델로 넘어간다** —
             v50 은 여기서 바로 포기했다. 실제로는 다른 모델에 한도가 남아 있었다. */
          st.dayOut=true; gemDayOut(model,true);
          dayOut++; lastErr='하루 한도 소진('+model+')';
          continue;
        }
        st.until=Date.now()+Math.max(15000,(q.delay||0)*1000);
        st.retry=Math.max(st.retry||0,q.delay||0);
        minOut++; lastErr='분당 한도('+model+')';
        continue;                    // 기다리지 말고 곧바로 다음 모델 — 분당 한도는 모델별이다
      }
      lastErr=msg;
    }
    /* 한 바퀴를 다 돌았는데 전부 분당 한도였다면, 그때 비로소 기다린다(지수 백오프).
       분당 한도가 아닌 이유로 실패한 것이 섞여 있으면 기다려도 소용없으므로 그만둔다. */
    if(!minOut||minOut<tried)break;
    if(round>=GEM_RETRY)break;
    const hint=Math.max.apply(null,live.map(m=>(GEM_STATE[m]||{}).retry||0));
    const back=5*Math.pow(2,round-1)+Math.random()*2;   // 5 → 10 → 20 → 40초, 지터 포함
    let w=Math.min(75,Math.max(5,Math.ceil(hint?hint+1:back)));
    for(;w>0;w--){
      if(say)say('무료 <b>분당</b> 한도에 걸렸습니다 — <b>하루 한도가 아닙니다.</b> '
        +'모델 '+tried+'개가 다 막혀서 '+w+'초 뒤 다시 시도합니다… ('+round+'/'+(GEM_RETRY-1)+')');
      await new Promise(z=>setTimeout(z,1000));
    }
  }
  /* 여기까지 왔으면 쓸 수 있는 모델이 전부 실패했다. 한도 때문이면 quota 를 달아 폴백으로
     넘기되, 하루 한도인지 분당 한도인지를 반드시 구분한다 — 안내 문구가 완전히 달라지고,
     사용자가 "1~2분 뒤 다시 하면 되는 일"을 "오늘은 끝"으로 오해하면 안 된다. */
  if(minOut){
    const qe=new Error('무료 분당 한도(모델당 5회/분)에 계속 걸립니다'
      +(dayOut?'(모델 '+dayOut+'개는 하루 한도까지 소진했습니다)':'(하루 한도는 아직 남아 있습니다)')
      +'. 1~2분 뒤에 다시 시도하면 대개 그대로 됩니다');
    qe.quota=true; qe.perMin=true; throw qe;
  }
  if(dayOut){
    const qe=new Error('무료 키로 쓸 수 있는 모델 '+(dayOut+dead)+'개가 모두 오늘 하루 한도(모델당 20회)를 다 썼습니다. '
      +'태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다');
    qe.quota=true; qe.perDay=true; throw qe;
  }
  if(/no longer available|not found|deprecated/i.test(lastErr))
    throw new Error('시도한 모델이 전부 더는 지원되지 않습니다. 새로고침 후 다시 시도해 보세요('+lastErr+')');
  throw new Error(lastErr||'인식 실패');
}

async function runScan(){
  if(!S.photos.length)return;
  const hosted=!!SCAN_ENDPOINT, prov=getProv();
  /* 패널이 닫혀 있어도 보이도록 배너에도 같이 띄운다 */
  const fail=(html,title)=>{
    const b=$('scanstate'); if(b){b.className='callout err';b.innerHTML=html;}
    clearWork();
    showResult('err',title||'악보를 옮기지 못했습니다',html,[
      {label:'다시 시도',pri:true,fn:()=>{openPanel('scan');runScan();}},
      {label:'직접 입력',fn:()=>openPanel('input')},
      {label:'설정 열기',fn:()=>openPanel('scan')}
    ]);
  };

  if(!hosted&&prov==='gemini'&&!getGKey())
    return fail('<b>무료 Gemini 키를 먼저 넣어 주세요.</b><br>'
      +'aistudio.google.com → 구글 계정 로그인 → <b>Get API key</b> → 복사해서 위 칸에 붙여넣기.<br>'
      +'카드 등록도 결제도 없습니다.');
  if(!hosted&&prov==='claude'&&!getKey()&&!IN_FRAME)
    return fail('<b>Claude API는 유료입니다.</b> 무료로 쓰시려면 위에서 <b>Gemini (무료)</b>를 고르세요.');

  const N=S.photos.length;
  const say=m=>{const b=$('scanstate'); if(b){b.className='callout work';b.innerHTML='<span class="spin"></span> '+m;} setWork(m);};
  say('시작하는 중…');
  LAST_TRUNCATED=false; GEM_USED=[];
  let ocrResult=null;   // Gemini 무료 한도를 다 쓰면 이걸(또는 새로 돌린 OCR을) 그대로 결과로 쓴다
  try{
    /* OCR로 먼저 코드·가사 초안을 훑어서, AI가 헷갈리기 쉬운 코드 기호·글자를
       구분할 때 참고하도록 프롬프트에 힌트로 얹는다. 실패해도 API 채보 자체는 그대로 진행한다. */
    let ocrHint='';
    if(P.ocrBoost!==false){
      try{
        ocrResult=await ocrDraft(S.photos.map(p=>p.hiUrl||p.ocrUrl||p.url),m=>say('OCR로 초안 대조 중… '+m));
        if(ocrResult.text.trim())ocrHint='\n\n참고용 OCR 초안(문자 인식 결과라 오타·오류가 있을 수 있습니다. '
          +'코드 기호나 헷갈리는 글자를 구분할 때만 참고하고, 실제 내용은 항상 사진 이미지를 기준으로 판단하세요):\n---\n'
          +ocrResult.text+'\n---';
      }catch(e){ ocrResult=null; /* OCR 보정은 실패해도 무시하고 API만으로 진행 */ }
    }
    /* 한 장을 단 단위로 쪼개면 인식이 정확해진다 */
    let shots=S.photos;
    if(P.bySystem!==false){
      say('악보를 단 단위로 나누는 중…');
      const acc=[];
      for(let pi=0;pi<S.photos.length;pi++){
        const ph=S.photos[pi];
        const parts=await splitSystems(ph.hiUrl||ph.url);
        /* page/t0/t1 을 같이 들고 다닌다 — 나중에 원본 사진 위에 하이라이트를 얹으려면
           "이 단이 몇 쪽의 어느 구간이었나"를 알아야 한다. */
        if(parts&&parts.length)parts.forEach(x=>acc.push(Object.assign({},x,{page:pi})));
        else acc.push(Object.assign({},ph,{page:pi,t0:0,t1:1,whole:true}));
      }
      if(acc.length)shots=acc;   // 쪽이 많아도 단 단위로 쪼갠 쪽이 정확도가 훨씬 높다
    }
    const NN=shots.length;
    const pages=[];
    let carryNote='', rechecked=0;   // 앞 단의 마지막 음(옥타브 기준), 다시 읽은 단 수
    let geomSys=0, geomFixed=0;      // 오선 자리를 직접 재서 음높이를 확정한 단 수 / 고친 음 수
    let geomFilled=0;                // AI 가 뭉쳐 읽은 것을 마디 단위로 되찾은 음 수 (v62)
    let durSys=0, durFixed=0;        // 음표 길이(박자)까지 확정한 단 수 / 고친 음 수
    const sysRec=[];                 // 원본 사진 위 하이라이트용: 단마다 {page,t0,t1,w}
    for(let i=0;i<NN;i++){
      const tag=NN>1?(i+1)+'/'+NN+'단 ':'';
      const b64=shots[i].b64;
      const withMel=P.readMel!==false;
      /* 음높이는 AI에 맡기지 않고 픽셀로 잰다(v49). 잰 결과를 프롬프트에 넣어 주고,
         AI가 돌려준 음표 개수가 우리가 센 개수와 같으면 음이름을 그 값으로 덮어쓴다.
         한 단씩 자른 그림에서만 한다 — 쪽 전체 그림에서는 첫 단만 재게 되어 뜻이 없다. */
      let geoNames=null, geoNotes=null, geoRaw=null, geoAcc=null;
      if(withMel&&P.geomPitch!==false&&!shots[i].whole){
        say(tag+'오선 자리와 음표 길이를 재는 중…');
        try{ const geo=await staffGeom(shots[i].url);
             /* 마디선은 늘 받아 둔다(사진 위 '지금 몇째 마디' 표시용) — 음높이가 못 미더워도
                마디선은 따로 잰 값이라 그대로 쓸 수 있다. 음이름은 말이 될 때만 쓴다(v53). */
             if(geo)geoRaw=geo;
             if(geo&&geo.notes.length>=3&&geomSane(geo.notes)){ geoNames=geo.notes.map(n=>n.name);
               geoAcc=geomAccs(geo);                 // 그림에서 직접 읽은 임시표(v60)
               if(geo.durSure)geoNotes=geo.notes; } }
        catch(e){ geoNames=null; geoNotes=null; geoRaw=null; geoAcc=null; }
      }
      say(tag+'악보를 읽는 중입니다…');
      /* 임시표를 하나라도 찾았을 때만 프롬프트에 넣는다 — 전부 '·' 인 줄은 잡음일 뿐이다 */
      const accHint=(geoAcc&&geoAcc.some(a=>a))
        ? geoAcc.map(a=>a==='#'?'♯':a==='b'?'♭':a==='n'?'♮':'·') : null;
      const mkPrompt=extra=>makePrompt(withMel,Object.assign({lastNote:carryNote,geom:geoNames,geomAcc:accHint},extra||{}))+ocrHint;
      const usePrompt=mkPrompt();
      let t='';
      if(hosted){
        const r=await fetch(SCAN_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({data:b64,prompt:usePrompt})});
        if(!r.ok)throw new Error(tag+'서버 응답 '+r.status);
        const d=await r.json();
        t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      }else if(prov==='gemini'){
        t=await geminiScan(getGKey(),usePrompt,b64,m=>say(tag+m));
      }else{
        const key=getKey();
        const r=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',
          headers:key
            ? {'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}
            : {'content-type':'application/json'},
          body:JSON.stringify({model:'claude-sonnet-5',max_tokens:4000,messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
            {type:'text',text:usePrompt}]}]})
        });
        if(!r.ok)throw new Error(tag+(r.status===401?'키가 거부되었습니다':'서버 응답 '+r.status));
        const d=await r.json();
        t=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
      }
      if(LAST_TRUNCATED&&P.readMel!==false&&!hosted){
        say(tag+'길이가 넘쳐 멜로디 없이 다시 읽는 중…');
        LAST_TRUNCATED=false;
        const p2=makePrompt(false)+ocrHint;
        if(prov==='gemini')t=await geminiScan(getGKey(),p2,b64,m=>say(tag+m));
      }
      t=t.trim().replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
      /* 멜로디가 악보로서 말이 안 되면 그 단만 한 번 더 읽는다(문제 있는 단에만 한도를 쓴다).
         두 번 중 더 나은 쪽을 고른다 — 다시 읽은 게 더 나쁘면 첫 결과를 그대로 쓴다. */
      if(withMel&&P.recheck!==false&&(prov==='gemini'||hosted)){
        const q=melScore(t);
        if(q&&q.score<0.75){
          say(tag+'음높이·박자가 맞지 않아 다시 확인하는 중…');
          try{
            const p3=mkPrompt({retry:q.why});
            let t2='';
            if(hosted){
              const r=await fetch(SCAN_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({data:b64,prompt:p3})});
              if(!r.ok)throw new Error('서버 응답 '+r.status);
              const d=await r.json();
              t2=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
            }else{
              t2=await geminiScan(getGKey(),p3,b64,m=>say(tag+m));
            }
            t2=stripFence(t2);
            const q2=melScore(t2);
            if(t2&&q2&&q2.score>q.score+0.05){ t=t2; rechecked++; }
          }catch(e){ /* 다시 읽기가 실패하면(한도 등) 첫 결과를 그대로 쓴다 */ }
        }
      }
      /* 우리가 잰 값으로 덮어쓴다. **마디 단위로 먼저 시도하고**(v62), 마디선을 못 찾았거나
         마디 수가 안 맞을 때만 예전처럼 단 전체로 맞춘다.
         마디 단위가 훨씬 세다 — AI 가 두 음을 하나로 뭉쳐 읽어도 그 마디만 잰 값으로 채우고
         나머지 마디는 그대로 둔다(예전에는 개수가 하나만 달라도 단 전체를 포기했다). */
      if(geoNames&&geoRaw&&withMel){
        const ab=applyGeomBars(t,geoRaw,geoAcc,P.beats);
        if(ab.matched){
          t=ab.text; geomSys++; geomFixed+=ab.changed; durSys++; geomFilled+=ab.filled;
        }else{
          const ap=applyGeomPitch(t,geoNames,geoAcc);
          if(ap.matched){ t=ap.text; geomSys++; geomFixed+=ap.changed; }
          /* 음높이를 확정한 단에서만 박자도 덮어쓴다 — 개수가 맞았다는 게 이미 확인된 상태다 */
          if(ap.matched&&geoNotes){
            const ad=applyGeomDur(t,geoNotes,P.beats);
            if(ad.matched){ t=ad.text; durSys++; durFixed+=ad.changed; }
          }
        }
      }
      carryNote=lastMelNote(t)||carryNote;
      const tm=t.match(/^TITLE:\s*(.+)$/m);
      if(tm){ if(i===0)$('title').value=tm[1].trim(); t=t.replace(/^TITLE:\s*.+$/m,'').trim(); }
      if(t)pages.push(t);
      sysRec.push({page:shots[i].page||0,t0:shots[i].t0||0,t1:(shots[i].t1===undefined?1:shots[i].t1),
                   w:t?sysWeight(t):0,ch:t?sysChords(t):0,whole:!!shots[i].whole,geo:geoRaw});
      /* Gemini 는 gemPace 가 요청 직전에 간격을 지키므로 여기서 또 쉬면 두 번 쉰다 */
      if(i<NN-1&&!(prov==='gemini'&&!hosted))await new Promise(r=>setTimeout(r,1100));
    }
    let text=pages.join('\n\n');
    if(!text)throw new Error('읽어낸 내용이 없습니다 — 사진을 더 밝고 반듯하게 찍어 보세요');
    S.raw=text; S.semis=0; S.verse=1; stopPlay();
    S.orig=buildOrig(sysRec);
    /* 사진에서 가져온 곡은 '원본 사진 보기'로 바로 들어간다(v49, 사용자 요청).
       인식이 얼마나 잘 됐든 반주자가 실제로 보고 연주하는 건 자기가 찍은 그 사진이다 —
       우리가 옮겨 적은 텍스트는 '지금 어디를 연주하는지'와 반주 소리를 위한 재료다.
       그래서 첫 화면은 원본 사진이고, 옮겨 적은 악보는 보기 전환으로 확인한다. */
    if(hasSheet())S.mode='sheet';
    reparse(); renderAll(); addHistory();
    clearWork();
    const bits=[];
    bits.push('코드 '+blocks.reduce((a,b)=>a+(b.k==='pairs'?b.pairs.filter(p=>p.chord).length:0),0)+'개'
      +', 가사 '+ (S.raw.match(/[가-힣]/g)||[]).length +'자'
      + (hasMelody()?', 멜로디 '+blocks.filter(b=>b.k==='mel').reduce((a,b)=>a+b.notes.filter(n=>!n.bar&&!n.rest).length,0)+'개':', 멜로디는 못 읽었습니다'));
    if(geomSys)bits.push(geomSys+'단은 오선 자리를 픽셀로 재서 음높이를 확정했습니다'
      +(geomFixed?'(AI가 잘못 본 '+geomFixed+'음 교정)':''));
    if(durSys)bits.push(durSys+'단은 음표 길이(박자)까지 재서 확정했습니다'
      +(durFixed?'(AI가 잘못 본 '+durFixed+'음 교정)':''));
    if(geomFilled)bits.push('<b>AI가 뭉쳐 읽은 음표 '+geomFilled+'개를 되찾았습니다</b>'
      +'(마디선을 기준으로 잰 값과 맞춰 넣었습니다)');
    if(rechecked)bits.push(rechecked+'단은 음높이가 이상해서 다시 읽었습니다');
    /* 무료 등급은 모델마다 하루 20회씩 따로 세므로 여러 모델을 돌려 쓴다 —
       한도 걱정이 있는 사용자가 이걸 눈으로 확인할 수 있어야 한다(v51) */
    if(GEM_USED.length>1)bits.push('무료 하루 한도를 나눠 쓰려고 모델 '+GEM_USED.length+'개를 돌려 썼습니다('+GEM_USED.join(', ')+')');
    if(SUSPECT)bits.push('확인이 필요한 음 '+SUSPECT+'개를 동그라미로 표시했습니다');
    /* 음표를 빠뜨린 마디는 **인식이 끝난 그 자리에서** 알려 준다(v61). 사용자가 나중에
       눈으로 찾아내야 했던 것을 앱이 먼저 짚어 주는 것이 요구사항이었다 —
       *"처음부터 잘 발견할수 있도록 해야한다. 누락없이!!"* */
    if(LACK)bits.push('<b style="color:var(--ribbon)">음표를 빠뜨린 것 같은 마디 '+LACK+'개</b>를 '
      +'⚠ 로 표시했습니다(가사 음절보다 음표가 적습니다) — 그 음표를 누르고 '
      +'<b>설정 → 오선보</b>에서 <b>둘로 쪼개기</b>나 <b>＋ 넣기</b>로 채워 주세요');
    if(LAST_TRUNCATED)bits.push('길이 제한으로 뒷부분이 잘렸을 수 있습니다 — 악보를 반씩 나눠 찍으면 더 잘 됩니다');
    showResult('ok','악보를 옮겼습니다',bits.join('. ')+'.<br>'
      +(hasSheet()?'<b>올린 사진을 그대로 띄웠습니다</b> — 재생하면 사진 위에서 따라갑니다.'
                 :'원본과 비교해 확인해 주세요.'),
      [{label:'옮겨 적은 악보 확인',pri:true,fn:()=>setMode(hasMelody()?'staff':'text')},
       {label:'직접 고치기',fn:()=>openPanel('input')}]);
    closePanel();
  }catch(err){
    if(err.quota&&!hosted&&prov==='gemini'){ await ocrFallback(ocrResult,say,fail,err); return; }
    fail((err.message||'변환 실패')+' — 다시 시도하거나 <b>직접 입력</b>에 옮겨 주세요.');
  }
}
/* Gemini 한도에 걸리면 사용자가 따로 누를 필요 없이 대신 채워 넣는다.
   코드·가사는 OCR(문자 인식)로, **멜로디는 오선을 픽셀로 재서**(v51) 얻는다 —
   음표를 재는 일에는 AI가 필요 없다. 그리고 왜 이 결과가 됐는지(분당 한도인지
   하루 한도인지)를 결과 화면에 정확히 밝힌다. */
async function ocrFallback(existing,say,fail,err){
  const perDay=!!(err&&err.perDay);
  const why=perDay
    ? '오늘 쓸 수 있는 <b>하루 한도</b>를 다 썼습니다(태평양 시간 자정, 한국 시간 오후 4~5시에 초기화됩니다)'
    : '무료 <b>분당 한도</b>에 계속 걸렸습니다 — <b>하루 한도가 남아 있어도 이렇게 됩니다.</b> '
      +'1~2분 뒤 다시 인식하면 대개 그대로 됩니다';
  try{
    say((perDay?'하루 한도 소진':'분당 한도에 걸림')+' — AI 없이 읽는 중…');
    let draft=(existing&&existing.sys&&existing.sys.length)?existing
             :await ocrDraft(S.photos.map(p=>p.hiUrl||p.ocrUrl||p.url),say);
    draft=await addGeomMelody(draft,say);
    const {text:txt,chordN,lyricN,melN,melSys,keepN,guessN}=draft;
    if(!txt||!txt.trim())throw new Error('AI 없이도 읽어낸 내용이 없습니다');
    S.raw=txt; S.semis=0; S.verse=1; stopPlay();
    /* 폴백이어도 원본 사진은 그대로 보여 준다 — 깨진 글자보다 원본이 훨씬 쓸모 있다.
       OCR 이 이미 단 단위로 잘라 봤으므로 그 구간을 그대로 하이라이트에 쓴다
       (예전엔 단 정보가 없다고 보고 쪽 전체를 한 덩어리로 잡았다). */
    const rec=(draft.sys||[]).filter(s=>(s.out||s.txt||'').trim())
      .map(s=>({page:s.page||0,t0:s.t0||0,t1:(s.t1===undefined?1:s.t1),
                w:sysWeight(s.out||s.txt),ch:sysChords(s.out||s.txt),whole:!!s.whole,geo:s.geo||null}));
    S.orig=buildOrig(rec.length?rec:S.photos.map((ph,pi)=>({page:pi,t0:0,t1:1,w:1,whole:true})));
    if(hasSheet())S.mode='sheet';   // 인식이 깨져도 사진은 정확하다 — 사진을 기본 화면으로
    reparse(); renderAll(); addHistory();
    clearWork();
    const melTxt=melN
      ? '<b>멜로디 '+melN+'음('+melSys+'단)은 AI 없이 오선을 픽셀로 재서 넣었습니다</b> — '
        +'음 자리와 길이는 정확한 편이지만 조표는 첫 코드로 추정했고, 마디 안 임시표(#/b)와 쉼표는 빠집니다.'
      : '오선을 찾지 못해 <b>멜로디(음표)는 넣지 못했습니다.</b>';
    showResult('warn','한도에 걸려 AI 없이 옮겼습니다',
      why+'.<br>코드·가사는 키 없이 글자만 인식한 것이라 <b>깨져 나오는 경우가 많습니다</b>'
      +'(코드 '+((keepN||0)+(guessN||0))+'개, 가사 '+lyricN+'덩어리). '+melTxt
      +(guessN?'<br><b>코드 '+guessN+'개는 멜로디를 보고 짐작했습니다</b> — 원보와 다를 수 있습니다.':'')+'<br>'
      +(perDay?'한도가 풀린 뒤':'1~2분 뒤')+' 다시 인식하시면 가사·코드까지 제대로 나옵니다.',
      [{label:(perDay?'직접 입력으로 고치기':'다시 시도'),pri:true,
        fn:()=>{ if(perDay)openPanel('input'); else {openPanel('scan');runScan();} }},
       {label:'옮겨 적은 글자 보기',fn:()=>setMode('text')}]);
    const box=$('scanstate');
    if(box){
      box.className='callout ok';
      box.innerHTML='<b>'+why+'.</b> 대신 코드·가사는 OCR(문자 인식)로, 멜로디는 오선을 재서 옮겼습니다 — '
        +'코드 '+chordN+'개, 가사 '+lyricN+'덩어리'+(melN?', 멜로디 '+melN+'음':'')
        +(S.photos.length>1?' ('+S.photos.length+'쪽)':'')+'. '
        +'코드·가사는 빠지거나 틀린 게 많으니 원본과 비교하며 <b>직접 입력</b>에서 고쳐 주세요.';
    }
    /* AI로 성공했을 때와 달리 여기서는 패널을 자동으로 닫지 않는다 — 결과 질이 떨어진 이유를
       사용자가 위 안내에서 직접 읽고 확인한 뒤 스스로 닫게 한다. */
  }catch(err2){
    fail(why+'. 그래서 AI 없이 읽어 봤지만 그것도 실패했습니다: '
      +(err2.message||'알 수 없는 오류')+' — <b>직접 입력</b>에 옮겨 주세요.');
  }
}

/* ============ 패널 ============ */
/* ★ 패널을 두 묶음으로 합쳤다 (v60). 아래 단추줄이 10개에서 5개로 줄어든 대신,
   들어간 것들은 **탭 한 줄**로 이어 놓아 오가는 데 단추 하나면 된다.
     설정  = 보기 · 재생 · 오선보 고치기 · 멜로디 진단
     더보기 = 악보 편집 · 저장된 콘티 · 내보내기
   묶음 안에서는 패널 사이를 오갈 때 **제목이 바뀌지 않는다** — 지금 어디 있는지는
   켜진 탭 하나로만 보인다(제목까지 같이 바뀌면 어디가 어디인지 헷갈린다). */
const PGROUP={view:'set',play:'set',staff:'set',diag:'set',input:'more',library:'more',export:'more'};
const GTABS={set:[['view','보기'],['play','재생'],['staff','오선보'],['diag','진단']],
             more:[['input','편집'],['library','저장'],['export','내보내기']]};
const GTITLE={set:'설정',more:'더보기'};
function openPanel(name){
  if(name==='more')name='input';
  if(name==='set')name='view';
  const s=$('sheet');
  /* ★ v60에서 '가져오기'가 한 가지 길로 줄었다 — 사진 인식뿐이다.
     사용자 판단: *"현재 인터넷으로만으로도 충분하니깐 다른 안 쓰는 기능들은 정리하자"*.
     없앤 것: 음악 파일 자동 채보(Basic Pitch·Whisper 를 CDN 에서 받아 브라우저에서 돌리던
     베타 기능)와 MusicXML 가져오기(사진→MusicXML 은 Audiveris 를 **컴퓨터에 설치해** 먼저
     돌려야 했다 — 인터넷만으로는 안 되는 유일한 길이었다).
     ★ 되살릴 일이 생기면 v59 커밋의 `audioToMono`~`parseMusicXML` 구간과
       `test/musicxml.test.js` 를 그대로 가져오면 된다(git 에 남아 있다). */
  const titles={scan:'악보 사진 가져오기',input:'악보 편집',library:'저장된 콘티',export:'내보내기',
                diag:'멜로디 진단',play:'재생 설정',view:'보기 설정',staff:'오선보 고치기',more:'더보기'};
  const grp=PGROUP[name];
  s.innerHTML='<div class="sheethead"><span class="eyebrow">'+(grp?GTITLE[grp]:titles[name])+'</span>'
    +'<button class="btn" id="close">닫기</button></div>';
  if(grp){
    const tb=document.createElement('div'); tb.className='ptabs';
    tb.innerHTML=GTABS[grp].map(t=>'<button'+(t[0]===name?' class="on"':'')+' data-tab="'+t[0]+'">'+t[1]+'</button>').join('');
    s.appendChild(tb);
    tb.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openPanel(b.dataset.tab));
  }
  const body=document.createElement('div');s.appendChild(body);
  $('close').onclick=closePanel;

  if(name==='scan'){
    const hosted=!!SCAN_ENDPOINT, showCfg=!!S.showCfg;
    /* ★ 사용자 요청(v65): *"이제 AI를 전혀 사용하지 않으니, 변환하기 버튼에 AI키
       없이가 바로가는걸로 하자! 기존 코드차트는 없어도 될듯"*. AI(코드 차트로 바꾸기)와
       키 설정은 **다들 안 쓴다** — 실제로 "AI 없이 읽기"만 쓰고 있었다고 사용자가 직접
       밝혔다. 그래서 순서를 뒤집는다: 큰 단추 하나(변환하기)가 곧바로 AI 없이 읽기로
       가고, AI 경로(키가 있어야 코드 인식이 더 정확하다)는 접어 둔 선택지로 내린다.
       지운 것은 없다 — runScan·API 키 설정은 그대로 남아 있고, 펼치면 쓸 수 있다. */
    body.innerHTML=
      (LOCAL_FILE&&!hosted
        ? '<div class="callout err">내려받은 파일로 열면 사진 인식이 막힙니다(CORS). https 주소로 여세요.</div>' : '')
      +'<div class="btns" style="margin-top:0">'
      +'<label class="btn lg on wide" for="file">사진 고르기</label>'
      +'<button class="btn lg wide" id="camopen">카메라</button>'
      +'</div>'
      +'<input type="file" id="file" class="vh" accept="image/*" multiple>'
      +'<div id="camwrap"><video id="cam" playsinline muted></video>'
      +'<div class="btns"><button class="btn on" id="shoot">촬영</button>'
      +'<button class="btn" id="camclose">취소</button></div></div>'
      +(S.photos.length
        ? '<div class="thumbs">'+S.photos.map((ph,i)=>
            '<div class="thumb"><span class="n">'+(i+1)+'</span>'
            +'<button class="x" data-del="'+i+'" aria-label="'+(i+1)+'쪽 빼기">×</button>'
            +'<img src="'+ph.url+'" alt="'+(i+1)+'쪽"></div>').join('')+'</div>'
          +'<p class="note" style="margin:4px 0 0">'+S.photos.length+'쪽 · 순서대로 이어 붙입니다 (최대 8쪽)</p>'
        : '<div class="drop" style="margin-top:14px">여러 장을 한 번에 고를 수 있습니다.<br>인쇄된 악보가 손글씨보다 훨씬 잘 읽힙니다.</div>')
      +'<div class="rowline"><span><b>멜로디까지 읽기</b><small>오선보의 음표를 함께 가져옵니다</small></span>'
      +'<button class="btn '+(P.readMel!==false?'on':'')+'" id="melread">'+(P.readMel!==false?'켬':'끔')+'</button></div>'
      +'<div class="rowline"><span><b>음높이를 직접 재기</b><small>음표 머리가 오선 몇째 줄·칸에 놓였는지 픽셀로 재서, AI 대신 음이름을 정합니다</small></span>'
      +'<button class="btn '+(P.geomPitch!==false?'on':'')+'" id="geompitch">'+(P.geomPitch!==false?'켬':'끔')+'</button></div>'
      +'<div class="rowline"><span><b>단별로 나눠 읽기</b><small>오선 줄마다 잘라 따로 인식합니다. 느리지만 정확합니다</small></span>'
      +'<button class="btn '+(P.bySystem!==false?'on':'')+'" id="bysys">'+(P.bySystem!==false?'켬':'끔')+'</button></div>'
      +'<div class="rowline"><span><b>OCR로 초안 대조</b><small>문자 인식(무료, 키 없음)으로 먼저 훑어본 걸 참고해 코드·가사를 보정합니다. 처음 쓸 때 조금 더 걸릴 수 있습니다</small></span>'

      +'<div id="scanstate"></div>'
      +(S.photos.length
        ? '<div class="btns"><button class="btn lg on wide" id="conv">변환하기'
          +(S.photos.length>1?' ('+S.photos.length+'쪽)':'')+'</button></div>'
          +'<p class="note">오선을 <b>픽셀로 직접 재서</b> 음표(음높이·박자)와 마디선을 옮깁니다 — '
          +'<b>API 키가 필요 없습니다.</b> 코드·가사는 문자 인식(무료)이라 <b>코드 기호는 자주 놓칩니다</b>'
          +'(실제 찬송가 사진 기준 46개 중 15개, 특히 F♯m7·E/G♯ 처럼 ♯이 붙은 코드). '
          +'코드가 자주 틀리면 아래 <b>AI로 더 정확하게</b>를 펼쳐 보세요.</p>'
          +'<div class="btns"><button class="btn" id="clr">전부 빼기</button></div>'
        : '')
      +'<button class="more" id="cfgtoggle">'+(showCfg?'▾':'▸')+' AI로 더 정확하게(선택)'+(getGKey()||getKey()?'':' · 키 필요')+'</button>'
      +(showCfg
        ? '<div class="opts">'
          +'<button class="btn '+(getProv()==='gemini'?'on':'')+'" data-prov="gemini">Gemini · 무료</button>'
          +'<button class="btn '+(getProv()==='claude'?'on':'')+'" data-prov="claude">Claude · 유료</button>'
          +'</div>'
