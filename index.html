  if(name==='staff'){
    /* ★ v52에서 이 패널을 뒤집었다. 사용자 지적: *"음을 수정이 안 됨! 그리고 오선지가
       너무너무 크다! 한글도 잘 안 보임! 진짜 가독성이 안 좋다."*
       원인은 고칠 수 없어서가 아니라 **고치는 단추가 화면 밖에 있어서**였다 —
       오선보를 먼저 그리고 그 아래에 ▲▼ 를 두었는데, 오선보가 폭 100% 로 늘어나
       한 줄이 160px 이 넘다 보니 단추가 늘 스크롤 아래로 밀려났다. 그래서:
         a. 고치는 단추를 **위로** 올리고 스크롤에 붙여 둔다(sticky).
         b. 오선보는 확대하지 않는다(max-width 로 1:1 이하), 높이는 잘라 스크롤한다.
         c. 음표를 눈으로 찾아 누르지 않아도 되게 **◀ ▶ 로 음을 옮겨 가며** 고친다. */
    /* 쉼표도 목록에 넣는다(v61) — 넣은 쉼표를 다시 지우거나 길이를 고칠 수 있어야 한다.
       오선보에서 쉼표는 눌러 고를 수 없으므로 ◀ ▶ 가 유일한 길이다. */
    const mels=[]; blocks.forEach((b,bi)=>{ if(b.k==='mel')b.notes.forEach((n,ni)=>{ if(!n.bar)mels.push({bi,ni}); }); });
    let sel=S.selNote||null;
    if(sel&&!mels.some(m=>m.bi===sel.bi&&m.ni===sel.ni))sel=null;
    if(!sel&&mels.length){ sel=mels[0]; S.selNote=sel; }
    const at=sel?mels.findIndex(m=>m.bi===sel.bi&&m.ni===sel.ni):-1;
    const cur=(()=>{ if(!sel)return null;
      const b=blocks[sel.bi]; if(!b||b.k!=='mel')return null;
      return b.notes[sel.ni]||null; })();
    const NM=['도','도♯','레','레♯','미','파','파♯','솔','솔♯','라','라♯','시'];
    const midiOf=n=>n&&(n.midi!==undefined?n.midi:60+mod(origKey.pc)+n.deg+(n.oct||0)*12);
    const isRest=!!(cur&&cur.rest);
    const head=cur
      ? '<div class="noteedit">'
        +'<div class="rowline" style="border:none;padding:6px 0 8px">'
        +'<span class="fontset"><button id="n-prev" '+(at<=0?'disabled':'')+'>◀</button>'
        +'<button id="n-next" '+(at<0||at>=mels.length-1?'disabled':'')+'>▶</button></span>'
        +'<span style="text-align:center;flex:1"><b style="font-size:19px;color:var(--brass)">'
        +(isRest?'쉼표':NM[mod(midiOf(cur))]+(Math.floor(midiOf(cur)/12)-1))+'</b>'
        +'<small style="display:block;color:var(--dim);font-size:11px">'
        +(at+1)+'/'+mels.length+'번째 · '+(durLabel(cur.beats)||'')+' '+(cur.beats||1)+'박</small></span>'
        +'<span class="fontset"><button id="n-dn" '+(isRest?'disabled':'')+'>▼</button>'
        +'<button id="n-play" '+(isRest?'disabled':'')+'>듣기</button>'
        +'<button id="n-up" '+(isRest?'disabled':'')+'>▲</button></span></div>'
        +(isRest?''
          :'<div class="btns"><button class="btn wide" id="n-oct-dn">한 옥타브 아래</button>'
           +'<button class="btn wide" id="n-oct-up">한 옥타브 위</button></div>')
        /* 길이 — 음을 새로 넣으려면 길이를 정할 수 있어야 한다. 악보에 실제로 쓰는 값만 돈다. */
        +'<div class="rowline" style="border:none;padding:4px 0 2px">'
        +'<span><b>음 길이</b><small>'+(durLabel(cur.beats)||'')+' · '+(cur.beats||1)+'박</small></span>'
        +'<span class="fontset"><button id="n-short">짧게</button><button id="n-long">길게</button>'
        +'<button id="n-dot">'+(noteDur(cur.beats).dots?'점 빼기':'점 붙이기')+'</button></span></div>'
        /* ★ 추가·삭제 (v61, 사용자 요청). 인식이 음표를 하나 빠뜨리면 여태 **고칠 방법이
           아예 없었다** — 높이만 바꿀 수 있었다. 사용자 말 그대로:
           *"파, 미 인데 파만 나왔다! 내가 추가하려는 추가버튼이 따로 없네?"* */
        +'<div class="btns"><button class="btn wide" id="n-ins-before">＋ 앞에 넣기</button>'
        +'<button class="btn wide" id="n-ins-after">＋ 뒤에 넣기</button></div>'
        +'<div class="btns"><button class="btn wide" id="n-split">둘로 쪼개기</button>'
        +'<button class="btn wide" id="n-ins-rest">＋ 쉼표 넣기</button></div>'
        /* ★ 마디선도 고칠 수 있어야 한다(v66, 사용자 신고: *"쉼표나 마디를 지울 수가 없음"*).
           인식이 마디선을 하나 더 만들면(실측: 4마디 `파 미` 가 4마디 `파` + 5마디 `미` 로
           갈라졌다) 여태 되돌릴 방법이 아예 없었다 — 음표만 고를 수 있었기 때문이다. */
        +'<div class="btns"><button class="btn wide" id="n-barless">앞 마디선 지우기</button>'
        +'<button class="btn wide" id="n-barmore">앞에 마디선 넣기</button></div>'
        +'<div class="btns"><button class="btn wide" id="n-del">'+(isRest?'이 쉼표 지우기':'이 음 지우기')+'</button></div></div>'
      : '<p class="note">고칠 음이 없습니다 — 이 곡에는 멜로디가 없습니다. '
        +'<b>더보기 → 편집</b>에서 <code>♪ 1:1 5:0.5</code> 처럼 직접 넣을 수 있습니다.</p>';
    /* ★★ 패널 안에 오선보를 **한 번 더 그리지 않는다**(v66, 사용자 요청).
       사용자 말 그대로: *"화면 밑에 것 수정하는 걸로 보니까 너무 작고 구별하기 어렵다.
       실제 위에 악보가 있는데 실시간으로 그걸로 고치는 걸로 하자! 빨간 네모 박스 보여주지
       말고 원본 것으로 보는 게 더 낫다."* 맞는 지적이다 — 패널 안 축소본은 화면 폭의 절반도
       못 쓰는데 위에는 이미 **크게 그려진 같은 악보**가 있고, 고칠 때마다 `renderAll()` 이
       그걸 다시 그리므로 **실시간으로 그대로 보인다**. 고른 음은 위 악보에서 강조된다. */
    body.innerHTML=
      '<p class="note"><b>위 악보에서 음표를 눌러 고르세요.</b> 고친 것은 바로 위 악보에 그대로 나타납니다. '
      +'<b>◀ ▶</b> 로 음을 옮겨 가며 <b>▲▼</b> 로 반음씩 고칩니다.</p>'
      +head;
    /* ★ 고른 음을 **창 위 빈 자리 한가운데**로 끌어올린다(v67).
       예전에는 "화면 높이의 30% 안에 있으면 그대로" 라는 어림이었는데, 폰에서는 창이
       화면의 대부분을 덮고 있어서 그 30%조차 창 뒤에 있었다. 이제 창의 **실제 윗변**을
       재서 그 위 빈 자리를 구하고, 거기에 고른 음을 놓는다 — 컴퓨터·폰 모두 같은 계산이다. */
    if(sel)setTimeout(()=>{
      const hit=document.querySelector('#chart [data-bi="'+sel.bi+'"][data-ni="'+sel.ni+'"]');
      if(!hit||!hit.getBoundingClientRect)return;
      const sh=$('sheet'), open=$('scrim').classList.contains('open');
      const panelTop=(sh&&open&&sh.getBoundingClientRect().height>0)
        ?sh.getBoundingClientRect().top:window.innerHeight;
      const r=hit.getBoundingClientRect();
      const topSafe=64, botSafe=Math.max(topSafe+40,panelTop-14);
      if(r.top>=topSafe&&r.bottom<=botSafe)return;            // 이미 보이면 그대로 둔다
      const want=topSafe+Math.max(0,(botSafe-topSafe-r.height)/2);
      window.scrollTo({top:Math.max(0,window.scrollY+r.top-want),behavior:'smooth'});
    },0);
    const shift=(d)=>{
      if(!cur||cur.rest||cur.bar)return;
      if(cur.midi===undefined){cur.midi=60+mod(origKey.pc)+cur.deg+(cur.oct||0)*12;delete cur.deg;delete cur.oct;}
      cur.midi=Math.max(24,Math.min(96,cur.midi+d));
      writeBackMelody(); renderAll();
      const ctx=AC(); if(ctx)voice(ctx,P.melInst,cur.midi+S.semis,ctx.currentTime+.01,.7,.5,0);
      openPanel('staff');
    };
    const go=(d)=>{ const j=at+d; if(j<0||j>=mels.length)return;
      S.selNote=mels[j]; renderAll(); openPanel('staff');
      const n=blocks[mels[j].bi].notes[mels[j].ni];
      const ctx=AC(); if(ctx&&n&&!n.rest)voice(ctx,P.melInst,midiOf(n)+S.semis,ctx.currentTime+.01,.5,.42,0); };
    const on=(id,fn)=>{const el=$(id); if(el)el.onclick=fn;};
    /* 길이 바꾸기 — 악보에 실제로 쓰는 값(BEAT_GRID)만 오간다.
       ★ 마디 박수가 안 맞아지면 그건 화면에 ⚠ 로 그대로 나온다. 숨기지 않는다. */
    const setBeats=v=>{ if(!cur)return;
      cur.beats=+Math.max(0.0625,Math.min(8,v)).toFixed(4);
      writeBackMelody(); renderAll(); openPanel('staff'); };
    const stepBeats=d=>{ if(!cur)return;
      const g=BEAT_GRID, b=cur.beats||1;
      let i=0; for(let k=0;k<g.length;k++)if(Math.abs(g[k]-b)<Math.abs(g[i]-b))i=k;
      setBeats(g[Math.max(0,Math.min(g.length-1,i+d))]); };
    /* 음표를 새로 넣는다. 고른 음과 같은 높이·길이로 넣는다 — 놓친 음은 대개 이웃과
       가깝고, 어차피 바로 ▲▼ 로 고칠 참이기 때문이다. 넣은 음을 바로 고르게 해 둔다. */
    const insert=(where,rest)=>{
      if(!sel)return;
      const b=blocks[sel.bi]; if(!b||b.k!=='mel')return;
      const nn=rest?{rest:true,beats:cur?(cur.beats||1):1}
                   :{midi:(cur&&!cur.rest)?midiOf(cur):(60+mod(origKey.pc)),beats:cur?(cur.beats||1):1};
      const at2=sel.ni+(where>0?1:0);
      b.notes.splice(at2,0,nn);
      S.selNote={bi:sel.bi,ni:at2};
      writeBackMelody(); renderAll(); openPanel('staff');
      if(!rest){ const ctx=AC(); if(ctx)voice(ctx,P.melInst,nn.midi+S.semis,ctx.currentTime+.01,.6,.45,0); }
      /* 아래는 넣은 음이 어디인지 바로 보이도록 — 화면이 그 줄로 스크롤된다(패널 안 오선보) */
      toast(rest?'쉼표를 넣었습니다 — 길이를 맞춰 주세요':'음표를 넣었습니다 — ▲▼ 로 높이를 맞춰 주세요');
    };
    const del=()=>{
      if(!sel)return;
      const b=blocks[sel.bi]; if(!b||b.k!=='mel')return;
      /* ★ **소리나는 음**만 센다. 쉼표·마디선까지 세면 "쉼표 하나 + 음표 하나" 인 줄에서
         마지막 음표가 지워져 멜로디 줄이 통째로 사라진다 — 그러면 고치는 화면 자체가
         비어서 되돌릴 방법이 없다(회귀 테스트가 이걸 잡았다). */
      if(!cur.rest&&b.notes.filter(n=>!n.bar&&!n.rest).length<=1){
        toast('이 줄의 마지막 음표는 지울 수 없습니다.'); return; }
      b.notes.splice(sel.ni,1);
      /* 지운 자리 앞 음을 고른다 — 비어 있으면 뒤 */
      let j=sel.ni-1; while(j>=0&&(b.notes[j].bar))j--;
      if(j<0){ j=sel.ni; while(j<b.notes.length&&b.notes[j].bar)j++; }
      S.selNote=(j>=0&&j<b.notes.length)?{bi:sel.bi,ni:j}:null;
      writeBackMelody(); renderAll(); openPanel('staff');
      toast('음표를 지웠습니다.');
    };
    on('n-up',()=>shift(1)); on('n-dn',()=>shift(-1));
    on('n-oct-up',()=>shift(12)); on('n-oct-dn',()=>shift(-12));
    on('n-prev',()=>go(-1)); on('n-next',()=>go(1));
    on('n-short',()=>stepBeats(-1)); on('n-long',()=>stepBeats(1));
    on('n-dot',()=>{ const d=noteDur(cur&&cur.beats); setBeats(d.dots?d.v:d.v*1.5); });
    /* ★ 쪼개기 — 놓친 음표를 되찾는 **가장 빠른 길**이다 (v61).
       인식이 두 음을 한 음으로 뭉쳐 읽는 것이 가장 흔한 누락 모양이다(온음표 하나로 읽으면
       박수 합이 맞아 버려서 다른 검사에 걸리지 않는다). 사용자가 신고한 것도 이 모양이었다 —
       *"예수 내 구주. 파, 미 인데 파만 나왔다!"*
       쪼개면 박수 합이 그대로라 마디가 어긋나지 않고, 뒤 음의 높이만 ▲▼ 로 고치면 끝난다. */
    const split=()=>{
      if(!sel||!cur)return;
      const b=blocks[sel.bi]; if(!b||b.k!=='mel')return;
      const half=+((cur.beats||1)/2).toFixed(4);
      if(half<0.0625){ toast('더 쪼갤 수 없습니다.'); return; }
      cur.beats=half;
      b.notes.splice(sel.ni+1,0,cur.rest?{rest:true,beats:half}:{midi:midiOf(cur),beats:half});
      S.selNote={bi:sel.bi,ni:sel.ni+1};
      writeBackMelody(); renderAll(); openPanel('staff');
      toast('둘로 쪼갰습니다 — 뒤 음의 높이를 ▲▼ 로 맞춰 주세요');
    };
    on('n-split',split);
    /* ★ 마디선 지우기 = **앞 마디와 합치기**. 인식이 마디선을 하나 더 만들면 마디가
       둘로 갈라지고 그 뒤 코드·가사가 통째로 밀린다(실측: 「무덤에 머물러」 4마디
       `파 미` 가 4마디 `파` + 5마디 `미` 로 갈라져 없던 5마디가 생겼다). */
    on('n-barless',()=>{
      if(!sel)return; const b=blocks[sel.bi]; if(!b||b.k!=='mel')return;
      let j=sel.ni-1; while(j>=0&&!b.notes[j].bar)j--;
      if(j<0){ toast('이 음 앞에는 마디선이 없습니다.'); return; }
      b.notes.splice(j,1); S.selNote={bi:sel.bi,ni:Math.max(0,sel.ni-1)};
      writeBackMelody(); renderAll(); openPanel('staff');
      toast('마디선을 지웠습니다 — 앞 마디와 합쳤습니다.');
    });
    on('n-barmore',()=>{
      if(!sel)return; const b=blocks[sel.bi]; if(!b||b.k!=='mel')return;
      if(sel.ni>0&&b.notes[sel.ni-1].bar){ toast('이미 마디선이 있습니다.'); return; }
      b.notes.splice(sel.ni,0,{bar:true}); S.selNote={bi:sel.bi,ni:sel.ni+1};
      writeBackMelody(); renderAll(); openPanel('staff');
      toast('마디선을 넣었습니다 — 이 음부터 새 마디입니다.');
    });
    on('n-ins-before',()=>insert(-1,false)); on('n-ins-after',()=>insert(1,false));
    on('n-ins-rest',()=>insert(1,true));
    on('n-del',del);
    on('n-play',()=>{const ctx=AC(); if(ctx&&cur&&!cur.rest)voice(ctx,P.melInst,midiOf(cur)+S.semis,ctx.currentTime+.01,.8,.5,0);});
  }

  if(name==='view'){
    const T=(id,on,label,sub)=>'<div class="rowline"><span><b>'+label+'</b>'
      +(sub?'<small>'+sub+'</small>':'')+'</span>'
      +'<button class="btn '+(on?'on':'')+'" id="'+id+'">'+(on?'켬':'끔')+'</button></div>';
    body.innerHTML=
      '<div class="rowline"><span><b>글자 크기</b><small>보면대 거리에 맞춰 조절하세요</small></span>'
      +'<span class="fontset"><button id="v-minus">가−</button><span id="v-size">'+S.font+'</span>'
      +'<button id="v-plus">가＋</button></span></div>'
      +(hasMelody()
        ? '<div class="rowline"><span><b>오선보 크기</b><small>화면 폭 대비 비율(기본 70%)</small></span>'
          +'<span class="fontset"><button id="v-staffminus">−</button><span id="v-staffsize">'+Math.round(S.staffScale*100)+'%</span>'
          +'<button id="v-staffplus">＋</button></span></div>'
        : '')
      +T('v-piano',P.piano!==false,'건반 표시','재생 중 누르는 음을 화면 아래 건반에 표시')
      +T('v-num',S.num,'넘버 시스템','코드를 1·4·5 숫자로 표시')
      +T('v-capo',S.capo,'카포','기타용 잡는 자리 계산')
      +T('v-flat',S.flat==='flat','♭ 우선','올림표 대신 내림표로 표기')
      +T('v-col',S.col,'2단 보기','가로가 넓을 때 두 줄로')
      +T('v-focus',document.body.classList.contains('focus'),'집중 모드',
          '머리글과 아래 단추줄을 감춰 악보만 크게 — 연주할 때 쓰세요(화면도 안 꺼집니다)');
    const up=()=>{renderAll();openPanel('view')};
    const on=(id,fn)=>{const el=$(id); if(el)el.onclick=fn;};
    on('v-minus',()=>{setFont(S.font-2);openPanel('view')});
    on('v-plus',()=>{setFont(S.font+2);openPanel('view')});
    on('v-staffminus',()=>{setStaffScale(S.staffScale-.1);openPanel('view')});
    on('v-staffplus',()=>{setStaffScale(S.staffScale+.1);openPanel('view')});
    on('v-piano',()=>{P.piano=(P.piano===false); syncPiano(P.playing); openPanel('view'); scheduleSave();});
    on('v-num',()=>{S.num=!S.num;up()});
    on('v-capo',()=>{if(!capoInfo()){toast('이 키에는 쓸 만한 카포 자리가 없습니다.');return;}S.capo=!S.capo;up()});
    on('v-flat',()=>{S.flat=S.flat==='flat'?null:'flat';up()});
    on('v-col',()=>{S.col=!S.col;up()});
    on('v-focus',()=>{ const on2=!document.body.classList.contains('focus');
      setFocus(on2); if(on2)closePanel(); else openPanel('view'); });
  }

  if(name==='diag'){
    const L=S.raw.replace(/\r\n?/g,'\n').split('\n');
    const rows=[]; let mel=null;
    for(const line of L){
      if(MEL_RE.test(line)){ mel=parseMelody(line); continue; }
      if(isSection(line)||!line.trim())continue;
      const bl=parseChart(line)[0];
      if(!bl||bl.k!=='pairs')continue;
      const nCh=bl.pairs.filter(p=>p.chord).length;
      if(!nCh){ continue; }
      let sums=[];
      /* parseMelody 는 음표 배열을 그대로 돌려준다 — 예전엔 여기서 mel.notes 로 읽어
         ♪ 줄이 있는 차트에서는 진단 화면 자체가 터졌다(정작 그걸 진단하려고 만든 화면). */
      if(mel){ sums=[0]; for(const n of mel){ if(n.bar)sums.push(0); else sums[sums.length-1]+=n.beats; }
        sums=sums.map(x=>Math.round(x*100)/100); }
      rows.push({ch:nCh,bar:bl.pairs.filter(p=>p.bar).length,
        mel:mel?mel.filter(n=>!n.bar).length:0,
        melBar:mel?mel.filter(n=>n.bar).length:0,sums});
      mel=null;
    }
    const tl=buildTimeline();
    body.innerHTML='<p class="note">멜로디가 코드와 안 맞을 때 원인을 찾는 화면입니다. 복사해서 보내 주시면 정확히 고칠 수 있습니다.</p>'
      +'<div id="dbox" style="font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--paper);'
      +'background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto">'
      +'박자 '+P.beats+' · 총 '+tl.total+'박 · 멜로디 '+tl.melNotes+'음 · 어긋난 마디 '+tl.drift+'<br>'
      +'멜로디 줄에 마디선: '+(/[♪♫][^\n]*\|/.test(S.raw)?'있음':'<b style="color:var(--ribbon)">없음</b>')+'<br><br>'
      +(rows.length?rows.map((r,i)=>'단'+(i+1)+' 코드'+r.ch+' 마디'+r.bar
        +' / 멜로디 '+r.mel+'음 마디'+r.melBar
        +(r.sums.length?' 박합['+r.sums.join(',')+']':' <b style="color:var(--ribbon)">멜로디 없음</b>')).join('<br>')
        :'<b style="color:var(--ribbon)">읽어낸 단이 없습니다</b>')
      +'</div>'
      +(tl.melNotes?'<p class="note" style="margin-top:14px"><b>읽어온 멜로디 계이름</b><br>'
        +'악보와 눈으로 대조해 보세요. 틀린 음은 <b>편집</b>에서 고칠 수 있습니다.</p>'
        +'<div style="font-family:var(--mono);font-size:13px;line-height:2;color:var(--brass);'
        +'background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:38vh;overflow:auto">'
        +(function(){
            const NM=['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'];
            const out=[];let bar=[],n=0;
            for(const e of tl.evs){ if(e.type!=='m')continue;
              bar.push(NM[mod(e.midi)]+(Math.floor(e.midi/12)-1));
              if(++n%8===0){out.push(bar.join(' '));bar=[];}
            }
            if(bar.length)out.push(bar.join(' '));
            return out.join('<br>')||'—';
          })()
        +'</div>':'')
      /* ★ 쌓인 분석을 **보여 준다**(v68, 사용자 요청: *"데이터 분석하는 걸 점점 쌓아라"*).
         숫자가 보이지 않으면 쌓이는지 알 수 없고, 쌓이는지 모르면 믿을 수도 없다. */
      +(function(){
          const o=learnLoad(), L=learnC0();
          const sp=SPACE.c0?SPACE.c0.toFixed(2):'—';
          return '<p class="note" style="margin-top:14px"><b>여태 배운 것</b> — 악보를 읽을 때마다 쌓입니다(사진은 저장하지 않습니다).</p>'
            +'<div style="font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--paper);'
            +'background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px">'
            +'읽은 악보 '+o.pages.length+'장<br>'
            +'이번 악보 음표 간격 상수 c0 '+sp+'칸 ('+SPACE.src+(SPACE.n?', 표본 '+SPACE.n+'개':'')+')<br>'
            +'간격이 길이를 알려 주는가 r='+(SPACE.r===null||SPACE.r===undefined?'—':SPACE.r)
            +(SPACE.r===null||SPACE.r===undefined?'':' ('+(SPACE.useGap===false?'낮음 — 음절마다 폭이 고른 악보':'뚜렷함')+')')+'<br>'
            +'여태 배운 평균 c0 '+(L?L.c0+'칸 (마디 간격 '+L.mn+'개에서)':'— (아직 모자람)')
            +'</div>';
        })()
      +'<div class="btns"><button class="btn" id="dcopy">이 내용 복사</button>'
      +'<button class="btn" id="dforget">배운 것 지우기</button></div>';
    $('dforget').onclick=()=>{ try{localStorage.removeItem(LEARN_KEY);}catch(e){} toast('배운 것을 지웠습니다.'); openPanel('diag'); };
    $('dcopy').onclick=async()=>{
      try{await navigator.clipboard.writeText($('dbox').innerText+'\n\n--- 원문 ---\n'+S.raw.slice(0,3000));toast('복사했어요');}
      catch(e){toast('복사가 막혀 있어요');}
    };
  }

  if(name==='play'){
    const opt=(id,cur,items)=>items.map(([v,l])=>
      '<button class="btn '+(v===cur?'on':'')+'" data-'+id+'="'+v+'">'+l+'</button>').join('');
    /* 멜로디·반주 소리 크기 슬라이더 — BPM 슬라이더와 같은 모양(range + 숫자) */
    const volRow=(id,label,v)=>'<span class="lbl">'+label+'</span>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<input class="field" id="'+id+'" type="range" min="0.4" max="2" step="0.05" value="'+v+'" style="flex:1">'
      +'<span id="'+id+'num" style="font-family:var(--mono);font-size:15px;font-weight:800;color:var(--brass);min-width:44px;text-align:right">'+Math.round(v*100)+'%</span>'
      +'</div>';
    body.innerHTML=
      '<span class="lbl">악기</span><div class="opts" id="insts">'
      +Object.keys(INSTRUMENTS).map(k=>
        '<button class="btn '+(instList().indexOf(k)>=0?'on':'')+'" data-inst="'+k+'">'+INSTRUMENTS[k].label+'</button>').join('')
      +'</div><p class="note" style="margin:-6px 0 14px">여러 개를 골라 함께 울릴 수 있습니다. 현악+플루트, 피아노+첼로처럼 겹쳐 보세요.<br>'
      +(instList().length
        ? '<b>다시 누르면 꺼집니다</b> — 전부 끄면 반주 없이 멜로디만 울립니다.'
        : '<b style="color:var(--ribbon)">악기를 하나도 안 골랐습니다 — 반주는 쉽니다.</b> '
          +(hasMelody()&&P.melody!==false?'멜로디만 울립니다.':'멜로디도 꺼져 있어 <b>아무 소리도 나지 않습니다.</b>'))
      +'</p>'
      +'<div class="rowline"><span><b>실제 악기음</b><small>합성음 대신 실제 녹음된 악기 소리를 씁니다. 온라인일 때만 되고, 처음 나오는 음은 받는 동안만 합성음으로 대신합니다</small></span>'
      +'<button class="btn '+(P.realInst!==false?'on':'')+'" id="realinst">'+(P.realInst!==false?'켬':'끔')+'</button></div>'
      +(hasMelody()
        ? '<span class="lbl">멜로디</span><div class="opts">'
          +'<button class="btn '+(P.melody?'on':'')+'" id="mel">'+(P.melody?'켬':'끔')+'</button>'
          +opt('minst',P.melInst,Object.keys(INSTRUMENTS).filter(k=>k!=='bass').map(k=>[k,INSTRUMENTS[k].label]))
          +'</div>'
          +'<span class="lbl">멜로디 높이</span><div class="opts">'
          +opt('moct',P.melOct||0,[[-1,'한 옥타브 아래'],[0,'그대로'],[1,'한 옥타브 위']])+'</div>'
          +'<span class="lbl">마디 맞춤</span><div class="opts">'
          +'<button class="btn '+(P.melFit!==false?'on':'')+'" id="melfit">'
          +(P.melFit!==false?'켬 · 마디에 강제로 맞춤':'끔 · 읽은 음가 그대로')+'</button></div>'
        : '')
      +(hasBassMelody()
        ? '<div class="rowline"><span><b>낮은음자리표도 재생</b><small>오선보에 낮은음자리(베이스 보표)가 따로 있으면 그 음도 함께 울립니다. 반주 악기의 베이스음과 겹쳐 들릴 수 있어요</small></span>'
          +'<button class="btn '+(P.playBass?'on':'')+'" id="playbass">'+(P.playBass?'켬':'끔')+'</button></div>'
        : '')
      /* 지금 켜진 칸은 **실제로 울리는 것**을 기준으로 표시한다(v63) — 악기를 다 끄면
         '반주 켬'이라고 적혀 있어도 반주는 안 울리므로, 그때는 '멜로디만'이 켜져 보여야 한다 */
      +'<span class="lbl">소리 구성</span><div class="opts">'
      +'<button class="btn '+(accompOn()&&melodyOn()?'on':'')+'" data-mix="all">전체</button>'
      +'<button class="btn '+(!accompOn()&&melodyOn()?'on':'')+'" data-mix="mel">멜로디만</button>'
      +'<button class="btn '+(accompOn()&&!melodyOn()?'on':'')+'" data-mix="acc">반주만</button>'
      +'</div>'
      +(!accompOn()&&!melodyOn()
        ? '<p class="note" style="margin:-6px 0 14px"><b style="color:var(--ribbon)">지금은 아무 소리도 나지 않습니다.</b> 재생하면 화면 표시(마디·가사)만 따라갑니다.</p>'
        : '')
      /* ★ 멜로디·반주 소리 크기를 따로 조절한다(v65, 사용자 요청).
         *"멜로디와 반주음악 경우 멜로디가 반주에 묻힌다. 그래서 멜로디나 반주음악도
         소리 크기를 조절할 수 있도록 하자!"* — 악기를 여럿 겹치면 반주가 두꺼워져
         멜로디 한 줄이 상대적으로 묻힌다. */
      +volRow('melvol','멜로디 크기',P.melVol)
      +volRow('accvol','반주 크기',P.accVol)
      +'<span class="lbl">장르</span><div class="opts">'
      +opt('genre',P.genre,Object.keys(GENRES).map(k=>[k,GENRES[k].label]))+'</div>'
      +'<span class="lbl">반주 패턴</span><div class="opts">'
      +opt('pat',P.pattern,Object.keys(PATTERNS).map(k=>[k,PATTERNS[k].label]))+'</div>'
      +'<span class="lbl">마디당 박</span><div class="opts" id="beats">'
      +opt('beats',P.beats,[[2,'2박'],[3,'3박'],[4,'4박'],[6,'6박']])+'</div>'
      +'<span class="lbl">빠르기 (BPM)</span>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<input class="field" id="bpmr" type="range" min="30" max="300" step="1" value="'+P.bpm+'" style="flex:1">'
      +'<span id="bpmnum" style="font-family:var(--mono);font-size:17px;font-weight:800;color:var(--brass);min-width:52px;text-align:right">'+P.bpm+'</span>'
      +'</div>'
      +'<div class="opts" style="margin-top:10px">'
      +'<button class="btn '+(P.click?'on':'')+'" id="clk">메트로놈</button>'
      +'<button class="btn '+(P.loop?'on':'')+'" id="lp">반복</button></div>'
      +'<p class="note" style="margin-top:14px">'
      +(hasMelody()
        ? (()=>{const tl=buildTimeline();
            return '이 곡에는 <b>멜로디 '+tl.melNotes+'음</b>이 들어 있습니다. 각 단의 첫 코드에 맞춰 재생됩니다. '
              +(tl.bassNotes?'낮은음자리표 '+tl.bassNotes+'음도 함께 읽었습니다(위 <b>낮은음자리표도 재생</b>을 켜야 들립니다). ':'')
              +(tl.drift?'<b style="color:var(--ribbon)">다만 '+tl.drift+'개 단에서 멜로디 길이가 마디와 맞지 않습니다. 그 부분은 어긋나게 들립니다.</b> ':'')
              +'오선보에서 읽어온 것이라 틀릴 수 있으니 원본과 비교해 확인하세요. ';})()
        : '이 차트에는 멜로디가 없습니다. 오선보 사진을 넣으면 멜로디까지 읽어옵니다. ')
      +'코드 하나를 한 마디로 잡되 차트에 <code>|</code>가 있으면 그 마디 안에서 나눕니다. '
      +'반주 패턴은 코드 구성음을 어떻게 쪼개 칠지를 정합니다.<br>'
      +'<b>연주 중에 코드를 누르면 그 자리부터</b> 다시 칩니다. 진행 바를 눌러도 됩니다.<br><br>'
      +'절이 여러 개면 <b>1절을 끝까지 친 뒤 2절로 넘어갑니다.</b> 화면 가사도 따라 바뀝니다. '
      +'<b>반복</b>을 끄면 마지막 절에서 멈추고, 켜면 처음으로 돌아갑니다.</p>';
    body.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.inst, cur=instList().slice(), at=cur.indexOf(k);
      /* ★ 마지막 하나도 끌 수 있다(v63) — 끄기 전에 무엇이었는지 기억해 두었다가,
         나중에 '반주만/전체'를 고를 때 되돌려 준다(빈 채로 반주를 켜면 아무 일도 안 일어난다). */
      if(at>=0){ cur.splice(at,1); if(!cur.length)P.lastInsts=[k]; } else cur.push(k);
      P.genre=''; P.insts=cur; renderToolbar();
      resyncPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-mix]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.mix;
      P.accomp=(m!=='mel'); P.melody=(m!=='acc');
      /* 반주를 켜라고 했는데 악기가 하나도 없으면 마지막에 쓰던 악기를 되살린다 —
         누른 단추가 아무 일도 안 하는 것처럼 보이면 안 된다 */
      if(P.accomp&&!instList().length)P.insts=(P.lastInsts&&P.lastInsts.length?P.lastInsts:['piano']).slice();
      renderToolbar(); resyncPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{
      applyGenre(b.dataset.genre); openPanel('play');
    });
    if($('mel'))$('mel').onclick=()=>{P.melody=!P.melody;renderToolbar();resyncPlay();openPanel('play')};
    body.querySelectorAll('[data-minst]').forEach(b=>b.onclick=()=>{
      P.melInst=b.dataset.minst; resyncPlay(); openPanel('play');
    });
    if($('melfit'))$('melfit').onclick=()=>{P.melFit=P.melFit===false;resyncPlay();openPanel('play')};
    if($('playbass'))$('playbass').onclick=()=>{P.playBass=!P.playBass;resyncPlay();openPanel('play')};
    if($('realinst'))$('realinst').onclick=()=>{P.realInst=P.realInst===false;openPanel('play')};
    body.querySelectorAll('[data-moct]').forEach(b=>b.onclick=()=>{
      P.melOct=parseInt(b.dataset.moct,10)||0; resyncPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{
      P.genre='';P.pattern=b.dataset.pat; openPanel('play');
    });
    body.querySelectorAll('[data-beats]').forEach(b=>b.onclick=()=>{
      P.beats=parseInt(b.dataset.beats,10); resyncPlay(); openPanel('play');
    });
    $('bpmr').oninput=e=>{const v=parseInt(e.target.value,10);setBpm(v,true);if($('bpmnum'))$('bpmnum').textContent=v;};
    $('melvol').oninput=e=>{P.melVol=parseFloat(e.target.value);if($('melvolnum'))$('melvolnum').textContent=Math.round(P.melVol*100)+'%';scheduleSave();};
    $('accvol').oninput=e=>{P.accVol=parseFloat(e.target.value);if($('accvolnum'))$('accvolnum').textContent=Math.round(P.accVol*100)+'%';scheduleSave();};
    $('clk').onclick=()=>{P.click=!P.click;openPanel('play')};
    $('lp').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop);openPanel('play')};
  }

  if(name==='export'){
    body.innerHTML='<p class="note">지금 보이는 키 그대로 내보냅니다. PDF는 A4 세로, 넘치면 자동으로 여러 장이 됩니다.</p>'
      +'<div class="btns"><button class="btn lg on wide" id="pdf">PDF 내려받기</button>'
      +'<button class="btn lg wide" id="png">이미지 PNG</button>'
      +'<button class="btn" id="prt">인쇄</button>'
      +'<button class="btn" id="txt">TXT</button>'
      +'<button class="btn" id="cho">ChordPro</button>'
      +'<button class="btn" id="cpy">복사</button></div>'
      +'<p class="note" style="margin-top:14px">파일 이름: <code>'+esc(baseName())+'</code><br>'
      +'다운로드가 막히면 <b>복사</b>나 <b>인쇄</b>를 쓰세요.</p>';
    $('pdf').onclick=()=>{try{saveBlob(new Blob([pdfBytes(chartCanvas())],{type:'application/pdf'}),baseName()+'.pdf');toast('PDF 내려받기 시작')}catch(e){toast('PDF 생성 실패')}};
    $('png').onclick=()=>{try{chartCanvas().toBlob(b=>{saveBlob(b,baseName()+'.png');toast('PNG 내려받기 시작')},'image/png')}catch(e){toast('이미지 생성 실패')}};
    $('prt').onclick=()=>{closePanel();setTimeout(()=>window.print(),150)};
    $('txt').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.txt');toast('TXT 내려받기 시작')};
    $('cho').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.cho');toast('ChordPro 내려받기 시작')};
    $('cpy').onclick=async()=>{try{await navigator.clipboard.writeText(chartText());toast('클립보드에 복사했어요')}catch(e){toast('복사가 막혀 있어요. 내려받기를 써 주세요.')}};
  }

  $('scrim').classList.add('open');
  /* 오선보 고치기일 때만 '가리지 않는 창' 으로 연다(v67) */
  const edit=(name==='staff');
  $('scrim').classList.toggle('edit',edit);
  document.body.classList.toggle('editing',edit);
}
function closePanel(){closeCam();$('scrim').classList.remove('open');
  $('scrim').classList.remove('edit');document.body.classList.remove('editing');}
$('scrim').onclick=e=>{if(e.target===$('scrim'))closePanel()};

/* ============ 배선 ============ */
document.querySelectorAll('nav [data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$('up').onclick=()=>{S.semis=Math.min(12,S.semis+1);renderAll()};
$('down').onclick=()=>{S.semis=Math.max(-12,S.semis-1);renderAll()};
$('b-verse').onclick=()=>{const mv=maxVerse(); if(mv<2)return; S.verse=S.verse>=mv?1:S.verse+1; renderAll();};



function setFont(v){S.font=Math.max(12,Math.min(44,v));renderAll();}
function setStaffScale(v){S.staffScale=Math.max(.5,Math.min(2,Math.round(v*10)/10));renderAll();scheduleSave();}


/* ★ 저장할 때 **어떤 이름으로 저장할지 물어본다**(v66, 사용자 요청).
   예전에는 제목 칸 값으로 조용히 저장해서, 제목을 안 고쳤으면 '제목 없음'이 쌓였다.
   물어본 이름은 제목 칸에도 그대로 넣는다 — 화면과 목록이 따로 놀면 안 된다. */
function saveSong(ask){
  if(ask){
    const want=window.prompt('어떤 이름으로 저장할까요?',$('title').value.trim()||'제목 없음');
    if(want===null)return;                       // 취소
    if(want.trim()){ $('title').value=want.trim(); scheduleSave(); }
  }
  const t=$('title').value.trim()||'제목 없음';
  const list=load().filter(s=>s.title!==t);
  const st=new Date();
  const id='s'+Date.now();
  list.unshift({id,title:t,raw:S.raw,semis:S.semis,beats:P.beats,bpm:P.bpm,photo:!!(S.orig&&S.orig.pages),
    at:st.toISOString().slice(0,10)+' '+st.toTimeString().slice(0,5)});
  const kept=list.slice(0,40);
  const okList=save(kept);
  pruneOrig(kept);
  const okPic=saveOrig(id,S.orig);
  toast(!okList?'저장에 실패했어요.'
    :(S.orig&&!okPic)?'“'+t+'” 저장 — 다만 저장 공간이 모자라 사진은 못 넣었습니다'
    :'콘티에 “'+t+'” 저장했습니다');
}
$('theme').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('theme').textContent=d?'어둡게':'밝게';
};
$('play').onclick=togglePlay;
$('track').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width)));
  seekTo(ratio*songSeconds());
};
$('instbtn').onclick=()=>openPanel('play');
$('loopbtn').classList.toggle('on',P.loop);
$('loopbtn').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop)};
function setBpm(v,skipSlider){
  v=Math.round(Number(v));
  if(!isFinite(v))v=P.bpm;
  P.bpm=Math.max(30,Math.min(300,v));
  $('bpm').value=P.bpm;
  if(!skipSlider&&$('bpmr'))$('bpmr').value=P.bpm;
}
$('bpmd').onclick=()=>setBpm(P.bpm-4);
$('bpmu').onclick=()=>setBpm(P.bpm+4);
$('bpm').onfocus=e=>e.target.select();
$('bpm').oninput=e=>{
  const v=parseInt(e.target.value,10);
  if(v>=30&&v<=300){P.bpm=v;if($('bpmr'))$('bpmr').value=v;}
};
$('bpm').onchange=e=>setBpm(e.target.value);
setInterval(()=>{if(!P.playing)renderTime(0)},1500);
$('bpm').onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();setBpm(e.target.value);e.target.blur();}
  if(e.key==='ArrowUp'){e.preventDefault();setBpm(P.bpm+1);}
  if(e.key==='ArrowDown'){e.preventDefault();setBpm(P.bpm-1);}
};
$('bpm').value=P.bpm;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
});
/* 집중 모드: 헤더와 도구막대를 감춰 악보만 크게 */
function setFocus(on){
  document.body.classList.toggle('focus',on);
  measureFoot();                       // 집중 모드는 아래 단추줄이 사라져 막대 높이가 바뀐다
  if(P.playing)renderPiano();
  if(on)wakeOn(); else wakeOff();
}
document.querySelectorAll('.seg [data-view]').forEach(b=>b.onclick=()=>setMode(b.dataset.view));
$('focusout').onclick=()=>setFocus(false);

/* 연주 중 화면이 꺼지지 않게 */
let wl=null;
async function wakeOn(){
  try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null}); } }catch(e){}
}
function wakeOff(){ if(wl&&!P.playing&&!document.body.classList.contains('focus')){try{wl.release()}catch(e){} wl=null;} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&(P.playing||document.body.classList.contains('focus')))wakeOn();
});
if($("ver"))$("ver").textContent=APP_VER;
if(restoreLast())reparse();
let rsT=null;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{
  if(S.mode!=='text')renderChart();
  if(P.playing){renderPiano();paintPiano(actx?actx.currentTime:0);}   // 건반 비율은 창 폭에서 나온다
  measureFoot();
},250);});
renderAll(); measureFoot();
</script>
</body>
</html>
