<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A23">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>콘티 — 코드 차트 이조기</title>
<style>
:root{
  --ink:#10161E; --raise:#1B242F; --line:#2B3744; --paper:#F2EEE6;
  --dim:#8D9AA8; --brass:#F0B95E; --ribbon:#A32E3E; --mint:#7FC8A9;
  --ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,'D2Coding',monospace;
}
html[data-theme="light"]{
  color-scheme:light;
  --ink:#FBFAF7; --raise:#FFFFFF; --line:#DFD9CC; --paper:#1A1F26;
  --dim:#6B7683; --brass:#9A6B15; --ribbon:#A32E3E; --mint:#2F7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);display:flex;flex-direction:column;min-height:100%}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.scroll::-webkit-scrollbar{width:0;height:0}

header{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid var(--line);padding:10px 14px 12px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
#title{background:none;border:none;color:var(--paper);font-size:17px;font-weight:700;flex:1;min-width:0;outline:none;padding:0}
.btn{background:none;color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 9px;font-size:11px}
.btn.step{padding:6px 12px;font-size:16px;line-height:1}

#rail{flex:1;display:flex;gap:2px;overflow-x:auto;padding:2px 0 6px}
.key{flex:1 0 auto;min-width:38px;padding:7px 4px 6px;border:none;border-bottom:2px solid transparent;background:none;color:var(--dim);font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;transition:background .15s,color .15s}
.key.orig{border-bottom-color:var(--ribbon)}
.key.on{background:var(--brass);color:var(--ink);font-weight:700}
#meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
#meta b{font-size:13px}

main{flex:1;padding:16px 8px 182px;font-family:var(--mono);line-height:1.5}
.section{break-inside:avoid;margin:32px 0 14px 9px;display:inline-block;padding:4px 12px;border-radius:999px;
  background:var(--ribbon);color:#fff;font-family:var(--ui);font-size:12px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase}
.section:first-child{margin-top:0}
.lineblk{break-inside:avoid;margin:0 0 6px;padding:6px 9px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;
  border-radius:9px;transition:background .18s}
.lineblk.cur{background:rgba(240,185,94,.10)}
.lineblk+.lineblk{margin-top:6px}
.pair{display:inline-block;vertical-align:bottom}
.ch{display:block;color:var(--brass);font-weight:800;letter-spacing:.01em;padding-right:9px;white-space:pre;line-height:1.3;cursor:pointer;transition:transform .12s}
.ch.plain{cursor:default}
.ly{display:block;white-space:pre-wrap}
.staffline{overflow-x:auto;margin:0 0 14px;padding:2px 0 0}
.staffline::-webkit-scrollbar{height:0}
.meas{display:inline-flex;align-items:flex-end;border-left:2px solid var(--line);
  padding:0 0 0 10px;margin:0 10px 10px 0;border-radius:2px}
.meas:first-child{border-left-color:var(--brass);opacity:1}
.lineblk.cur .meas{border-left-color:var(--brass)}
.capo{break-inside:avoid;margin-bottom:14px;padding:8px 12px;border:1px dashed var(--mint);border-radius:8px;font-size:12px;font-family:var(--ui);color:var(--mint)}

nav{border-top:1px solid var(--line);padding:9px 10px 10px;display:flex;gap:7px;
  flex-wrap:wrap;justify-content:center}
nav .btn{flex:1 1 auto;min-width:82px;text-align:center;padding:11px 10px}

#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#scrim.open{display:flex}
#sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--raise);border-top:2px solid var(--brass);border-radius:14px 14px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.note{font-size:12.5px;color:var(--dim);line-height:1.7;margin:0 0 12px}
.field{background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;width:100%;outline:none}
textarea.field{font-family:var(--mono);min-height:220px;line-height:1.5;resize:vertical}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.btn.lg{padding:15px 20px;font-size:15px;font-weight:800;border-radius:14px}
.btn.wide{flex:1;text-align:center}
label.btn.wide{justify-content:center}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rowline b{font-size:14px;font-weight:700}
.rowline small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-weight:400}
.more{background:none;border:none;color:var(--brass);font-size:13px;font-weight:700;padding:14px 0 4px;cursor:pointer;font-family:var(--ui)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.keys button{background:var(--ink);border:1px solid var(--line);color:var(--brass);border-radius:9px;
  padding:10px 13px;font-family:var(--mono);font-size:14px;font-weight:700;cursor:pointer}
.callout{padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.callout.err{border:1px solid var(--ribbon);color:var(--ribbon)}
.callout.ok{border:1px dashed var(--mint);color:var(--mint)}
.callout.work{color:var(--brass);display:flex;align-items:center;gap:9px}
.spin{width:13px;height:13px;border:2px solid var(--brass);border-top-color:transparent;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#preview{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.drop{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.7}
.modecards{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.modecard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;font-family:var(--ui)}
.modecard:active{border-color:var(--brass)}
.modecard .ico{font-size:26px;flex:0 0 auto;width:44px;text-align:center}
.modecard>span{display:block;min-width:0}
.modecard .tt{display:block;font-size:15px;font-weight:800;color:var(--paper)}
.modecard .ds{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5;font-weight:400}
.modecard .badge{margin-left:6px;font-size:10px;font-weight:700;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:1px 7px;vertical-align:middle}
.backlink{background:none;border:none;color:var(--dim);font-size:12.5px;font-weight:700;padding:0 0 14px;cursor:pointer;font-family:var(--ui)}
.rowlist{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowlist button.load{flex:1;text-align:left;background:none;border:none;color:var(--paper);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.rowlist small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}

footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raise);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#progwrap{padding:0 12px;display:flex;align-items:center;gap:9px}
#track{flex:1;height:16px;display:flex;align-items:center;cursor:pointer;position:relative}
#track::before{content:'';position:absolute;left:0;right:0;height:5px;background:var(--line);border-radius:3px}
#bar-fill{position:relative;height:5px;width:0;background:var(--brass);border-radius:3px}
#bar-fill{height:100%;width:0;background:var(--brass);border-radius:2px;transition:width .12s linear}
#time{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;letter-spacing:.02em;min-width:86px;text-align:right}
#transport{display:flex;align-items:center;gap:8px;padding:6px 12px 6px}
#play{width:44px;height:36px;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tempo{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px}
.tempo button{background:none;border:none;color:var(--paper);font-size:15px;width:26px;height:28px;cursor:pointer}
.tempo input{font-family:var(--mono);font-size:14px;width:46px;text-align:center;font-weight:700;background:none;border:none;color:var(--paper);outline:none;padding:2px 0;-moz-appearance:textfield}
.tempo input::-webkit-outer-spin-button,.tempo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tempo input:focus{color:var(--brass)}
.tempo .unit{font-size:10px;color:var(--dim);padding-right:4px;letter-spacing:.08em}
#instbtn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch.now{background:var(--brass);color:var(--ink);border-radius:5px;padding-left:5px;margin-left:-5px;
  transform:scale(1.06);transform-origin:left bottom;box-shadow:0 0 0 3px rgba(214,163,84,.18)}
.opts{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 16px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;display:block;margin-bottom:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{display:inline-flex;align-items:center}
.rawfile{display:block;width:100%;margin:10px 0 4px;font-size:12.5px;color:var(--paper);
  background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}
.rawfile::-webkit-file-upload-button{background:var(--line);color:var(--paper);border:0;
  border-radius:6px;padding:6px 10px;margin-right:10px;font-family:var(--ui);font-size:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.thumb{position:relative;flex:0 0 auto;width:104px}
.thumb img{width:100%;height:132px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);display:block;background:#fff}
.thumb .n{position:absolute;left:5px;top:5px;background:var(--brass);color:var(--ink);font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
.thumb .x{position:absolute;right:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer}
#camwrap{display:none;margin-top:12px}
#cam{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
body.focus header{display:none}
body.focus nav{display:none}
body.focus main{padding:14px 12px 96px}
body.focus #transport{padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
#focusout{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:35;display:none}
body.focus #focusout{display:block}
#errbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--ribbon);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:12.5px;line-height:1.6;display:none}
#errbar b{display:block;font-size:13px;margin-bottom:3px}
.fontset{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.fontset button{background:none;border:none;color:var(--paper);font-family:var(--ui);
  font-size:16px;font-weight:800;padding:10px 15px;cursor:pointer}
.fontset span{font-family:var(--mono);font-size:12.5px;color:var(--dim);min-width:26px;text-align:center}
#toast{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);z-index:50;background:var(--brass);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;max-width:90vw;text-align:center;display:none}
#toast.show{display:block}
#workbar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--brass);color:var(--ink);
  padding:8px 14px;font-size:12.5px;font-weight:700;display:none;align-items:center;gap:8px;
  cursor:pointer;border:none;width:100%;text-align:left;font-family:var(--ui)}
#workbar.show{display:flex}
#workbar .spin{border-color:var(--ink);border-top-color:transparent;flex:0 0 auto}

@media print{
  header,footer,#scrim,#toast,#workbar,.noprint{display:none!important}
  body{background:#fff!important;color:#000!important}
  main{padding:0!important}
  .ch{color:#000!important;font-weight:700}
  .section{color:#000!important;border-color:#000!important}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<header class="noprint">
  <div class="row" style="align-items:baseline;margin-bottom:9px">
    <span class="eyebrow" style="color:var(--ribbon)">콘티 v<span id="ver">?</span></span>
    <input id="title" value="예시 곡" aria-label="곡 제목">
    <button class="btn" id="theme">밝게</button>
  </div>
  <div class="row">
    <button class="btn step" id="down" aria-label="반음 내리기">−</button>
    <div id="rail" class="scroll"></div>
    <button class="btn step" id="up" aria-label="반음 올리기">+</button>
  </div>
  <div id="meta"></div>
</header>

<main id="chart"></main>

<footer class="noprint">
<div id="progwrap"><div id="track"><div id="bar-fill"></div></div><span id="time">0:00 / 0:00</span></div>
<div id="transport">
  <button class="btn on" id="play" aria-label="재생">&#9654;</button>
  <div class="tempo"><button id="bpmd" aria-label="느리게">−</button><input id="bpm" type="number" inputmode="numeric" pattern="[0-9]*" min="30" max="300" value="84" aria-label="빠르기 BPM"><span class="unit">BPM</span><button id="bpmu" aria-label="빠르게">+</button></div>
  <button class="btn" id="instbtn">피아노</button>
  <button class="btn" id="loopbtn">반복</button>
</div>
<nav class="scroll">
  <button class="btn" data-panel="scan">가져오기</button>
  <button class="btn" data-panel="input">편집</button>
  <button class="btn" id="b-mode">악보</button>
  <button class="btn" id="b-melonly">멜로디만</button>
  <button class="btn" id="b-verse">1절</button>
  <button class="btn" id="b-focus">집중</button>
  <button class="btn" data-panel="view">보기</button>
  <button class="btn" data-panel="library">콘티</button>
  <button class="btn" data-panel="export">내보내기</button>
</nav>
</footer>

<button class="btn" id="focusout">나가기</button>
<div id="errbar"></div>
<div id="scrim"><div id="sheet"></div></div>
<div id="toast" role="status"></div>
<button id="workbar" type="button" role="status"></button>

<script>
window.onerror=function(msg,src,ln){
  try{
    var e=document.getElementById('errbar');
    if(e){e.style.display='block';
      e.innerHTML='<b>문제가 생겼습니다'+(typeof APP_VER!=='undefined'?' (v'+APP_VER+')':'')+'</b>'
        +String(msg)+' · '+ln+'행<br>주소 끝에 <b>?v=새숫자</b>를 붙여 새로고침하면 대부분 해결됩니다.';}
  }catch(x){}
  return false;
};
/* ============ 배포 설정 ============
   SCAN_ENDPOINT 를 비워두면: 사진 인식에 사용자 각자의 API 키가 필요하다(개인용).
   여기에 배포한 주소를 넣으면: 사용자는 키 없이 그냥 쓴다(공개용). worker.js 참고.
   예) const SCAN_ENDPOINT = "https://konti-scan.내계정.workers.dev";
*/
const SCAN_ENDPOINT = "";
const APP_VER = "37";
/* file:// 나 content:// 로 열면 브라우저가 외부 호출을 막는다(CORS). 미리 알려준다. */
const LOCAL_FILE = !/^https?:$/.test(location.protocol);
/* Claude 앱처럼 iframe 안에서 실행 중이면 키 없이도 인식이 통한다. */
let IN_FRAME=false; try{IN_FRAME=window.self!==window.top;}catch(e){IN_FRAME=true;}

/* ============ 음악 이론 ============ */
const PCM={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, ACC={'#':1,'♯':1,'b':-1,'♭':-1,'':0};
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PREF=['sharp','flat','sharp','flat','sharp','flat','flat','sharp','flat','sharp','flat','sharp'];
const DEG={0:'1',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'#4',7:'5',8:'b6',9:'6',10:'b7',11:'7'};
const SHAPES=[7,0,2,9,4];
const CHORD_RE=/^([A-G])([#♯b♭]?)([^/\s]*?)(?:\/([A-G])([#♯b♭]?))?$/;
const PASS=/^(\||\|\||:\||\|:|-|—|%|x\d+|\(?\d+x\)?|N\.?C\.?|\/+)$/i;
/* 코드 접미사로 허용되는 조각만 나열한다. Chorus/Bridge/Ending 이 코드로 잡히던 문제 방지 */
const SUFFIX_RE=/^(?:maj|min|sus|add|dim|aug|m|M|Δ|°|\+|-|\(|\)|[#b♯♭]|\d)*$/;
const mod=n=>((n%12)+12)%12;
const nm=(pc,p)=>(p==='flat'?FLAT:SHARP)[mod(pc)];

function parseChord(t){
  if(!t)return null;
  const m=t.match(CHORD_RE); if(!m)return null;
  const[,l,a,sfx='',bl,ba]=m;
  if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(sfx))return null;
  if(sfx.length>9)return null;
  if(sfx&&!SUFFIX_RE.test(sfx))return null;
  return{root:mod(PCM[l]+(ACC[a]||0)),suffix:sfx,bass:bl?mod(PCM[bl]+(ACC[ba]||0)):null};
}
const showChord=(c,s,p)=>nm(c.root+s,p)+c.suffix+(c.bass===null?'':'/'+nm(c.bass+s,p));
const showNum=(c,k)=>DEG[mod(c.root-k)]+c.suffix+(c.bass===null?'':'/'+DEG[mod(c.bass-k)]);

/* ============ 차트 파싱 ============ */
function isSection(l){
  const t=l.trim(); if(!t)return false;
  if(/^[[<(].{1,24}[\]>)]$/.test(t)&&!parseChord(t.slice(1,-1)))return true;
  return /^(intro|verse|pre|prechorus|pre-chorus|chorus|bridge|tag|ending|outro|interlude|간주|후렴|절|브릿지|전주|후주)\s*\d*\s*[:)\].]?$/i.test(t);
}
function isChordLine(l){
  const t=l.trim().split(/\s+/).filter(Boolean); if(!t.length)return false;
  let n=0; for(const x of t){ if(PASS.test(x))continue; if(!parseChord(x))return false; n++; }
  return n>0;
}
const MEL_RE=/^\s*[♪♫]\s*\S/;
const NOTE_RE=/^(?:(r)|([A-G])([#♯b♭]?)(-?\d))(?::([\d.]+))?$/i;
const SOL={'도':0,'레':2,'미':4,'파':5,'솔':7,'라':9,'시':11};
const SOL_RE=/^([#♯b♭]?)([도레미파솔라시])([#♯b♭]?)(-?\d)?(?::([\d.]+))?$/;
const DEG_RE=/^([#♯b♭]?)([1-7])([v^]?)(?::([\d.]+))?$/;
const DEG_SEMI={1:0,2:2,3:4,4:5,5:7,6:9,7:11};
function parseMelody(line){
  const out=[];
  for(const t of line.trim().replace(/^[♪♫]\s*/,'').split(/\s+/)){
    if(/^\|+$/.test(t)){ out.push({bar:true}); continue; }
    const sm=t.match(SOL_RE);
    if(sm){
      const beats=sm[5]?parseFloat(sm[5]):1;
      const oct=sm[4]?parseInt(sm[4],10):4;
      const midi=(oct+1)*12+SOL[sm[2]]+(ACC[sm[1]]||0)+(ACC[sm[3]]||0);
      if(beats>0&&midi>=12&&midi<=108)out.push({midi,beats});
      continue;
    }
    const dm=t.match(DEG_RE);
    if(dm){
      const beats=dm[4]?parseFloat(dm[4]):1;
      if(beats>0)out.push({deg:DEG_SEMI[dm[2]]+(ACC[dm[1]]||0),
        oct:(dm[3]==='^'?1:dm[3]==='v'?-1:0),beats});
      continue;
    }
    const m=t.match(NOTE_RE); if(!m)continue;
    const beats=m[5]?parseFloat(m[5]):1;
    if(!isFinite(beats)||beats<=0)continue;
    if(m[1]){out.push({rest:true,beats});continue;}
    const midi=(parseInt(m[4],10)+1)*12+PCM[m[2].toUpperCase()]+(ACC[m[3]]||0);
    if(midi>=12&&midi<=108)out.push({midi,beats});
  }
  return out;
}
/* AI가 마디 안 쉼표를 빠뜨려 박수가 모자란 경우, 표준 쉼표 길이(온쉼표4~16분쉼표0.25)로
   나머지를 채워 넣어 마디 박수 합을 박자표(P.beats)에 강제로 맞춘다.
   첫 마디(마디선 앞)는 못갖춘마디일 수 있으므로 채우지 않는다. */
function padMelodyRests(nts){
  const per=(typeof P!=='undefined'&&P.beats)||4;
  const groups=[[]];
  for(const n of nts){ if(n.bar)groups.push([]); else groups[groups.length-1].push(n); }
  if(groups.filter(g=>g.length).length<2)return nts;   // 마디 표시가 뚜렷하지 않으면 자동 배분(melFit)에 맡긴다
  const fillRests=r=>{
    const vals=[4,3,2,1.5,1,.75,.5,.25], out=[]; let guard=0;
    while(r>0.01&&guard++<20){ const v=vals.find(x=>x<=r+1e-6)||0.25; out.push({rest:true,beats:v}); r-=v; }
    return out;
  };
  const outNts=[];
  groups.forEach((g,gi)=>{
    if(gi>0)outNts.push({bar:true});
    outNts.push(...g);
    if(gi===0)return;
    const sum=g.reduce((a,n)=>a+(n.beats||1),0);
    if(sum>0.01&&sum<per-0.01)outNts.push(...fillRests(per-sum));
  });
  return outNts;
}
function melLine(notes,semis,p,clef){
  return (clef==='bass'?'♫ ':'♪ ')+notes.map(n=>n.bar?'|':n.rest?('r:'+n.beats)
    :(nm(n.midi+semis,p)+(Math.floor((n.midi+semis)/12)-1)+':'+n.beats)).join(' ');
}

function parseChart(raw){
  const lines=raw.replace(/\r\n?/g,'\n').split('\n'), out=[];
  const inline=/\[[A-G][#♯b♭]?[^\]]{0,8}\]/.test(raw)&&/\][^\s[]/.test(raw);
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(MEL_RE.test(line)){const nts=parseMelody(line); if(nts.length){out.push({k:'mel',clef:/^\s*♫/.test(line)?'bass':'treble',notes:padMelodyRests(nts)});continue;} continue;}
    if(/^[\s:.0-9]*(?:[A-G][#♯b♭]?-?\d|r):[\d.]/.test(line.trim())){continue;} // 잘린 멜로디 조각은 버린다
    if(isSection(line)){out.push({k:'sec',text:line.trim().replace(/^[[<(]|[\]>)]$/g,'').trim()});continue;}
    if(!line.trim()){out.push({k:'blank'});continue;}
    if(inline&&line.includes('[')){
      const pairs=[],re=/\[([^\]]+)\]/g; let last=0,m,lead='';
      while((m=re.exec(line))!==null){
        const before=line.slice(last,m.index);
        if(!pairs.length&&before)lead=before; else if(pairs.length)pairs[pairs.length-1].text+=before;
        pairs.push({chord:parseChord(m[1]),raw:m[1],text:''}); last=re.lastIndex;
      }
      if(pairs.length){
        pairs[pairs.length-1].text+=line.slice(last);
        if(lead)pairs.unshift({chord:null,raw:'',text:lead});
        out.push({k:'pairs',pairs:withBars(pairs)}); continue;
      }
    }
    const vm=line.match(/^\s*([2-9])\)\s*(.*)$/);
    if(vm){
      let prev=null;
      for(let k=out.length-1;k>=0;k--){ if(out[k].k==='pairs'&&out[k].pairs.some(x=>x.chord)){prev=out[k];break;} if(out[k].k==='sec')break; }
      if(prev){ prev.alt=prev.alt||{}; prev.alt[+vm[1]]=vm[2]; continue; }
    }
    if(isChordLine(line)){
      const pos=[],re=/\S+/g; let m;
      while((m=re.exec(line))!==null)pos.push({col:m.index,raw:m[0]});
      const nx=lines[i+1];
      const ly=(nx!==undefined&&nx.trim()&&!isChordLine(nx)&&!isSection(nx)&&!MEL_RE.test(nx))?nx:null;
      if(ly!==null)i++;
      const pairs=[];
      if(pos.length&&pos[0].col>0)pairs.push({chord:null,raw:'',text:ly?ly.slice(0,pos[0].col):''});
      pos.forEach((p,j)=>{
        const end=j+1<pos.length?pos[j+1].col:undefined;
        pairs.push({chord:parseChord(p.raw),raw:p.raw,text:ly?ly.slice(p.col,end):''});
      });
      out.push({k:'pairs',pairs:withBars(pairs)}); continue;
    }
    out.push({k:'pairs',pairs:withBars([{chord:null,raw:'',text:line}])});
  }
  return out;
}
function splitByCounts(src,counts){
  const out=[]; let i=0;
  for(const n of counts){
    let taken=0,buf='';
    while(i<src.length&&taken<n){const ch=src[i++];buf+=ch;if(ch!==' ')taken++;}
    while(i<src.length&&src[i]===' ')buf+=src[i++];
    out.push(buf);
  }
  if(i<src.length)out[out.length-1]=(out[out.length-1]||'')+src.slice(i);
  return out;
}
/* 해당 절의 가사로 바꾼 pairs 를 돌려준다. 없으면 원본 그대로. */
function pairsForVerse(b,vn){
  if(vn<=1||!b.alt||!b.alt[vn])return b.pairs;
  const idxs=[],counts=[];
  b.pairs.forEach((p,i)=>{ if(p.bar)return; idxs.push(i); counts.push([...(p.text||'')].filter(c=>c!==' ').length); });
  const parts=splitByCounts(b.alt[vn],counts);
  const map={}; idxs.forEach((i,j)=>map[i]=parts[j]||'');
  return b.pairs.map((p,i)=>p.bar?p:({chord:p.chord,raw:p.raw,idx:p.idx,text:map[i]||''}));
}
function maxVerse(){
  let m=1;
  for(const b of blocks) if(b.alt) for(const k in b.alt) m=Math.max(m,+k);
  return m;
}
/* 가사/코드 속의 | 를 마디 구분 표시로 바꾼다 */
function cleanLyric(t){
  if(!t)return t;
  return t.replace(/(^|\s)r(?=\s|$)/g,'$1 ')      // 홀로 남은 쉼표 기호
          .replace(/(^|\s)r:[\d.]+/g,'$1')
          .replace(/[ ]{3,}/g,'  ');
}
function withBars(pairs){
  const out=[];
  const push=o=>{ if(o.bar){ if(out.length&&out[out.length-1].bar)return; out.push(o); return; }
    if(o.chord||(o.text&&o.text.trim())||(o.raw&&o.raw.trim()))out.push(o); };
  for(const p of pairs){
    if(!p.chord&&/^\|+$/.test((p.raw||'').trim())){ push({bar:true}); if(p.text&&p.text.trim())push({chord:null,raw:'',text:p.text}); continue; }
    const t=cleanLyric(p.text||'');
    if(t.indexOf('|')<0){ push({chord:p.chord,raw:p.raw,text:t}); continue; }
    const parts=t.split('|');
    push({chord:p.chord,raw:p.raw,text:parts[0]});
    for(let i=1;i<parts.length;i++){ push({bar:true}); push({chord:null,raw:'',text:parts[i]}); }
  }
  while(out.length&&out[out.length-1].bar)out.pop();
  return out;
}
function detectKey(bl){
  for(const b of bl){ if(b.k!=='pairs')continue;
    for(const p of b.pairs) if(p.chord) return{pc:p.chord.root,minor:/^m(?!aj)/.test(p.chord.suffix)}; }
  return{pc:0,minor:false};
}

/* ============ 오선보 그리기 ============ */
const LET=['C','D','E','F','G','A','B'];
const LET_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const SHARP_ORD=['F','C','G','D','A','E','B'];
const FLAT_ORD=['B','E','A','D','G','C','F'];
/* 조표: 장조 으뜸음(pc) → [기호, 개수] */
function keySig(pc){
  const SH={7:1,2:2,9:3,4:4,11:5,6:6,1:7};
  const FL={5:1,10:2,3:3,8:4,1:5,6:6,11:7};
  if(SH[pc])return['#',SH[pc]];
  if(FL[pc])return['b',FL[pc]];
  return['',0];
}
/* 미디 음 → 오선 위치(온음 단계)와 임시표 */
function spell(midi,pref,sigSet){
  const pc=mod(midi), name=(pref==='flat'?FLAT:SHARP)[pc];
  const letter=name[0], acc=name.length>1?name[1]:'';
  const oct=Math.floor(midi/12)-1;
  const step=LET.indexOf(letter)+7*oct;
  const sigAcc=sigSet[letter]||'';
  return {step,acc,show:acc!==sigAcc?(acc||'n'):''};
}
/* 멜로디를 SVG 오선보로 */
function renderStaff(sel){
  /* 이 화면은 멜로디 한 줄만 이어붙여 보여준다. 높은음자리/낮은음자리가 둘 다 있으면
     고른 음(sel)이 속한 보표만 골라 보여준다 — 안 그러면 두 보표가 한 줄에 뒤섞인다. */
  const targetClef=(sel&&blocks[sel.bi]&&blocks[sel.bi].clef)||'treble';
  const notes=[];
  for(let bi=0;bi<blocks.length;bi++){
    const b=blocks[bi]; if(b.k!=='mel'||(b.clef||'treble')!==targetClef)continue;
    b.notes.forEach((n,ni)=>notes.push({n,bi,ni}));
  }
  if(!notes.length)return '<div class="callout err"><b>이 차트에는 멜로디가 없습니다.</b><br>'
    +'사진 화면에서 <b>멜로디까지 읽기</b>를 켜고 다시 인식하거나, '
    +'<b>편집</b>에서 <code>♪ 1:1 5:0.5</code> 처럼 직접 넣으세요.</div>';

  const pc=mod(origKey.pc+S.semis), pref=S.flat||PREF[pc];
  const [sgn,cnt]=keySig(pc);
  const sigSet={}; const ord=sgn==='#'?SHARP_ORD:FLAT_ORD;
  for(let i=0;i<cnt;i++)sigSet[ord[i]]=sgn;

  const GAP=9, W=1000, LEFT=96, RIGHT=24;
  const rows=[]; let cur=[], x=LEFT;
  for(const item of notes){
    const n=item.n;
    const w=n.bar?12:Math.round(26+Math.min(4,n.beats||1)*13);
    if(x+w>W-RIGHT&&cur.length){rows.push(cur);cur=[];x=LEFT;}
    cur.push({...item,x,w}); x+=w;
  }
  if(cur.length)rows.push(cur);

  const RH=104, H=rows.length*RH+18;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  const C='var(--paper)', A='var(--brass)';
  rows.forEach((row,ri)=>{
    const top=ri*RH+30;
    for(let i=0;i<5;i++)
      svg+='<line x1="14" y1="'+(top+i*GAP*2)+'" x2="'+(W-10)+'" y2="'+(top+i*GAP*2)+'" stroke="'+C+'" stroke-width="1.1" opacity=".55"/>';
    const isBass=targetClef==='bass';
    const bottomStep=isBass?18:30;   // 낮은음자리표는 G2, 높은음자리표는 E4 자리
    const bottom=top+8*GAP;
    const yOf=st=>bottom-(st-bottomStep)*GAP;
    svg+='<text x="22" y="'+(top+GAP*5.6)+'" font-size="'+(isBass?42:46)+'" fill="'+C+'" opacity=".85">'+(isBass?'&#119074;':'&#119070;')+'</text>';
    let sx=58;
    for(let i=0;i<cnt;i++){
      const L=ord[i];
      const st=LET.indexOf(L)+7*(isBass?(L==='B'||L==='A'||L==='G'?2:3):(L==='B'||L==='A'||L==='G'?4:5));
      svg+='<text x="'+sx+'" y="'+(yOf(st)+5)+'" font-size="19" fill="'+C+'" opacity=".8">'+(sgn==='#'?'♯':'♭')+'</text>';
      sx+=11;
    }
    for(const it of row){
      const n=it.n;
      if(n.bar){ svg+='<line x1="'+it.x+'" y1="'+top+'" x2="'+it.x+'" y2="'+(top+8*GAP)+'" stroke="'+C+'" stroke-width="1.6" opacity=".6"/>'; continue; }
      const cx=it.x+13;
      if(n.rest){ svg+='<rect x="'+(cx-7)+'" y="'+(top+3*GAP)+'" width="14" height="'+GAP+'" fill="'+C+'" opacity=".55" rx="1"/>'; continue; }
      const midi=(n.midi!==undefined)?n.midi+S.semis:((isBass?48:60)+pc+n.deg+(n.oct||0)*12);
      const sp=spell(midi,pref,sigSet), y=yOf(sp.step);
      const on=(sel&&sel.bi===it.bi&&sel.ni===it.ni);
      const col=on?A:C;
      const ledgeTop=isBass?20:32, ledgeLo=isBass?16:28, ledgeHi=isBass?28:40;
      for(let L=ledgeTop;L>=sp.step;L-=2) if(L<=ledgeLo) svg+='<line x1="'+(cx-12)+'" y1="'+yOf(L)+'" x2="'+(cx+12)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      for(let L=ledgeTop;L<=sp.step;L+=2) if(L>=ledgeHi) svg+='<line x1="'+(cx-12)+'" y1="'+yOf(L)+'" x2="'+(cx+12)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      const b=n.beats||1, hollow=b>=2;
      svg+='<ellipse cx="'+cx+'" cy="'+y+'" rx="7.4" ry="5.6" transform="rotate(-18 '+cx+' '+y+')" '
        +(hollow?'fill="none" stroke="'+col+'" stroke-width="2"':'fill="'+col+'"')+'/>';
      if(b<4){
        const up=sp.step<(isBass?24:36), sx2=up?cx+7:cx-7, sy2=up?y-32:y+32;
        svg+='<line x1="'+sx2+'" y1="'+y+'" x2="'+sx2+'" y2="'+sy2+'" stroke="'+col+'" stroke-width="1.7"/>';
        if(b<1){
          svg+='<path d="M'+sx2+' '+sy2+' q9 5 7 16" stroke="'+col+'" stroke-width="1.7" fill="none"/>';
          if(b<0.5)svg+='<path d="M'+sx2+' '+(sy2+8)+' q9 5 7 16" stroke="'+col+'" stroke-width="1.7" fill="none"/>';
        }
      }
      if(sp.show)svg+='<text x="'+(cx-20)+'" y="'+(y+5)+'" font-size="17" fill="'+col+'">'+(sp.show==='#'?'♯':sp.show==='b'?'♭':'♮')+'</text>';
      svg+='<rect x="'+(it.x-2)+'" y="'+(top-14)+'" width="'+(it.w+4)+'" height="'+(8*GAP+28)+'" fill="transparent" '
        +'style="cursor:pointer" data-bi="'+it.bi+'" data-ni="'+it.ni+'"/>';
      if(on)svg+='<rect x="'+(it.x-2)+'" y="'+(top-14)+'" width="'+(it.w+4)+'" height="'+(8*GAP+28)+'" fill="'+A+'" opacity=".12" rx="5" pointer-events="none"/>';
    }
  });
  return svg+'</svg>';
}
/* 한 블록(코드+가사 한 줄 + 앞서 나온 멜로디)을 "실제" 마디 배열로 쪼갠다.
   재생 엔진(buildTimeline)과 같은 규칙을 쓴다:
   - 곡 전체에 명시적 마디선(|)이 하나도 없으면, 코드 하나 = 마디 하나(리드시트 관례)로 본다.
     예) "G  D/F#  Em" 처럼 파이프 없이 나열된 코드는 3마디로 나뉜다.
   - 멜로디에 마디 표시가 2개 이상이면 그걸 그대로 존중하고, 없으면(대부분의 스캔 결과)
     박자 누적으로 각 마디에 자동 배분한다 — 재생 때 쓰는 melFit과 같은 비율로 늘이거나 줄인다.
   melM/chM/lyM은 서로 길이가 같도록(N) 빈 배열로 맞춰서 반환 — 여러 블록을
   이어 붙여도 마디 위치가 어긋나지 않게 하기 위함이다. */
function measuresOfBlock(mel,blk,forceN){
  const chPairs=blk?blk.pairs:[];
  const hasBarGlobal=blocks.some(b=>b.k==='pairs'&&b.pairs.some(p=>p.bar));
  const splitPairs=pairs=>{
    if(hasBarGlobal){
      const g=[[]]; for(const pr of pairs){ if(pr.bar)g.push([]); else g[g.length-1].push(pr); }
      return g.filter(x=>x.length);
    }
    const g=[]; for(const pr of pairs){ if(pr.chord||!g.length)g.push([]); g[g.length-1].push(pr); }
    return g.length?g:[[]];
  };
  const chM0=splitPairs(chPairs);

  /* 멜로디 자체에 마디 표시(|)가 2개 이상 있으면 그 마디 개수를 "진짜"로 믿는다.
     코드 줄의 마디 개수(chM0.length)와 다르더라도 절대 여러 마디를 하나로 뭉개지 않는다
     — 예전엔 초과분을 전부 첫 마디에 욱여넣어 그 마디만 박수가 폭발하고
     가사가 뒤섞이는 버그가 있었다(예: "16박" 마디). 대신 둘 중 더 큰 쪽으로
     전체 마디 수(N)를 늘리고, 모자란 쪽(코드 없는 마디/가사 없는 마디)은 빈 채로 둔다. */
  let melGroups=null;
  if(mel&&mel.notes&&mel.notes.length){
    const groups=[[]];
    mel.notes.forEach((n,ni)=>{ if(n.bar)groups.push([]); else groups[groups.length-1].push({n,bi:mel._bi,ni}); });
    const gs=groups.filter(g=>g.length);
    if(gs.length>=2)melGroups=gs;
  }
  let N=melGroups?Math.max(melGroups.length,chM0.length):chM0.length;
  if(forceN!==undefined)N=forceN;

  const chM=chM0.slice(0,N); while(chM.length<N)chM.push([]);
  const verses=(blk&&blk.alt)?[1,...Object.keys(blk.alt).map(Number)].sort((a,b)=>a-b):[1];
  const lyM={};
  verses.forEach(v=>{
    const pv=blk?pairsForVerse(blk,v):[];
    const g=splitPairs(pv).slice(0,N);
    while(g.length<N)g.push([]);
    lyM[v]=g;
  });

  let melM=new Array(N).fill(0).map(()=>[]);
  let fitM=new Array(N).fill(false);   // true인 마디는 박자 자동 배분(추정치)이라 박수 어긋남 경고를 보여주지 않는다
  if(melGroups){
    for(let i=0;i<N;i++)if(melGroups[i])melM[i]=melGroups[i];
  }else if(mel&&mel.notes&&mel.notes.length){   // 마디 표시가 없으면 박자 누적으로 자동 배분(melFit과 동일한 원리)
    const groups=[[]];
    mel.notes.forEach((n,ni)=>{ if(n.bar)groups.push([]); else groups[groups.length-1].push({n,bi:mel._bi,ni}); });
    const beatsPerBar=P.beats||4, fitTo=N*beatsPerBar;
    const flat=groups.filter(g=>g.length)[0]||[];
    const raw=flat.reduce((a,it)=>a+(it.n.beats||1),0);
    const k=(raw>0&&Math.abs(raw-fitTo)>0.01)?fitTo/raw:1;
    let acc=0;
    flat.forEach(it=>{
      const barIdx=Math.min(N-1,Math.floor((acc+1e-9)/beatsPerBar));
      melM[barIdx].push(it);
      acc+=(it.n.beats||1)*k;
    });
    for(let i=0;i<N;i++)fitM[i]=true;
  }
  return {melM,chM,lyM,verses,N,fitM};
}
/* 이어붙인 마디 배열(melM/chM/lyM)을 한 줄에 4마디씩 리드시트(코드+오선+가사) SVG로 그린다.
   measureStart: 곡 전체 기준 첫 마디 번호(1부터) */
function renderStaffSection(melM,chM,lyM,verses,measureStart,fitM,bassM){
  fitM=fitM||[]; bassM=bassM||[];
  const pc=mod(origKey.pc+S.semis), pref=S.flat||PREF[pc];
  const [sgn,cnt]=keySig(pc), ord=sgn==='#'?SHARP_ORD:FLAT_ORD;
  const sigSet={}; for(let i=0;i<cnt;i++)sigSet[ord[i]]=sgn;
  const N=melM.length;
  if(!N)return {svgs:[],count:0};
  const per=4;   // 가독성을 위해 한 줄에 최소 4마디씩 표시
  const out=[];
  for(let s0=0;s0<N;s0+=per)out.push(draw(s0,Math.min(N,s0+per)));
  return {svgs:out.filter(x=>x),count:N};

  function draw(mFrom,mTo){

  const GAP=7, TOP=40, W=1000, PAD=14, VOFF=17;
  const bottom=TOP+8*GAP, yOf=st=>bottom-(st-30)*GAP;
  const C='var(--paper)', A='var(--brass)';
  const labeled={};   // 절 번호는 이 줄에서 한 번만 표시
  let body='', x=PAD+(cnt?46+cnt*9:42);
  const spans=[];
  let clef='<text x="'+PAD+'" y="'+(TOP+GAP*5.6)+'" font-size="37" fill="'+C+'" opacity=".8">&#119070;</text>';
  let sx=PAD+34;
  for(let i=0;i<cnt;i++){
    const L=ord[i], oc=(L==='B'||L==='A'||L==='G')?4:5;
    clef+='<text x="'+sx+'" y="'+(yOf(LET.indexOf(L)+7*oc)+4)+'" font-size="15" fill="'+C+'" opacity=".8">'+(sgn==='#'?'♯':'♭')+'</text>';
    sx+=9;
  }
  if(measureStart===1&&mFrom===0){                 // 곡 맨 처음 한 번만 박자표 표기
    clef+='<text x="'+sx+'" y="'+(TOP+22)+'" font-size="18" font-weight="700" fill="'+C+'" opacity=".85">'+P.beats+'</text>';
    clef+='<text x="'+sx+'" y="'+(TOP+50)+'" font-size="18" font-weight="700" fill="'+C+'" opacity=".85">4</text>';
    x=Math.max(x,sx+18);
  }
  for(let m=mFrom;m<mTo;m++){
    const notes=melM[m]||[], chs=chM[m]||[];
    const beatSum=notes.length?notes.reduce((a,it)=>a+(it.n.beats||1),0):null;
    const mismatch=beatSum!==null&&!fitM[m]&&Math.abs(beatSum-P.beats)>0.75;   // 자동 배분(fitM) 오차는 눈감아주고 진짜 어긋난 것만 표시
    const R='var(--ribbon)';
    body+='<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+bottom+'" stroke="'+(mismatch?R:C)+'" stroke-width="1.5" opacity="'+(mismatch?'.85':'.5')+'"/>';
    body+='<text x="'+(x+3)+'" y="'+(TOP-25)+'" font-size="11" fill="'+(mismatch?R:C)+'" opacity="'+(mismatch?'.95':'.55')+'" font-weight="'+(mismatch?'700':'400')+'">'
      +(measureStart+m)+(mismatch?' ⚠'+(beatSum%1?beatSum.toFixed(1):beatSum)+'박':'')+'</text>';
    x+=8;
    const startX=x;
    if(!notes.length){                       // 멜로디가 없는 마디는 코드와 절별 가사만
      chs.forEach((p,i)=>{
        if(p.chord)body+='<text x="'+(x+i*58)+'" y="'+(TOP-11)+'" font-size="17" font-weight="700" fill="'+A+'">'
          +(S.num?showNum(p.chord,origKey.pc):showChord(p.chord,S.semis,pref))+'</text>';
      });
      verses.forEach((v,vi)=>{
        const grp=(lyM[v]&&lyM[v][m])||[];
        grp.forEach((p,i)=>{
          const label=(verses.length>1&&!labeled[v])?(v+'. '):'';
          if(label)labeled[v]=true;
          body+='<text x="'+(x+i*58)+'" y="'+(bottom+24+vi*VOFF)+'" font-size="15" fill="'+C+'">'+esc(label+(p.text||''))+'</text>';
        });
      });
      x+=Math.max(118,chs.length*58);
      spans.push({m,startX,endX:x});
      continue;
    }
    const realCx=[];
    for(const it of notes){
      const n=it.n;
      const w=Math.round(18+Math.min(4,n.beats||1)*12);
      const cx=x+w/2;
      if(n.rest){ body+='<rect x="'+(cx-6)+'" y="'+(TOP+3*GAP)+'" width="11" height="'+GAP+'" fill="'+C+'" opacity=".5" rx="1"/>'; x+=w; continue; }
      const midi=(n.midi!==undefined)?n.midi+S.semis:(60+pc+n.deg+(n.oct||0)*12);
      const sp=spell(midi,pref,sigSet), y=yOf(sp.step);
      const on=(S.selNote&&S.selNote.bi===it.bi&&S.selNote.ni===it.ni);
      const col=on?A:C;
      for(let L=32;L>=sp.step;L-=2) if(L<=28) body+='<line x1="'+(cx-10)+'" y1="'+yOf(L)+'" x2="'+(cx+10)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      for(let L=32;L<=sp.step;L+=2) if(L>=40) body+='<line x1="'+(cx-10)+'" y1="'+yOf(L)+'" x2="'+(cx+10)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      const b=n.beats||1, hollow=b>=2;
      body+='<ellipse cx="'+cx+'" cy="'+y+'" rx="6" ry="4.5" transform="rotate(-18 '+cx+' '+y+')" '
        +(hollow?'fill="none" stroke="'+col+'" stroke-width="1.6"':'fill="'+col+'"')+'/>';
      if(b<4){
        const up=sp.step<36, sx2=up?cx+6:cx-6, sy2=up?y-24:y+24;
        body+='<line x1="'+sx2+'" y1="'+y+'" x2="'+sx2+'" y2="'+sy2+'" stroke="'+col+'" stroke-width="1.4"/>';
        if(b<1)body+='<path d="M'+sx2+' '+sy2+' q7 4 6 12" stroke="'+col+'" stroke-width="1.4" fill="none"/>';
        if(b<0.5)body+='<path d="M'+sx2+' '+(sy2+6)+' q7 4 6 12" stroke="'+col+'" stroke-width="1.4" fill="none"/>';
      }
      if(sp.show)body+='<text x="'+(cx-15)+'" y="'+(y+4)+'" font-size="13" fill="'+col+'">'+(sp.show==='#'?'♯':sp.show==='b'?'♭':'♮')+'</text>';
      body+='<rect x="'+x+'" y="'+(TOP-21)+'" width="'+w+'" height="'+(8*GAP+46+(verses.length-1)*VOFF)+'" fill="transparent" style="cursor:pointer" data-bi="'+it.bi+'" data-ni="'+it.ni+'"/>';
      realCx.push(cx); x+=w;
    }
    // 절별 가사를 실제 음표 위치에 맞춰 배치
    verses.forEach((v,vi)=>{
      const grp=(lyM[v]&&lyM[v][m])||[];
      const syl=[...grp.map(p=>p.text||'').join('')].filter(ch=>ch.trim());
      for(let si=0;si<Math.min(syl.length,realCx.length);si++){
        const label=(verses.length>1&&!labeled[v])?(v+'. '):'';
        if(label)labeled[v]=true;
        body+='<text x="'+realCx[si]+'" y="'+(bottom+24+vi*VOFF)+'" font-size="14" fill="'+C+'" text-anchor="middle">'+esc(label+syl[si])+'</text>';
      }
    });
    // 코드 심볼: 마디 안 음표에 맞춰 배치
    const span=x-startX;
    chs.filter(p=>p.chord).forEach((p,i,arr)=>{
      const px=startX+(arr.length>1?span*i/arr.length:0)+3;
      body+='<text x="'+px+'" y="'+(TOP-11)+'" font-size="17" font-weight="700" fill="'+A+'" data-cidx="'+(p.idx)+'" style="cursor:pointer">'
        +(S.num?showNum(p.chord,origKey.pc):showChord(p.chord,S.semis,pref))+'</text>';
    });
    spans.push({m,startX,endX:x});
  }
  body+='<line x1="'+x+'" y1="'+TOP+'" x2="'+x+'" y2="'+bottom+'" stroke="'+C+'" stroke-width="1.5" opacity=".5"/>';
  const WW=Math.max(W,x+PAD);
  let lines='';
  for(let i=0;i<5;i++)lines+='<line x1="'+PAD+'" y1="'+(TOP+i*GAP*2)+'" x2="'+x+'" y2="'+(TOP+i*GAP*2)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
  let H=bottom+38+(verses.length-1)*VOFF;
  let bassSvg='';
  const hasBass=bassM.some(g=>g&&g.length);
  if(hasBass){
    /* 낮은음자리표(베이스 보표)를 높은음자리 아래에 이어 그린다.
       각 마디 폭(spans)은 위 높은음자리 마디와 그대로 공유해 두 보표가 세로로 맞는다.
       베이스 음표 개수가 그 마디의 높은음자리 음표 개수와 달라도(대개 다름) 마디 폭 안에 고르게 나눠 찍는다. */
    const TOP2=H+34, bottom2=TOP2+8*GAP, yOf2=st=>bottom2-(st-18)*GAP;
    let bClef='<text x="'+PAD+'" y="'+(TOP2+GAP*5.6)+'" font-size="34" fill="'+C+'" opacity=".8">&#119074;</text>';
    let sx2=PAD+34;
    for(let i=0;i<cnt;i++){
      const L=ord[i], oc2=(L==='B'||L==='A'||L==='G')?2:3;
      bClef+='<text x="'+sx2+'" y="'+(yOf2(LET.indexOf(L)+7*oc2)+4)+'" font-size="15" fill="'+C+'" opacity=".8">'+(sgn==='#'?'♯':'♭')+'</text>';
      sx2+=9;
    }
    let bLines='';
    for(let i=0;i<5;i++)bLines+='<line x1="'+PAD+'" y1="'+(TOP2+i*GAP*2)+'" x2="'+x+'" y2="'+(TOP2+i*GAP*2)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
    let bBody='';
    for(const spn of spans){
      const grp=(bassM[spn.m]||[]).filter(it=>it&&!it.n.bar);
      if(!grp.length)continue;
      const w0=spn.endX-spn.startX;
      grp.forEach((it,i)=>{
        const n=it.n, cx=spn.startX+w0*(i+0.5)/grp.length;
        if(n.rest){ bBody+='<rect x="'+(cx-6)+'" y="'+(TOP2+3*GAP)+'" width="11" height="'+GAP+'" fill="'+C+'" opacity=".5" rx="1"/>'; return; }
        const midi=(n.midi!==undefined)?n.midi+S.semis:(48+pc+n.deg+(n.oct||0)*12);
        const spx=spell(midi,pref,sigSet), y=yOf2(spx.step);
        const on=(S.selNote&&S.selNote.bi===it.bi&&S.selNote.ni===it.ni);
        const col=on?A:C;
        for(let L=20;L>=spx.step;L-=2) if(L<=16) bBody+='<line x1="'+(cx-10)+'" y1="'+yOf2(L)+'" x2="'+(cx+10)+'" y2="'+yOf2(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
        for(let L=20;L<=spx.step;L+=2) if(L>=28) bBody+='<line x1="'+(cx-10)+'" y1="'+yOf2(L)+'" x2="'+(cx+10)+'" y2="'+yOf2(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
        const b=n.beats||1, hollow=b>=2;
        bBody+='<ellipse cx="'+cx+'" cy="'+y+'" rx="6" ry="4.5" transform="rotate(-18 '+cx+' '+y+')" '
          +(hollow?'fill="none" stroke="'+col+'" stroke-width="1.6"':'fill="'+col+'"')+'/>';
        if(b<4){
          const up=spx.step<24, sx3=up?cx+6:cx-6, sy3=up?y-24:y+24;
          bBody+='<line x1="'+sx3+'" y1="'+y+'" x2="'+sx3+'" y2="'+sy3+'" stroke="'+col+'" stroke-width="1.4"/>';
          if(b<1)bBody+='<path d="M'+sx3+' '+sy3+' q7 4 6 12" stroke="'+col+'" stroke-width="1.4" fill="none"/>';
          if(b<0.5)bBody+='<path d="M'+sx3+' '+(sy3+6)+' q7 4 6 12" stroke="'+col+'" stroke-width="1.4" fill="none"/>';
        }
        if(spx.show)bBody+='<text x="'+(cx-15)+'" y="'+(y+4)+'" font-size="13" fill="'+col+'">'+(spx.show==='#'?'♯':spx.show==='b'?'♭':'♮')+'</text>';
        bBody+='<rect x="'+(cx-w0/(2*grp.length))+'" y="'+(TOP2-21)+'" width="'+(w0/grp.length)+'" height="'+(8*GAP+42)+'" fill="transparent" style="cursor:pointer" data-bi="'+it.bi+'" data-ni="'+it.ni+'"/>';
      });
    }
    bassSvg=bLines+bClef+bBody;
    H=bottom2+30;
  }
  return '<svg viewBox="0 0 '+WW+' '+H+'" width="100%" style="display:block">'
    +lines+clef+body+bassSvg+'</svg>';
  }
}

function writeBackMelody(){
  const lines=S.raw.replace(/\r\n?/g,'\n').split('\n');
  const mels=blocks.filter(b=>b.k==='mel');
  let k=0;
  for(let i=0;i<lines.length;i++){
    if(!MEL_RE.test(lines[i]))continue;
    if(k<mels.length)lines[i]=melLine(mels[k].notes,0,S.flat||'flat',mels[k].clef);
    k++;
  }
  S.raw=lines.join('\n');
  scheduleSave();
}

const QUAL=[[/^(m7b5|ø)/,[0,3,6,10]],[/^(dim7|°7)/,[0,3,6,9]],[/^(dim|°)/,[0,3,6]],
 [/^(aug|\+)/,[0,4,8]],[/^maj7|^M7|^Δ/,[0,4,7,11]],[/^m(?:in)?7/,[0,3,7,10]],
 [/^m(?:in)?(?!aj)/,[0,3,7]],[/^sus2/,[0,2,7]],[/^sus4?/,[0,5,7]],[/^7/,[0,4,7,10]],[/^6/,[0,4,7,9]]];

let actx=null, master=null, wet=null, dry=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);

function makeIR(ctx,sec,decay){
  const len=Math.max(1,Math.floor(ctx.sampleRate*sec));
  const buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){
      const t=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.15);
    }
  }
  return buf;
}
function AC(){
  if(!actx){
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return null;
    actx=new A();
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=3.4;
    comp.attack.value=.006; comp.release.value=.26;
    comp.connect(actx.destination);
    master=actx.createGain(); master.gain.value=.85;
    dry=actx.createGain(); dry.gain.value=.82;
    wet=actx.createGain(); wet.gain.value=.30;
    const rev=actx.createConvolver();
    try{ rev.buffer=makeIR(actx,2.6,2.4); }catch(e){}
    const damp=actx.createBiquadFilter();
    damp.type='lowpass'; damp.frequency.value=3600;
    master.connect(dry); dry.connect(comp);
    master.connect(wet); wet.connect(rev); rev.connect(damp); damp.connect(comp);
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
const ksCache={};
function pluckBuf(ctx,freq){
  const k=Math.round(freq*4); if(ksCache[k])return ksCache[k];
  const sr=ctx.sampleRate,len=Math.floor(sr*2.4),N=Math.max(2,Math.round(sr/freq));
  const buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
  let p=0,last=0;
  for(let i=0;i<len;i++){
    const cur=ring[p], v=(cur+last)*.5*.9965;
    d[i]=v*Math.exp(-i/(sr*1.6));
    ring[p]=v; last=cur; p=(p+1)%N;
  }
  ksCache[k]=buf; return buf;
}

function setReverb(insts){
  if(!wet)return;
  const list=Array.isArray(insts)?insts:[insts];

/* ============ 실제 악기 샘플(General MIDI, 무료·공개 라이선스) ============
   합성음 대신 실제로 녹음된 악기 소리를 쓴다. 온라인일 때만 되고, 처음 쓰는 음은
   내려받는 동안 합성음으로 대신 채워둔다 — 재생이 끊기거나 멈추는 일은 없다.
   같은 음을 다시 연주할 때부터(같은 곡 반복 재생, 다음 곡 등) 실제 소리로 들린다. */
const SAMPLE_BASE='https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@gh-pages/FluidR3_GM/';
const SAMPLE_MAP={piano:'acoustic_grand_piano',ep:'electric_piano_1',organ:'drawbar_organ',
  strings:'string_ensemble_1',cello:'cello',brass:'trumpet',flute:'flute',
  choir:'choir_aahs',pad:'pad_2_warm',guitar:'acoustic_guitar_nylon',bass:'acoustic_bass'};
const FLAT_NAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const sampleCache=new Map();               // 'folder|pc|oct' -> AudioBuffer(성공) | null(실패) | Promise(진행중)
const sampleKey=(folder,pc,oct)=>folder+'|'+pc+'|'+oct;
async function fetchSample(folder,pc,oct){
  const url=SAMPLE_BASE+folder+'-mp3/'+FLAT_NAMES[pc]+oct+'.mp3';
  const r=await fetch(url); if(!r.ok)throw new Error('no sample');
  const buf=await r.arrayBuffer();
  const ctx=AC(); if(!ctx)throw new Error('no audio context');
  return await ctx.decodeAudioData(buf);
}
function warmSample(folder,pc,oct){        // 백그라운드로 미리 받아둔다 — 지금 재생을 막지 않는다
  const key=sampleKey(folder,pc,oct);
  if(sampleCache.has(key))return;
  const p=fetchSample(folder,pc,oct).then(ab=>{sampleCache.set(key,ab);return ab;})
    .catch(()=>{sampleCache.set(key,null);return null;});
  sampleCache.set(key,p);
}
/* 원하는 옥타브의 샘플이 아직 없으면, 같은 음이름의 다른(이미 받아진) 옥타브를 찾아
   재생속도를 2의 거듭제곱으로 걸어 정확히 옮긴다(옥타브 이조는 배음이라 가장 자연스럽다).
   아직 아무 옥타브도 캐시에 없으면(비동기 로딩 전) null — 그 순간만 합성음으로 대신한다. */
function getCachedSample(folder,pc,oct){
  for(let d=0;d<=4;d++){
    const cands=d===0?[oct]:[oct-d,oct+d];
    for(const o of cands){
      const v=sampleCache.get(sampleKey(folder,pc,o));
      if(v&&!(v instanceof Promise))return {buffer:v,octShift:oct-o};
    }
  }
  return null;
}
function playSampleVoice(ctx,I,buf,octShift,t,dur,vel,out2){
  const src=ctx.createBufferSource();
  src.buffer=buf; src.playbackRate.value=Math.pow(2,octShift);
  const g=ctx.createGain(), peak=Math.max(.0002,vel);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+Math.min(.02,I.a||.01));   // 샘플 자체에 어택이 있어 살짝만 올린다
  g.gain.setTargetAtTime(.0001,t+dur,Math.max(.05,(I.r||.3)/3));
  src.connect(g); g.connect(out2);
  src.start(t); src.stop(t+dur+(I.r||.3)+.4);
}

function voice(ctx,inst,midi,t,dur,vel,pan){
  const I=INSTRUMENTS[inst]||INSTRUMENTS.piano;
  if(I.oct)midi+=I.oct*12;
  const f=mtof(midi);
  let out2=master;
  if(pan!==undefined&&ctx.createStereoPanner){
    const sp=ctx.createStereoPanner();
    sp.pan.value=Math.max(-.7,Math.min(.7,pan));
    sp.connect(master); out2=sp;
  }
  const sampleFolder=P.realInst!==false&&SAMPLE_MAP[inst];
  if(sampleFolder){
    const oct=Math.floor(midi/12)-1, pc=mod(midi);
    const hit=getCachedSample(sampleFolder,pc,oct);
    if(hit){ playSampleVoice(ctx,I,hit.buffer,hit.octShift,t,dur,vel,out2); return; }
    warmSample(sampleFolder,pc,oct);   // 이번 음은 합성음으로, 다음부터는 실제 소리로
  }
  if(I.pluck){
    const src=ctx.createBufferSource(); src.buffer=pluckBuf(ctx,f);
    src.detune.value=(Math.random()*8-4);
    const g=ctx.createGain();
    g.gain.setValueAtTime(vel*1.1,t);
    g.gain.setTargetAtTime(.0001,t+Math.max(.25,dur*.85),.14);
    src.connect(g); g.connect(out2);
    src.start(t); src.stop(t+Math.min(2.4,dur+.7));
    return;
  }
  const end=t+dur+I.r+.2;
  const g=ctx.createGain(), peak=Math.max(.0002,vel);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+I.a);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak*I.sus),t+I.a+I.d);
  g.gain.setTargetAtTime(.0001,t+dur,I.r/3);

  let node=g;
  if(I.lp){                                   // 톤을 둥글게
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value=I.lp[0]; lp.Q.value=I.lp[1];
    g.connect(lp); node=lp;
  }
  if(I.fenv){                                 // 금관: 세게 불면 밝아진다
    const bp=ctx.createBiquadFilter(); bp.type='lowpass'; bp.Q.value=.9;
    bp.frequency.setValueAtTime(I.fenv[0],t);
    bp.frequency.linearRampToValueAtTime(I.fenv[1],t+I.fenv[2]);
    bp.frequency.setTargetAtTime(I.fenv[0]*1.6,t+dur*.7,.3);
    node.connect(bp); node=bp;
  }
  node.connect(out2);

  let vibGain=null;
  if(I.vib){                                  // 비브라토 — 전자음을 벗어나는 핵심
    const lfo=ctx.createOscillator(), lg=ctx.createGain();
    lfo.frequency.value=I.vib[0];
    lg.gain.setValueAtTime(0,t);
    lg.gain.linearRampToValueAtTime(I.vib[1]*100,t+Math.min(.5,I.a+.25));  // 서서히 걸린다
    lfo.connect(lg); lfo.start(t); lfo.stop(end);
    vibGain=lg;
  }
  if(I.breath){                               // 플루트 숨소리
    const len=Math.max(1,Math.floor(ctx.sampleRate*Math.min(.25,dur)));
    const nb=ctx.createBuffer(1,len,ctx.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<len;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const ns=ctx.createBufferSource(); ns.buffer=nb;
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=f*2; nf.Q.value=1.2;
    const ng=ctx.createGain(); ng.gain.value=vel*I.breath;
    ns.connect(nf); nf.connect(ng); ng.connect(out2);
    ns.start(t); ns.stop(t+Math.min(.3,dur));
  }

  const layer=(inst==='piano'||inst==='ep'||inst==='pad'||inst==='strings'||inst==='choir')?2:1;
  for(const[mult,amp] of I.partials){
    for(let L=0;L<(mult===1?layer:1);L++){
      const o=ctx.createOscillator(), og=ctx.createGain();
      o.type=I.wave||'sine';
      o.frequency.value=f*mult;
      o.detune.value=(layer>1&&mult===1?(L===0?-6:6):0)+(I.spread?(Math.random()*6-3):0);
      if(vibGain)vibGain.connect(o.detune);
      og.gain.value=amp/(mult===1?layer:1);
      o.connect(og); og.connect(g);
      o.start(t); o.stop(end);
    }
  }
}

/* 연주 패턴: 한 코드가 차지하는 b박을 어떻게 쪼개 칠 것인가
   반환 [{t:박 오프셋, n:[미디음], d:박 길이, g:세기}] */
const PATTERNS={
  block:{label:'블록 코드',build:(v,b)=>[{t:0,n:[v.bass].concat(v.upper),d:b,g:.26}]},

  arp:{label:'아르페지오',build:(v,b)=>{
    const u=v.upper, top=u[u.length-1];
    const seq=[v.bass,u[0],u[1]||u[0],top,u[1]||u[0],u[0]];
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++)out.push({t:i*step,n:[seq[i%seq.length]],d:b-i*step+.4,g:.30});
    return out;}},

  alberti:{label:'알베르티',build:(v,b)=>{
    const u=v.upper, hi=u[u.length-1], mid=u[1]||u[0];
    const seq=[v.bass,hi,mid,hi];
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++)out.push({t:i*step,n:[seq[i%4]],d:step*2.2,g:.29});
    return out;}},

  eight:{label:'8비트',build:(v,b)=>{
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++){
      const t=i*step;
      if(i%2===0)out.push({t,n:[v.bass],d:step*1.7,g:.32});
      out.push({t,n:v.upper,d:step*.95,g:i%2?.13:.19});
    }
    return out;}},

  waltz:{label:'왈츠',build:(v,b)=>{
    const beats=Math.max(2,Math.round(b)),out=[{t:0,n:[v.bass],d:1,g:.33}];
    for(let i=1;i<beats;i++)out.push({t:i,n:v.upper,d:.9,g:.19});
    return out;}},

  shuffle:{label:'셔플',build:(v,b)=>{
    const n=Math.max(1,Math.round(b)),out=[];
    for(let i=0;i<n;i++){
      out.push({t:i,n:i%2===0?[v.bass]:v.upper,d:.62,g:.30});
      out.push({t:i+2/3,n:v.upper,d:.34,g:.16});
    }
    return out;}},

  bossa:{label:'보사노바',build:(v,b)=>{
    const out=[],n=Math.max(2,Math.round(b));
    for(let i=0;i<n;i+=2){
      out.push({t:i,n:[v.bass],d:1.4,g:.32});
      out.push({t:i+1.5,n:[v.bass],d:1,g:.27});
    }
    [0,.75,1.5,2.5,3.25].forEach(t=>out.push({t,n:v.upper,d:.5,g:.17}));
    return out;}},

  ballad:{label:'발라드',build:(v,b)=>{
    const u=v.upper,out=[{t:0,n:[v.bass],d:b,g:.30}];
    const rest=Math.max(1,Math.round((b-.5)*2)),step=(b-.5)/rest;
    for(let i=0;i<rest;i++)out.push({t:.5+i*step,n:[u[i%u.length]],d:b-(.5+i*step)+.5,g:.24});
    return out;}}
};

function chordVoicing(chord,semis){
  let iv=[0,4,7]; for(const[re,x] of QUAL) if(re.test(chord.suffix)){iv=x;break;}
  const rp=mod(chord.root+semis);
  const bassPc=mod((chord.bass===null?chord.root:chord.bass)+semis);
  return {bass:36+bassPc, upper:iv.map(i=>60+rp+i)};
}

/* 여러 악기를 동시에 울린다 */
function instList(){
  const l=(P.insts&&P.insts.length)?P.insts:['piano'];
  return l.filter(k=>INSTRUMENTS[k]);
}
function strike(ctx,chord,semis,insts,t,dur,beats,spb){
  const list=(insts&&insts.length?insts:['piano']).filter(k=>INSTRUMENTS[k]);
  if(!list.length)return;
  setReverb(list);
  const mix=1/Math.sqrt(list.length);          // 겹칠수록 각각을 낮춰 뭉개지지 않게
  const v=chordVoicing(chord,semis);
  const P2=PATTERNS[P.pattern]||PATTERNS.block;
  const evs=P2.build(v,beats).filter(e=>e.t<beats&&e.t>=0);
  list.forEach((inst,ii)=>{
    const I=INSTRUMENTS[inst];
    if(I.bassOnly){
      evs.forEach(e=>{ if(e.n.some(m=>m<52))voice(ctx,inst,v.bass,t+e.t*spb,Math.max(.14,e.d*spb),e.g*mix,0); });
      return;
    }
    const off=ii*.008;                          // 악기마다 아주 살짝 어긋나게 = 합주 느낌
    for(const e of evs){
      const n=e.n.length;
      e.n.forEach((m,i)=>{
        const low=m<52;
        const pan=low?0:((n>1?(i/(n-1)):.5)-.5)*.62+(ii-(list.length-1)/2)*.12;
        voice(ctx,inst,m,t+e.t*spb+i*(I.spread||0)+off,Math.max(.14,e.d*spb),e.g*mix,pan);
        if(low&&e.g>.28)voice(ctx,inst,m-12,t+e.t*spb+off,Math.max(.14,e.d*spb),e.g*.4*mix,0);
      });
    }
  });
}
function click(ctx,t,strong){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square'; o.frequency.value=strong?1600:1050;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(strong?.16:.09,t+.001);
  g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.06);
}
function tapChord(chord,semis){
  const ctx=AC(); if(!ctx||!chord)return;
  const list=instList();
  setReverb(list);
  const v=chordVoicing(chord,semis), t=ctx.currentTime+.01, mix=1/Math.sqrt(list.length);
  list.forEach((inst,ii)=>{
    const I=INSTRUMENTS[inst];
    voice(ctx,inst,v.bass,t+ii*.008,1.4,.34*mix,0);
    if(!I.bassOnly)v.upper.forEach((m,i,arr)=>
      voice(ctx,inst,m,t+i*(I.spread||0)+ii*.008,1.4,.26*mix,((i/Math.max(1,arr.length-1))-.5)*.6));
  });
}

const GENRES={
  hymn   :{label:'찬송가',    insts:['organ'],            mel:'flute',  pat:'block',   bpm:76,  beats:4},
  ballad :{label:'CCM 발라드',insts:['piano','strings'],  mel:'flute',  pat:'ballad',  bpm:68,  beats:4},
  modern :{label:'모던 워십', insts:['pad','ep'],         mel:'ep',     pat:'arp',     bpm:72,  beats:4},
  acou   :{label:'어쿠스틱',  insts:['guitar','strings'], mel:'flute',  pat:'arp',     bpm:84,  beats:4},
  gospel :{label:'가스펠',    insts:['ep','organ'],       mel:'brass',  pat:'shuffle', bpm:96,  beats:4},
  band   :{label:'밴드 8비트',insts:['piano','bass'],     mel:'brass',  pat:'eight',   bpm:100, beats:4},
  orch   :{label:'관현악',    insts:['strings','cello','brass','flute'], mel:'flute', pat:'block', bpm:72, beats:4},
  bossa  :{label:'보사노바',  insts:['guitar','flute'],   mel:'flute',  pat:'bossa',   bpm:124, beats:4},
  waltz  :{label:'왈츠',      insts:['piano','strings'],  mel:'flute',  pat:'waltz',   bpm:108, beats:3},
  classic:{label:'클래식',    insts:['piano','cello'],    mel:'strings',pat:'alberti', bpm:88,  beats:4}
};
function applyGenre(k){
  const g=GENRES[k]; if(!g)return;
  P.genre=k; P.insts=g.insts.slice(); P.melInst=g.mel; P.pattern=g.pat; P.beats=g.beats;
  setBpm(g.bpm); renderToolbar();
  if(P.playing)startPlay();
}

/* ---- 시퀀서 ---- */
const P={playing:false,bpm:84,genre:'',insts:['piano'],melInst:'ep',pattern:'block',beats:4,loop:true,click:false,melody:true,accomp:true,readMel:true,bySystem:true,ocrBoost:true,realInst:true,melOct:0,melFit:true,playBass:false,
         evs:[],total:0,k:0,cursorT:0,lastAt:0,t0:0,timer:null,marks:[],vmarks:[],vnext:1,cur:-1};

function buildTimeline(){
  const evs=[], hasBar=blocks.some(b=>b.k==='pairs'&&b.pairs.some(p=>p.bar));
  let beat=0, pendingMel=null, pendingBass=null, drift=0, melNotes=0, bassNotes=0;

  const put=(notes,startBeat,fitTo,evType,baseMidi)=>{
    evType=evType||'m'; baseMidi=baseMidi||60;
    const raw=notes.reduce((a,n)=>a+(n.bar?0:n.beats),0);
    const k=(P.melFit!==false&&fitTo>0&&raw>0&&Math.abs(raw-fitTo)>0.01)?(fitTo/raw):1;
    let t=startBeat;
    for(const n of notes){
      if(n.bar)continue;
      const d=n.beats*k;
      if(!n.rest){
        const mi=(n.midi!==undefined)?n.midi:(baseMidi+origKey.pc+n.deg+(n.oct||0)*12);
        evs.push({type:evType,midi:mi,beats:d,at:t});
        if(evType==='mb')bassNotes++; else melNotes++;
      }
      t+=d;
    }
    return t-startBeat;
  };
  const dur=g=>g.reduce((a,n)=>a+(n.bar?0:n.beats),0);

  /* 멜로디를 마디 단위로 코드 마디에 맞춘다. 못갖춘마디는 첫 마디 앞에 붙인다. */
  const layMel=(mel,barStarts,lineStart,lineBeats,evType,baseMidi)=>{
    if(!mel)return;
    const groups=[[]];
    for(const n of mel.notes){ if(n.bar)groups.push([]); else groups[groups.length-1].push(n); }
    const gs=groups.filter(g=>g.length);
    if(!barStarts.length||gs.length<2){
      const raw=dur(mel.notes);
      if(lineBeats>0&&Math.abs(raw-lineBeats)>0.75)drift++;
      put(mel.notes,lineStart,lineBeats,evType,baseMidi);   // 마디 표시가 없으면 단 길이에 맞춰 늘린다
      return;
    }
    const nb=barStarts.length, off=gs.length-nb;
    if(off>0){                                   // 못갖춘마디: 첫 마디 앞에서 끝나도록
      let t=barStarts[0];
      for(let g=off-1;g>=0;g--){ t-=dur(gs[g]); put(gs[g],t,0,evType,baseMidi); }
    }
    for(let i=0;i<nb;i++){
      const g=gs[i+Math.max(0,off)];
      if(!g)break;
      if(Math.abs(dur(g)-P.beats)>0.75)drift++;
      put(g,barStarts[i],P.beats,evType,baseMidi);          // 마디마다 강제로 길이를 맞춘다
    }
  };

  for(const b of blocks){
    if(b.k==='mel'){
      if(b.clef==='bass'){ if(pendingBass)layMel(pendingBass,[],beat,0,'mb',48); pendingBass=b; }
      else { if(pendingMel)layMel(pendingMel,[],beat,0); pendingMel=b; }
      continue;
    }
    if(b.k!=='pairs')continue;

    const lineStart=beat, barStarts=[];
    let bar=[];
    const flush=()=>{ if(!bar.length)return;
      barStarts.push(beat);
      const per=P.beats/bar.length;
      bar.forEach(x=>{evs.push({type:'c',chord:x.chord,idx:x.idx,beats:per,at:beat});beat+=per;});
      bar=[]; };
    for(const pr of b.pairs){
      if(pr.bar){ if(hasBar)flush(); continue; }
      if(pr.chord){ bar.push(pr); if(!hasBar)flush(); }
    }
    flush();
    if(pendingMel){ layMel(pendingMel,barStarts,lineStart,beat-lineStart); pendingMel=null; }
    if(pendingBass){ layMel(pendingBass,barStarts,lineStart,beat-lineStart,'mb',48); pendingBass=null; }
  }
  if(pendingMel)layMel(pendingMel,[],beat,0);
  if(pendingBass)layMel(pendingBass,[],beat,0,'mb',48);

  /* 못갖춘마디가 0박 앞으로 나갔으면 전체를 밀어준다 */
  let minAt=0;
  for(const e of evs) if(e.at<minAt)minAt=e.at;
  if(minAt<0){ for(const e of evs)e.at-=minAt; beat-=minAt; }

  const total=Math.max(beat,1);
  if(P.click)for(let t=0;t<total;t+=1)
    evs.push({type:'k',at:t,strong:Math.round(t)%P.beats===0});
  evs.sort((a,b)=>a.at-b.at||(a.type==='k'?-1:1));
  return {evs,total,hasMel:melNotes>0,melNotes,bassNotes,drift};
}
function hasMelody(){return blocks.some(b=>b.k==='mel');}
function hasBassMelody(){return blocks.some(b=>b.k==='mel'&&b.clef==='bass');}
function schedule(){
  const ctx=AC(); if(!ctx)return;
  const now=ctx.currentTime;
  for(let guard=0;guard<400;guard++){
    const spb=60/P.bpm;
    if(P.k>=P.evs.length){
      const wrapT=P.cursorT+(P.total-P.lastAt)*spb, mv=maxVerse();
      if(P.vnext<mv){                      // 1절 끝 → 2절
        P.vnext++; P.vmarks.push({t:wrapT,v:P.vnext});
      }else if(P.loop){                    // 마지막 절 끝 → 처음부터
        P.vnext=1; P.vmarks.push({t:wrapT,v:1});
      }else{
        setTimeout(stopPlay,Math.max(0,(wrapT-now)*1000)+400);
        return;
      }
      P.cursorT=wrapT; P.lastAt=0; P.k=0;
    }
    const ev=P.evs[P.k], t=P.cursorT+(ev.at-P.lastAt)*spb;
    if(t>now+.25)return;
    if(ev.type==='c'){
      if(P.accomp!==false)strike(ctx,ev.chord,S.semis,instList(),t,ev.beats*spb*.96,ev.beats,spb);
      P.marks.push({t,idx:ev.idx});
    }else if(ev.type==='m'){
      if(P.melody)voice(ctx,P.melInst,ev.midi+S.semis+(P.melOct||0)*12,t,ev.beats*spb*.92,P.accomp===false?.6:.46,0);
    }else if(ev.type==='mb'){
      if(P.playBass)voice(ctx,'bass',ev.midi+S.semis,t,ev.beats*spb*.92,.4,0);
    }else{
      click(ctx,t,ev.strong);
    }
    P.cursorT=t; P.lastAt=ev.at; P.k++;
  }
}
function frame(){
  if(!P.playing){renderTime(0);return;}
  const ctx=actx; if(ctx){
    const now=ctx.currentTime;
    if(now-(P.lastT||0)>0.16){
      P.lastT=now;
      const total=songSeconds();
      let el=now-P.t0;
      if(P.loop&&total>0&&el>total)el=el%total;
      renderTime(el);
    }
    while(P.vmarks.length&&P.vmarks[0].t<=now){
      const v=P.vmarks.shift().v;
      if(S.verse!==v){S.verse=v;renderChart();renderToolbar();}
    }
    while(P.marks.length>1&&P.marks[1].t<=now)P.marks.shift();
    if(P.marks.length&&P.marks[0].t<=now&&P.marks[0].idx!==P.cur)mark(P.marks[0].idx);
  }
  requestAnimationFrame(frame);
}
function mark(idx){
  P.cur=idx;
  document.querySelectorAll('.ch.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('.lineblk.cur').forEach(e=>e.classList.remove('cur'));
  const el=document.querySelector('.ch[data-idx="'+idx+'"]');
  if(!el)return;
  el.classList.add('now');
  const line=el.closest('.lineblk'); if(line)line.classList.add('cur');
  const r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>window.innerHeight-190)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function startPlay(){
  const ctx=AC(); if(!ctx){toast('이 브라우저에서는 소리를 낼 수 없습니다.');return;}
  const tl=buildTimeline();
  if(!tl.evs.length){toast('재생할 내용이 없습니다.');return;}
  P.evs=tl.evs; P.total=tl.total;
  P.playing=true; P.k=0; P.lastAt=0; P.marks=[]; P.vmarks=[]; P.vnext=S.verse; P.cur=-1;
  P.t0=ctx.currentTime+.25;
  P.cursorT=ctx.currentTime+.25;
  clearInterval(P.timer);
  P.timer=setInterval(schedule,25);
  schedule(); requestAnimationFrame(frame);
  $('play').innerHTML='&#10073;&#10073;';
  wakeOn();
}
function stopPlay(){
  P.playing=false; clearInterval(P.timer); P.timer=null; P.marks=[]; P.vmarks=[]; P.cur=-1;
  document.querySelectorAll('.ch.now').forEach(e=>e.classList.remove('now'));

  /* 구간(절/후렴) 안에서는 원문 줄 구분과 무관하게 마디를 이어붙여
     한 줄에 4마디씩 보이도록 한다 — [Verse]/[Chorus] 같은 구간 표시나
     곡 끝에서만 끊는다. */
  let accMel=[], accCh=[], accLy={}, accFit=[], accBass=[];
  const flush=()=>{
    if(!accMel.length)return;
    const verses=Object.keys(accLy).map(Number).sort((a,b)=>a-b);
    const {svgs,count}=renderStaffSection(accMel,accCh,accLy,verses,measureNo,accFit,accBass);
    measureNo+=count;
    if(svgs.length){
      const box=document.createElement('div');
      box.className='staffline';
      box.style.width=Math.round((S.staffScale||1)*100)+'%';
      box.innerHTML=svgs.join('');
      el.appendChild(box);
    }
    accMel=[]; accCh=[]; accLy={}; accFit=[]; accBass=[];
  };
  for(const b of blocks){
    if(b.k==='mel'){ if(b.clef==='bass')pendBass=b; else pendMel=b; continue; }
    if(b.k==='blank'){ continue; }
    if(b.k==='sec'){ flush(); const d=document.createElement('div');d.className='section';d.textContent=b.text;el.appendChild(d);continue; }
    const {melM,chM,lyM,verses,N,fitM}=measuresOfBlock(pendMel,b);
    const {melM:bassM}=measuresOfBlock(pendBass,b,N);
    pendMel=null; pendBass=null;
    if(!N)continue;
    const priorLen=accMel.length;
    accMel=accMel.concat(melM); accCh=accCh.concat(chM); accFit=accFit.concat(fitM); accBass=accBass.concat(bassM);
    const known=new Set(Object.keys(accLy).map(Number)); verses.forEach(v=>known.add(v));
    known.forEach(v=>{
      if(!accLy[v])accLy[v]=new Array(priorLen).fill(0).map(()=>[]);

  });

const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* 원하는 지점부터 다시 재생 */
function seekTo(sec){
  const ctx=AC(); if(!ctx)return;
  const tl=buildTimeline();
  if(!tl.evs.length)return;
  const spb=60/P.bpm, pass=tl.total, mv=Math.max(1,maxVerse());
  const total=pass*spb*mv;
  sec=Math.max(0,Math.min(total-0.05,sec));
  const beat=sec/spb;
  const vi=Math.min(mv-1,Math.floor(beat/pass)), inPass=beat-vi*pass;
  if(!P.playing){ S.verse=vi+1; startPlay(); }
  P.evs=tl.evs; P.total=tl.total;
  let k=0; while(k<P.evs.length&&P.evs[k].at<inPass)k++;
  P.k=k; P.lastAt=inPass; P.vnext=vi+1;
  P.cursorT=ctx.currentTime+0.08;
  P.t0=P.cursorT-sec;
  P.marks=[]; P.vmarks=[]; P.cur=-1;
  if(S.verse!==vi+1){S.verse=vi+1;renderChart();renderToolbar();}
  renderTime(sec);
}
function seekToChord(idx){
  const tl=buildTimeline();
  const e=tl.evs.find(x=>x.type==='c'&&x.idx===idx);
  if(!e)return false;
  const spb=60/P.bpm, vi=Math.max(0,S.verse-1);
  seekTo((vi*tl.total+e.at)*spb);
  return true;
}

const PAGE_W=1240, RATIO=1.41428;
const CMONO="ui-monospace,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic',monospace";
const CSANS="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";

function subtitle(){

function chartCanvas(){
  const M=78,W=PAGE_W,maxW=W-M*2,CH=27,LY=27,LINE=74,GAP=14,sm=chordSemis(),p=pref();
  const probe=document.createElement('canvas').getContext('2d');
  const cf='700 '+CH+'px '+CMONO, lf=LY+'px '+CMONO;
  const ops=[]; let y=M;
  ops.push({t:'title',x:M,y:y+40,s:$('title').value.trim()||'제목 없음'}); y+=62;
  ops.push({t:'sub',x:M,y:y+18,s:subtitle()}); y+=54;
  for(const b of blocks){
    if(b.k==='blank'){y+=LINE*.42;continue;}
    if(b.k==='sec'){y+=26;ops.push({t:'sec',x:M,y:y+18,s:b.text.toUpperCase()});y+=30;ops.push({t:'rule',x:M,y,w:maxW});y+=20;continue;}
    if(b.k==='mel')continue;
    let x=M;
    for(const pr of pairsForVerse(b,S.verse)){
      if(pr.bar){ if(x>M){ops.push({t:'bar',x:x+5,y});x+=16;} continue; }
      const label=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;
      probe.font=cf; const cw=label?probe.measureText(label).width+GAP:0;
      probe.font=lf; const tw=probe.measureText(pr.text).width;
      const w=Math.max(cw,tw);
      if(x>M&&x+w>M+maxW){x=M;y+=LINE;}
      if(label)ops.push({t:'ch',x,y:y+CH,s:label});
      if(pr.text)ops.push({t:'ly',x,y:y+CH+LY+6,s:pr.text});
      x+=w;
    }
    y+=LINE;
  }
  const H=Math.max(Math.ceil(y+M),Math.ceil(PAGE_W*RATIO));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.textBaseline='alphabetic';
  for(const o of ops){
    if(o.t==='title'){c.font='700 46px '+CSANS;c.fillStyle='#111';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='sub'){c.font='500 24px '+CSANS;c.fillStyle='#6B7683';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='sec'){c.font='700 20px '+CSANS;c.fillStyle='#A32E3E';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='rule'){c.fillStyle='#D8D2C6';c.fillRect(o.x,o.y,o.w,1);}
    else if(o.t==='bar'){c.fillStyle='#B9AF9C';c.fillRect(o.x,o.y+2,2,66);}
    else if(o.t==='ch'){c.font=cf;c.fillStyle='#000';c.fillText(o.s,o.x,o.y);}
    else {c.font=lf;c.fillStyle='#222';c.fillText(o.s,o.x,o.y);}
  }
  return cv;
}

    const co='q '+W+' 0 0 '+H+' 0 0 cm /I0 Do Q';
    mark(ct);str(ct+' 0 obj\n<</Length '+co.length+'>>\nstream\n'+co+'\nendstream\nendobj\n');
    mark(im);str(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.bytes.length+'>>\nstream\n');
    push(p.bytes);str('\nendstream\nendobj\n');
  });
  const xp=len,total=3+N*3;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)x+=String(off[n]||0).padStart(10,'0')+' 00000 n \n';
  str(x);str('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xp+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length}
  return out;
}
function pdfBytes(cv){
  const ph=Math.round(cv.width*RATIO),n=Math.max(1,Math.ceil(cv.height/ph)),pages=[];
  for(let i=0;i<n;i++){
    const s=document.createElement('canvas');s.width=cv.width;s.height=ph;
    const c=s.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,s.width,s.height);
    c.drawImage(cv,0,i*ph,cv.width,ph,0,0,cv.width,ph);
    pages.push({bytes:b64bytes(s.toDataURL('image/jpeg',.92).split(',')[1]),w:s.width,h:s.height});
  }
  return buildPdf(pages);
}

/* 캔버스 하나를 원하는 최대 변 길이로 맞춰 만든다(그레이스케일·대비 보정 포함) */
function fitCanvas(img,cap){
  const sc=Math.min(1,cap/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  const c=cv.getContext('2d');
  c.filter='grayscale(1) contrast(1.25) brightness(1.05)';
  c.drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',.9);
}
async function prepImage(f){
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl});
  const out=fitCanvas(img,1600);
  /* OCR(무료·키 없이 읽기)은 AI 인식과 달리 이미지 크기 제한이 없다 — 작은 글자가 많은
     찬송가 등은 해상도가 정확도를 크게 좌우해서, 원본을 덜 줄인 별도 사본을 하나 더 만들어 둔다. */
  const ocrOut=fitCanvas(img,2200);
  return {url:out,b64:out.split(',')[1],ocrUrl:ocrOut};
}

/* 오선이 모인 줄(단)을 찾아 한 단씩 잘라낸다.
   한 번에 보는 음표가 줄면 음높이 인식이 훨씬 정확해진다. */
function splitSystems(url,targetW){
  return new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const W=img.width,H=img.height;
        const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
        const d=ctx.getImageData(0,0,W,H).data;
        const rows=new Float32Array(H);
        for(let y=0;y<H;y++){
          let c=0,o=y*W*4;
          for(let x=0;x<W;x++){const i=o+x*4;
            if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)<150)c++;}
          rows[y]=c/W;
        }
        const isLine=y=>rows[y]>0.45;              // 가로로 길게 이어진 줄 = 오선
        const bands=[]; let st=-1;
        for(let y=0;y<H;y++){
          if(isLine(y)){ if(st<0)st=y; }
          else if(st>=0){ bands.push([st,y]); st=-1; }
        }
        if(st>=0)bands.push([st,H-1]);
        // 가까운 오선들을 한 단으로 묶는다
        const sys=[]; let cur=null;
        for(const [a,b] of bands){
          if(cur&&a-cur[1]<H*0.045){ cur[1]=b; }
          else { if(cur)sys.push(cur); cur=[a,b]; }
        }
        if(cur)sys.push(cur);
        const good=sys.filter(x=>x[1]-x[0]>H*0.008);
        if(good.length<2||good.length>14){ res(null); return; }
        const out=[];
        for(let i=0;i<good.length;i++){
          const prevEnd=i>0?good[i-1][1]:0;
          const nextStart=i<good.length-1?good[i+1][0]:H;
          const top=Math.max(0,Math.floor((good[i][0]+prevEnd)/2)-6);
          const bot=Math.min(H,Math.ceil((good[i][1]+nextStart)/2)+6);
          const hh=bot-top; if(hh<20)continue;
          const sc=Math.min(3,(targetW||1400)/W);
          const c2=document.createElement('canvas');
          c2.width=Math.round(W*sc); c2.height=Math.round(hh*sc);
          const x2=c2.getContext('2d');
          x2.fillStyle='#fff'; x2.fillRect(0,0,c2.width,c2.height);
          x2.filter='grayscale(1) contrast(1.2)';
          x2.drawImage(img,0,top,W,hh,0,0,c2.width,c2.height);
          const u=c2.toDataURL('image/jpeg',.92);
          out.push({url:u,b64:u.split(',')[1]});
        }
        res(out.length>=2?out:null);
      }catch(e){ res(null); }
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}
