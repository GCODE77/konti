<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131A23">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>콘티 — 코드 차트 이조기</title>
<style>
:root{
  --ink:#10161E; --raise:#1B242F; --line:#2B3744; --paper:#F2EEE6;
  --dim:#8D9AA8; --brass:#F0B95E; --ribbon:#A32E3E; --mint:#7FC8A9;
  --ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,'D2Coding',monospace;
}
html[data-theme="light"]{
  color-scheme:light;
  --ink:#FBFAF7; --raise:#FFFFFF; --line:#DFD9CC; --paper:#1A1F26;
  --dim:#6B7683; --brass:#9A6B15; --ribbon:#A32E3E; --mint:#2F7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);display:flex;flex-direction:column;min-height:100%}
button,input,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.scroll::-webkit-scrollbar{width:0;height:0}

header{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid var(--line);padding:10px 14px 12px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
#title{background:none;border:none;color:var(--paper);font-size:17px;font-weight:700;flex:1;min-width:0;outline:none;padding:0}
.btn{background:none;color:var(--paper);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.btn.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:3px 9px;font-size:11px}
.btn.step{padding:6px 12px;font-size:16px;line-height:1}

#rail{flex:1;display:flex;gap:2px;overflow-x:auto;padding:2px 0 6px}
.key{flex:1 0 auto;min-width:38px;padding:7px 4px 6px;border:none;border-bottom:2px solid transparent;background:none;color:var(--dim);font-family:var(--mono);font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;transition:background .15s,color .15s}
.key.orig{border-bottom-color:var(--ribbon)}
.key.on{background:var(--brass);color:var(--ink);font-weight:700}
#meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
#meta b{font-size:13px}

main{flex:1;padding:16px 8px;padding-bottom:calc(var(--footh,182px) + 18px);
  font-family:var(--mono);line-height:1.5}
.section{break-inside:avoid;margin:32px 0 14px 9px;display:inline-block;padding:4px 12px;border-radius:999px;
  background:var(--ribbon);color:#fff;font-family:var(--ui);font-size:12px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase}
.section:first-child{margin-top:0}
.lineblk{break-inside:avoid;margin:0 0 6px;padding:6px 9px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;
  border-radius:9px;transition:background .18s}
.lineblk.cur{background:rgba(240,185,94,.10)}
.lineblk+.lineblk{margin-top:6px}
.pair{display:inline-block;vertical-align:bottom}
.ch{display:block;color:var(--brass);font-weight:800;letter-spacing:.01em;padding-right:9px;white-space:pre;line-height:1.3;cursor:pointer;transition:transform .12s}
.ch.plain{cursor:default}
.ly{display:block;white-space:pre-wrap}
/* 원본 사진 보기. 인식 결과를 못 믿을 때 결국 눈으로 보는 건 원본이다 —
   그래서 사진을 그대로 띄우고, 재생 위치를 사진 위에 하이라이트로 얹는다. */
.origwrap{margin:0 0 6px;overflow-x:auto;overscroll-behavior-x:contain}
/* 크게 보기 — 사진을 키우고 지금 치는 마디를 가운데로 끌고 다닌다 */
.origwrap.zoom .origpg{max-width:none;width:calc(100% * var(--szoom,1))}
.sheetbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.sheetbar .btn{padding:7px 13px;font-size:12.5px}
.origpg{position:relative;margin:0 auto 14px;max-width:1000px;line-height:0}
.origpg img{width:100%;height:auto;display:block;border-radius:8px}
.origsys{position:absolute;left:0;right:0;cursor:pointer;border-radius:5px;
  transition:background .18s linear,box-shadow .18s linear}
.origsys:hover{background:rgba(240,185,94,.14)}
.origsys.on{background:rgba(240,185,94,.26);box-shadow:inset 0 0 0 2px var(--brass)}
.origsys .lab{position:absolute;left:4px;top:2px;font-size:10px;line-height:1;color:var(--ink);
  background:var(--brass);border-radius:4px;padding:2px 5px;font-weight:700;opacity:0;transition:opacity .15s}
.origsys.on .lab,.origsys:hover .lab{opacity:.95}
.origline{position:absolute;top:0;bottom:0;width:3px;background:var(--ribbon);
  box-shadow:0 0 7px var(--ribbon);display:none;pointer-events:none}
.origsys.on .origline{display:block}
.orignote{font-size:13px;line-height:1.55;color:var(--dim);margin:0 0 12px;padding:0 2px}
/* 음표 고치기 — 고치는 단추를 위에 붙여 두고(sticky), 오선보는 확대하지 않는다 */
.noteedit{position:sticky;top:0;z-index:2;background:var(--raise);padding-bottom:6px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
.noteedit .fontset button[disabled]{opacity:.3;cursor:default}
#staffbox{background:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:8px 6px;max-height:42vh;overflow:auto}
#staffbox svg{max-width:760px;margin:0 auto}
/* 마디 상자·건반 (v52) — 사진 위에 '지금 몇째 마디'를 그리고,
   그 아래 건반에 '지금 어느 음'을 켜 둔다. */
.origbar{position:absolute;top:0;bottom:0;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .1s}
.origbar.now{opacity:1;background:rgba(163,46,62,.26);box-shadow:inset 0 0 0 2px var(--ribbon)}
.origsys .mno{position:absolute;left:3px;top:1px;font-size:9px;font-weight:800;color:var(--ribbon);
  background:rgba(255,255,255,.82);border-radius:3px;padding:0 3px;line-height:1.5;opacity:0}
.origbar.now .mno{opacity:1}
#pianowrap{display:none;padding:0 10px 4px}
body.piano-on #pianowrap{display:block}
#pianolab{display:flex;align-items:center;gap:7px;font-family:var(--ui);font-size:11.5px;
  color:var(--dim);line-height:1.5;padding:3px 2px 4px;min-height:20px;white-space:nowrap;overflow:hidden}
#pianolab b{color:var(--brass);font-size:14px}
#pianolab .mn{color:var(--paper);font-weight:800}
#pianolab .mel{color:#fff;background:var(--ribbon);border-radius:999px;padding:1px 9px;font-weight:800}
#pianolab .lg{margin-left:auto;display:flex;align-items:center;gap:4px;opacity:.8;font-size:10.5px}
#pianolab .lg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:6px}
#pianolab .lg i.m{background:var(--ribbon)}
#pianolab .lg i.c{background:#5C8CB5}
#piano{display:block;width:100%;height:auto}
#piano .wk{fill:#F7F4EE;stroke:#8A929B;stroke-width:.5}
#piano .bk{fill:#1A222B;stroke:#000;stroke-width:.5}
#piano .wk.on,#piano .bk.on{fill:var(--ribbon)}
#piano .wk.onc,#piano .bk.onc{fill:#5C8CB5}
#piano .kl{font-family:var(--ui);font-weight:800;fill:#fff;text-anchor:middle;opacity:0}
#piano .on+.kl,#piano .onc+.kl{opacity:1}
#piano .oc{font-family:var(--ui);fill:#9AA5B1;text-anchor:middle}
.staffline{overflow-x:auto;margin:0 0 14px;padding:2px 0 0}
.suspect{border:1px solid var(--ribbon);border-radius:10px;padding:8px 11px;margin:0 0 12px;
  font-size:13px;line-height:1.5;color:var(--paper);background:color-mix(in srgb,var(--ribbon) 12%,transparent)}
.staffline::-webkit-scrollbar{height:0}
/* ── 채보 오선보 위 재생 위치 (v60). 마디 음영 + 지금 치는 음 ──
   ★ 둘 다 음표 **뒤에** 깔려 있다. 위에 덮으면 정작 읽어야 할 음표가 흐려진다. */
.mbox{fill:var(--brass);fill-opacity:0;stroke:var(--brass);stroke-opacity:0;stroke-width:1.5;transition:fill-opacity .12s,stroke-opacity .12s}
.mbox.on{fill-opacity:.085;stroke-opacity:.5}
.nowbox{fill:var(--brass);opacity:0}
.nowbox.on{opacity:.3}
#chart text[data-cidx].now{fill:var(--ribbon);font-size:19px}
.meas{display:inline-flex;align-items:flex-end;border-left:2px solid var(--line);
  padding:0 0 0 10px;margin:0 10px 10px 0;border-radius:2px}
.meas:first-child{border-left-color:var(--brass);opacity:1}
.lineblk.cur .meas{border-left-color:var(--brass)}
.capo{break-inside:avoid;margin-bottom:14px;padding:8px 12px;border:1px dashed var(--mint);border-radius:8px;font-size:12px;font-family:var(--ui);color:var(--mint)}

/* ── 아래 단추줄 (v60에서 10개 → 5개로 묶었다) ──
   사용자 요청: *"메뉴 가시성, 가독성 아주 좋게로 마무리"*. 반주자는 보면대 위 60cm 거리에서
   연주하며 이걸 누른다. 그래서 (가) 글자를 키우고(13 → 14.5px) 굵게, (나) 누르는 면적을
   키우고(높이 44px 이상 — 손가락 최소 크기), (다) **자주 쓰는 것만 밖에** 두고 나머지는
   안으로 넣었다. 보기 전환 셋은 하나의 묶음 단추(.seg)로 합쳐 지금 어느 화면인지가
   **켜진 칸 하나**로 바로 보이게 했다(예전엔 단추 세 개의 켬/끔을 눈으로 조합해야 했다). */
nav{border-top:1px solid var(--line);padding:10px 10px 12px;display:flex;gap:8px;
  flex-wrap:wrap;justify-content:center;align-items:stretch}
nav .btn{flex:0 1 auto;min-width:96px;text-align:center;padding:12px 14px;
  font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
nav .ni{font-size:15px;line-height:1;opacity:.75}
nav .btn.on .ni{opacity:1}
/* 보기 전환 — 칸 셋이 붙어 있는 하나의 단추 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:none}
.seg button{background:none;border:none;border-right:1px solid var(--line);color:var(--dim);
  font-family:var(--ui);font-size:14.5px;font-weight:700;padding:12px 15px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brass);color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:default}
@media (max-width:520px){
  /* 휴대폰에서는 두 줄로 — 보기 전환이 한 줄을 다 쓰고(가장 자주 누른다), 나머지 넷이 아랫줄.
     ★ order 로 올린다. DOM 순서를 바꾸면 넓은 화면에서 '가져오기'가 가운데로 가 버린다. */
  nav{padding:8px 8px 10px;gap:6px}
  nav .btn{min-width:0;flex:1 1 auto;padding:12px 8px;font-size:13.5px}
  .seg{flex:1 1 100%;order:-1}
  .seg button{flex:1;padding:12px 4px;font-size:13.5px}
}

#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#scrim.open{display:flex}
/* ★ 음표를 고치는 동안에는 **악보를 가리지 않는다**(v67, 사용자 신고:
   *"모바일의 경우 음표 수정을 하려고 하니 창이 가려져서 보이지 않아 수정하기가 어렵다"*).
   고치는 화면은 위 악보를 보면서 쓰는 화면인데, 여태 검은 막(50%)을 깔고 창이 화면의
   86%까지 올라와 정작 고치는 대상이 안 보였다. 고칠 때만 ① 막을 걷고 ② 창을 화면 아래
   44%로 낮추고 ③ 막을 **투과**시켜 위 악보의 음표를 바로 눌러 고를 수 있게 한다.
   body.editing 의 아래 여백은 마지막 단도 창 위로 끌어올릴 수 있게 하는 자리다. */
#scrim.edit{background:rgba(0,0,0,0);pointer-events:none}
#scrim.edit #sheet{pointer-events:auto;max-height:44vh;box-shadow:0 -12px 30px rgba(0,0,0,.55)}
body.editing main{padding-bottom:calc(var(--footh,182px) + 46vh)}
/* 고른 음표 표시 — 색만 바꾸면 작은 화면에서 안 보인다. 상자·테두리·▼ 커서 셋으로 알린다 */
.selbox{fill:var(--brass);opacity:.18;animation:selpulse 1.7s ease-in-out infinite}
.selring{fill:none;stroke:var(--brass);stroke-width:1.6;opacity:.85}
.selcur{fill:var(--brass);opacity:.95}
@keyframes selpulse{0%,100%{opacity:.13}50%{opacity:.3}}
#sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--raise);border-top:2px solid var(--brass);border-radius:14px 14px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ptabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
  font-family:var(--ui);font-size:14.5px;font-weight:700;padding:9px 13px 10px;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s}
.ptabs button.on{color:var(--brass);border-bottom-color:var(--brass)}
.note{font-size:12.5px;color:var(--dim);line-height:1.7;margin:0 0 12px}
.field{background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;width:100%;outline:none}
textarea.field{font-family:var(--mono);min-height:220px;line-height:1.5;resize:vertical}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.btn.lg{padding:15px 20px;font-size:15px;font-weight:800;border-radius:14px}
.btn.wide{flex:1;text-align:center}
label.btn.wide{justify-content:center}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rowline b{font-size:14px;font-weight:700}
.rowline small{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-weight:400}
.more{background:none;border:none;color:var(--brass);font-size:13px;font-weight:700;padding:14px 0 4px;cursor:pointer;font-family:var(--ui)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.keys button{background:var(--ink);border:1px solid var(--line);color:var(--brass);border-radius:9px;
  padding:10px 13px;font-family:var(--mono);font-size:14px;font-weight:700;cursor:pointer}
.callout{padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.callout.err{border:1px solid var(--ribbon);color:var(--ribbon)}
.callout.ok{border:1px dashed var(--mint);color:var(--mint)}
.callout.work{color:var(--brass);display:flex;align-items:center;gap:9px}
.spin{width:13px;height:13px;border:2px solid var(--brass);border-top-color:transparent;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#preview{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.drop{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;font-size:12.5px;color:var(--dim);line-height:1.7}
.rowlist{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rowlist button.load{flex:1;text-align:left;background:none;border:none;color:var(--paper);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.rowlist small{display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px}

footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raise);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#progwrap{padding:0 12px;display:flex;align-items:center;gap:9px}
#track{flex:1;height:16px;display:flex;align-items:center;cursor:pointer;position:relative}
#track::before{content:'';position:absolute;left:0;right:0;height:5px;background:var(--line);border-radius:3px}
#bar-fill{position:relative;height:5px;width:0;background:var(--brass);border-radius:3px}
#bar-fill{height:100%;width:0;background:var(--brass);border-radius:2px;transition:width .12s linear}
#time{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;letter-spacing:.02em;min-width:86px;text-align:right}
#transport{display:flex;align-items:center;gap:8px;padding:6px 12px 6px}
#play{width:44px;height:36px;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tempo{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px}
.tempo button{background:none;border:none;color:var(--paper);font-size:15px;width:26px;height:28px;cursor:pointer}
.tempo input{font-family:var(--mono);font-size:14px;width:46px;text-align:center;font-weight:700;background:none;border:none;color:var(--paper);outline:none;padding:2px 0;-moz-appearance:textfield}
.tempo input::-webkit-outer-spin-button,.tempo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tempo input:focus{color:var(--brass)}
.tempo .unit{font-size:10px;color:var(--dim);padding-right:4px;letter-spacing:.08em}
#instbtn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch.now{background:var(--brass);color:var(--ink);border-radius:5px;padding-left:5px;margin-left:-5px;
  transform:scale(1.06);transform-origin:left bottom;box-shadow:0 0 0 3px rgba(214,163,84,.18)}
.opts{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 16px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;display:block;margin-bottom:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{display:inline-flex;align-items:center}
.rawfile{display:block;width:100%;margin:10px 0 4px;font-size:12.5px;color:var(--paper);
  background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px}
.rawfile::-webkit-file-upload-button{background:var(--line);color:var(--paper);border:0;
  border-radius:6px;padding:6px 10px;margin-right:10px;font-family:var(--ui);font-size:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.thumb{position:relative;flex:0 0 auto;width:104px}
.thumb img{width:100%;height:132px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);display:block;background:#fff}
.thumb .n{position:absolute;left:5px;top:5px;background:var(--brass);color:var(--ink);font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}
.thumb .x{position:absolute;right:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;cursor:pointer}
#camwrap{display:none;margin-top:12px}
#cam{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
body.focus header{display:none}
body.focus nav{display:none}
body.focus main{padding:14px 12px;padding-bottom:calc(var(--footh,96px) + 14px)}
body.focus #transport{padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
#focusout{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:35;display:none}
body.focus #focusout{display:block}
#errbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--ribbon);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:12.5px;line-height:1.6;display:none}
#errbar b{display:block;font-size:13px;margin-bottom:3px}
.fontset{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.fontset button{background:none;border:none;color:var(--paper);font-family:var(--ui);
  font-size:16px;font-weight:800;padding:10px 15px;cursor:pointer}
.fontset span{font-family:var(--mono);font-size:12.5px;color:var(--dim);min-width:26px;text-align:center}
#toast{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);z-index:50;background:var(--brass);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;max-width:90vw;text-align:center;display:none}
#toast.show{display:block}
#workbar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--brass);color:var(--ink);
  padding:8px 14px;font-size:12.5px;font-weight:700;display:none;align-items:center;gap:8px;
  cursor:pointer;border:none;width:100%;text-align:left;font-family:var(--ui)}
#workbar.show{display:flex}
/* 인식 결과 알림. 누를 때까지 사라지지 않는다 — toast 는 2.4초 뒤 없어져서
   사용자가 놓치면 성공했는지 실패했는지 알 방법이 아예 없었다. */
#result{position:fixed;left:0;right:0;top:0;z-index:70;display:none;padding:12px 14px;
  border-bottom:2px solid;font-size:14px;line-height:1.55;background:var(--raise);color:var(--paper)}
#result.show{display:block}
#result.ok{border-color:var(--mint)}
#result.warn{border-color:var(--brass)}
#result.err{border-color:var(--ribbon)}
#result .rtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;margin:0 34px 0 0}
#result.ok .rtitle{color:var(--mint)} #result.warn .rtitle{color:var(--brass)} #result.err .rtitle{color:var(--ribbon)}
#result .rbody{margin-top:5px;opacity:.9}
#result .racts{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
#result .racts button{background:var(--ink);color:var(--paper);border:1px solid var(--line);
  border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
#result .racts button.pri{background:var(--brass);color:var(--ink);border-color:var(--brass)}
#result .rx{position:absolute;top:8px;right:9px;background:none;border:none;color:var(--dim);
  font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
#workbar .spin{border-color:var(--ink);border-top-color:transparent;flex:0 0 auto}

@media print{
  header,footer,#scrim,#toast,#workbar,#result,.noprint{display:none!important}
  body{background:#fff!important;color:#000!important}
  main{padding:0!important}
  .ch{color:#000!important;font-weight:700}
  .section{color:#000!important;border-color:#000!important}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

<script>
window.onerror=function(msg,src,ln){
  try{
    var e=document.getElementById('errbar');
    if(e){e.style.display='block';
      e.innerHTML='<b>문제가 생겼습니다'+(typeof APP_VER!=='undefined'?' (v'+APP_VER+')':'')+'</b>'
        +String(msg)+' · '+ln+'행<br>주소 끝에 <b>?v=새숫자</b>를 붙여 새로고침하면 대부분 해결됩니다.';}
  }catch(x){}
  return false;
};
/* ============ 배포 설정 ============
   SCAN_ENDPOINT 를 비워두면: 사진 인식에 사용자 각자의 API 키가 필요하다(개인용).
   여기에 배포한 주소를 넣으면: 사용자는 키 없이 그냥 쓴다(공개용). worker.js 참고.
   예) const SCAN_ENDPOINT = "https://konti-scan.내계정.workers.dev";
*/
const SCAN_ENDPOINT = "";
const APP_VER = "68";
/* file:// 나 content:// 로 열면 브라우저가 외부 호출을 막는다(CORS). 미리 알려준다. */
const LOCAL_FILE = !/^https?:$/.test(location.protocol);
/* Claude 앱처럼 iframe 안에서 실행 중이면 키 없이도 인식이 통한다. */
let IN_FRAME=false; try{IN_FRAME=window.self!==window.top;}catch(e){IN_FRAME=true;}

/* ============ 음악 이론 ============ */
const PCM={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, ACC={'#':1,'♯':1,'b':-1,'♭':-1,'':0};
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const PREF=['sharp','flat','sharp','flat','sharp','flat','flat','sharp','flat','sharp','flat','sharp'];
const DEG={0:'1',1:'b2',2:'2',3:'b3',4:'3',5:'4',6:'#4',7:'5',8:'b6',9:'6',10:'b7',11:'7'};
const SHAPES=[7,0,2,9,4];
const CHORD_RE=/^([A-G])([#♯b♭]?)([^/\s]*?)(?:\/([A-G])([#♯b♭]?))?$/;
const PASS=/^(\||\|\||:\||\|:|-|—|%|x\d+|\(?\d+x\)?|N\.?C\.?|\/+)$/i;
/* 코드 접미사로 허용되는 조각만 나열한다. Chorus/Bridge/Ending 이 코드로 잡히던 문제 방지 */
const SUFFIX_RE=/^(?:maj|min|sus|add|dim|aug|m|M|Δ|°|\+|-|\(|\)|[#b♯♭]|\d)*$/;
const mod=n=>((n%12)+12)%12;
const nm=(pc,p)=>(p==='flat'?FLAT:SHARP)[mod(pc)];

function parseChord(t){
  if(!t)return null;
  const m=t.match(CHORD_RE); if(!m)return null;
  const[,l,a,sfx='',bl,ba]=m;
  if(/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(sfx))return null;
  if(sfx.length>9)return null;
  if(sfx&&!SUFFIX_RE.test(sfx))return null;
  return{root:mod(PCM[l]+(ACC[a]||0)),suffix:sfx,bass:bl?mod(PCM[bl]+(ACC[ba]||0)):null};
}
const showChord=(c,s,p)=>nm(c.root+s,p)+c.suffix+(c.bass===null?'':'/'+nm(c.bass+s,p));
const showNum=(c,k)=>DEG[mod(c.root-k)]+c.suffix+(c.bass===null?'':'/'+DEG[mod(c.bass-k)]);

/* ============ 차트 파싱 ============ */
function isSection(l){
  const t=l.trim(); if(!t)return false;
  if(/^[[<(].{1,24}[\]>)]$/.test(t)&&!parseChord(t.slice(1,-1)))return true;
  return /^(intro|verse|pre|prechorus|pre-chorus|chorus|bridge|tag|ending|outro|interlude|간주|후렴|절|브릿지|전주|후주)\s*\d*\s*[:)\].]?$/i.test(t);
}
function isChordLine(l){
  const t=l.trim().split(/\s+/).filter(Boolean); if(!t.length)return false;
  let n=0; for(const x of t){ if(PASS.test(x))continue; if(!parseChord(x))return false; n++; }
  return n>0;
}
const MEL_RE=/^\s*[♪♫]\s*\S/;
const NOTE_RE=/^(?:(r)|([A-G])([#♯b♭]?)(-?\d))(?::([\d.]+))?$/i;
const SOL={'도':0,'레':2,'미':4,'파':5,'솔':7,'라':9,'시':11};
const SOL_RE=/^([#♯b♭]?)([도레미파솔라시])([#♯b♭]?)(-?\d)?(?::([\d.]+))?$/;
const DEG_RE=/^([#♯b♭]?)([1-7])([v^]?)(?::([\d.]+))?$/;
const DEG_SEMI={1:0,2:2,3:4,4:5,5:7,6:9,7:11};
function parseMelody(line){
  const out=[];
  for(const t of line.trim().replace(/^[♪♫]\s*/,'').split(/\s+/)){
    if(/^\|+$/.test(t)){ out.push({bar:true}); continue; }
    const sm=t.match(SOL_RE);
    if(sm){
      const beats=sm[5]?parseFloat(sm[5]):1;
      const oct=sm[4]?parseInt(sm[4],10):4;
      const midi=(oct+1)*12+SOL[sm[2]]+(ACC[sm[1]]||0)+(ACC[sm[3]]||0);
      if(beats>0&&midi>=12&&midi<=108)out.push({midi,beats});
      continue;
    }
    const dm=t.match(DEG_RE);
    if(dm){
      const beats=dm[4]?parseFloat(dm[4]):1;
      if(beats>0)out.push({deg:DEG_SEMI[dm[2]]+(ACC[dm[1]]||0),
        oct:(dm[3]==='^'?1:dm[3]==='v'?-1:0),beats});
      continue;
    }
    const m=t.match(NOTE_RE); if(!m)continue;
    const beats=m[5]?parseFloat(m[5]):1;
    if(!isFinite(beats)||beats<=0)continue;
    if(m[1]){out.push({rest:true,beats});continue;}
    const midi=(parseInt(m[4],10)+1)*12+PCM[m[2].toUpperCase()]+(ACC[m[3]]||0);
    if(midi>=12&&midi<=108)out.push({midi,beats});
  }
  return out;
}
/* ============ 멜로디 음높이 보정 ============
   사진에서 음높이를 읽을 때 가장 흔한 오류는 "옥타브"다 — 오선 위 음표 머리의 자리는
   맞게 봤는데 덧줄 개수를 잘못 세서 C4를 C5로 적는 식이다. 찬양 멜로디는 앞 음에서
   5도를 넘겨 뛰는 일이 드물고 옥타브 넘게 뛰었다가 곧 돌아오는 일은 거의 없다.
   그래서 음이름(도·레·미)은 그대로 두고 옥타브만 옮겨 봤을 때 도약이 사라지는 음은
   옥타브 오독으로 보고 고친다. 음이름은 절대 바꾸지 않는다 — 그건 판단 근거가 없다.

   비터비(동적 계획법)로 선율 전체의 "부자연스러움"을 한 번에 최소화한다.
   - 옮기지 않는 것이 기본이고 옮기면 벌점을 준다(뚜렷한 이유가 있을 때만 움직이도록)
   - 5도를 넘는 도약에만 벌점을 준다
   - 사람이 부르거나 반주로 치는 현실적인 음역을 벗어나면 벌점을 준다
   그래서 앞뒤가 다 높은 진짜 옥타브 도약은 그냥 두고, 혼자 튀는 한 음만 제자리로 온다. */
const MEL_RANGE={treble:[55,86],bass:[35,64]};   // G3~D6 / B1~E4
function repairOctaves(nts,clef){
  const ix=[]; nts.forEach((n,i)=>{ if(!n.bar&&!n.rest&&n.midi!==undefined)ix.push(i); });
  if(ix.length<2)return nts;
  const [LO,HI]=MEL_RANGE[clef==='bass'?'bass':'treble'];
  const SHIFT=[-24,-12,0,12,24], SHIFT_PEN=[12,6,0,6,12];
  const rangePen=m=>(m<LO?LO-m:m>HI?m-HI:0)*3;
  const leapPen=d=>Math.max(0,Math.abs(d)-7)*2;
  const inRange=m=>m>=LO&&m<=HI;
  /* 첫 음과 마지막 음은 이웃이 한쪽뿐이라 "혼자 튀었다"는 증거가 없다. 도약을 줄인다는
     이유만으로 건드리면 진짜 옥타브 도약에서 엉뚱하게 첫 음을 끌어내린다 — 실제로
     [60,72,74,...] 를 [72,72,74,...] 로 망치는 걸 테스트에서 잡았다.
     그래서 양 끝 음은 음역을 벗어난 경우에만 옮길 수 있게 둔다. */
  const openAt=k=>(k>0&&k<ix.length-1)||!inRange(nts[ix[k]].midi);
  const cand=ix.map(i=>SHIFT.map(d=>nts[i].midi+d));
  const NS=SHIFT.length;
  const allow=(k,s)=>SHIFT[s]===0||openAt(k);
  const INF=1e9;
  let cost=cand[0].map((m,s)=>allow(0,s)?SHIFT_PEN[s]+rangePen(m):INF);
  const back=[];
  for(let k=1;k<ix.length;k++){
    const nc=new Array(NS).fill(INF), bk=new Array(NS).fill(0);
    for(let s=0;s<NS;s++){
      if(!allow(k,s))continue;
      const base=SHIFT_PEN[s]+rangePen(cand[k][s]);
      for(let p=0;p<NS;p++){
        if(cost[p]>=INF)continue;
        const c=cost[p]+base+leapPen(cand[k][s]-cand[k-1][p]);
        if(c<nc[s]){nc[s]=c;bk[s]=p;}
      }
    }
    back.push(bk); cost=nc;
  }
  let s=0; for(let i=1;i<NS;i++)if(cost[i]<cost[s])s=i;
  const pick=new Array(ix.length); pick[ix.length-1]=s;
  for(let k=ix.length-1;k>0;k--)pick[k-1]=back[k-1][pick[k]];
  let changed=0; pick.forEach(p=>{ if(SHIFT[p]!==0)changed++; });
  if(!changed)return nts;
  /* 절반 이상을 옮겨야 한다면 "한두 음이 튀었다"는 가정이 틀린 것이니 손대지 않는다.
     다만 원래 음들이 애초에 음역을 벗어나 있었다면(자리표를 통째로 잘못 본 경우)
     전부 옮기는 게 맞으므로 그때는 이 제한을 풀어 준다. */
  const out0=ix.filter(i=>!inRange(nts[i].midi)).length;
  if(changed>Math.floor(ix.length/2)&&out0<=ix.length/2)return nts;
  const out=nts.map(n=>({...n}));
  ix.forEach((i,k)=>{ const d=SHIFT[pick[k]]; if(d){ out[i].midi+=d; out[i].fix=true; } });
  return out;
}
/* AI가 마디 안 쉼표를 빠뜨려 박수가 모자란 경우, 표준 쉼표 길이(온쉼표4~16분쉼표0.25)로
   나머지를 채워 넣어 마디 박수 합을 박자표(P.beats)에 강제로 맞춘다.
   첫 마디(마디선 앞)는 못갖춘마디일 수 있으므로 채우지 않는다. */
function padMelodyRests(nts){
  const per=(typeof P!=='undefined'&&P.beats)||4;
  const groups=[[]];
  for(const n of nts){ if(n.bar)groups.push([]); else groups[groups.length-1].push(n); }
  if(groups.filter(g=>g.length).length<2)return nts;   // 마디 표시가 뚜렷하지 않으면 자동 배분(melFit)에 맡긴다
  const fillRests=r=>{
    const vals=[4,3,2,1.5,1,.75,.5,.25], out=[]; let guard=0;
    while(r>0.01&&guard++<20){ const v=vals.find(x=>x<=r+1e-6)||0.25; out.push({rest:true,beats:v}); r-=v; }
    return out;
  };
  const outNts=[];
  groups.forEach((g,gi)=>{
    if(gi>0)outNts.push({bar:true});
    outNts.push(...g);
    if(gi===0)return;
    const sum=g.reduce((a,n)=>a+(n.beats||1),0);
    if(sum>0.01&&sum<per-0.01)outNts.push(...fillRests(per-sum));
  });
  return outNts;
}
/* 멜로디 한 줄을 완성한다: 음높이 보정(옥타브 오독) → 마디 박수 맞추기(쉼표 채우기).
   순서가 중요하다 — 쉼표를 먼저 채우면 보정이 볼 선율 윤곽이 흐려진다. */
function finishMel(rawNotes,clef){ return padMelodyRests(repairOctaves(rawNotes,clef)); }
function melLine(notes,semis,p,clef){
  return (clef==='bass'?'♫ ':'♪ ')+notes.map(n=>n.bar?'|':n.rest?('r:'+n.beats)
    :(nm(n.midi+semis,p)+(Math.floor((n.midi+semis)/12)-1)+':'+n.beats)).join(' ');
}

function parseChart(raw){
  const lines=raw.replace(/\r\n?/g,'\n').split('\n'), out=[];
  const inline=/\[[A-G][#♯b♭]?[^\]]{0,8}\]/.test(raw)&&/\][^\s[]/.test(raw);
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(MEL_RE.test(line)){const nts=parseMelody(line);
      if(nts.length){ const clef=/^\s*♫/.test(line)?'bass':'treble';
        out.push({k:'mel',clef,_raw:nts,notes:finishMel(nts,clef)}); }
      continue;}
    /* ♪ 로 시작하지 않는 멜로디 조각. AI가 긴 멜로디 줄을 중간에서 줄바꿈하면 이렇게 나온다.
       예전엔 그냥 버려서 그 단의 멜로디가 통째로 사라지고 빈 오선만 남았다 — 이어 붙인다. */
    if(/^[\s:.0-9|]*(?:[A-G][#♯b♭]?-?\d|r):[\d.]/.test(line.trim())){
      const prev=out.length?out[out.length-1]:null;
      if(prev&&prev.k==='mel'){
        const more=parseMelody('♪ '+line.trim());
        if(more.length){ prev._raw=prev._raw.concat(more); prev.notes=finishMel(prev._raw,prev.clef); }
      }
      continue;
    }
    if(/^\s*(?:TITLE|제목)\s*:/i.test(line)){continue;}   // 제목 줄은 가사·마디가 아니다

    {
      const prev=out.length?out[out.length-1]:null;
      if(prev&&prev.k==='pairs'&&prev._cl&&!MEL_RE.test(line)){

    out.push({k:'pairs',pairs:withBars([{chord:null,raw:'',text:line}])});

}
/* 코드 줄의 칸(col)은 모노스페이스 폰트 기준 '보이는 너비'다.
   한글/한자 등 동아시아 문자는 그 폰트에서 2칸을 차지하지만 JS 문자열
   인덱스로는 1칸이라, col을 가사 문자열 인덱스로 그대로 쓰면 뒤로 갈수록
   밀려서 결국 문자열 길이를 넘어가 뒤쪽 코드에 가사가 하나도 안 붙는
   버그가 났었다. 보이는 너비를 누적해서 실제 인덱스로 변환해야 함. */

  if((cp>=0x1100&&cp<=0x115F)||(cp>=0x2E80&&cp<=0xA4CF)||(cp>=0xAC00&&cp<=0xD7A3)
    ||(cp>=0xF900&&cp<=0xFAFF)||(cp>=0xFF00&&cp<=0xFF60)||(cp>=0xFFE0&&cp<=0xFFE6)
    ||(cp>=0x20000&&cp<=0x3FFFD))return 2;

function colToIndex(str,col){
  let w=0,i=0;
  for(;i<str.length;i++){ if(w>=col)break; w+=dispW(str[i]); }

function splitByCounts(src,counts){
  const out=[]; let i=0;
  for(const n of counts){
    let taken=0,buf='';
    while(i<src.length&&taken<n){const ch=src[i++];buf+=ch;if(ch!==' ')taken++;}
    while(i<src.length&&src[i]===' ')buf+=src[i++];
    out.push(buf);
  }
  if(i<src.length)out[out.length-1]=(out[out.length-1]||'')+src.slice(i);
  return out;
}

  const idxs=[],counts=[];
  b.pairs.forEach((p,i)=>{ if(p.bar)return; idxs.push(i); counts.push([...(p.text||'')].filter(c=>c!==' ').length); });
  const parts=splitByCounts(b.alt[vn],counts);

function maxVerse(){

/* 가사/코드 속의 | 를 마디 구분 표시로 바꾼다 */
function cleanLyric(t){
  if(!t)return t;
  return t.replace(/^\s*[1-9]\s*[).]\s*/,'')          // 가사로 새어 들어온 절 번호 표시
          .replace(/(^|\s)r(?=\s|$)/g,'$1 ')      // 홀로 남은 쉼표 기호

function withBars(pairs){

    if(o.chord||(o.text&&o.text.trim())||(o.raw&&o.raw.trim()))out.push(o); };
  for(const p of pairs){
    if(!p.chord&&/^\|+$/.test((p.raw||'').trim())){ push({bar:true}); if(p.text&&p.text.trim())push({chord:null,raw:'',text:p.text}); continue; }
    const t=cleanLyric(p.text||'');
    if(t.indexOf('|')<0){ push({chord:p.chord,raw:p.raw,text:t}); continue; }
    const parts=t.split('|');
    push({chord:p.chord,raw:p.raw,text:parts[0]});
    for(let i=1;i<parts.length;i++){ push({bar:true}); push({chord:null,raw:'',text:parts[i]}); }

/* 인식이 틀렸을 가능성이 높은 음을 표시해 둔다. 음높이 인식은 완벽해질 수 없으니

   높은 확률로만 표시한다 — 너무 많이 표시하면 표시가 무의미해진다.
     oct  : 우리가 옥타브를 고친 음 (원본과 대조해 확인해 달라는 뜻)
     key  : 이 곡의 조성에도, 쓰인 어느 코드에도 없는 음 — 임시표(#/b) 오독이 흔한 자리

function markSuspectNotes(){
  const ok=new Set();

  DEGS.forEach(d=>ok.add(mod(origKey.pc+d)));

    const c=p.chord, minor=/^m(?!aj)/.test(c.suffix);
    ok.add(mod(c.root)); ok.add(mod(c.root+(minor?3:4))); ok.add(mod(c.root+7));
    if(/7/.test(c.suffix)){ ok.add(mod(c.root+10)); ok.add(mod(c.root+11)); }
    if(/(sus4|sus\b|sus$)/.test(c.suffix))ok.add(mod(c.root+5));
    if(/sus2|add9|9/.test(c.suffix))ok.add(mod(c.root+2));
    if(c.bass!==null)ok.add(mod(c.bass));

  let n=0;
  for(const b of blocks){
    if(b.k!=='mel')continue;
    let prev=null;
    for(const nt of b.notes){
      if(nt.bar||nt.rest||nt.midi===undefined)continue;
      delete nt.warn;
      if(nt.fix)nt.warn='oct';
      else if(!ok.has(mod(nt.midi)))nt.warn='key';
      else if(prev!==null&&Math.abs(nt.midi-prev)>12)nt.warn='leap';
      if(nt.warn)n++;
      prev=nt.midi;
    }
  }

}
function detectKey(bl){
  for(const b of bl){ if(b.k!=='pairs')continue;
    for(const p of b.pairs) if(p.chord) return{pc:p.chord.root,minor:/^m(?!aj)/.test(p.chord.suffix)}; }
  return{pc:0,minor:false};
}

const SHARP_ORD=['F','C','G','D','A','E','B'];

   쪽을 쓰고, 개수까지 같으면(F#6개 = Gb6개) #/b 취향을 따른다. 여기서 취향과 어긋난

     그래서 **점이 아예 그려지지 않았다.** 점4분음표(1.5박)와 4분음표(1박)가 화면에서
     똑같이 보였고, 점8분(0.75박)은 8분음표와 구별되지 않았다. 사용자 지적:
     *"점 8분음표 등, 점 있는것도 구분 필요!"* — 맞는 말이고, 점이 안 보이면 리듬을
     읽을 수 없다(찬송가는 점8분+16분 리듬이 절반을 차지한다).

     속이 빈 머리"로 우연히 맞히던 것이, 점4분음표(1.5박)에서는 "2박 미만이니 속이 찬 머리"로
     **우연히 맞고**, 겹점2분음표(3.5박)에서는 **틀렸다**. 나눗셈 한 번으로 전부 맞는다. */
const DUR_BASE=[8,4,2,1,0.5,0.25,0.125,0.0625];

  let best=DUR_BASE[0];

    ns.forEach(d=>{ d._sx=d.X+(up?STEM_DX:-STEM_DX); });
    const x0=ns[0]._sx, x1=ns[ns.length-1]._sx;
    const t0=ns[0].y+(up?-STEM_LEN:STEM_LEN), t1=ns[ns.length-1].y+(up?-STEM_LEN:STEM_LEN);
    let slope=(x1>x0)?(t1-t0)/(x1-x0):0;
    slope=Math.max(-0.22,Math.min(0.22,slope));
    let b0=(t0+t1)/2-slope*((x0+x1)/2-x0);
    const at=x=>b0+slope*(x-x0);
    let shift=0;
    ns.forEach(d=>{
      const room=up?(d.y-STEM_MIN)-at(d._sx):at(d._sx)-(d.y+STEM_MIN);
      if(room>=0)return;
      if(up)shift=Math.min(shift,room); else shift=Math.max(shift,-room);
    });
    b0+=shift;
    ns.forEach(d=>{
      const by=at(d._sx);
      svg+='<line x1="'+d._sx.toFixed(1)+'" y1="'+d.y+'" x2="'+d._sx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="'+d.col+'" stroke-width="1.4"/>';
      hi=Math.min(hi,Math.min(d.y,by)-4); lo=Math.max(lo,Math.max(d.y,by)+4);
    });
    const col=ns[0].col;
    const beam=(xa,xb,k)=>{
      const off=(up?1:-1)*k*BEAM_GAP, h=up?BEAM_W:-BEAM_W;
      const ya=at(xa)+off, yb=at(xb)+off;
      hi=Math.min(hi,ya-Math.abs(h)-2,yb-Math.abs(h)-2);
      lo=Math.max(lo,ya+Math.abs(h)+2,yb+Math.abs(h)+2);
      return '<path d="M'+xa.toFixed(1)+' '+ya.toFixed(1)+' L'+xb.toFixed(1)+' '+yb.toFixed(1)
        +' L'+xb.toFixed(1)+' '+(yb+h).toFixed(1)+' L'+xa.toFixed(1)+' '+(ya+h).toFixed(1)+' Z" fill="'+col+'"/>';
    };
    svg+=beam(x0,x1,0);
    /* 둘째·셋째 빔 — 실제로 필요한 음표 사이에만. 혼자면 이웃 쪽으로 짧은 토막을 낸다
       (점8분+16분 리듬이 정확히 이 모양이다 — 사용자가 보내 준 사진의 그 자리다). */
    const maxF=Math.max.apply(null,ns.map(d=>d.D.flags));
    for(let k=1;k<maxF;k++){
      let run=[];
      const flush=()=>{
        if(run.length>=2)svg+=beam(run[0]._sx,run[run.length-1]._sx,k);
        else if(run.length===1){
          const d=run[0], j=ns.indexOf(d), dir=(j>0)?-1:1;
          const xa=d._sx, xb=d._sx+dir*9;
          svg+=beam(Math.min(xa,xb),Math.max(xa,xb),k);
        }
        run=[];
      };
      ns.forEach(d=>{ if(d.D.flags>k)run.push(d); else flush(); });
      flush();
    }
  });
  return {svg,hi,lo};
}
/* 박수를 사람 말로 — "1.5박" 보다 "점4분음표" 가 악보와 바로 이어진다 */
const DUR_NAME={8:'온음표 ×2',4:'온음표',2:'2분음표',1:'4분음표',0.5:'8분음표',
                0.25:'16분음표',0.125:'32분음표',0.0625:'64분음표'};
function durLabel(beats){
  const d=noteDur(beats), base=DUR_NAME[d.v];
  if(!base)return '';
  return (d.dots===2?'겹점':d.dots===1?'점':'')+base;
}
/* 미디 음 → 오선 위치(온음 단계)와 임시표 */
function spell(midi,pref,sigSet){
  const pc=mod(midi), name=(pref==='flat'?FLAT:SHARP)[pc];
  const letter=name[0], acc=name.length>1?name[1]:'';
  const oct=Math.floor(midi/12)-1;
  const step=LET.indexOf(letter)+7*oct;
  const sigAcc=sigSet[letter]||'';
  return {step,acc,show:acc!==sigAcc?(acc||'n'):''};
}
/* 멜로디를 SVG 오선보로 */
function renderStaff(sel){
  /* 이 화면은 멜로디 한 줄만 이어붙여 보여준다. 높은음자리/낮은음자리가 둘 다 있으면
     고른 음(sel)이 속한 보표만 골라 보여준다 — 안 그러면 두 보표가 한 줄에 뒤섞인다. */
  const targetClef=(sel&&blocks[sel.bi]&&blocks[sel.bi].clef)||'treble';
  const notes=[];
  for(let bi=0;bi<blocks.length;bi++){
    const b=blocks[bi]; if(b.k!=='mel'||(b.clef||'treble')!==targetClef)continue;
    b.notes.forEach((n,ni)=>notes.push({n,bi,ni}));
  }
  if(!notes.length)return '<div class="callout err"><b>이 차트에는 멜로디가 없습니다.</b><br>'
    +'사진 화면에서 <b>멜로디까지 읽기</b>를 켜고 다시 인식하거나, '
    +'<b>편집</b>에서 <code>♪ 1:1 5:0.5</code> 처럼 직접 넣으세요.</div>';

  const pc=sigPc(origKey.pc+S.semis,origKey.minor), pref=S.flat||PREF[pc];
  const [sgn,cnt]=keySig(pc,pref);
  const sigSet={}; const ord=sgn==='#'?SHARP_ORD:FLAT_ORD;
  for(let i=0;i<cnt;i++)sigSet[ord[i]]=sgn;

  const GAP=9, W=1000, LEFT=96, RIGHT=24;
  const rows=[]; let cur=[], x=LEFT;
  for(const item of notes){
    const n=item.n;
    const w=n.bar?12:Math.round(26+Math.min(4,n.beats||1)*13);
    if(x+w>W-RIGHT&&cur.length){rows.push(cur);cur=[];x=LEFT;}
    cur.push({...item,x,w}); x+=w;
  }
  if(cur.length)rows.push(cur);

  const RH=104, H=rows.length*RH+18;
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  const C='var(--paper)', A='var(--brass)';
  rows.forEach((row,ri)=>{
    const top=ri*RH+30;
    for(let i=0;i<5;i++)
      svg+='<line x1="14" y1="'+(top+i*GAP*2)+'" x2="'+(W-10)+'" y2="'+(top+i*GAP*2)+'" stroke="'+C+'" stroke-width="1.1" opacity=".55"/>';
    const isBass=targetClef==='bass';
    const bottomStep=isBass?18:30;   // 낮은음자리표는 G2, 높은음자리표는 E4 자리
    const bottom=top+8*GAP;
    const yOf=st=>bottom-(st-bottomStep)*GAP;
    svg+='<text x="22" y="'+(top+GAP*5.6)+'" font-size="'+(isBass?42:46)+'" fill="'+C+'" opacity=".85">'+(isBass?'&#119074;':'&#119070;')+'</text>';
    let sx=58;
    for(let i=0;i<cnt;i++){
      const L=ord[i];
      const st=LET.indexOf(L)+7*(isBass?(L==='B'||L==='A'||L==='G'?2:3):(L==='B'||L==='A'||L==='G'?4:5));
      svg+='<text x="'+sx+'" y="'+(yOf(st)+5)+'" font-size="19" fill="'+C+'" opacity=".8">'+(sgn==='#'?'♯':'♭')+'</text>';
      sx+=11;
    }
    for(const it of row){
      const n=it.n;
      if(n.bar){ svg+='<line x1="'+it.x+'" y1="'+top+'" x2="'+it.x+'" y2="'+(top+8*GAP)+'" stroke="'+C+'" stroke-width="1.6" opacity=".6"/>'; continue; }
      const cx=it.x+13;
      if(n.rest){ svg+='<rect x="'+(cx-7)+'" y="'+(top+3*GAP)+'" width="14" height="'+GAP+'" fill="'+C+'" opacity=".55" rx="1"/>'; continue; }
      const midi=(n.midi!==undefined)?n.midi+S.semis:((isBass?48:60)+pc+n.deg+(n.oct||0)*12);
      const sp=spell(midi,pref,sigSet), y=yOf(sp.step);
      const on=(sel&&sel.bi===it.bi&&sel.ni===it.ni);
      const col=on?A:C;
      const ledgeTop=isBass?20:32, ledgeLo=isBass?16:28, ledgeHi=isBass?28:40;
      for(let L=ledgeTop;L>=sp.step;L-=2) if(L<=ledgeLo) svg+='<line x1="'+(cx-12)+'" y1="'+yOf(L)+'" x2="'+(cx+12)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      for(let L=ledgeTop;L<=sp.step;L+=2) if(L>=ledgeHi) svg+='<line x1="'+(cx-12)+'" y1="'+yOf(L)+'" x2="'+(cx+12)+'" y2="'+yOf(L)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      const D=noteDur(n.beats);
      svg+='<ellipse cx="'+cx+'" cy="'+y+'" rx="7.4" ry="5.6" transform="rotate(-18 '+cx+' '+y+')" '
        +(D.hollow?'fill="none" stroke="'+col+'" stroke-width="2"':'fill="'+col+'"')+'/>';
      if(D.stem){
        const up=sp.step<(isBass?24:36), sx2=up?cx+7:cx-7, sy2=up?y-32:y+32;
        svg+='<line x1="'+sx2+'" y1="'+y+'" x2="'+sx2+'" y2="'+sy2+'" stroke="'+col+'" stroke-width="1.7"/>';
        for(let f=0;f<D.flags;f++)
          svg+='<path d="M'+sx2+' '+(up?sy2+f*8:sy2-f*8)+' q9 5 7 16" stroke="'+col+'" stroke-width="1.7" fill="none"/>';
      }
      /* 점은 머리 오른쪽, **줄에 놓인 음은 반 칸 위 칸에** 찍는다(조판 규칙) */
      if(D.dots){
        const dy=(sp.step%2===0)?y-GAP:y;
        for(let d=0;d<D.dots;d++)
          svg+='<circle cx="'+(cx+12+d*6)+'" cy="'+dy+'" r="2.4" fill="'+col+'"/>';
      }
      if(sp.show)svg+='<text x="'+(cx-20)+'" y="'+(y+5)+'" font-size="17" fill="'+col+'">'+(sp.show==='#'?'♯':sp.show==='b'?'♭':'♮')+'</text>';
      svg+='<rect x="'+(it.x-2)+'" y="'+(top-14)+'" width="'+(it.w+4)+'" height="'+(8*GAP+28)+'" fill="transparent" '
        +'style="cursor:pointer" data-bi="'+it.bi+'" data-ni="'+it.ni+'"/>';
      if(on)svg+='<rect x="'+(it.x-2)+'" y="'+(top-14)+'" width="'+(it.w+4)+'" height="'+(8*GAP+28)+'" fill="'+A+'" opacity=".12" rx="5" pointer-events="none"/>';
    }
  });
  return svg+'</svg>';
}
/* 한 블록(코드+가사 한 줄 + 앞서 나온 멜로디)을 "실제" 마디 배열로 쪼갠다.
   재생 엔진(buildTimeline)과 같은 규칙을 쓴다:
   - 곡 전체에 명시적 마디선(|)이 하나도 없으면, 코드 하나 = 마디 하나(리드시트 관례)로 본다.
     예) "G  D/F#  Em" 처럼 파이프 없이 나열된 코드는 3마디로 나뉜다.
   - 멜로디에 마디 표시가 2개 이상이면 그걸 그대로 존중하고, 없으면(대부분의 스캔 결과)
     박자 누적으로 각 마디에 자동 배분한다 — 재생 때 쓰는 melFit과 같은 비율로 늘이거나 줄인다.
   melM/chM/lyM은 서로 길이가 같도록(N) 빈 배열로 맞춰서 반환 — 여러 블록을
   이어 붙여도 마디 위치가 어긋나지 않게 하기 위함이다. */
function measuresOfBlock(mel,blk,forceN){
  const chPairs=blk?blk.pairs:[];
  const hasBarGlobal=blocks.some(b=>b.k==='pairs'&&b.pairs.some(p=>p.bar));
  const splitPairs=pairs=>{
    if(hasBarGlobal){
      const g=[[]]; for(const pr of pairs){ if(pr.bar)g.push([]); else g[g.length-1].push(pr); }
      return g.filter(x=>x.length);
    }
    const g=[]; for(const pr of pairs){ if(pr.chord||!g.length)g.push([]); g[g.length-1].push(pr); }
    return g.length?g:[[]];
  };
  const chM0=splitPairs(chPairs);

  /* 멜로디 자체에 마디 표시(|)가 2개 이상 있으면 그 마디 개수를 "진짜"로 믿는다.
     코드 줄의 마디 개수(chM0.length)와 다르더라도 절대 여러 마디를 하나로 뭉개지 않는다
     — 예전엔 초과분을 전부 첫 마디에 욱여넣어 그 마디만 박수가 폭발하고
     가사가 뒤섞이는 버그가 있었다(예: "16박" 마디). 대신 둘 중 더 큰 쪽으로
     전체 마디 수(N)를 늘리고, 모자란 쪽(코드 없는 마디/가사 없는 마디)은 빈 채로 둔다. */
  let melGroups=null;
  if(mel&&mel.notes&&mel.notes.length){
    const groups=[[]];
    mel.notes.forEach((n,ni)=>{ if(n.bar)groups.push([]); else groups[groups.length-1].push({n,bi:mel._bi,ni}); });
    const gs=groups.filter(g=>g.length);
    if(gs.length>=2)melGroups=gs;
  }
  let N=melGroups?Math.max(melGroups.length,chM0.length):chM0.length;
  if(forceN!==undefined)N=forceN;

  const chM=chM0.slice(0,N); while(chM.length<N)chM.push([]);
  const verses=(blk&&blk.alt)?[1,...Object.keys(blk.alt).map(Number)].sort((a,b)=>a-b):[1];
  const lyM={};
  verses.forEach(v=>{
    const pv=blk?pairsForVerse(blk,v):[];
    const g=splitPairs(pv).slice(0,N);
    while(g.length<N)g.push([]);
    lyM[v]=g;
  });

  let melM=new Array(N).fill(0).map(()=>[]);
  let fitM=new Array(N).fill(false);   // true인 마디는 박자 자동 배분(추정치)이라 박수 어긋남 경고를 보여주지 않는다
  if(melGroups){
    for(let i=0;i<N;i++)if(melGroups[i])melM[i]=melGroups[i];
  }else if(mel&&mel.notes&&mel.notes.length){   // 마디 표시가 없으면 박자 누적으로 자동 배분(melFit과 동일한 원리)
    const groups=[[]];
    mel.notes.forEach((n,ni)=>{ if(n.bar)groups.push([]); else groups[groups.length-1].push({n,bi:mel._bi,ni}); });
    const beatsPerBar=P.beats||4, fitTo=N*beatsPerBar;
    const flat=groups.filter(g=>g.length)[0]||[];
    const raw=flat.reduce((a,it)=>a+(it.n.beats||1),0);
    const k=(raw>0&&Math.abs(raw-fitTo)>0.01)?fitTo/raw:1;
    let acc=0;

      melM[barIdx].push(it);

    });

/* 이어붙인 마디 배열(melM/chM/lyM)을 리드시트(코드+오선+가사) SVG로 그린다.

   (1) 마디 폭을 음표 개수만으로 정해 오선이 화면 폭의 절반만 쓰고 나머지는 비었다.

   지금은 실제 조판 순서를 따른다: 마디마다 필요한 폭을 먼저 재고(가사·코드 글자 폭
   포함) → 행에 채워 넣고 → 남는 폭을 비례 배분해 행을 꽉 채우고 → 음표가 실제로

   보고 있든(사진 보기여도) 인식 직후 결과 안내에 바로 적을 수 있어야 하기 때문이다. */

function txtW(s,fs){ let w=0; for(const c of (s||''))w+=(dispW(c)===2?1.02:0.56)*fs; return w; }
/* 마디의 가사를 음절로 쪼갠다 — 한글은 한 글자가 한 음절이라 글자 단위가 곧 음절 단위 */
function sylsOf(grp){ return [...(grp||[]).map(p=>p.text||'').join('')].filter(ch=>ch.trim()); }

function renderStaffSection(melM,chM,lyM,verses,measureStart,fitM,bassM,W,breaks){
  fitM=fitM||[]; bassM=bassM||[]; W=Math.max(320,Math.round(W||1000));
  const pc=sigPc(origKey.pc+S.semis,origKey.minor), pref=S.flat||PREF[pc];
  const [sgn,cnt]=keySig(pc,pref), ord=sgn==='#'?SHARP_ORD:FLAT_ORD;

     되는지를 알아야 한다. 음표 간격은 줄여도 읽히지만 **한글 가사는 한 글자가 통째로

  for(let m=0;m<N;m++){

    const syl={}; verses.forEach(v=>syl[v]=sylsOf(lyM[v]&&lyM[v][m]));

    verses.forEach(v=>{ const s=syl[v];
      if(s.length&&s.length<=si.length)
        s.forEach((ch,j)=>{ const i=si[j]; sw[i]=Math.max(sw[i],txtW(ch,LY_FS)+5); });
    });
    let need=sw.reduce((a,b)=>a+b,0);
    /* 음절이 음표보다 많은 마디(인식 오차로 흔하다)는 음절 전부가 들어갈 폭을 확보한다 */
    verses.forEach(v=>{ const s=syl[v];
      if(s.length>si.length)need=Math.max(need,s.reduce((a,ch)=>a+txtW(ch,LY_FS)+3,0));
    });
    if(!notes.length)verses.forEach(v=>{
      const g=(lyM[v]&&lyM[v][m])||[];
      need=Math.max(need,g.reduce((a,p)=>a+txtW((p.text||'').trim(),LY_FS)+11,0));
    });
    need=Math.max(need,chs.reduce((a,p)=>a+txtW(chLabel(p),CH_FS)+12,0));
    /* 최소 폭 — 음표 간격은 머리 하나 들어갈 22px 까지 줄이고, 가사·코드 글자 폭은 그대로 둔다 */
    const swm=notes.map(()=>22);
    verses.forEach(v=>{ const s2=syl[v];
      if(s2.length&&s2.length<=si.length)
        s2.forEach((ch,j)=>{ const i=si[j]; swm[i]=Math.max(swm[i],txtW(ch,LY_FS)+3); });
    });
    let low=swm.reduce((a,b)=>a+b,0);
    verses.forEach(v=>{ const s2=syl[v];
      if(s2.length>si.length)low=Math.max(low,s2.reduce((a,ch)=>a+txtW(ch,LY_FS)+3,0));
    });
    if(!notes.length)verses.forEach(v=>{
      const g=(lyM[v]&&lyM[v][m])||[];
      low=Math.max(low,g.reduce((a,p)=>a+txtW((p.text||'').trim(),LY_FS)+8,0));
    });
    low=Math.max(low,chs.reduce((a,p)=>a+txtW(chLabel(p),CH_FS)+10,0));
    slotW[m]=sw; soundIx[m]=si; sylM[m]=syl;
    intr[m]=Math.max(MINM,need)+12;
    minr[m]=Math.min(intr[m],Math.max(56,low)+8);
  }

  /* ── 2단계: 행에 채워 넣는다. 폭이 되면 찬송가 관례대로 4마디, 좁은 화면이면 2~3마디 ── */
  const avail=Math.max(150,W-PAD-headW);
  /* breaks: 원본 사진의 단 끝 마디 번호 모음. 있으면 **원본과 같은 자리에서만 줄을 바꾼다**
     (v52, 사용자 요청: "첫 줄 4마디, 둘째 줄 3마디면 채보도 같은 줄 같은 마디로 나와라").

     ★★ v60까지는 여기에 **폭 검사가 하나 더 걸려 있었다** — "폭이 모자라면 잘라 넣는다,
        화면이 먼저다". 그 규칙이 강제 줄바꿈과 부딪혀 사용자가 신고한 모양을 만들었다:
        *"12마디는 왜 자기 혼자만 1마디가 한줄 다 차지 하는가? 원본사진 악보를 보면
          4마디씩 한줄이면 사진과 동일하게 나타내야한다"*
        원본 9~12마디가 한 단인데 9·10·11 을 넣고 나면 폭이 모자라 12가 다음 줄로 밀리고,
        바로 뒤에 **단 끝 강제 줄바꿈**이 오니 12마디가 혼자 한 줄을 차지했다.
     → 원본 단은 절대 쪼개지 않는다. 폭이 모자라면 **가로로 넘겨 스크롤**한다
        (`.staffline` 이 이미 overflow-x:auto 다). 음표 크기를 지키면서 원본과 같은
        마디 배열이 나오고, 재생 중에는 지금 치는 마디를 가로로 따라가 준다. */
  const rows=[]; let cur=[],curW=0;
  for(let m=0;m<N;m++){
    const w=Math.min(intr[m],avail);
    const forced=!!(breaks&&cur.length&&breaks.has(measureStart+m-1));
    const over=!breaks&&cur.length&&(curW+w>avail||cur.length>=MAXPER);
    if(forced||over){rows.push(cur);cur=[];curW=0;}
    cur.push(m); curW+=w;
  }
  if(cur.length)rows.push(cur);
  /* ── 행의 논리 폭(VW). 기본은 화면 폭이고, **글자가 겹칠 때만** 넓혀서 가로로 넘긴다.
     원본 단을 한 줄에 다 넣어야 하므로(위 규칙) 대개는 줄여서 맞추면 된다 — 음표 간격만
     좁아지고 읽는 데는 지장이 없다. 가사가 겹치기 시작하는 선(minr)을 넘어설 때만
     넓혀서 `.staffline` 이 가로로 스크롤되게 한다. 그때도 음표 크기는 그대로다.
     ★ 행마다 따로 넓히면 오선이 줄마다 다른 자리에서 끝나 너덜너덜하다 — 가장 넓은 행에
       맞춰 **모두 같은 폭**을 쓴다. 가로 스크롤도 한 번에 움직인다. */
  let VW=W;
  rows.forEach(ms=>{ let low=0; ms.forEach(m=>low+=minr[m]);
    VW=Math.max(VW,Math.round(headW+20+low+PAD)); });
  VW=Math.min(VW,Math.round(W*2.6));
  /* 마지막 행에 마디가 하나만 남으면 앞 행에서 한 마디를 넘겨 준다.
     한 마디만 오선 한 줄을 차지하면(게다가 낮은음자리표까지 딸려 오면)
     화면이 텅 빈 오선으로 낭비된다. 원본을 따라갈 때는 하지 않는다 — 원본이 그렇다면
     그게 맞는 모양이다. */
  if(!breaks&&rows.length>1&&rows[rows.length-1].length===1&&rows[rows.length-2].length>=3)
    rows[rows.length-1].unshift(rows[rows.length-2].pop());
  return {svgs:rows.map(draw).filter(x=>x),count:N};

  function draw(ms){
    const C='var(--paper)', A='var(--brass)', R='var(--ribbon)';
    const showTime=(measureStart===1&&ms[0]===0);          // 곡 맨 처음 한 번만 박자표
    const left=headW+(showTime?20:0);
    /* ── 3단계: 이 행의 논리 폭을 정한다.
       마디들이 원하는 폭의 합이 화면보다 넓으면 **논리 폭을 늘려 잡고**(VW) SVG 를 그만큼
       넓게 그린다 — 그러면 `.staffline` 이 가로로 스크롤되고 음표·글자 크기는 그대로다.
       줄여서 욱여넣지 않는 이유: 한글 가사는 한 글자가 8분음표 칸보다 넓어서 조금만 줄여도
       글자끼리 겹쳐 **읽을 수 없는 악보**가 된다(v47에서 이미 한 번 겪은 일이다).
       ★ 2.6배까지만 넓힌다. 그보다 넘어가면 가로로도 못 읽으므로 그때는 줄인다. */
    let sum=0; ms.forEach(m=>sum+=Math.min(intr[m],avail));
    const room=Math.max(150,VW-PAD-left);
    const k=sum>0?room/sum:1;                              // 남는 폭은 비례 배분해 행을 꽉 채운다
    const TOP=40, bottom=TOP+8*GAP, yOf=st=>bottom-(st-30)*GAP;
    const staffRow=ms.some(m=>(melM[m]||[]).some(it=>it&&!it.n.bar));
    const bassRow=ms.some(m=>(bassM[m]||[]).some(it=>it&&!it.n.bar));   // 이 행에 베이스 음표가 있을 때만 낮은음자리표를 그린다
    const ledger=(X,y)=>'<line x1="'+(X-10).toFixed(1)+'" y1="'+y+'" x2="'+(X+10).toFixed(1)+'" y2="'+y+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';

    const box=[]; { let x=left; ms.forEach(m=>{ const w=Math.min(intr[m],avail)*k; box.push({m,x0:x,x1:x+w}); x+=w; }); }
    const endX=box.length?box[box.length-1].x1:left;

    let notesSvg='';
    let hi=TOP, lo=bottom;                    // 음표 잉크가 실제로 닿는 위/아래 한계
    const hits=[], chOut=[], numOut=[], lyOut=[], barOut=[], spans=[];
    /* 재생 위치 표시용 (v60). 음표마다 뒤에 깔아 둘 상자 — 켜지면 음영이 된다.
       ★ 음표 **뒤에** 깔아야 한다. 위에 덮으면 음영 때문에 음표가 흐려져서,
         정작 읽어야 할 것이 안 보이게 된다. */
    const nowRects=[];

    box.forEach(({m,x0,x1})=>{
      const notes=(melM[m]||[]).filter(it=>it&&!it.n.bar);
      const chs=(chM[m]||[]).filter(p=>p.chord);
      const syl=sylM[m], si=soundIx[m], sw=slotW[m];
      const beatSum=notes.length?notes.reduce((a,it)=>a+(it.n.beats||1),0):null;
      const pickup=(measureStart+m===1);      // 못갖춘마디는 박수가 모자라도 정상 — 경고하지 않는다
      const bad=beatSum!==null&&!fitM[m]&&!pickup&&Math.abs(beatSum-P.beats)>0.75;
      /* ★ 음표를 빠뜨렸는지 **가사로 검산한다** (v61, 사용자 신고로 넣었다).
         *"예수 내 구주. 파, 미 인데 파만 나왔다!"* — 한 마디에 가사 음절이 둘인데 소리나는
         음표가 하나면 음표를 하나 놓친 것이다. 찬송가·복음성가는 한 음절에 한 음이 원칙이고,
         이음줄로 한 음절을 여러 음에 붙이는 반대 경우는 여기 걸리지 않는다(음표가 더 많다).
         ★ **모든 절이 한목소리로 모자랄 때만** 경고한다(음절 수의 최솟값을 쓴다). 가사는
           글자 인식이라 한 절이 깨지는 일이 흔한데, 그걸로 경고를 띄우면 곧 무시하게 된다.
         ★ 박수 검사로는 절대 못 잡는다 — 온음표 하나(4박)나 2분음표 둘(2+2박)이나 합은 같다.
           그래서 이 검산이 따로 필요하다. */
      let lack=0;
      if(notes.length&&si.length){
        const vs=verses.filter(v=>(syl[v]||[]).length);
        if(vs.length)lack=Math.max(0,Math.min.apply(null,vs.map(v=>syl[v].length))-si.length);
      }
      barOut.push({x:x0,bad:bad||!!lack});
      numOut.push({x:x0+3,bad:bad||!!lack,
        txt:(measureStart+m)
          +(bad?' ⚠'+(beatSum%1?beatSum.toFixed(1):beatSum)+'박':'')
          +(lack?' ⚠음표 '+lack+'개':'')});

      const inner=x0+8, iw=Math.max(16,x1-inner-6);
      const swSum=sw.reduce((a,b)=>a+b,0)||1;
      const cx=[]; { let c=inner; sw.forEach(w=>{ const ww=w/swSum*iw; cx.push(c+ww/2); c+=ww; }); }
      spans.push({m,x0,x1});

      /* ★ 머리·덧줄·점·임시표를 먼저 다 그리고, **기둥과 빔은 무리 단위로 뒤에** 그린다(v62).
         낱개로 깃발을 달면 "이 셋이 한 박"이라는 정보가 사라진다 — beamGroups/stemsSvg 참고. */
      const ND=[];
      notes.forEach((it,i)=>{
        const n=it.n, X=cx[i], slot=sw[i]/swSum*iw;
        if(n.rest){
          const RD=noteDur(n.beats);
          /* 쉼표도 길이가 보여야 한다 — 온쉼표는 넷째 줄 **아래**, 2분쉼표는 셋째 줄 **위**.
             그보다 짧은 쉼표는 모양이 복잡해 상자로 대신하되 **길수록 넓게** 그려 눈으로 갈린다. */
          const rw=RD.v>=2?11:Math.max(5,Math.round(5+RD.v*6));
          const ry=RD.v>=4?(TOP+2*GAP):RD.v>=2?(TOP+3*GAP):(TOP+2.4*GAP);
          const rh=RD.v>=2?GAP*0.8:GAP*1.2;
          notesSvg+='<rect x="'+(X-rw/2).toFixed(1)+'" y="'+ry.toFixed(1)+'" width="'+rw+'" height="'+rh.toFixed(1)+'" fill="'+C+'" opacity=".5" rx="1"/>';
          for(let d=0;d<RD.dots;d++)
            notesSvg+='<circle cx="'+(X+rw/2+4+d*5).toFixed(1)+'" cy="'+(TOP+3*GAP-GAP*0.5).toFixed(1)+'" r="2" fill="'+C+'" opacity=".6"/>';
          ND.push(null);
          return;
        }
        const midi=(n.midi!==undefined)?n.midi+S.semis:(60+pc+n.deg+(n.oct||0)*12);
        const sp=spell(midi,pref,sigSet), y=yOf(sp.step);
        const on=(S.selNote&&S.selNote.bi===it.bi&&S.selNote.ni===it.ni);
        const col=on?A:C;
        /* 인식이 틀렸을 가능성이 높은 음은 동그라미로 표시한다 — 눌러서 바로 고칠 수 있다 */
        if(n.warn&&!on)notesSvg+='<circle cx="'+X.toFixed(1)+'" cy="'+y+'" r="10" fill="none" stroke="'+R+'" stroke-width="1.4" opacity=".8"/>';
        for(let L=32;L>=sp.step;L-=2)if(L<=28){const yy=yOf(L);notesSvg+=ledger(X,yy);lo=Math.max(lo,yy+4);}
        for(let L=32;L<=sp.step;L+=2)if(L>=40){const yy=yOf(L);notesSvg+=ledger(X,yy);hi=Math.min(hi,yy-4);}
        const D=noteDur(n.beats);
        notesSvg+='<ellipse cx="'+X.toFixed(1)+'" cy="'+y+'" rx="6" ry="4.5" transform="rotate(-18 '+X.toFixed(1)+' '+y+')" '
          +(D.hollow?'fill="none" stroke="'+col+'" stroke-width="1.6"':'fill="'+col+'"')+'/>';
        const pad=n.warn?11:6;
        hi=Math.min(hi,y-pad); lo=Math.max(lo,y+pad);
        ND.push({X,y,step:sp.step,D,col});
        if(D.dots){
          const dy=(sp.step%2===0)?y-GAP:y;
          for(let d=0;d<D.dots;d++)
            notesSvg+='<circle cx="'+(X+10+d*5).toFixed(1)+'" cy="'+dy+'" r="2" fill="'+col+'"/>';
          hi=Math.min(hi,dy-4);
        }
        if(sp.show)notesSvg+='<text x="'+(X-15).toFixed(1)+'" y="'+(y+4)+'" font-size="13" fill="'+col+'" font-weight="700">'+(sp.show==='#'?'♯':sp.show==='b'?'♭':'♮')+'</text>';
        hits.push({x:X-Math.max(10,slot/2),w:Math.max(20,slot),bi:it.bi,ni:it.ni,on,m:measureStart+m});
        nowRects.push({x:X-Math.max(9,slot/2),w:Math.max(18,slot),bi:it.bi,ni:it.ni,top:TOP-6,h:8*GAP+12});
      });
      { const st=stemsSvg(ND,beamGroups(notes,P.beats),36);
        notesSvg+=st.svg;
        if(isFinite(st.hi))hi=Math.min(hi,st.hi);
        if(isFinite(st.lo))lo=Math.max(lo,st.lo); }

      /* 가사: 음절이 음표 수 이하면 음표마다 하나씩, 넘치면 마디 폭에 고르게 —
         어느 경우에도 음절을 버리지 않는다 */
      verses.forEach(v=>{
        if(!notes.length){
          const g=(lyM[v]&&lyM[v][m])||[];
          const words=g.map(p=>(p.text||'').trim()).filter(Boolean);
          if(!words.length)return;
          /* 마디 폭에 고르게 벌려 놓는다(1단계에서 이미 다 들어갈 폭을 확보해 뒀다) */
          words.forEach((w,j)=>lyOut.push({v,x:inner+iw*(j+0.5)/words.length,txt:w,mid:true}));
          return;
        }
        const s=syl[v]; if(!s.length)return;
        if(s.length<=si.length){ s.forEach((ch,j)=>lyOut.push({v,x:cx[si[j]],txt:ch,mid:true})); return; }
        /* 음절이 음표보다 많은 마디(인식 오차로 흔하다). 마디 폭에 그냥 고르게
           벌리면 글자가 자기 음표에서 70px 가까이 밀려 "이 글자가 어느 음이냐"를
           알 수 없었다. 음표 위치를 기준선으로 두고 그 사이에 끼워 넣는다 —
           첫 음절은 첫 음표, 마지막 음절은 마지막 음표에 맞는다. */
        const anchors=si.map(i=>cx[i]);
        let xs;
        if(anchors.length>=2&&s.length>1){
          const last=anchors.length-1;
          xs=s.map((ch,j)=>{ const f=j*last/(s.length-1), i0=Math.floor(f), t=f-i0;
            return anchors[i0]+(anchors[Math.min(last,i0+1)]-anchors[i0])*t; });
        }else xs=s.map((ch,j)=>inner+iw*(j+0.5)/s.length);
        /* 그래도 글자끼리 닿으면 최소 간격만큼 밀어내고, 마디 밖으로 나가면 되돌린다 */
        const ws=s.map(ch=>txtW(ch,LY_FS)+2);
        for(let j=1;j<xs.length;j++)xs[j]=Math.max(xs[j],xs[j-1]+(ws[j-1]+ws[j])/2);
        const over=(xs[xs.length-1]+ws[ws.length-1]/2)-(inner+iw);
        if(over>0)for(let j=0;j<xs.length;j++)xs[j]-=over;
        s.forEach((ch,j)=>lyOut.push({v,x:xs[j],txt:ch,mid:true}));
      });

      /* 코드 이름: 마디 안에서 왼쪽부터 자기 글자 폭만큼 자리를 잡아 서로 겹치지 않게 */
      { let c=x0+8;
        chs.forEach(p=>{ const t=chLabel(p);
          chOut.push({x:c,txt:t,idx:p.idx,m:measureStart+m});
          c+=Math.max(txtW(t,CH_FS)+10,iw/chs.length); }); }
    });

    /* ── 4단계: 잉크가 닿는 범위를 알았으니 코드 줄과 가사 줄 높이를 정한다 ── */
    const chordY=Math.min(TOP-12,hi-8), numY=chordY-16;
    const nv=verses.filter(v=>lyOut.some(o=>o.v===v));
    const ly0=staffRow?Math.max(bottom+21,lo+16):chordY+25;
    const lyY={}; nv.forEach((v,i)=>lyY[v]=ly0+i*VOFF);
    const lyBot=ly0+(nv.length?nv.length-1:0)*VOFF;
    const y0=Math.min(numY-12,hi-6);
    let y1=Math.max(lyBot+7,lo+6);

    let out='';
    if(staffRow){
      for(let i=0;i<5;i++)out+='<line x1="'+PAD+'" y1="'+(TOP+i*GAP*2)+'" x2="'+endX.toFixed(1)+'" y2="'+(TOP+i*GAP*2)+'" stroke="'+C+'" stroke-width="1.1" opacity=".5"/>';
      out+='<text x="'+PAD+'" y="'+(TOP+GAP*5.6)+'" font-size="37" fill="'+C+'" opacity=".8">&#119070;</text>';
      let sx=PAD+34;
      for(let i=0;i<cnt;i++){ const L=ord[i], oc=(L==='B'||L==='A'||L==='G')?4:5;
        out+='<text x="'+sx+'" y="'+(yOf(LET.indexOf(L)+7*oc)+4)+'" font-size="15" fill="'+C+'" opacity=".8">'+(sgn==='#'?'♯':'♭')+'</text>'; sx+=9; }
      if(showTime){
        out+='<text x="'+sx+'" y="'+(TOP+22)+'" font-size="18" font-weight="700" fill="'+C+'" opacity=".85">'+P.beats+'</text>';
        out+='<text x="'+sx+'" y="'+(TOP+50)+'" font-size="18" font-weight="700" fill="'+C+'" opacity=".85">4</text>';
      }

    const disp=Math.max(100,Math.round(0.68*VW/W*100));

function writeBackMelody(){
  const lines=S.raw.replace(/\r\n?/g,'\n').split('\n');
  const mels=blocks.filter(b=>b.k==='mel');
  let k=0;
  for(let i=0;i<lines.length;i++){
    if(!MEL_RE.test(lines[i]))continue;
    /* ★ 이 곡의 조에 맞는 표기로 쓴다. 예전엔 무조건 'flat' 이라 A장조 곡에서 음 하나만
       고쳐도 원문 전체가 Gb4·Db5 로 바뀌었다 — 소리는 같지만 편집 화면에서 읽을 수가 없다. */
    if(k<mels.length)lines[i]=melLine(mels[k].notes,0,
      S.flat||PREF[sigPc(origKey.pc,origKey.minor)]||'sharp',mels[k].clef);
    k++;
  }
  S.raw=lines.join('\n');
  /* 음표를 넣거나 지웠으면 "음표가 모자란 마디" 수도 바로 다시 센다 — 고치자마자
     경고가 사라져야 다 고쳤는지 알 수 있다(이 경로는 reparse 를 부르지 않는다). */
  LACK=countLackNotes();
  scheduleSave();
}

 [/^(aug|\+)/,[0,4,8]],[/^maj7|^M7|^Δ/,[0,4,7,11]],[/^m(?:in)?7/,[0,3,7,10]],
 [/^m(?:in)?(?!aj)/,[0,3,7]],[/^sus2/,[0,2,7]],[/^sus4?/,[0,5,7]],[/^7/,[0,4,7,10]],[/^6/,[0,4,7,9]]];

let actx=null, master=null, wet=null, dry=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);

function makeIR(ctx,sec,decay){
  const len=Math.max(1,Math.floor(ctx.sampleRate*sec));
  const buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){
      const t=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.15);
    }
  }
  return buf;
}
function AC(){
  if(!actx){
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return null;
    actx=new A();
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=3.4;
    comp.attack.value=.006; comp.release.value=.26;
    comp.connect(actx.destination);
    master=actx.createGain(); master.gain.value=.85;
    dry=actx.createGain(); dry.gain.value=.82;
    wet=actx.createGain(); wet.gain.value=.30;
    const rev=actx.createConvolver();
    try{ rev.buffer=makeIR(actx,2.6,2.4); }catch(e){}
    const damp=actx.createBiquadFilter();
    damp.type='lowpass'; damp.frequency.value=3600;
    master.connect(dry); dry.connect(comp);
    master.connect(wet); wet.connect(rev); rev.connect(damp); damp.connect(comp);
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
const ksCache={};
function pluckBuf(ctx,freq){
  const k=Math.round(freq*4); if(ksCache[k])return ksCache[k];
  const sr=ctx.sampleRate,len=Math.floor(sr*2.4),N=Math.max(2,Math.round(sr/freq));
  const buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  const ring=new Float32Array(N);
  for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
  let p=0,last=0;
  for(let i=0;i<len;i++){
    const cur=ring[p], v=(cur+last)*.5*.9965;
    d[i]=v*Math.exp(-i/(sr*1.6));
    ring[p]=v; last=cur; p=(p+1)%N;
  }
  ksCache[k]=buf; return buf;
}

/* ============ 실제 악기 샘플(General MIDI, 무료·공개 라이선스) ============
   합성음 대신 실제로 녹음된 악기 소리를 쓴다. 온라인일 때만 되고, 처음 쓰는 음은
   내려받는 동안 합성음으로 대신 채워둔다 — 재생이 끊기거나 멈추는 일은 없다.
   같은 음을 다시 연주할 때부터(같은 곡 반복 재생, 다음 곡 등) 실제 소리로 들린다. */
const SAMPLE_BASE='https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@gh-pages/FluidR3_GM/';
const SAMPLE_MAP={piano:'acoustic_grand_piano',ep:'electric_piano_1',organ:'drawbar_organ',
  strings:'string_ensemble_1',cello:'cello',brass:'trumpet',flute:'flute',
  choir:'choir_aahs',pad:'pad_2_warm',guitar:'acoustic_guitar_nylon',bass:'acoustic_bass'};
const FLAT_NAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const sampleCache=new Map();               // 'folder|pc|oct' -> AudioBuffer(성공) | null(실패) | Promise(진행중)
const sampleKey=(folder,pc,oct)=>folder+'|'+pc+'|'+oct;
async function fetchSample(folder,pc,oct){
  const url=SAMPLE_BASE+folder+'-mp3/'+FLAT_NAMES[pc]+oct+'.mp3';
  const r=await fetch(url); if(!r.ok)throw new Error('no sample');
  const buf=await r.arrayBuffer();
  const ctx=AC(); if(!ctx)throw new Error('no audio context');
  return await ctx.decodeAudioData(buf);
}
function warmSample(folder,pc,oct){        // 백그라운드로 미리 받아둔다 — 지금 재생을 막지 않는다
  const key=sampleKey(folder,pc,oct);
  if(sampleCache.has(key))return;
  const p=fetchSample(folder,pc,oct).then(ab=>{sampleCache.set(key,ab);return ab;})
    .catch(()=>{sampleCache.set(key,null);return null;});
  sampleCache.set(key,p);
}
/* 원하는 옥타브의 샘플이 아직 없으면, 같은 음이름의 다른(이미 받아진) 옥타브를 찾아
   재생속도를 2의 거듭제곡으로 걸어 정확히 옮긴다(옥타브 이조는 배음이라 가장 자연스럽다).
   아직 아무 옥타브도 캐시에 없으면(비동기 로딩 전) null — 그 순간만 합성음으로 대신한다. */
function getCachedSample(folder,pc,oct){
  for(let d=0;d<=4;d++){
    const cands=d===0?[oct]:[oct-d,oct+d];
    for(const o of cands){
      const v=sampleCache.get(sampleKey(folder,pc,o));
      if(v&&!(v instanceof Promise))return {buffer:v,octShift:oct-o};
    }
  }
  return null;
}
function playSampleVoice(ctx,I,buf,octShift,t,dur,vel,out2){
  const src=ctx.createBufferSource();
  const rate=Math.pow(2,octShift);
  src.buffer=buf; src.playbackRate.value=rate;
  /* ★★ 긴 음이 **샘플이 끝나면서 툭 끊긴다** (v64에서 고친 것).
     사용자 신고: *"무덤에 머물라 후렴구의 시·라·레(사셨네) 에서 레를
     트럼펫이 길게 부는 게 아니라 너무 짧게 분다! 악보대로 3박 불어야 하는데"*.
     원인은 박자 계산이 아니라 **녹음 길이**다. 우리가 쓰는 GM 샘플(FluidR3)은
     한 음이 1~2초짜리로 녹음되어 있어서, 3박(80BPM 에서 2.2초)를 버틸 수가 없다.
     포장(gain)은 제대로 3박을 버티고 있었지만 **소리 자체가 없어졌던 것**이다.
     ★ 고침: 길게 끌어야 하는 악기(오르간·현악·금관·플루트·합창·패드 = 지속음 I.sus가 높은 것)
       에한해, 샘플이 모자라면 **가운데 구간을 되풀이한다.** 기타·피아노처럼
       원래 사라지는 악기는 건드리지 않는다 — 그건 짧은 게 맞다.
     ★ 되풀이하는 구간은 샘플의 55~92% 로 넓게 잡는다. 앞쪽(어택)을 피하고
       끝쪽(여음)도 피해야 되풀이가 틀려지지 않는다. */
  const effLen=buf.duration/Math.max(1e-6,rate);
  if((I.sus||0)>=0.6&&effLen<dur+0.08){
    const a=buf.duration*0.55, b=buf.duration*0.92;
    if(b-a>0.08){ src.loop=true; src.loopStart=a; src.loopEnd=b; }
  }
  const g=ctx.createGain(), peak=Math.max(.0002,vel);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+Math.min(.02,I.a||.01));   // 샘플 자체에 어택이 있어 살짝만 올린다
  g.gain.setTargetAtTime(.0001,t+dur,Math.max(.05,(I.r||.3)/3));
  src.connect(g); g.connect(out2);
  src.start(t); src.stop(t+dur+(I.r||.3)+.4);
}

/* ★★ 느리게 올라오는 악기는 **미리 시작해야 박에 맞는다** (v62).
   사용자 신고: *"다른 악기들을 넣으면 싱크가 안맞다(박자 밀리는 느낌)"*. 맞는 말이었고,
   원인은 재생 엔진이 아니라 **악기의 어택(소리가 올라오는 시간)** 이었다. 현악 0.24초·
   합창 0.30초·패드 0.45초로 잡혀 있었는데, 84BPM 에서 한 박이 0.71초다 —
   패드는 소리가 **반 박 넘게 늦게** 들린다. 화면 표시는 예약한 시각 그대로라
   "표시는 맞는데 소리가 뒤에서 따라온다"가 된다.
   ★ 소리를 **예약 시각보다 앞당겨 시작**해서, 귀에 들리는 꼭짓점이 박에 오게 한다.
     (피아노·오르간처럼 어택이 빠른 악기는 lead 가 거의 0 이라 아무 영향이 없다)
   ★ 앞당기는 한계는 0.18초다. `startPlay` 가 첫 음 앞에 0.25초를 비워 두므로 안전하고,
     그보다 더 당기면 앞 음표를 침범한다.
   ★ 샘플(실제 악기 녹음)은 자체 어택이 짧아 조금만 당긴다 — 많이 당기면 오히려 빨라진다. */
const leadOf=I=>Math.max(0,Math.min(.18,(I.a||0)*.62));
function voice(ctx,inst,midi,t,dur,vel,pan){
  const I=INSTRUMENTS[inst]||INSTRUMENTS.piano;
  if(I.oct)midi+=I.oct*12;
  const lead=leadOf(I);
  if(lead>0){ const lo=ctx.currentTime+.002; t=Math.max(lo,t-lead); }
  const f=mtof(midi);
  let out2=master;
  if(pan!==undefined&&ctx.createStereoPanner){
    const sp=ctx.createStereoPanner();
    sp.pan.value=Math.max(-.7,Math.min(.7,pan));
    sp.connect(master); out2=sp;
  }
  const sampleFolder=P.realInst!==false&&SAMPLE_MAP[inst];
  if(sampleFolder){
    const oct=Math.floor(midi/12)-1, pc=mod(midi);
    const hit=getCachedSample(sampleFolder,pc,oct);
    /* 샘플은 녹음 자체에 어택이 있어 합성음만큼 당기면 안 된다 — 당긴 만큼 절반을 되돌린다 */
    if(hit){ playSampleVoice(ctx,I,hit.buffer,hit.octShift,t+lead*0.55,dur,vel,out2); return; }
    warmSample(sampleFolder,pc,oct);   // 이번 음은 합성음으로, 다음부터는 실제 소리로
  }
  if(I.pluck){
    const src=ctx.createBufferSource(); src.buffer=pluckBuf(ctx,f);
    src.detune.value=(Math.random()*8-4);
    const g=ctx.createGain();
    g.gain.setValueAtTime(vel*1.1,t);
    g.gain.setTargetAtTime(.0001,t+Math.max(.25,dur*.85),.14);
    src.connect(g); g.connect(out2);
    src.start(t); src.stop(t+Math.min(2.4,dur+.7));
    return;
  }
  const end=t+dur+I.r+.2;
  const g=ctx.createGain(), peak=Math.max(.0002,vel);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+I.a);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak*I.sus),t+I.a+I.d);
  g.gain.setTargetAtTime(.0001,t+dur,I.r/3);

  let node=g;
  if(I.lp){                                   // 톤을 둥글게
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.value=I.lp[0]; lp.Q.value=I.lp[1];
    g.connect(lp); node=lp;
  }
  if(I.fenv){                                 // 금관: 세게 불면 밝아진다
    const bp=ctx.createBiquadFilter(); bp.type='lowpass'; bp.Q.value=.9;
    bp.frequency.setValueAtTime(I.fenv[0],t);
    bp.frequency.linearRampToValueAtTime(I.fenv[1],t+I.fenv[2]);
    bp.frequency.setTargetAtTime(I.fenv[0]*1.6,t+dur*.7,.3);
    node.connect(bp); node=bp;
  }
  node.connect(out2);

  let vibGain=null;
  if(I.vib){                                  // 비브라토 — 전자음을 벗어나는 핵심
    const lfo=ctx.createOscillator(), lg=ctx.createGain();
    lfo.frequency.value=I.vib[0];
    lg.gain.setValueAtTime(0,t);
    lg.gain.linearRampToValueAtTime(I.vib[1]*100,t+Math.min(.5,I.a+.25));  // 서서히 걸린다
    lfo.connect(lg); lfo.start(t); lfo.stop(end);
    vibGain=lg;
  }
  if(I.breath){                               // 플루트 숨소리
    const len=Math.max(1,Math.floor(ctx.sampleRate*Math.min(.25,dur)));
    const nb=ctx.createBuffer(1,len,ctx.sampleRate), nd=nb.getChannelData(0);
    for(let i=0;i<len;i++)nd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const ns=ctx.createBufferSource(); ns.buffer=nb;
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=f*2; nf.Q.value=1.2;
    const ng=ctx.createGain(); ng.gain.value=vel*I.breath;
    ns.connect(nf); nf.connect(ng); ng.connect(out2);
    ns.start(t); ns.stop(t+Math.min(.3,dur));
  }

  const layer=(inst==='piano'||inst==='ep'||inst==='pad'||inst==='strings'||inst==='choir')?2:1;
  for(const[mult,amp] of I.partials){
    for(let L=0;L<(mult===1?layer:1);L++){
      const o=ctx.createOscillator(), og=ctx.createGain();
      o.type=I.wave||'sine';
      o.frequency.value=f*mult;
      o.detune.value=(layer>1&&mult===1?(L===0?-6:6):0)+(I.spread?(Math.random()*6-3):0);
      if(vibGain)vibGain.connect(o.detune);
      og.gain.value=amp/(mult===1?layer:1);
      o.connect(og); og.connect(g);
      o.start(t); o.stop(end);
    }
  }
}

/* 연주 패턴: 한 코드가 차지하는 b박을 어떻게 쪼개 칠 것인가
   반환 [{t:박 오프셋, n:[미디음], d:박 길이, g:세기}] */
const PATTERNS={
  block:{label:'블록 코드',build:(v,b)=>[{t:0,n:[v.bass].concat(v.upper),d:b,g:.26}]},

  arp:{label:'아르페지오',build:(v,b)=>{
    const u=v.upper, top=u[u.length-1];
    const seq=[v.bass,u[0],u[1]||u[0],top,u[1]||u[0],u[0]];
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++)out.push({t:i*step,n:[seq[i%seq.length]],d:b-i*step+.4,g:.30});
    return out;}},

  alberti:{label:'알베르티',build:(v,b)=>{
    const u=v.upper, hi=u[u.length-1], mid=u[1]||u[0];
    const seq=[v.bass,hi,mid,hi];
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++)out.push({t:i*step,n:[seq[i%4]],d:step*2.2,g:.29});
    return out;}},

  eight:{label:'8비트',build:(v,b)=>{
    const n=Math.max(2,Math.round(b*2)),step=b/n,out=[];
    for(let i=0;i<n;i++){
      const t=i*step;
      if(i%2===0)out.push({t,n:[v.bass],d:step*1.7,g:.32});
      out.push({t,n:v.upper,d:step*.95,g:i%2?.13:.19});
    }
    return out;}},

  waltz:{label:'왈츠',build:(v,b)=>{
    const beats=Math.max(2,Math.round(b)),out=[{t:0,n:[v.bass],d:1,g:.33}];
    for(let i=1;i<beats;i++)out.push({t:i,n:v.upper,d:.9,g:.19});
    return out;}},

  shuffle:{label:'셔플',build:(v,b)=>{
    const n=Math.max(1,Math.round(b)),out=[];
    for(let i=0;i<n;i++){
      out.push({t:i,n:i%2===0?[v.bass]:v.upper,d:.62,g:.30});
      out.push({t:i+2/3,n:v.upper,d:.34,g:.16});
    }
    return out;}},

  bossa:{label:'보사노바',build:(v,b)=>{
    const out=[],n=Math.max(2,Math.round(b));
    for(let i=0;i<n;i+=2){
      out.push({t:i,n:[v.bass],d:1.4,g:.32});
      out.push({t:i+1.5,n:[v.bass],d:1,g:.27});
    }
    [0,.75,1.5,2.5,3.25].forEach(t=>out.push({t,n:v.upper,d:.5,g:.17}));
    return out;}},

  ballad:{label:'발라드',build:(v,b)=>{
    const u=v.upper,out=[{t:0,n:[v.bass],d:b,g:.30}];
    const rest=Math.max(1,Math.round((b-.5)*2)),step=(b-.5)/rest;
    for(let i=0;i<rest;i++)out.push({t:.5+i*step,n:[u[i%u.length]],d:b-(.5+i*step)+.5,g:.24});
    return out;}}
};

/* ============ 화음 자리잡기 (보이싱) ============
   ★ v61까지는 코드를 늘 **기본 위치**로만 쳤다(`upper: iv.map(i=>60+rp+i)`). 그래서
     코드가 바뀔 때마다 세 소리가 통째로 뛰어다녔다 — 성부 진행이 아예 없었다.
     사용자 지적: *"악기를 추가하면 화음이 넣어야하는데 굉장히 조잡해보이는 별로이다"*.
   반주가 조잡하게 들리는 이유는 대개 **음이 틀려서가 아니라 자리가 틀려서**다:
     ① 코드마다 통째로 점프한다 → 귀에 "화성 진행"이 아니라 "덩어리 이동"으로 들린다
     ② 악기를 여럿 고르면 **전부 같은 음을 같은 옥타브로** 겹쳐 쳐서 뭉갠다
   ①은 전위(inversion) 중에서 **앞 코드에서 가장 적게 움직이는 것**을 고르면 사라진다.
   ②는 악기마다 맡는 자리를 나눠 주면 사라진다(strike 의 layerOf). */
const VOICE_LO=55, VOICE_HI=79;                 // G3~G5 — 반주가 멜로디를 덮지 않는 자리
function voiceLead(pcs,prev){
  const uniq=[]; pcs.forEach(x=>{ const m2=mod(x); if(uniq.indexOf(m2)<0)uniq.push(m2); });
  const n=uniq.length;
  if(!n)return [];
  let best=null,bestCost=Infinity;
  for(let rot=0;rot<n;rot++){
    const v=[];
    let m=VOICE_LO+mod(uniq[rot]-VOICE_LO);
    v.push(m);
    for(let k=1;k<n;k++){
      const pc=uniq[(rot+k)%n];
      let x=v[v.length-1]+1; while(mod(x)!==pc)x++;
      v.push(x);
    }
    while(v[v.length-1]>VOICE_HI&&v[0]-12>=VOICE_LO-5)for(let i=0;i<v.length;i++)v[i]-=12;
    /* 앞 코드의 어느 소리에서든 가장 가까운 거리의 합 — 공통음이 제자리에 남으면 싸진다 */
    const cost=(prev&&prev.length)
      ? v.reduce((a,x)=>a+Math.min.apply(null,prev.map(q=>Math.abs(x-q))),0)
        +Math.abs(v[0]-prev[0])*0.6
      : Math.abs(v[0]-60)+Math.abs(v[v.length-1]-72);
    if(cost<bestCost){bestCost=cost;best=v;}
  }
  return best;
}
function chordVoicing(chord,semis,prev){
  let iv=[0,4,7]; for(const[re,x] of QUAL) if(re.test(chord.suffix)){iv=x;break;}
  const rp=mod(chord.root+semis);
  const bassPc=mod((chord.bass===null?chord.root:chord.bass)+semis);
  return {bass:36+bassPc, upper:voiceLead(iv.map(i=>rp+i),prev), rootPc:rp};
}

/* 여러 악기를 동시에 울린다.
   ★ **하나도 안 고른 상태를 허용한다**(v63, 사용자 요청) — *"악기 경우 무조건 1개를 선택해야
     하는 게 아니라 내가 선택 해제를 다 할 수 있도록 해야 한다"*. 예전에는 마지막 하나를
     못 지웠고, 지워지더라도 여기서 몰래 피아노로 되돌려 놨다. 이제 빈 목록은 빈 목록이다 —
     반주가 소리를 내지 않는다(멜로디만 남는다). 멜로디까지 끄면 아무 소리도 안 난다. */
function instList(){
  const l=Array.isArray(P.insts)?P.insts:['piano'];
  return l.filter(k=>INSTRUMENTS[k]);
}
/* 지금 실제로 소리가 나는가 — 화면(건반)과 소리가 **같은 답**을 써야 한다(v63).
   예전에는 건반이 이걸 안 보고 늘 다 켰다: 멜로디만 골라도 반주 코드 음이 같이 켜졌고,
   반주만 골라도 멜로디 음이 켜졌다. 사용자 요청 그대로 고친다 —
   *"멜로디만 선택했을 경우 피아노 건반도 멜로디만 나와야 한다"*. */
function accompOn(){ return P.accomp!==false&&instList().length>0; }
function melodyOn(){ return P.melody!==false; }
/* 악기마다 맡을 자리를 나눈다 — **전부 같은 음을 겹쳐 치면 뭉갠다**(v62).
   0번째: 화음 전체 · 1번째: 밑음과 5도를 한 옥타브 아래(깔개) · 2번째: 꼭대기 음만(색깔)
   3번째부터: 가운데 한 음만. 뒤로 갈수록 소리도 작아진다.
   ★ 1번째를 '밑음+3도'로 하면 안 된다 — 낮은 자리의 3도는 탁하다. 빈 5도가 깔개로 맞다. */
const LAYER_G=[1,.6,.52,.42];
function layerOf(ii,v,total){
  const u=(v.upper||[]).slice(), n=Math.max(1,total||1);
  if(u.length<2)return u;
  if(ii===1){
    /* 깔개 — 밑음과 5도를 한 옥타브 아래로. ★ 3도를 깔면 안 된다(낮은 자리의 3도는 탁하다).
       화음이 11반음 안에 쌓여 있으므로 −12 한 음은 **언제나 화음보다 아래**다 = 겹치지 않는다. */
    const root=u.find(m=>mod(m)===v.rootPc);
    const fifth=u.find(m=>mod(m)===mod(v.rootPc+7));
    const a=(root===undefined?u[0]:root)-12;
    const b=(fifth===undefined?u[u.length-1]:fifth)-12;
    return a===b?[a]:[Math.min(a,b),Math.max(a,b)];
  }
  if(ii===2)return [u[u.length-1]];                 // 꼭대기 = 색깔
  if(ii>=3)return [u[(ii-3)%u.length]];
  /* 0번째(주 악기)는 **악기가 늘수록 자리를 내준다** — 안 그러면 2·3번째가 치는 음을
     그대로 또 쳐서 같은 음이 둘씩 겹친다(그게 '조잡함'의 정체다). */
  if(n<=2)return u;
  if(n===3)return u.slice(0,-1);
  return u.length>2?u.slice(1,-1):u;
}
function strike(ctx,chord,semis,insts,t,dur,beats,spb,pre){
  const list=(insts||[]).filter(k=>INSTRUMENTS[k]);
  if(!list.length)return;                      // 악기를 하나도 안 골랐으면 반주는 쉰다(v63)
  setReverb(list);
  /* 겹칠수록 각각을 낮춰 뭉개지지 않게 + 사용자가 조절하는 반주 소리 크기(P.accVol) */
  const mix=(1/Math.sqrt(list.length))*(P.accVol!=null?P.accVol:1);
  const v=pre||chordVoicing(chord,semis);
  const P2=PATTERNS[P.pattern]||PATTERNS.block;
  list.forEach((inst,ii)=>{
    const I=INSTRUMENTS[inst];
    if(I.bassOnly){
      const evs0=P2.build(v,beats).filter(e=>e.t<beats&&e.t>=0);
      evs0.forEach(e=>{ if(e.n.some(m=>m<52))voice(ctx,inst,v.bass,t+e.t*spb,Math.max(.14,e.d*spb),e.g*mix,0); });
      return;
    }
    /* 반주 패턴을 **그 악기가 맡은 음들로** 다시 짠다 — 아르페지오·알베르티도 자기 자리에서 돈다 */
    const vl={bass:v.bass,upper:layerOf(ii,v,list.length),rootPc:v.rootPc};
    if(!vl.upper.length)return;
    const evs=P2.build(vl,beats).filter(e=>e.t<beats&&e.t>=0);
    const lg=LAYER_G[Math.min(ii,LAYER_G.length-1)];
    const off=ii*.008;                          // 악기마다 아주 살짝 어긋나게 = 합주 느낌
    for(const e of evs){
      const n=e.n.length;
      e.n.forEach((m,i)=>{
        const low=m<52;
        const pan=low?0:((n>1?(i/(n-1)):.5)-.5)*.62+(ii-(list.length-1)/2)*.12;
        voice(ctx,inst,m,t+e.t*spb+i*(I.spread||0)+off,Math.max(.14,e.d*spb),e.g*mix*lg,pan);
        /* 옥타브 겹쳐 치기는 **악기가 하나일 때만** — 여럿이면 그것만으로 이미 두껍다 */
        if(low&&e.g>.28&&list.length===1)voice(ctx,inst,m-12,t+e.t*spb+off,Math.max(.14,e.d*spb),e.g*.4*mix,0);
      });
    }
  });
}
function click(ctx,t,strong){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='square'; o.frequency.value=strong?1600:1050;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(strong?.16:.09,t+.001);
  g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.06);
}
function tapChord(chord,semis){
  const ctx=AC(); if(!ctx||!chord)return;
  const list=instList();
  if(!list.length)return;                      // 악기를 다 끄면 코드를 눌러도 소리가 없다(v63)
  setReverb(list);
  const v=chordVoicing(chord,semis), t=ctx.currentTime+.01, mix=1/Math.sqrt(list.length);
  list.forEach((inst,ii)=>{
    const I=INSTRUMENTS[inst];
    voice(ctx,inst,v.bass,t+ii*.008,1.4,.34*mix,0);
    if(!I.bassOnly)v.upper.forEach((m,i,arr)=>
      voice(ctx,inst,m,t+i*(I.spread||0)+ii*.008,1.4,.26*mix,((i/Math.max(1,arr.length-1))-.5)*.6));
  });
