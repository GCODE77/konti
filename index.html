        if(prov==='gemini')t=await geminiScan(getGKey(),p2,b64,m=>say(tag+m));
      }
      t=t.trim().replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim();
      /* 멜로디가 악보로서 말이 안 되면 그 단만 한 번 더 읽는다(문제 있는 단에만 한도를 쓴다).
         두 번 중 더 나은 쪽을 고른다 — 다시 읽은 게 더 나쁘면 첫 결과를 그대로 쓴다. */
      if(withMel&&P.recheck!==false&&(prov==='gemini'||hosted)){
        const q=melScore(t);
        if(q&&q.score<0.75){
          say(tag+'음높이·박자가 맞지 않아 다시 확인하는 중…');
          try{
            const p3=mkPrompt({retry:q.why});
            let t2='';
            if(hosted){
              const r=await fetch(SCAN_ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({data:b64,prompt:p3})});
              if(!r.ok)throw new Error('서버 응답 '+r.status);
              const d=await r.json();
              t2=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
            }else{
              t2=await geminiScan(getGKey(),p3,b64,m=>say(tag+m));
            }
            t2=stripFence(t2);
            const q2=melScore(t2);
            if(t2&&q2&&q2.score>q.score+0.05){ t=t2; rechecked++; }
          }catch(e){ /* 다시 읽기가 실패하면(한도 등) 첫 결과를 그대로 쓴다 */ }
        }
      }
      /* 우리가 잰 음높이로 덮어쓴다 — 개수가 정확히 같을 때만(applyGeomPitch 안에서 검사) */
      if(geoNames&&withMel){
        const ap=applyGeomPitch(t,geoNames);
        if(ap.matched){ t=ap.text; geomSys++; geomFixed+=ap.changed; }
        /* 음높이를 확정한 단에서만 박자도 덮어쓴다 — 개수가 맞았다는 게 이미 확인된 상태다 */
        if(ap.matched&&geoNotes){
          const ad=applyGeomDur(t,geoNotes,P.beats);
          if(ad.matched){ t=ad.text; durSys++; durFixed+=ad.changed; }
        }
      }
      carryNote=lastMelNote(t)||carryNote;
      const tm=t.match(/^TITLE:\s*(.+)$/m);
      if(tm){ if(i===0)$('title').value=tm[1].trim(); t=t.replace(/^TITLE:\s*.+$/m,'').trim(); }
      if(t)pages.push(t);
      sysRec.push({page:shots[i].page||0,t0:shots[i].t0||0,t1:(shots[i].t1===undefined?1:shots[i].t1),
                   w:t?sysWeight(t):0,whole:!!shots[i].whole});
      if(i<NN-1)await new Promise(r=>setTimeout(r,1100));   // 무료 등급 분당 한도 배려
    }
    let text=pages.join('\n\n');
    if(!text)throw new Error('읽어낸 내용이 없습니다 — 사진을 더 밝고 반듯하게 찍어 보세요');
    S.raw=text; S.semis=0; S.verse=1; stopPlay();
    S.orig=buildOrig(sysRec);
    /* 사진에서 가져온 곡은 '원본 사진 보기'로 바로 들어간다(v49, 사용자 요청).
       인식이 얼마나 잘 됐든 반주자가 실제로 보고 연주하는 건 자기가 찍은 그 사진이다 —
       우리가 옮겨 적은 텍스트는 '지금 어디를 연주하는지'와 반주 소리를 위한 재료다.
       그래서 첫 화면은 원본 사진이고, 옮겨 적은 악보는 보기 전환으로 확인한다. */
    if(hasSheet())S.mode='sheet';
    reparse(); renderAll(); addHistory();
    clearWork();
    const bits=[];
    bits.push('코드 '+blocks.reduce((a,b)=>a+(b.k==='pairs'?b.pairs.filter(p=>p.chord).length:0),0)+'개'
      +', 가사 '+ (S.raw.match(/[가-힣]/g)||[]).length +'자'
      + (hasMelody()?', 멜로디 '+blocks.filter(b=>b.k==='mel').reduce((a,b)=>a+b.notes.filter(n=>!n.bar&&!n.rest).length,0)+'개':', 멜로디는 못 읽었습니다'));
    if(geomSys)bits.push(geomSys+'단은 오선 자리를 픽셀로 재서 음높이를 확정했습니다'
      +(geomFixed?'(AI가 잘못 본 '+geomFixed+'음 교정)':''));
    if(durSys)bits.push(durSys+'단은 음표 길이(박자)까지 재서 확정했습니다'
      +(durFixed?'(AI가 잘못 본 '+durFixed+'음 교정)':''));
    if(rechecked)bits.push(rechecked+'단은 음높이가 이상해서 다시 읽었습니다');
    if(SUSPECT)bits.push('확인이 필요한 음 '+SUSPECT+'개를 동그라미로 표시했습니다');
    if(LAST_TRUNCATED)bits.push('길이 제한으로 뒷부분이 잘렸을 수 있습니다 — 악보를 반씩 나눠 찍으면 더 잘 됩니다');
    showResult('ok','악보를 옮겼습니다',bits.join('. ')+'.<br>'
      +(hasSheet()?'<b>올린 사진을 그대로 띄웠습니다</b> — 재생하면 사진 위에서 따라갑니다.'
                 :'원본과 비교해 확인해 주세요.'),
      [{label:'옮겨 적은 악보 확인',pri:true,fn:()=>setMode(hasMelody()?'staff':'text')},
       {label:'직접 고치기',fn:()=>openPanel('input')}]);
    closePanel();
  }catch(err){
    if(err.quota&&!hosted&&prov==='gemini'){ await ocrFallback(ocrResult,say,fail); return; }
    fail((err.message||'변환 실패')+' — 다시 시도하거나 <b>직접 입력</b>에 옮겨 주세요.');
  }
}
/* Gemini 무료 한도를 다 쓰면 사용자가 따로 누를 필요 없이 OCR 결과로 대신 채워 넣는다.
   그리고 반드시 "무료 한도 때문에 OCR로만 처리했다"는 걸 결과 화면에 밝힌다 — 왜 멜로디가
   없는지, 왜 정확도가 떨어지는지 사용자가 헷갈리지 않게. */
async function ocrFallback(existing,say,fail){
  try{
    say('무료 한도 소진 — 대신 OCR로 읽는 중…');
    const {text:txt,chordN,lyricN}=(existing&&existing.text)?existing:await ocrDraft(S.photos.map(p=>p.ocrUrl||p.url),say);
    if(!txt||!txt.trim())throw new Error('OCR로도 읽어낸 내용이 없습니다');
    S.raw=txt; S.semis=0; S.verse=1; stopPlay();
    /* OCR로 대체됐어도 원본 사진은 그대로 보여 준다 — 깨진 글자보다 원본이 훨씬 쓸모 있다.
       단 구분 정보가 없으니 쪽 전체를 한 덩어리로 잡는다. */
    S.orig=buildOrig(S.photos.map((ph,pi)=>({page:pi,t0:0,t1:1,w:1,whole:true})));
    if(hasSheet())S.mode='sheet';   // OCR 결과가 깨져도 사진은 정확하다 — 사진을 기본 화면으로
    reparse(); renderAll(); addHistory();
    clearWork();
    showResult('warn','무료 한도를 다 써서 OCR로만 옮겼습니다',
      '<b>결과 품질이 많이 떨어집니다.</b> 키 없이 글자만 인식한 것이라 <b>멜로디(음표)는 아예 읽지 못하고</b>, '
      +'가사도 깨져 나오는 경우가 많습니다(코드 '+chordN+'개, 가사 '+lyricN+'덩어리).<br>'
      +'Gemini 무료 한도는 <b>태평양 시간 자정(한국 시간 오후 4~5시)</b>에 초기화됩니다. '
      +'그때 다시 인식하시면 멜로디까지 제대로 나옵니다.',
      [{label:'직접 입력으로 고치기',pri:true,fn:()=>openPanel('input')},
       {label:'옮겨 적은 글자 보기',fn:()=>setMode('text')}]);
    const box=$('scanstate');
    if(box){
      box.className='callout ok';
      box.innerHTML='<b>Gemini 무료 한도를 다 써서 대신 OCR(문자 인식)로만 옮겼습니다.</b> '
        +'코드 '+chordN+'개, 가사 '+lyricN+'덩어리를 읽었습니다'+(S.photos.length>1?' ('+S.photos.length+'쪽)':'')+'. '
        +'키 없이 읽은 것이라 빠지거나 틀린 게 많고 <b>멜로디(음표)는 읽지 못합니다</b> — 원본과 비교하며 '
        +'<b>직접 입력</b>에서 고쳐 주세요. 한도는 태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다.';
    }
    /* AI로 성공했을 때와 달리 여기서는 패널을 자동으로 닫지 않는다 — 결과 질이 떨어진 이유를
       사용자가 위 안내에서 직접 읽고 확인한 뒤 스스로 닫게 한다. */
  }catch(err2){
    fail('Gemini 무료 한도를 다 썼고, OCR로도 실패했습니다: '+(err2.message||'알 수 없는 오류')+' — <b>직접 입력</b>에 옮겨 주세요.');
  }
}

/* ============ 음악 파일 → 채보(베타) ============
   서버 없이 브라우저 안에서만 동작: 가사는 Whisper(transformers.js, CDN에서 모델을 받아옴),
   멜로디는 자기상관(autocorrelation) 기반 단음 피치 추적으로 뽑는다.
   합주곡(여러 음이 겹치는 곡)에는 안 맞고, 보컬이 뚜렷한 단선율 위주로만 그럭저럭 동작한다. */
function audioToMono(buffer){
  if(buffer.numberOfChannels===1)return buffer.getChannelData(0).slice();
  const L=buffer.getChannelData(0), R=buffer.getChannelData(1), out=new Float32Array(L.length);
  for(let i=0;i<L.length;i++)out[i]=(L[i]+R[i])/2;
  return out;
}
async function resampleTo(buffer,rate){
  const len=Math.max(1,Math.ceil(buffer.duration*rate));
  const off=new OfflineAudioContext(1,len,rate);
  const src=off.createBufferSource(); src.buffer=buffer; src.connect(off.destination); src.start();
  const rendered=await off.startRendering();
  return rendered.getChannelData(0).slice();
}
/* 프레임마다 RMS(소리 크기)와 자기상관으로 얻은 기본주파수를 구해 반음 단위로 묶는다 */
/* Basic Pitch 는 Float32Array 가 아니라 AudioBuffer 를 받고, 22050Hz 가 아니면 예외를 던진다 */
async function resampleBuffer(buffer,rate){
  const len=Math.max(1,Math.ceil(buffer.duration*rate));
  const off=new OfflineAudioContext(1,len,rate);
  const src=off.createBufferSource(); src.buffer=buffer; src.connect(off.destination); src.start();
  return await off.startRendering();
}

/* ============ 오디오 → 멜로디: Spotify Basic Pitch (v49) ============
   원래는 자기상관(detectMelodyNotes)으로 직접 기본주파수를 쫓았다. 그건 사람 목소리
   하나만 녹음한 파일에나 통하고, 반주가 섞인 MR·음원에서는 거의 쓸 수 없다.
   Spotify 가 공개한 Basic Pitch(Apache 2.0)는 다성(여러 음이 같이 나는) 채보용으로
   학습된 모델이고, **TensorFlow.js 판이 따로 있어 브라우저 안에서만 돌린다** —
   서버 없이·무료라는 이 앱의 제약을 그대로 지킨다. 모델 가중치는 0.9MB뿐이다.
     https://github.com/spotify/basic-pitch-ts  (Apache License 2.0)

   ★ 반드시 '?bundle' 을 붙여 불러야 한다. 그냥 esm.sh/@spotify/basic-pitch 로 하면
     TensorFlow.js 의존 모듈 그래프를 브라우저가 수백 개로 쪼개 받다가 **영원히
     끝나지 않는다**(실측: 45초 넘게 then/catch 둘 다 안 불렸다). '?bundle' 은 한 파일로
     묶어 주고 1.8초에 끝난다.
   ★ 문턱값 0.3 / 0.25 / 8 은 실측으로 고른 값이다. README 예시(0.25/0.25/5)보다 조금
     올렸고, 0.5/0.3/11 로 조이면 **곡 앞부분 음들이 통째로 안 잡힌다**(합성 음원 8음 중
     앞 3음이 빠졌다). 이 값에서는 16초 32음이 음높이·시작시각 모두 정확히 나왔다.
   ★ 속도: 처음 한 번은 모델·백엔드 준비에 20초쯤 걸리고, 그 뒤로는 오디오 길이의
     0.11배(16초 → 1.8초)다. 3분 곡이면 20초 남짓. */
const BP_VER='1.0.1';
const BP_ESM='https://esm.sh/@spotify/basic-pitch@'+BP_VER+'?bundle';
const BP_MODEL='https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@'+BP_VER+'/model/model.json';
let BPITCH=null;
async function loadBasicPitch(){
  if(BPITCH)return BPITCH;
  const mod=await import(BP_ESM);
  BPITCH={mod, bp:new mod.BasicPitch(BP_MODEL)};
  return BPITCH;
}
/* 다성으로 나온 음들 중 "그 순간 가장 높은 소리"만 남겨 단성 선율로 만든다.
   찬양 멜로디는 거의 항상 맨 위 소리다 — 오선보에서 소프라노만 고르는 것과 같은 규칙이고,
   그래서 사진 경로(staffGeom)와 음원 경로가 같은 것을 가리킨다(서로 검산할 수 있다). */
function topLine(notes,dur){
  const bnd=new Set([0]);
  notes.forEach(n=>{ bnd.add(+n.startTimeSeconds.toFixed(3));
                     bnd.add(+(n.startTimeSeconds+n.durationSeconds).toFixed(3)); });
  if(dur)bnd.add(+dur.toFixed(3));
  const ts=[...bnd].sort((a,b)=>a-b);
  const segs=[];
  for(let i=0;i+1<ts.length;i++){
    const a=ts[i], b=ts[i+1]; if(b-a<0.02)continue;
    let hi=null;
    for(const n of notes){
      const st=n.startTimeSeconds, en=st+n.durationSeconds;
      if(st<=a+1e-6&&en>=b-1e-6&&(hi===null||n.pitchMidi>hi))hi=n.pitchMidi;
    }
    segs.push(hi===null?{rest:true,dur:b-a}:{midi:hi,dur:b-a});
  }
  const out=[];
  for(const g of segs){
    const p=out.length?out[out.length-1]:null;
    if(p&&((g.rest&&p.rest)||(!g.rest&&!p.rest&&p.midi===g.midi))){ p.dur+=g.dur; continue; }
    if(p&&g.dur<0.07){ p.dur+=g.dur; continue; }   // 아주 짧은 조각은 잡음이라 앞 음에 흡수
    out.push({rest:g.rest,midi:g.midi,dur:g.dur});
  }
  return out;
}
async function bpMelody(ab,setStatus){
  const {mod,bp}=await loadBasicPitch();
  const buf=await resampleBuffer(ab,22050);
  const frames=[],onsets=[],contours=[];
  await bp.evaluateModel(buf,
    (fr,on,co)=>{ frames.push(...fr); onsets.push(...on); contours.push(...co); },
    p=>{ if(setStatus)setStatus('멜로디를 음표로 옮기는 중… '+Math.round((p||0)*100)+'%'); });
  const notes=mod.noteFramesToTime(
    mod.addPitchBendsToNoteEvents(contours, mod.outputToNotesPoly(frames,onsets,0.3,0.25,8)));
  return topLine(notes,ab.duration);
}
/* 프레임마다 RMS(소리 크기)와 자기상관으로 얻은 기본주파수를 구해 반음 단위로 묶는다.
   Basic Pitch 를 못 받았을 때(오프라인 등)만 쓰는 예비 경로다 — 반주가 섞인 음원에는 약하다. */
function detectMelodyNotes(mono,sr){
  const frame=1024, hop=512;
  const minLag=Math.floor(sr/1000), maxLag=Math.floor(sr/70);
  const hopSec=hop/sr, runs=[]; let cur=null;
  for(let i=0;i+frame<=mono.length;i+=hop){
    let rms=0; for(let j=0;j<frame;j++)rms+=mono[i+j]*mono[i+j];
    rms=Math.sqrt(rms/frame);
    let midi=null;
    if(rms>0.012){
      let bestLag=-1,bestVal=0;
      for(let lag=minLag;lag<=maxLag;lag++){
        let sum=0; for(let j=0;j<frame-lag;j++)sum+=mono[i+j]*mono[i+j+lag];
        if(sum>bestVal){bestVal=sum;bestLag=lag;}
      }
      if(bestLag>0){ const f0=sr/bestLag; midi=Math.round(69+12*Math.log2(f0/440)); }
    }
    const rest=(midi===null);
    if(cur&&((rest&&cur.rest)||(!rest&&!cur.rest&&midi===cur.midi))){ cur.dur+=hopSec; continue; }
    if(cur)runs.push(cur);
    cur=rest?{rest:true,dur:hopSec}:{midi,dur:hopSec};
  }
  if(cur)runs.push(cur);
  const MIN=hopSec*3, merged=[];               // 3프레임 미만 잡음은 앞 음에 흡수
  for(const n of runs){
    if(n.dur<MIN&&merged.length){ merged[merged.length-1].dur+=n.dur; continue; }
    merged.push(n);
  }
  return merged;                                // [{midi|rest,dur(초)}]
}
/* 초 단위 길이를 주어진 BPM 기준 박수로 바꾸고 16분음표 단위로 반올림 */
function quantizeToBeats(runs,bpm){
  return runs.map(n=>{
    let b=Math.max(0.25,Math.round((n.dur*(bpm/60))/0.25)*0.25);
    return n.rest?{rest:true,beats:b}:{midi:n.midi,beats:b};
  });
}
/* 마디 경계(beatsPerBar)에서 음을 잘라 마디선을 끼워 넣는다 */
function barSplitNotes(notes,beatsPerBar){
  const out=[]; let pos=0;
  for(const n of notes){
    let remain=n.beats;
    while(remain>0.001){
      const take=Math.min(remain,beatsPerBar-pos);
      out.push(n.rest?{rest:true,beats:take}:{midi:n.midi,beats:take});
      pos+=take; remain-=take;
      if(pos>=beatsPerBar-0.001){ out.push({bar:true}); pos=0; }
    }
  }
  while(out.length&&out[out.length-1].bar)out.pop();
  return out;
}
function barCountOf(notes){ return notes.filter(n=>n.bar).length+1; }
/* Whisper 단어 타임스탬프를 같은 마디 구간에 떨어지는 것끼리 묶어 가사 줄을 만든다 */
function wordsToBarredLyric(chunks,barCount,beatsPerBar,bpm){
  const secPerBeat=60/bpm, barSec=beatsPerBar*secPerBeat;
  const buckets=new Array(barCount).fill(0).map(()=>[]);
  (chunks||[]).forEach(c=>{
    const t=(c.timestamp&&c.timestamp[0])||0;
    const bi=Math.min(barCount-1,Math.max(0,Math.floor(t/barSec)));
    const w=(c.text||'').trim(); if(w)buckets[bi].push(w);
  });
  // 가사가 없는 마디(간주 등)를 빈 문자열로 두면 파서(withBars)가 그 마디선을 지워버려
  // 멜로디 마디 수와 어긋난다 — 자리표시자를 넣어 마디 개수를 지킨다.
  return buckets.map(b=>b.length?b.join(' '):'·').join('|');
}
let TFJS=null;
async function loadWhisper(onProg){
  if(!TFJS){
    const mod=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    mod.env.allowLocalModels=false;
    TFJS=mod;
  }
  return TFJS.pipeline('automatic-speech-recognition','Xenova/whisper-base',{progress_callback:onProg});
}
/* 전체 파이프라인: 파일 → 멜로디(오선) + 가사(마디 정렬), S.raw에 새 곡으로 써 넣는다 */
async function runAudioTranscribe(setStatus){
  const ab=S.audioFile&&S.audioFile.buf; if(!ab)throw new Error('no-buffer');
  const beatsPerBar=P.beats||4, bpm0=P.bpm;   // 처리 중 사용자가 BPM/박자표를 바꿔도 흔들리지 않도록 시작 시점 값을 고정

  setStatus('멜로디 분석 준비 중… (처음 한 번만 모델 1MB를 내려받습니다)');
  let rawNotes=null, melEngine='basic-pitch';
  try{
    rawNotes=await bpMelody(ab,setStatus);
    if(!rawNotes.some(n=>!n.rest))rawNotes=null;      // 아무 음도 못 찾았으면 예비 경로로
  }catch(e){ rawNotes=null; }
  if(!rawNotes){
    melEngine='간단 방식';
    setStatus('멜로디 분석 중… (모델을 못 받아 간단 방식으로 대체합니다)');
    rawNotes=detectMelodyNotes(await resampleTo(ab,8000),8000);
  }
  const barred=barSplitNotes(quantizeToBeats(rawNotes,bpm0),beatsPerBar);
  const bars=barCountOf(barred);

  setStatus('가사 인식 모델을 내려받는 중… (처음 한 번만, 수십MB)');
  const asr=await loadWhisper(p=>{
    if(p&&p.status==='progress')setStatus('모델 다운로드 중… '+Math.round(p.progress||0)+'%');
  });
  setStatus('가사를 텍스트로 옮기는 중…');
  const mono16k=await resampleTo(ab,16000);
  const result=await asr(mono16k,{chunk_length_s:30,stride_length_s:5,return_timestamps:'word',language:'korean',task:'transcribe'});
  const lyricLine=wordsToBarredLyric(result.chunks,bars,beatsPerBar,bpm0);

  const title=($('title').value||'').trim()||(S.audioFile.name||'').replace(/\.[^.]+$/,'');
  $('title').value=title;
  S.raw='[Verse 1]\n'+melLine(barred,0,'flat')+'\n'+(lyricLine||result.text||'');
  S.semis=0; S.verse=1; S.mode='auto';
  stopPlay(); reparse(); renderAll();
}

/* ============ MusicXML 가져오기(v50) ============
   AI/픽셀 추정 없이 구조화된 데이터를 그대로 옮겨 적는 경로다. 사진에서 AI가 음높이를
   "읽어 맞히는" 것과 달리, MusicXML은 음이름·박자·마디가 이미 숫자로 박혀 있어
   옮기기만 하면 된다 — 사실상 오독이 없다(이 앱이 만들 수 있는 가장 정확한 결과다).
   대신 사용자가 사진을 MusicXML로 바꿔 주는 무료 프로그램(Audiveris 등, 데스크톱 앱)을
   한 번 거쳐야 한다 — "브라우저 안에서 AI 없이"라는 제약을 지키려면 이 방법뿐이다.
   느려도 좋고 파일이 커도 좋다는 전제로, 정확도를 최우선에 두고 만들었다. */

/* .mxl(압축 MusicXML)은 사실 zip이다. 알맹이(안의 .xml 하나)만 꺼내면 되므로
   외부 라이브러리 없이 아주 작은 zip 리더를 직접 짰다. 압축 해제는 브라우저 내장
   DecompressionStream(deflate-raw)를 쓴다 — 옛 브라우저는 못 열지만, 그때는
   Audiveris 등에서 압축 안 된 .xml/.musicxml로 다시 내보내면 된다. */
async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined')
    throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다 — 최신 Chrome/Edge를 쓰거나, 압축 안 된 .xml/.musicxml로 내보내 주세요.');
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter(); w.write(bytes); w.close();
  const buf=await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(buf);
}
function readZipEntries(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eocd=-1;
  const start=Math.max(0,u8.length-22-65557);
  for(let i=u8.length-22;i>=start;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0)throw new Error('zip 구조를 찾지 못했습니다(mxl 파일이 손상되었을 수 있습니다)');
  const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const entries={}; let p=cdOff;
  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true),
      nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commentLen=dv.getUint16(p+32,true),
      lhOff=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    entries[name]={method,compSize,lhOff};
    p+=46+nameLen+extraLen+commentLen;
  }
  return entries;
}
async function readZipEntry(u8,entries,name){
  const e=entries[name]; if(!e)throw new Error('zip 안에 "'+name+'" 항목이 없습니다');
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const nameLen=dv.getUint16(e.lhOff+26,true), extraLen=dv.getUint16(e.lhOff+28,true);
  const dataStart=e.lhOff+30+nameLen+extraLen;
  const raw=u8.subarray(dataStart,dataStart+e.compSize);
  return e.method===0?raw:await inflateRaw(raw);
}
async function mxlToXmlText(buf){
  const u8=new Uint8Array(buf);
  const entries=readZipEntries(u8);
  let rootPath=null;
  if(entries['META-INF/container.xml']){
    const ctxt=new TextDecoder('utf-8').decode(await readZipEntry(u8,entries,'META-INF/container.xml'));
    const m=ctxt.match(/full-path="([^"]+)"/); if(m)rootPath=m[1];
  }
  /* container.xml 이 가리키는 이름이 zip 안에 실제로 없을 수도 있다(경로 표기 차이·인코딩
     문제). 이름을 그대로 믿지 말고, 없으면 zip 안의 .xml 을 직접 찾는다.
     ※ 실제 Audiveris 5.x 가 만든 한글 이름 .mxl 로 확인해 보니 이 경우는 정상이었다 —
        방어용 안전장치다. */
  if(!rootPath||!entries[rootPath])rootPath=Object.keys(entries).find(n=>/\.(musicxml|xml)$/i.test(n)&&!/^META-INF\//i.test(n));
  if(!rootPath)throw new Error('mxl 안에서 악보 파일을 찾지 못했습니다');
  const bytes=await readZipEntry(u8,entries,rootPath);
  return new TextDecoder('utf-8').decode(bytes).replace(/^﻿/,'');
}

/* 코드 기호(<harmony>) 종류 → 이 앱이 쓰는 접미사. <kind text="..">에 원문 표기가
   남아 있으면 그걸 우선한다 — OMR/편집기가 원래 악보에 적힌 그대로를 보존해 두는
   경우가 많아서, 우리가 다시 매핑하는 것보다 원본에 더 가깝다. */
const XML_KIND_SFX={major:'',minor:'m',dominant:'7','dominant-seventh':'7','major-seventh':'maj7',
  'minor-seventh':'m7',augmented:'aug',diminished:'dim','diminished-seventh':'dim7',
  'half-diminished':'m7b5','major-sixth':'6','minor-sixth':'m6','suspended-second':'sus2',
  'suspended-fourth':'sus4','major-ninth':'maj9','dominant-ninth':'9','minor-ninth':'m9',
  power:'5','major-minor':'m/maj7',none:''};
function xmlStepAlterName(step,alter){
  alter=Math.round(alter||0);
  /* 이 앱의 음이름 정규식은 임시표를 한 글자만 받는다(##/bb 없음) — 겹올림/겹내림표는
     드물어서 한 글자로 뭉갠다. 실제 찬양 악보에서 마주칠 일이 거의 없는 한계다. */
  const a=alter>0?'#':alter<0?'b':'';
  return step+a;
}
function parseHarmony(h){
  const root=h.querySelector('root'); if(!root)return null;
  const stepEl=root.querySelector('root-step'); if(!stepEl||!stepEl.textContent)return null;
  const alter=+(root.querySelector('root-alter')?.textContent||0);
  const rootName=xmlStepAlterName(stepEl.textContent.trim(),alter);
  const kindEl=h.querySelector('kind');
  const kindText=kindEl&&kindEl.getAttribute('text');
  const kindVal=kindEl&&kindEl.textContent&&kindEl.textContent.trim();
  let name;
  if(kindText&&/^[A-G]/.test(kindText.trim())){ name=kindText.trim(); }   // 원문에 이미 근음까지 있음
  else{
    let sfx='';
    if(kindText&&kindText.trim())sfx=kindText.trim();
    else if(kindVal&&Object.prototype.hasOwnProperty.call(XML_KIND_SFX,kindVal))sfx=XML_KIND_SFX[kindVal];
    name=rootName+sfx;
  }
  const bass=h.querySelector('bass');
  if(bass){
    const bstep=bass.querySelector('bass-step');
    if(bstep&&bstep.textContent){
      const balter=+(bass.querySelector('bass-alter')?.textContent||0);
      name+='/'+xmlStepAlterName(bstep.textContent.trim(),balter);
    }
  }
  return name;
}
/* MusicXML 한 파트를 이 앱의 차트 텍스트로 바꾼다.
   - 목소리(voice)·오선(staff) 번호가 여럿이면 가장 작은 번호만 쓴다 — MusicXML 관례상
     번호가 작을수록 위(소프라노) 목소리다. topLine(음원)·staffGeom(사진)과 같은 규칙이다.
   - 동시에 울리는 화음(<chord/> 표시가 붙은 음)은 첫 음(맨 위)만 남긴다.
   - 이음줄(<tie>)로 이어진 같은 음은 박수를 더해 하나로 합친다.
   - 마디 경계마다 텍스트에 '|' 문자를 그대로 심어 둔다 — withBars()가 이 문자를
     보고 마디를 나누므로, AI가 만든 결과와 똑같은 표기를 그대로 재사용한다.
   - 코드/가사 줄과 멜로디 줄을 4마디씩 묶어 번갈아 내보낸다(가독성만을 위함 —
     한 줄로 다 이어 붙여도 재생·이조·렌더는 똑같이 동작한다. 실제 화면 조판은
     텍스트 줄바꿈과 무관하게 다시 계산된다). */
function parseMusicXML(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('MusicXML 형식이 아니거나 파일이 손상되었습니다');
  if(!doc.querySelector('score-partwise')){
    throw new Error(doc.querySelector('score-timewise')
      ?'score-timewise 형식은 지원하지 않습니다 — 대부분의 프로그램은 score-partwise로도 내보낼 수 있습니다.'
      :'<score-partwise> 악보를 찾지 못했습니다.');
  }
  const part=doc.querySelector('part');
  if(!part)throw new Error('악보 안에 <part>가 없습니다');
  const measures=[...part.querySelectorAll('measure')];
  if(!measures.length)throw new Error('마디를 찾지 못했습니다');

  let voiceFilter=null, staffFilter=null;
  {
    const voices=new Set(), staffs=new Set();
    measures.forEach(ms=>ms.querySelectorAll('note').forEach(n=>{
      const v=n.querySelector('voice'), s=n.querySelector('staff');
      if(v&&v.textContent.trim())voices.add(v.textContent.trim());
      if(s&&s.textContent.trim())staffs.add(s.textContent.trim());
    }));
    if(voices.size>1)voiceFilter=[...voices].sort((a,b)=>+a-+b)[0];
    if(staffs.size>1)staffFilter=[...staffs].sort((a,b)=>+a-+b)[0];
  }

  let divisions=1, beatsPerBar=null, bpm=null, pendingWord='';
  let curChord=null, curText='';
  const noteText=n=>n.bar?'|':n.rest?('r:'+n.beats):(n.name+':'+n.beats);
  const melLines=[], pairLines=[];
  let melBuf=[], pairsBuf=[], mCount=0;

  const pushPair=()=>{
    if(curChord||curText.trim()||curText.includes('|'))pairsBuf.push({chord:curChord,text:curText});
    curChord=null; curText='';
  };
  const flushChunk=()=>{
    pushPair();
    if(melBuf.length)melLines.push('♪ '+melBuf.map(noteText).join(' '));
    if(pairsBuf.length){
      let s=''; pairsBuf.forEach(p=>{ s+=(p.chord?'['+p.chord+']':'')+p.text; });
      if(s.trim())pairLines.push(s);
    }
    melBuf=[]; pairsBuf=[];
  };

  measures.forEach((ms,mi)=>{
    const dv=ms.querySelector(':scope > attributes > divisions');
    if(dv)divisions=(+dv.textContent)||divisions;
    if(beatsPerBar===null){
      const t=ms.querySelector(':scope > attributes > time');
      if(t){
        const b=+((t.querySelector('beats')||{}).textContent||0);
        const bt=+((t.querySelector('beat-type')||{}).textContent||0);
        if(b&&bt===4)beatsPerBar=b;
      }
    }
    if(bpm===null){
      const snd=ms.querySelector('sound[tempo]');
      if(snd)bpm=Math.round(+snd.getAttribute('tempo'))||null;
    }
    if(mi>0){ if(melBuf.length)melBuf.push({bar:true}); curText+='|'; }
    for(const el of ms.children){
      const tag=el.tagName;
      if(tag==='harmony'){
        const nm2=parseHarmony(el); if(!nm2)continue;
        pushPair(); curChord=nm2; continue;
      }
      if(tag!=='note')continue;
      if(el.querySelector(':scope > grace'))continue;
      const v=el.querySelector(':scope > voice'), s=el.querySelector(':scope > staff');
      if(voiceFilter&&v&&v.textContent.trim()!==voiceFilter)continue;
      if(staffFilter&&s&&s.textContent.trim()!==staffFilter)continue;
      if(el.querySelector(':scope > chord'))continue;   // 동시에 울리는 화음의 아래 음은 건너뛴다
      const durEl=el.querySelector(':scope > duration');
      const beats=durEl?(+durEl.textContent)/divisions:0;
      if(!(beats>0))continue;
      const tieStop=[...el.querySelectorAll(':scope > tie')].some(t=>t.getAttribute('type')==='stop');
      if(el.querySelector(':scope > rest')){
        const prev=melBuf[melBuf.length-1];
        if(prev&&prev.rest)prev.beats=+(prev.beats+beats).toFixed(4);
        else melBuf.push({rest:true,beats:+beats.toFixed(4)});
      }else{
        const pitch=el.querySelector(':scope > pitch');
        if(pitch){
          const step=pitch.querySelector('step').textContent.trim();
          const alter=+(pitch.querySelector('alter')?.textContent||0);
          const octave=+pitch.querySelector('octave').textContent;
          const name=xmlStepAlterName(step,alter)+octave;
          const prev=melBuf[melBuf.length-1];
          if(tieStop&&prev&&!prev.bar&&!prev.rest&&prev.name===name)prev.beats=+(prev.beats+beats).toFixed(4);
          else melBuf.push({name,beats:+beats.toFixed(4)});
        }
      }
      const lyric=el.querySelector(':scope > lyric');
      if(lyric){
        const syl=(lyric.querySelector('text')||{}).textContent||'';
        const type=(lyric.querySelector('syllable-type')||{}).textContent||'single';
        if(type==='begin'||type==='single'){ curText+=pendingWord; pendingWord=syl; }
        else pendingWord+=syl;
        if(type==='end'||type==='single'){ curText+=pendingWord; pendingWord=''; }
      }
    }
    if(++mCount>=4||mi===measures.length-1){ flushChunk(); mCount=0; }
  });
  if(pendingWord)curText+=pendingWord;
  if(melBuf.length||pairsBuf.length||curText||curChord)flushChunk();

  if(!melLines.length)throw new Error('음표를 하나도 찾지 못했습니다(다른 목소리를 골라야 할 수 있습니다)');
  const lines=[]; const n=Math.max(melLines.length,pairLines.length);
  for(let i=0;i<n;i++){ if(melLines[i])lines.push(melLines[i]); if(pairLines[i])lines.push(pairLines[i]); }
  return {text:lines.join('\n'),beatsPerBar,bpm};
}

/* ============ 패널 ============ */
function openPanel(name){
  const s=$('sheet');
  const scanTitle=S.importMode==='audio'?'음악 파일에서 채보':S.importMode==='photo'?'사진에서 가져오기':S.importMode==='musicxml'?'MusicXML 가져오기':'가져오기';
  const titles={scan:scanTitle,input:'악보 편집',library:'저장된 콘티',export:'내보내기',diag:'멜로디 진단',play:'재생 설정',view:'보기 설정',staff:'오선보'};
  s.innerHTML='<div class="sheethead"><span class="eyebrow">'+titles[name]+'</span><button class="btn" id="close">닫기</button></div>';
  const body=document.createElement('div');s.appendChild(body);
  $('close').onclick=closePanel;

  if(name==='scan'&&!S.importMode){
    body.innerHTML='<p class="note" style="margin-top:0">어떤 방법으로 악보를 만들까요?</p>'
      +'<div class="modecards">'
      +'<button class="modecard" id="pick-photo"><span class="ico">📷</span><span>'
      +'<span class="tt">사진으로 코드차트 인식</span>'
      +'<span class="ds">종이 악보·코드차트 사진을 찍으면 코드·가사·멜로디를 텍스트로 옮겨 적습니다.</span></span></button>'
      +'<button class="modecard" id="pick-audio"><span class="ico">🎵</span><span>'
      +'<span class="tt">음악 파일로 자동 채보<span class="badge">베타</span></span>'
      +'<span class="ds">mp3·m4a 같은 음악 파일을 넣으면 브라우저 안에서(서버 없이, 무료) 멜로디와 가사를 뽑아냅니다. 멜로디는 Spotify가 공개한 Basic Pitch 모델로 읽어 <b>반주가 섞인 MR·음원에서도</b> 가장 높은 소리(멜로디)를 골라냅니다.</span></span></button>'
      +'<button class="modecard" id="pick-mxl"><span class="ico">🎼</span><span>'
      +'<span class="tt">MusicXML 파일 가져오기<span class="badge">최고 정확도</span></span>'
      +'<span class="ds">AI가 읽어 맞히지 않고, 이미 숫자로 정리된 음이름·박자를 그대로 옮기므로 오독이 없습니다. 다만 사진을 MusicXML로 바꿔 주는 <b>무료 프로그램(Audiveris 등)</b>을 컴퓨터에서 먼저 한 번 돌려야 합니다 — 그 결과 파일(.xml/.musicxml/.mxl)을 여기 넣으세요.</span></span></button>'
      +'</div>';
    $('pick-photo').onclick=()=>{S.importMode='photo';openPanel('scan')};
    $('pick-audio').onclick=()=>{S.importMode='audio';openPanel('scan')};
    $('pick-mxl').onclick=()=>{S.importMode='musicxml';openPanel('scan')};
    $('scrim').classList.add('open');
    return;
  }

  if(name==='scan'&&S.importMode==='audio'){

  if(name==='diag'){
    const L=S.raw.replace(/\r\n?/g,'\n').split('\n');
    const rows=[]; let mel=null;
    for(const line of L){
      if(MEL_RE.test(line)){ mel=parseMelody(line); continue; }
      if(isSection(line)||!line.trim())continue;
      const bl=parseChart(line)[0];
      if(!bl||bl.k!=='pairs')continue;
      const nCh=bl.pairs.filter(p=>p.chord).length;
      if(!nCh){ continue; }
      let sums=[];
      /* parseMelody 는 음표 배열을 그대로 돌려준다 — 예전엔 여기서 mel.notes 로 읽어
         ♪ 줄이 있는 차트에서는 진단 화면 자체가 터졌다(정작 그걸 진단하려고 만든 화면). */
      if(mel){ sums=[0]; for(const n of mel){ if(n.bar)sums.push(0); else sums[sums.length-1]+=n.beats; }
        sums=sums.map(x=>Math.round(x*100)/100); }
      rows.push({ch:nCh,bar:bl.pairs.filter(p=>p.bar).length,
        mel:mel?mel.filter(n=>!n.bar).length:0,
        melBar:mel?mel.filter(n=>n.bar).length:0,sums});

      +'<div id="dbox" style="font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--paper);'

      +'멜로디 줄에 마디선: '+(/[♪♫][^\n]*\|/.test(S.raw)?'있음':'<b style="color:var(--ribbon)">없음</b>')+'<br><br>'
      +(rows.length?rows.map((r,i)=>'단'+(i+1)+' 코드'+r.ch+' 마디'+r.bar

        +(r.sums.length?' 박합['+r.sums.join(',')+']':' <b style="color:var(--ribbon)">멜로디 없음</b>')).join('<br>')
        :'<b style="color:var(--ribbon)">읽어낸 단이 없습니다</b>')
      +'</div>'
      +(tl.melNotes?'<p class="note" style="margin-top:14px"><b>읽어온 멜로디 계이름</b><br>'
        +'악보와 눈으로 대조해 보세요. 틀린 음은 <b>편집</b>에서 고칠 수 있습니다.</p>'
        +'<div style="font-family:var(--mono);font-size:13px;line-height:2;color:var(--brass);'
        +'background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:38vh;overflow:auto">'
        +(function(){
            const NM=['도','도#','레','레#','미','파','파#','솔','솔#','라','라#','시'];
            const out=[];let bar=[],n=0;
            for(const e of tl.evs){ if(e.type!=='m')continue;
              bar.push(NM[mod(e.midi)]+(Math.floor(e.midi/12)-1));
              if(++n%8===0){out.push(bar.join(' '));bar=[];}
            }
            if(bar.length)out.push(bar.join(' '));
            return out.join('<br>')||'—';
          })()

      +'<div class="btns"><button class="btn" id="dcopy">이 내용 복사</button></div>';
    $('dcopy').onclick=async()=>{
      try{await navigator.clipboard.writeText($('dbox').innerText+'\n\n--- 원문 ---\n'+S.raw.slice(0,3000));toast('복사했어요');}

  }

  if(name==='play'){

      +'<div class="rowline"><span><b>실제 악기음</b><small>합성음 대신 실제 녹음된 악기 소리를 씁니다. 온라인일 때만 되고, 처음 나오는 음은 받는 동안만 합성음으로 대신합니다</small></span>'
      +'<button class="btn '+(P.realInst!==false?'on':'')+'" id="realinst">'+(P.realInst!==false?'켬':'끔')+'</button></div>'

          +'<span class="lbl">마디 맞춤</span><div class="opts">'
          +'<button class="btn '+(P.melFit!==false?'on':'')+'" id="melfit">'

        : '')
      +(hasBassMelody()
        ? '<div class="rowline"><span><b>낮은음자리표도 재생</b><small>오선보에 낮은음자리(베이스 보표)가 따로 있으면 그 음도 함께 울립니다. 반주 악기의 베이스음과 겹쳐 들릴 수 있어요</small></span>'

      +'<span class="lbl">소리 구성</span><div class="opts">'

      +'<button class="btn '+(P.accomp!==false&&P.melody===false?'on':'')+'" data-mix="acc">반주만</button>'
      +'</div>'
      +'<span class="lbl">장르</span><div class="opts">'
      +opt('genre',P.genre,Object.keys(GENRES).map(k=>[k,GENRES[k].label]))+'</div>'
      +'<span class="lbl">반주 패턴</span><div class="opts">'
      +opt('pat',P.pattern,Object.keys(PATTERNS).map(k=>[k,PATTERNS[k].label]))+'</div>'
      +'<span class="lbl">마디당 박</span><div class="opts" id="beats">'
      +opt('beats',P.beats,[[2,'2박'],[3,'3박'],[4,'4박'],[6,'6박']])+'</div>'
      +'<span class="lbl">빠르기 (BPM)</span>'
      +'<div style="display:flex;align-items:center;gap:12px">'
      +'<input class="field" id="bpmr" type="range" min="30" max="300" step="1" value="'+P.bpm+'" style="flex:1">'
      +'<span id="bpmnum" style="font-family:var(--mono);font-size:17px;font-weight:800;color:var(--brass);min-width:52px;text-align:right">'+P.bpm+'</span>'
      +'</div>'
      +'<div class="opts" style="margin-top:10px">'
      +'<button class="btn '+(P.click?'on':'')+'" id="clk">메트로놈</button>'
      +'<button class="btn '+(P.loop?'on':'')+'" id="lp">반복</button></div>'
      +'<p class="note" style="margin-top:14px">'
      +(hasMelody()
        ? (()=>{const tl=buildTimeline();
            return '이 곡에는 <b>멜로디 '+tl.melNotes+'음</b>이 들어 있습니다. 각 단의 첫 코드에 맞춰 재생됩니다. '
              +(tl.bassNotes?'낮은음자리표 '+tl.bassNotes+'음도 함께 읽었습니다(위 <b>낮은음자리표도 재생</b>을 켜야 들립니다). ':'')
              +(tl.drift?'<b style="color:var(--ribbon)">다만 '+tl.drift+'개 단에서 멜로디 길이가 마디와 맞지 않습니다. 그 부분은 어긋나게 들립니다.</b> ':'')
              +'오선보에서 읽어온 것이라 틀릴 수 있으니 원본과 비교해 확인하세요. ';})()
        : '이 차트에는 멜로디가 없습니다. 오선보 사진을 넣으면 멜로디까지 읽어옵니다. ')

      +'절이 여러 개면 <b>1절을 끝까지 친 뒤 2절로 넘어갑니다.</b> 화면 가사도 따라 바뀝니다. '

      renderToolbar(); if(P.playing)startPlay(); openPanel('play');

      applyGenre(b.dataset.genre); openPanel('play');

    body.querySelectorAll('[data-minst]').forEach(b=>b.onclick=()=>{
      P.melInst=b.dataset.minst; if(P.playing)startPlay(); openPanel('play');
    });
    if($('melfit'))$('melfit').onclick=()=>{P.melFit=P.melFit===false;if(P.playing)startPlay();openPanel('play')};
    if($('playbass'))$('playbass').onclick=()=>{P.playBass=!P.playBass;if(P.playing)startPlay();openPanel('play')};
    if($('realinst'))$('realinst').onclick=()=>{P.realInst=P.realInst===false;openPanel('play')};
    body.querySelectorAll('[data-moct]').forEach(b=>b.onclick=()=>{
      P.melOct=parseInt(b.dataset.moct,10)||0; if(P.playing)startPlay(); openPanel('play');
    });
    body.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{
      P.genre='';P.pattern=b.dataset.pat; openPanel('play');
    });
    body.querySelectorAll('[data-beats]').forEach(b=>b.onclick=()=>{
      P.beats=parseInt(b.dataset.beats,10); if(P.playing)startPlay(); openPanel('play');
    });
    $('bpmr').oninput=e=>{const v=parseInt(e.target.value,10);setBpm(v,true);if($('bpmnum'))$('bpmnum').textContent=v;};
    $('clk').onclick=()=>{P.click=!P.click;openPanel('play')};
    $('lp').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop);openPanel('play')};
  }

  if(name==='export'){
    body.innerHTML='<p class="note">지금 보이는 키 그대로 내보냅니다. PDF는 A4 세로, 넘치면 자동으로 여러 장이 됩니다.</p>'
      +'<div class="btns"><button class="btn lg on wide" id="pdf">PDF 내려받기</button>'
      +'<button class="btn lg wide" id="png">이미지 PNG</button>'
      +'<button class="btn" id="prt">인쇄</button>'
      +'<button class="btn" id="txt">TXT</button>'
      +'<button class="btn" id="cho">ChordPro</button>'
      +'<button class="btn" id="cpy">복사</button></div>'
      +'<p class="note" style="margin-top:14px">파일 이름: <code>'+esc(baseName())+'</code><br>'
      +'다운로드가 막히면 <b>복사</b>나 <b>인쇄</b>를 쓰세요.</p>';
    $('pdf').onclick=()=>{try{saveBlob(new Blob([pdfBytes(chartCanvas())],{type:'application/pdf'}),baseName()+'.pdf');toast('PDF 내려받기 시작')}catch(e){toast('PDF 생성 실패')}};
    $('png').onclick=()=>{try{chartCanvas().toBlob(b=>{saveBlob(b,baseName()+'.png');toast('PNG 내려받기 시작')},'image/png')}catch(e){toast('이미지 생성 실패')}};
    $('prt').onclick=()=>{closePanel();setTimeout(()=>window.print(),150)};
    $('txt').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.txt');toast('TXT 내려받기 시작')};
    $('cho').onclick=()=>{saveBlob(new Blob([chartText()],{type:'text/plain;charset=utf-8'}),baseName()+'.cho');toast('ChordPro 내려받기 시작')};

  $('scrim').classList.add('open');

function closePanel(){closeCam();$('scrim').classList.remove('open')}
$('scrim').onclick=e=>{if(e.target===$('scrim'))closePanel()};

/* ============ 배선 ============ */
document.querySelectorAll('nav [data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$('up').onclick=()=>{S.semis=Math.min(12,S.semis+1);renderAll()};
$('down').onclick=()=>{S.semis=Math.max(-12,S.semis-1);renderAll()};
$('b-verse').onclick=()=>{const mv=maxVerse(); if(mv<2)return; S.verse=S.verse>=mv?1:S.verse+1; renderAll();};



function setFont(v){S.font=Math.max(12,Math.min(44,v));renderAll();}
function setStaffScale(v){S.staffScale=Math.max(.5,Math.min(2,Math.round(v*10)/10));renderAll();scheduleSave();}


function saveSong(){
  const t=$('title').value.trim()||'제목 없음';
  const list=load().filter(s=>s.title!==t);
  const st=new Date();
  list.unshift({id:'s'+Date.now(),title:t,raw:S.raw,semis:S.semis,
    at:st.toISOString().slice(0,10)+' '+st.toTimeString().slice(0,5)});
  toast(save(list.slice(0,40))?'콘티에 “'+t+'” 저장했습니다':'저장에 실패했어요.');
}
$('theme').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('theme').textContent=d?'어둡게':'밝게';
};
$('play').onclick=togglePlay;
$('track').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width)));
  seekTo(ratio*songSeconds());
};
$('instbtn').onclick=()=>openPanel('play');
$('loopbtn').classList.toggle('on',P.loop);
$('loopbtn').onclick=()=>{P.loop=!P.loop;$('loopbtn').classList.toggle('on',P.loop)};
function setBpm(v,skipSlider){
  v=Math.round(Number(v));
  if(!isFinite(v))v=P.bpm;
  P.bpm=Math.max(30,Math.min(300,v));
  $('bpm').value=P.bpm;
  if(!skipSlider&&$('bpmr'))$('bpmr').value=P.bpm;
}
$('bpmd').onclick=()=>setBpm(P.bpm-4);
$('bpmu').onclick=()=>setBpm(P.bpm+4);
$('bpm').onfocus=e=>e.target.select();
$('bpm').oninput=e=>{
  const v=parseInt(e.target.value,10);
  if(v>=30&&v<=300){P.bpm=v;if($('bpmr'))$('bpmr').value=v;}
};
$('bpm').onchange=e=>setBpm(e.target.value);
setInterval(()=>{if(!P.playing)renderTime(0)},1500);
$('bpm').onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();setBpm(e.target.value);e.target.blur();}
  if(e.key==='ArrowUp'){e.preventDefault();setBpm(P.bpm+1);}
  if(e.key==='ArrowDown'){e.preventDefault();setBpm(P.bpm-1);}
};
$('bpm').value=P.bpm;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
});
/* 집중 모드: 헤더와 도구막대를 감춰 악보만 크게 */
function setFocus(on){
  document.body.classList.toggle('focus',on);
  $('b-focus').classList.toggle('on',on);
  if(on)wakeOn(); else wakeOff();
}
$('b-sheet').onclick=()=>setMode(S.mode==='sheet'?(hasMelody()?'staff':'text'):'sheet');
$('b-mode').onclick=()=>{
  if(!hasMelody()){toast('멜로디가 있어야 악보로 볼 수 있습니다.');return;}
  S.mode=(S.mode==='text')?'staff':'text';
  renderAll();
  toast(S.mode==='text'?'가사 중심 보기':'악보 보기');
};
$('b-melonly').onclick=()=>{
  if(!hasMelody()){toast('이 곡에는 멜로디가 없습니다.');return;}
  P.accomp=(P.accomp===false); P.melody=true;
  renderToolbar(); if(P.playing)startPlay();
  toast(P.accomp===false?'멜로디만 재생합니다':'반주와 함께 재생합니다');
};
$('b-focus').onclick=()=>setFocus(!document.body.classList.contains('focus'));
$('focusout').onclick=()=>setFocus(false);

/* 연주 중 화면이 꺼지지 않게 */
let wl=null;
async function wakeOn(){
  try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null}); } }catch(e){}
}
function wakeOff(){ if(wl&&!P.playing&&!document.body.classList.contains('focus')){try{wl.release()}catch(e){} wl=null;} }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&(P.playing||document.body.classList.contains('focus')))wakeOn();
});
if($("ver"))$("ver").textContent=APP_VER;
if(restoreLast())reparse();
let rsT=null;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.mode!=='text')renderChart()},250);});
renderAll();
</script>
