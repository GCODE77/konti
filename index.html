  tickUI();
  requestAnimationFrame(frame);
}
function mark(idx){
  P.cur=idx;
  document.querySelectorAll('.ch.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('.lineblk.cur').forEach(e=>e.classList.remove('cur'));
  const el=document.querySelector('.ch[data-idx="'+idx+'"]');
  if(!el)return;
  el.classList.add('now');
  const line=el.closest('.lineblk'); if(line)line.classList.add('cur');
  const r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>window.innerHeight-190)el.scrollIntoView({block:'center',behavior:'smooth'});
}
function startPlay(){
  const ctx=AC(); if(!ctx){toast('이 브라우저에서는 소리를 낼 수 없습니다.');return;}
  const tl=buildTimeline();
  if(!tl.evs.length){toast('재생할 내용이 없습니다.');return;}
  P.evs=tl.evs; P.total=tl.total;
  P.playing=true; P.k=0; P.lastAt=0; P.marks=[]; P.vmarks=[]; P.vnext=S.verse; P.cur=-1;
  P.t0=ctx.currentTime+.25;
  P.cursorT=ctx.currentTime+.25;
  clearInterval(P.timer);
  P.timer=setInterval(schedule,25);
  clearInterval(P.uiTimer);
  P.uiTimer=setInterval(tickUI,110);   // RAF 가 멈춰도 화면이 따라오게 하는 보험
  schedule(); requestAnimationFrame(frame); tickUI();
  $('play').innerHTML='&#10073;&#10073;';
  wakeOn();
}
function stopPlay(){
  P.playing=false; clearInterval(P.timer); P.timer=null;
  clearInterval(P.uiTimer); P.uiTimer=null;
  P.marks=[]; P.vmarks=[]; P.cur=-1;
  document.querySelectorAll('.ch.now').forEach(e=>e.classList.remove('now'));
  document.querySelectorAll('#chart .origsys.on').forEach(e=>e.classList.remove('on'));
  $('play').innerHTML='&#9654;';
  wakeOff();
}
function togglePlay(){ P.playing?stopPlay():startPlay(); }

  });
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}

function renderChartStaff(){
  const el=$('chart');
  el.style.fontSize=S.font+'px'; el.style.columnCount=1;
  el.innerHTML='';
  const ci=capoInfo();
  if(S.capo&&ci){
    const d=document.createElement('div');d.className='capo';
    d.innerHTML='카포 <b>'+ci.fret+'</b>프렛 · '+nm(ci.shape,PREF[ci.shape])+' 폼';
    el.appendChild(d);
  }
  if(SUSPECT){
    const d=document.createElement('div'); d.className='suspect';
    d.innerHTML='<b>확인이 필요한 음 '+SUSPECT+'개</b> — 동그라미 친 음표를 눌러 원본과 대조해 고쳐 주세요. '
      +'<span style="opacity:.7">조성에 없는 음, 옥타브가 튄 음, 저희가 옥타브를 자동으로 고친 음입니다.</span>';
    el.appendChild(d);
  }
  let pendMel=null, pendBass=null, measureNo=1;
  /* 구간(절/후렴) 안에서는 원문 줄 구분과 무관하게 마디를 이어붙여
     한 줄에 4마디씩 보이도록 한다 — [Verse]/[Chorus] 같은 구간 표시나
     곡 끝에서만 끊는다. */
  /* 한 행의 "논리 폭". SVG는 viewBox 로 화면 폭에 맞춰 늘어나므로, 논리 폭을
     실제 화면 폭 ÷ 확대율로 잡으면 글자가 정확히 확대율 배로 렌더된다.
     이렇게 해야 폭이 좁은 휴대폰에서는 한 행에 2~3마디만 넣어 글자 크기를
     지키고, 넓은 화면에서는 4마디를 꽉 채운다. 예전엔 논리 폭이 1000 고정이라
     휴대폰에서 글자가 3분의 1로 줄어들어 아예 읽을 수 없었다. */
  const zoom=Math.max(.5,Math.min(2,S.staffScale||1));
  const rowW=Math.max(320,Math.round((el.clientWidth||1000)/zoom));
  let accMel=[], accCh=[], accLy={}, accFit=[], accBass=[];
  const flush=()=>{
    if(!accMel.length)return;
    const verses=Object.keys(accLy).map(Number).sort((a,b)=>a-b);
    const {svgs,count}=renderStaffSection(accMel,accCh,accLy,verses,measureNo,accFit,accBass,rowW);
    measureNo+=count;
    if(svgs.length){
      const box=document.createElement('div');
      box.className='staffline';
      box.innerHTML=svgs.join('');
      el.appendChild(box);
    }
    accMel=[]; accCh=[]; accLy={}; accFit=[]; accBass=[];
  };
  for(const b of blocks){
    if(b.k==='mel'){ if(b.clef==='bass')pendBass=b; else pendMel=b; continue; }
    if(b.k==='blank'){ continue; }
    if(b.k==='sec'){ flush(); const d=document.createElement('div');d.className='section';d.textContent=b.text;el.appendChild(d);continue; }
    const {melM,chM,lyM,verses,N,fitM}=measuresOfBlock(pendMel,b);
    const {melM:bassM}=measuresOfBlock(pendBass,b,N);
    pendMel=null; pendBass=null;
    if(!N)continue;
    const priorLen=accMel.length;
    accMel=accMel.concat(melM); accCh=accCh.concat(chM); accFit=accFit.concat(fitM); accBass=accBass.concat(bassM);
    const known=new Set(Object.keys(accLy).map(Number)); verses.forEach(v=>known.add(v));
    known.forEach(v=>{
      if(!accLy[v])accLy[v]=new Array(priorLen).fill(0).map(()=>[]);
      accLy[v]=accLy[v].concat(lyM[v]||new Array(N).fill(0).map(()=>[]));
    });
  }
  flush();
  el.querySelectorAll('[data-bi]').forEach(r=>r.onclick=()=>{
    S.selNote={bi:+r.dataset.bi,ni:+r.dataset.ni}; openPanel('staff');
  });
  el.querySelectorAll('[data-cidx]').forEach(t=>t.onclick=()=>{
    const i=+t.dataset.cidx;
    if(P.playing){ if(seekToChord(i))return; }
    for(const bb of blocks) if(bb.k==='pairs') for(const p of bb.pairs)
      if(p.idx===i&&p.chord){ tapChord(p.chord,chordSemis()); return; }
  });
}
/* 원본 사진을 그대로 띄우고, 각 단(사진에서 찾아낸 오선 한 줄) 위에 하이라이트를 얹는다.
   S.orig = {pages:[{url,sys:[{t0,t1,b0,b1}]}], total} — b0/b1 은 그 단이 곡 전체에서
   차지하는 진행 구간(0~1). 재생할 때 frame() 이 이 값으로 하이라이트를 옮긴다. */
function renderSheet(){
  const el=$('chart');
  el.style.fontSize=S.font+'px'; el.style.columnCount=1;
  el.innerHTML='';
  const o=S.orig;
  if(!o||!o.pages||!o.pages.length){
    el.innerHTML='<div class="callout err"><b>원본 사진이 없습니다.</b><br>'
      +'<b>가져오기</b>에서 악보 사진을 다시 넣어 주세요. 직접 입력한 곡에는 원본 사진이 없습니다.</div>';
    return;
  }
  const note=document.createElement('div');
  note.className='orignote';
  note.innerHTML='재생하면 지금 연주 중인 단이 사진 위에 표시됩니다. <b>단을 누르면 그 자리부터 재생</b>합니다.'
    +(o.approx?' 단 구분을 못 찾은 사진은 쪽 전체를 한 덩어리로 표시합니다.':'');
  el.appendChild(note);
  const wrap=document.createElement('div'); wrap.className='origwrap';
  o.pages.forEach((pg,pi)=>{
    const d=document.createElement('div'); d.className='origpg';
    const img=document.createElement('img');
    img.src=pg.url; img.alt=(pi+1)+'쪽 원본 악보'; img.loading='lazy';
    d.appendChild(img);
    (pg.sys||[]).forEach(sy=>{
      const b=document.createElement('div');
      b.className='origsys';
      b.style.top=(sy.t0*100).toFixed(3)+'%';
      b.style.height=((sy.t1-sy.t0)*100).toFixed(3)+'%';
      b.dataset.b0=sy.b0; b.dataset.b1=sy.b1;
      b.innerHTML='<span class="lab">'+(sy.n||'')+'</span><div class="origline"></div>';
      b.onclick=()=>{ const t=songSeconds()*Math.max(0,Math.min(1,sy.b0));
        if(!P.playing)startPlay(); seekTo(t); };
      d.appendChild(b);
    });
    wrap.appendChild(d);
  });
  el.appendChild(wrap);
  paintSheet(P.playing?sheetProgress():-1);
}
/* 지금 재생 위치를 0~1 진행도로 (절 반복은 무시하고 한 절 안에서의 위치) */
function sheetProgress(){
  const total=songSeconds(); if(!(total>0)||!actx)return -1;
  let el=actx.currentTime-P.t0;
  if(P.loop&&el>total)el=el%total;
  return Math.max(0,Math.min(1,el/total));
}
/* 진행도에 맞춰 하이라이트와 재생선을 옮긴다. p<0 이면 전부 끈다. */
function paintSheet(p){
  const boxes=document.querySelectorAll('#chart .origsys');
  if(!boxes.length)return;
  let cur=null;
  boxes.forEach(b=>{
    const b0=+b.dataset.b0, b1=+b.dataset.b1;
    const on=p>=0&&p>=b0&&p<b1;
    b.classList.toggle('on',on);
    if(on){ cur=b;
      const f=(b1>b0)?(p-b0)/(b1-b0):0;
      const h=b.querySelector('.origline');
      if(h)h.style.left=(f*100).toFixed(2)+'%';
    }
  });
  if(cur&&P.playing){
    const r=cur.getBoundingClientRect();
    if(r.top<80||r.bottom>window.innerHeight-190)cur.scrollIntoView({block:'center',behavior:'smooth'});
  }
}
function renderChartText(){
  const el=$('chart'),sm=chordSemis(),p=pref(),ci=capoInfo();
  el.style.fontSize=S.font+'px';
  el.style.columnCount=S.col?2:1; el.style.columnGap='28px';
  el.innerHTML='';
  if(S.capo&&ci){
    const d=document.createElement('div');d.className='capo';
    d.innerHTML='카포 <b>'+ci.fret+'</b>프렛 · '+nm(ci.shape,PREF[ci.shape])+' 폼으로 잡으면 실제로는 '+esc(targetLabel())+'로 들립니다';
    el.appendChild(d);
  }
  for(const b of blocks){
    if(b.k==='blank'){const d=document.createElement('div');d.style.height=(S.font*.9)+'px';el.appendChild(d);continue;}
    if(b.k==='sec'){const d=document.createElement('div');d.className='section';d.textContent=b.text;el.appendChild(d);continue;}
    if(b.k==='mel')continue;
    const row=document.createElement('div');row.className='lineblk';
    let meas=document.createElement('span'), nIn=0; meas.className='meas';
    const flushMeas=()=>{ if(nIn)row.appendChild(meas);
      meas=document.createElement('span'); meas.className='meas'; nIn=0; };
    for(const pr of pairsForVerse(b,S.verse)){
      if(pr.bar){ flushMeas(); continue; }
      const label=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;
      const wrap=document.createElement('span');wrap.className='pair';
      const ch=document.createElement('span');
      ch.className='ch'+(pr.chord?'':' plain');
      ch.style.fontSize=(S.font*.88)+'px';
      ch.style.minHeight=(S.font*1.2)+'px';
      ch.textContent=label;
      if(pr.chord){
        ch.dataset.idx=pr.idx;
        if(pr.idx===P.cur){ch.classList.add('now');row.classList.add('cur');}
        ch.onclick=()=>{ if(P.playing){ if(seekToChord(pr.idx))return; } tapChord(pr.chord,sm); };
        ch.setAttribute('role','button');ch.tabIndex=0;
        ch.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();
          if(P.playing&&seekToChord(pr.idx))return; tapChord(pr.chord,sm);}};
      }
      const ly=document.createElement('span');ly.className='ly';ly.textContent=pr.text;
      wrap.appendChild(ch);wrap.appendChild(ly);meas.appendChild(wrap);nIn++;
    }
    flushMeas();
    el.appendChild(row);
  }
}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let DUR={key:'',sec:0};
function songSeconds(){
  const key=S.raw.length+'|'+P.bpm+'|'+P.beats+'|'+S.verse;
  if(DUR.key===key)return DUR.sec;
  const tl=buildTimeline();
  DUR={key,sec:tl.total*(60/P.bpm)*Math.max(1,maxVerse())};
  return DUR.sec;
}
function renderTime(elapsed){
  const total=songSeconds();
  const el=Math.min(elapsed===undefined?0:elapsed,total);
  const t=$('time'); if(t)t.textContent=fmt(el)+' / '+fmt(total);
  const f=$('bar-fill'); if(f)f.style.width=(total>0?Math.min(100,el/total*100):0)+'%';
}
/* 원하는 지점부터 다시 재생 */
function seekTo(sec){
  const ctx=AC(); if(!ctx)return;
  const tl=buildTimeline();
  if(!tl.evs.length)return;
  const spb=60/P.bpm, pass=tl.total, mv=Math.max(1,maxVerse());
  const total=pass*spb*mv;
  sec=Math.max(0,Math.min(total-0.05,sec));
  const beat=sec/spb;
  const vi=Math.min(mv-1,Math.floor(beat/pass)), inPass=beat-vi*pass;
  if(!P.playing){ S.verse=vi+1; startPlay(); }
  P.evs=tl.evs; P.total=tl.total;
  let k=0; while(k<P.evs.length&&P.evs[k].at<inPass)k++;
  P.k=k; P.lastAt=inPass; P.vnext=vi+1;
  P.cursorT=ctx.currentTime+0.08;
  P.t0=P.cursorT-sec;
  P.marks=[]; P.vmarks=[]; P.cur=-1;
  if(S.verse!==vi+1){S.verse=vi+1;renderChart();renderToolbar();}
  renderTime(sec);
}
function seekToChord(idx){
  const tl=buildTimeline();
  const e=tl.evs.find(x=>x.type==='c'&&x.idx===idx);
  if(!e)return false;
  const spb=60/P.bpm, vi=Math.max(0,S.verse-1);
  seekTo((vi*tl.total+e.at)*spb);
  return true;
}

function saveLast(){
  try{
    setLS('konti:last',JSON.stringify({
      t:$('title').value, raw:S.raw, semis:S.semis, verse:S.verse, flat:S.flat,
      num:S.num, capo:S.capo, font:S.font, staffScale:S.staffScale, col:S.col, mode:S.mode,
      bpm:P.bpm, insts:P.insts, melInst:P.melInst, pattern:P.pattern,
      beats:P.beats, genre:P.genre, loop:P.loop, click:P.click, melody:P.melody, realInst:P.realInst,
      playBass:P.playBass, orig:S.orig,
      at:Date.now()
    }));
  }catch(e){
    /* 사진까지 넣으면 localStorage 한도를 넘길 수 있다 — 그때는 사진만 빼고 다시 저장한다.
       사진 보기는 있으면 좋은 기능이고, 곡 자체를 못 저장하는 건 훨씬 큰 손해다. */
    try{
      setLS('konti:last',JSON.stringify({
        t:$('title').value, raw:S.raw, semis:S.semis, verse:S.verse, flat:S.flat,
        num:S.num, capo:S.capo, font:S.font, staffScale:S.staffScale, col:S.col,
        mode:S.mode,   /* 'sheet'(원본 사진 보기)도 그대로 저장한다 — 사진에서 가져온 곡의 기본 보기다 */
        bpm:P.bpm, insts:P.insts, melInst:P.melInst, pattern:P.pattern,
        beats:P.beats, genre:P.genre, loop:P.loop, click:P.click, melody:P.melody,
        realInst:P.realInst, playBass:P.playBass, at:Date.now()
      }));
    }catch(e2){}
  }
}
function restoreLast(){
  let r=null;
  try{ r=JSON.parse(localStorage.getItem('konti:last')||'null'); }catch(e){}
  if(!r||!r.raw||!r.raw.trim())return false;
  S.raw=r.raw;
  S.semis=r.semis||0; S.verse=r.verse||1; S.flat=r.flat||null;
  S.num=!!r.num; S.capo=!!r.capo; S.font=r.font||20;
  S.staffScale=(typeof r.staffScale==='number')?Math.max(.5,Math.min(2,r.staffScale)):1;
  S.col=!!r.col;
  S.orig=(r.orig&&r.orig.pages&&r.orig.pages.length)?r.orig:null;
  S.mode=(r.mode==='text')?'text':(r.mode==='sheet'&&S.orig)?'sheet':'auto';
  if(r.bpm)P.bpm=r.bpm;
  if(Array.isArray(r.insts)&&r.insts.length)P.insts=r.insts.filter(k=>INSTRUMENTS[k]);
  else if(r.inst&&INSTRUMENTS[r.inst])P.insts=[r.inst];
  if(!P.insts||!P.insts.length)P.insts=['piano'];
  if(r.melInst)P.melInst=r.melInst;
  if(r.pattern)P.pattern=r.pattern; if(r.beats)P.beats=r.beats;
  P.genre=r.genre||''; P.loop=r.loop!==false; P.click=!!r.click; P.melody=r.melody!==false;
  P.realInst=r.realInst!==false; P.playBass=!!r.playBass;
  if(r.t)$('title').value=r.t;
  return true;
}

/* ============ 내보내기 ============ */
const PAGE_W=1240, RATIO=1.41428;
const CMONO="ui-monospace,Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic',monospace";
const CSANS="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";

function subtitle(){
  const ci=capoInfo();
  return '원키 '+origLabel()+' → 연주키 '+(S.num?'넘버':targetLabel())
    +((S.capo&&ci)?'  ·  카포 '+ci.fret:'')+(maxVerse()>1?'  ·  '+S.verse+'절':'');
}
function chartCanvas(){
  const M=78,W=PAGE_W,maxW=W-M*2,CH=27,LY=27,LINE=74,GAP=14,sm=chordSemis(),p=pref();
  const probe=document.createElement('canvas').getContext('2d');
  const cf='700 '+CH+'px '+CMONO, lf=LY+'px '+CMONO;
  const ops=[]; let y=M;
  ops.push({t:'title',x:M,y:y+40,s:$('title').value.trim()||'제목 없음'}); y+=62;
  ops.push({t:'sub',x:M,y:y+18,s:subtitle()}); y+=54;
  for(const b of blocks){
    if(b.k==='blank'){y+=LINE*.42;continue;}
    if(b.k==='sec'){y+=26;ops.push({t:'sec',x:M,y:y+18,s:b.text.toUpperCase()});y+=30;ops.push({t:'rule',x:M,y,w:maxW});y+=20;continue;}
    if(b.k==='mel')continue;
    let x=M;
    for(const pr of pairsForVerse(b,S.verse)){
      if(pr.bar){ if(x>M){ops.push({t:'bar',x:x+5,y});x+=16;} continue; }
      const label=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;
      probe.font=cf; const cw=label?probe.measureText(label).width+GAP:0;
      probe.font=lf; const tw=probe.measureText(pr.text).width;
      const w=Math.max(cw,tw);
      if(x>M&&x+w>M+maxW){x=M;y+=LINE;}
      if(label)ops.push({t:'ch',x,y:y+CH,s:label});
      if(pr.text)ops.push({t:'ly',x,y:y+CH+LY+6,s:pr.text});
      x+=w;
    }
    y+=LINE;
  }
  const H=Math.max(Math.ceil(y+M),Math.ceil(PAGE_W*RATIO));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.textBaseline='alphabetic';
  for(const o of ops){
    if(o.t==='title'){c.font='700 46px '+CSANS;c.fillStyle='#111';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='sub'){c.font='500 24px '+CSANS;c.fillStyle='#6B7683';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='sec'){c.font='700 20px '+CSANS;c.fillStyle='#A32E3E';c.fillText(o.s,o.x,o.y);}
    else if(o.t==='rule'){c.fillStyle='#D8D2C6';c.fillRect(o.x,o.y,o.w,1);}
    else if(o.t==='bar'){c.fillStyle='#B9AF9C';c.fillRect(o.x,o.y+2,2,66);}
    else if(o.t==='ch'){c.font=cf;c.fillStyle='#000';c.fillText(o.s,o.x,o.y);}
    else {c.font=lf;c.fillStyle='#222';c.fillText(o.s,o.x,o.y);}
  }
  return cv;
}
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function buildPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=u=>{parts.push(u);len+=u.length};
  const str=s=>push(enc.encode(s));
  const mark=n=>{off[n]=len};
  const W=595.28,H=841.89,N=pages.length;
  str('%PDF-1.4\n');
  mark(1);str('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  mark(2);str('2 0 obj\n<</Type/Pages/Kids['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']/Count '+N+'>>\nendobj\n');
  pages.forEach((p,i)=>{
    const pg=3+i*3,ct=4+i*3,im=5+i*3;
    mark(pg);str(pg+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']/Resources<</XObject<</I0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>\nendobj\n');
    const co='q '+W+' 0 0 '+H+' 0 0 cm /I0 Do Q';
    mark(ct);str(ct+' 0 obj\n<</Length '+co.length+'>>\nstream\n'+co+'\nendstream\nendobj\n');
    mark(im);str(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.bytes.length+'>>\nstream\n');
    push(p.bytes);str('\nendstream\nendobj\n');
  });
  const xp=len,total=3+N*3;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)x+=String(off[n]||0).padStart(10,'0')+' 00000 n \n';
  str(x);str('trailer\n<</Size '+total+'/Root 1 0 R>>\nstartxref\n'+xp+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length}
  return out;
}
function pdfBytes(cv){
  const ph=Math.round(cv.width*RATIO),n=Math.max(1,Math.ceil(cv.height/ph)),pages=[];
  for(let i=0;i<n;i++){
    const s=document.createElement('canvas');s.width=cv.width;s.height=ph;
    const c=s.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,s.width,s.height);
    c.drawImage(cv,0,i*ph,cv.width,ph,0,0,cv.width,ph);
    pages.push({bytes:b64bytes(s.toDataURL('image/jpeg',.92).split(',')[1]),w:s.width,h:s.height});
  }
  return buildPdf(pages);
}
function baseName(){return ($('title').value.trim()||'chart').replace(/[\\/:*?"<>|]/g,'')+'_'+(S.num?'NNS':targetLabel());}
function saveBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function chartText(){
  const sm=chordSemis(),p=pref(),out=[];
  out.push($('title').value.trim()||'제목 없음');out.push(subtitle());out.push('');
  for(const b of blocks){
    if(b.k==='blank')out.push('');
    else if(b.k==='sec')out.push('['+b.text+']');
    else if(b.k==='mel')out.push(melLine(b.notes,S.semis,p,b.clef));
    else{
      let cl='',ly='';
      for(const pr of pairsForVerse(b,S.verse)){
        if(pr.bar){cl+='| ';ly+='  ';continue;}
        const ch=pr.chord?(S.num?showNum(pr.chord,origKey.pc):showChord(pr.chord,sm,p)):pr.raw;
        const w=Math.max(ch.length+1,pr.text.length);
        cl+=ch.padEnd(w,' ');ly+=pr.text.padEnd(w,' ');
      }
      if(cl.trim())out.push(cl.replace(/\s+$/,''));
      if(ly.trim())out.push(ly.replace(/\s+$/,''));
    }
  }
  return out.join('\n');
}

/* 캔버스 하나를 원하는 최대 변 길이로 맞춰 만든다(그레이스케일·대비 보정 포함) */
function fitCanvas(img,cap){
  const sc=Math.min(1,cap/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  const c=cv.getContext('2d');
  c.filter='grayscale(1) contrast(1.25) brightness(1.05)';
  c.drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',.9);
}
async function prepImage(f){
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl});
  const out=fitCanvas(img,1600);
  /* OCR(무료·키 없이 읽기)은 AI 인식과 달리 이미지 크기 제한이 없다 — 작은 글자가 많은
     찬송가 등은 해상도가 정확도를 크게 좌우해서, 원본을 덜 줄인 별도 사본을 하나 더 만들어 둔다. */
  const ocrOut=fitCanvas(img,2200);
  /* 단 단위로 잘라 보낼 원본. 예전에는 위의 1600px 사본을 다시 잘라 썼는데, 이미 줄여 놓은
     그림에서 오려낸 것이라 오선 간격이 몇 픽셀밖에 안 남아 음높이를 볼 수가 없었다.
     음높이 인식은 "음표 머리가 어느 줄/칸에 놓였나"를 보는 일이라 이 해상도가 곧 정확도다. */
  const hiOut=fitCanvas(img,3000);
  /* 화면에 그대로 비춰 줄 사본. 보내는 사본(url)은 흑백·고대비로 만들어 놓은 것이라
     사람이 보기엔 원본이 낫다. localStorage 에 넣을 수 있는 크기로 줄여 둔다. */
  const showOut=(()=>{
    const sc=Math.min(1,1400/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.72);
  })();
  return {url:out,b64:out.split(',')[1],ocrUrl:ocrOut,hiUrl:hiOut,showUrl:showOut,w:img.width,h:img.height};
}
async function onPickFile(e){
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  S.importMode='photo';
  let bad=0;
  for(const f of files){
    try{ S.photos.push(await prepImage(f)); }catch(err){ bad++; }
  }
  if(S.photos.length>8)S.photos=S.photos.slice(0,8);
  if(bad)toast(bad+'장은 열지 못했습니다.');
  openPanel('scan');
}
document.addEventListener('paste',ev=>{
  const it=[...(ev.clipboardData&&ev.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));
  if(!it)return;
  const f=it.getAsFile(); if(!f)return;
  S.importMode='photo';
  prepImage(f).then(p=>{S.photos.push(p);openPanel('scan')}).catch(()=>toast('이미지를 열지 못했습니다.'));
});

/* ============ 오선 자리를 픽셀로 재서 음높이를 확정한다 (v49) ============
   AI 비전이 가장 못 하는 일이 "음표 머리가 오선 몇째 줄·칸에 놓였나 세기"다(CLAUDE.md
   1번 항목 — 프롬프트를 아무리 조여도 3도·2도씩 틀리는 건 못 막았다). 그런데 이건

     1) 가로 투영으로 오선 다섯 줄의 y 를 찾는다(줄 간격 sp 도 여기서 나온다).
        간격이 고른 다섯 줄 묶음 중 가장 위를 쓴다 = 소프라노 보표

     2) 오선 줄만 지운다. 그 열의 잉크가 세로로 짧게 끊기면(=줄뿐이면) 지우고,
        길게 이어지면(=음표 머리·기둥이 걸쳐 있으면) 남긴다.
     3) 남은 잉크에서 세로 런 길이와 가로 런 길이가 둘 다 음표 머리 크기인 픽셀만
        고른다. 기둥은 세로로 너무 길고, 빔은 세로로 너무 얇고, 점·임시표는 너무 작다.
     4) 속이 빈 음표(2분·온음표)는 3)에 안 걸린다 — 대신 잉크로 완전히 둘러싸인
        흰 구멍을 찾는다. 그게 곧 머리 중심이다.
     5) 같은 x 에 쌓인 것(SATB 화음)은 맨 위 것만 쓴다 = 소프라노 = 멜로디.
     6) 머리 중심 y 를 맨 아래 줄 기준 반칸 단위로 세어 음이름을 바로 계산한다.

   ★ 못 믿을 상황(오선 다섯 줄을 못 찾음 / 음표 3개 미만 / 반칸 격자에 잘 안 떨어짐)에는
     반드시 null 을 돌려준다. 추측으로 덮어쓰면 지금보다 나빠진다 — 이 원칙을 깨지 말 것.
   ★ 결과는 두 곳에 쓴다. (a) 프롬프트에 "우리가 센 음이름"으로 넣어 AI가 참고하게 하고,
     (b) AI가 돌려준 음표 개수가 우리가 센 개수와 정확히 같을 때만 음이름을 덮어쓴다.
     개수가 다르면 정렬 근거가 없으므로 손대지 않는다(잘못 맞추면 뒤가 전부 밀린다).
   ★ 임시표(#/b)는 픽셀로 읽지 않는다. 음이름만 우리가 정하고, 음이름이 그대로면 AI가
     붙인 임시표를 유지한다. 음이름이 바뀌면 그 임시표는 다른 음의 것이므로 떼어낸다. */

/* 맨 아래 오선 줄의 음을 "옥타브*7 + 음이름번호"로: 높은음자리표 E4, 낮은음자리표 G2 */
const CLEF_BOTTOM={treble:4*7+2, bass:2*7+4};
const diaName=abs=>DIA_L[((abs%7)+7)%7]+Math.floor(abs/7);
function otsuTh(hist,total){
  let sum=0; for(let i=0;i<256;i++)sum+=i*hist[i];
  let wB=0,sumB=0,best=-1,th=128;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB)continue;
    const wF=total-wB; if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF, v=wB*wF*(mB-mF)*(mB-mF);
    if(v>best){best=v;th=t;}
  }
  return th;
}
function imgFrom(url){
  return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});
}
/* 오선이 가장 수평에 가까워지는 기울기(라디안)를 찾는다.
   손으로 찍은 악보 사진은 늘 조금 기울어 있고, 가로 투영으로 오선을 찾는 방식은 1도만
   기울어도 무너진다(합성 테스트에서 1.5도에 아무것도 못 찾는 것을 확인했다).

   ★ 두 가지를 조심할 것 — 둘 다 실제로 밟은 함정이다.
   1. 판정용 사본을 너무 작게 줄이면 안 된다. 오선은 1~3px 짜리 얇은 선이라, 브라우저의
      기본 축소(저품질 이중선형)로 1/4 이하로 줄이면 **선이 통째로 사라진다.** 실제로
      380px 사본에서는 잉크 픽셀이 0개가 나와 모든 각도의 점수가 같아졌고, 반듯한 그림에
      3도 회전을 걸어 버렸다. 사본 폭은 760px 이상으로 두고 고품질 축소를 켠다.
   2. 점수를 "잉크냐 아니냐"로 세지 말 것. 얇은 선은 축소하면 회색이 되어 문턱값 하나로
      갈리면 결과가 요동친다. 밝기(0~1)의 행 평균을 그대로 제곱해서 더한다 —
      오선이 수평에 맞으면 어두움이 몇 행에 몰려 제곱합이 최대가 된다. */
function bestSkew(img){
  const W=Math.min(img.width,Math.max(760,Math.round(img.width*0.5)));
  const H=Math.max(24,Math.round(img.height*(W/img.width)));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  const score=deg=>{
    const a=deg*Math.PI/180;
    g.setTransform(1,0,0,1,0,0);
    g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    if(a){ g.translate(W/2,H/2); g.rotate(a); g.translate(-W/2,-H/2); }
    g.drawImage(img,0,0,W,H);
    g.setTransform(1,0,0,1,0,0);
    let d; try{ d=g.getImageData(0,0,W,H).data; }catch(e){ return null; }
    let sum=0;
    for(let y=0;y<H;y++){
      let dark=0; const o=y*W*4;
      for(let x=0;x<W;x++){ const i=o+x*4; dark+=255-(d[i]*.299+d[i+1]*.587+d[i+2]*.114); }
      const r=dark/(W*255);
      sum+=r*r;
    }
    return sum;
  };
  const flat=score(0);
  if(flat===null||flat<=0)return 0;
  let best=0, bestScore=flat;
  for(let deg=-3;deg<=3.001;deg+=0.4){
    if(Math.abs(deg)<0.05)continue;
    const v=score(deg); if(v===null)return 0;
    if(v>bestScore){ bestScore=v; best=deg; }
  }
  /* 남은 기울기가 0.2도만 있어도 오선 줄 지우기가 양쪽 끝에서 실패해서 음표를 잃는다.
     (합성 테스트: 1.5도 사진에서 왼쪽 세 음이 통째로 빠졌다) 그래서 곱게 다시 훑는다. */
  if(best){
    for(let pass=0;pass<2;pass++){
      const step=pass?0.05:0.15, span=pass?0.12:0.36;
      for(let deg=best-span;deg<=best+span+1e-9;deg+=step){
        const v=score(deg); if(v===null)break;
        if(v>bestScore){ bestScore=v; best=deg; }
      }
    }
  }
  /* 원래대로 두는 것이 기본이다. 되돌리는 게 뚜렷하게 나을 때만 돌린다 —
     미세한 회전은 음표 머리를 세로로 번지게 해서 오히려 음을 잃는다. */
  if(bestScore<flat*1.03)return 0;
  const a=best*Math.PI/180;
  return Math.abs(a)<0.003?0:a;               // 0.17도 미만은 되돌릴 필요가 없다
}
/* 한 단 그림에서 소프라노 음표들의 자리를 재서
   {sp,top,bot,med,notes:[{x,cy,step,abs,name}]} 또는 null 을 돌려준다. */
/* ============ 음표 길이(박자)를 픽셀로 재기 (v50) ============
   음높이를 자로 재듯, 길이도 "그림에 무엇이 붙어 있나"를 세면 나온다:
     속이 빈 머리인가 → 온음표·2분음표 · 기둥이 있나 → 온음표 구분
     기둥 끝에 가로로 굵은 잉크(빔·꼬리)가 몇 겹인가 → 8분(1겹)·16분(2겹)
     머리 오른쪽에 작고 동그란 점이 있나 → 점음표(×1.5)
   ★ 박자는 하나만 틀려도 그 뒤가 전부 밀린다. 그래서 음높이 때와 똑같이
     "모르겠으면 손대지 않는다" — 애매하면 sure:false 를 달아 돌려주고, 부르는 쪽에서
     한 음이라도 sure 가 아니면 그 단 전체의 박자를 쓰지 않는다. */
function headDur(ink,vr,hr,W,c,sp,y0,y1,bot,nextX0,others,lineRow){
  const hy0=Math.round(c.cy-sp*0.55), hy1=Math.round(c.cy+sp*0.55);
  /* 기둥 찾기.
     ★ 처음엔 "머리 높이에서 세로 잉크 덩어리를 따라가는" 방식으로 했는데 전부 실패했다 —
       머리와 기둥이 붙는 지점에서는 가로 잉크 폭이 머리 전체 폭이라, 기둥을 가늘다는
       기준으로 찾으면 그 자리에서 걸러져 버린다. 그래서 **머리에서 떨어진 구간**
       (0.9~2.4칸 위/아래)에서 그 x 칸이 얼마나 채워져 있는지로 본다. */
  const colFill=(x,ya,yb)=>{
    if(x<0||x>=W)return 0;
    const a=Math.max(y0,Math.round(Math.min(ya,yb))), b=Math.min(y1,Math.round(Math.max(ya,yb)));
    if(b<=a)return 0;
    let n=0; for(let y=a;y<=b;y++)if(ink[y*W+x])n++;
    return n/(b-a+1);
  };
  const tipOf=(x,dir)=>{                    // 머리에서 dir 방향으로 잉크를 따라간 끝
    let y=Math.round(c.cy+dir*sp*0.6), last=y, gap=0;
    const lim=Math.max(2,Math.round(sp*0.35));
    while(y>=y0&&y<=y1){
      if(ink[y*W+x]){ last=y; gap=0; } else if(++gap>lim)break;
      y+=dir;
    }
    return last;
  };
  let stem=null;
  const reach=Math.max(2,Math.round(sp*0.7));   // 속 빈 머리는 x 범위가 '구멍' 기준이라 넉넉히
  const FILL=0.8;
  for(let d=0;d<=reach&&!stem;d++){
    const xr=Math.round(c.x1)+d;
    if(colFill(xr,c.cy-sp*0.9,c.cy-sp*2.4)>=FILL&&colFill(xr,c.cy+sp*1.1,c.cy+sp*2.4)<0.5){
      stem={x:xr,tip:tipOf(xr,-1),up:true}; break; }
    const xl=Math.round(c.x0)-d;
    if(colFill(xl,c.cy+sp*0.9,c.cy+sp*2.4)>=FILL&&colFill(xl,c.cy-sp*1.1,c.cy-sp*2.4)<0.5){
      stem={x:xl,tip:tipOf(xl,1),up:false}; break; }
  }
  /* 기둥 끝에서 머리 쪽으로 훑으며 꼬리·빔이 몇 겹인지 센다.
     ★ 처음엔 기둥 칸의 가로 런 길이(hr)로 판정했는데, 꼬리가 오선 줄과 겹치는 자리에
       오면 줄 지우기 단계에서 그 부분이 함께 지워져 놓쳤다(높은 음의 아래 기둥에서 발생).
       그래서 기둥 칸 한 줄이 아니라 **기둥 양옆 띠의 잉크 양**으로 센다 — 꼬리든 빔이든
       기둥 옆으로 뻗어 나가는 잉크라는 점은 같고, 한 칸이 지워져도 살아남는다. */
  let bands=0;
  if(stem){
    /* ★ 처음엔 기둥 끝(tip)에서 머리 쪽으로 훑었는데, 끝 위치를 정확히 잡는 게 생각보다
       어려웠다(빔이 오선 줄과 겹쳐 일부가 지워지면 끝이 빔 앞에서 끊긴다). 그래서
       **기둥 길이 전체**를 훑는다 — 기둥 가운데는 옆에 잉크가 없으니 헛집히지 않고,
       끝 위치를 몰라도 된다. */
    const dOut=stem.up?-1:1;
    const ya=Math.round(c.cy+dOut*sp*0.85), yb=Math.round(c.cy+dOut*sp*4.3);
    /* 기둥과 **이어져 있는** 가로 잉크의 폭으로 센다(hr). 창 안의 잉크를 전부 세면
       바로 옆의 쉼표·다른 기호까지 들어와 헛집힌다 — 실측: 8분쉼표가 붙어 있는 8분음표.
       그리고 문턱을 0.45칸에서 0.3칸으로 내렸다. 빔은 옆 음표까지 길게 뻗지만
       **꼬리는 훨씬 얇아서**(기둥 2px + 꼬리 4px 정도) 0.45칸에서는 통째로 놓쳤다. */
    const need=Math.max(3,Math.round(sp*0.3));
    /* 두 줄이면 충분하다. 꼬리는 원래 얇고(6줄쯤), 그중 4줄이 오선 줄과 겹쳐 지워지면
       두 줄만 남는다 — 실측에서 minBand=3 이라 그 꼬리를 통째로 놓쳤다.
       기둥은 어차피 2px 라 need(0.3칸) 문턱을 절대 못 넘으므로 헛집히지 않는다. */
    const minBand=2;
    /* 지워진 오선 줄이 빔을 두 조각으로 끊는다. 그 끊김은 이어 붙여야 하지만,
       빔 두 겹 사이의 빈틈(약 0.25칸)까지 이어 붙이면 16분음표가 8분음표로 읽힌다 —
       그래서 이어 붙이는 폭을 그보다 뚜렷하게 좁게 둔다. */
    const gapTol=Math.max(1,Math.round(sp*0.12));
    /* 같은 x 에 다른 성부의 머리가 쌓여 있으면(SATB) 그 머리를 빔으로 오인한다 —
       그 머리 앞에서 훑기를 멈춘다. */
    let lim=yb;
    if(others&&others.length)for(const oy of others){
      if(dOut<0&&oy<c.cy-sp*0.9&&oy>lim)lim=Math.round(oy+sp*0.7);
      if(dOut>0&&oy>c.cy+sp*0.9&&oy<lim)lim=Math.round(oy-sp*0.7);
    }
    const steps=Math.abs(lim-ya)+1;
    const wide=[], dbg=[];
    for(let k=0;k<steps;k++){
      const y=ya+dOut*k;
      if(y<y0||y>y1)break;
      /* 기둥과 이어진 가로 런(hr)을 쓰되, 주변을 조금 넓혀 본다.
         ★ 세로 ±1 · 가로 ±2 로 넓히는 이유가 각각 있다:
           가로 — 기둥 굵기가 2px 뿐이라 찾아낸 stem.x 가 1~2px 어긋나면 빈 칸을 본다.
           세로 — 꼬리가 붙는 부분이 **오선 줄과 정확히 겹치면** 줄 지우기가 그 행들을
                  지워 버려 살아남는 행이 하나뿐이 된다(실측: 기둥이 아래로 뻗는 높은 음).
         세로를 ±2 로 넓히면 안 된다 — 16분음표의 빔 두 겹 사이 빈틈(약 0.25칸)까지
         메워져 8분음표로 읽힌다. ±1 이 두 요구의 경계다. */
      let side=0;
      for(let dy=-1;dy<=1;dy++){
        const yy=y+dy; if(yy<y0||yy>y1)continue;
        for(let dx=-2;dx<=2;dx++){
          const xx=stem.x+dx; if(xx<0||xx>=W)continue;
          const p2=yy*W+xx;
          if(ink[p2]&&hr[p2]>side)side=hr[p2];
        }
      }
      wide.push(side>=need);
      if(window.__DURDBG)dbg.push(side);
    }
    for(let i=0;i<wide.length;i++){
      if(wide[i])continue;
      let j=i; while(j<wide.length&&!wide[j])j++;
      if(i>0&&j<wide.length&&(j-i)<=gapTol)for(let k=i;k<j;k++)wide[k]=true;
      i=j-1;
    }
    let run=0;
    for(let i=0;i<=wide.length;i++){
      if(i<wide.length&&wide[i])run++;
      else { if(run>=minBand)bands++; run=0; }
    }
    /* 디버그 고리: window.__DURDBG=[] 을 먼저 두면 기둥 옆 잉크 양이 줄줄이 담긴다.
       이 판정도 눈에 보이는 출력이 없어서, 이게 없으면 왜 꼬리를 놓쳤는지 알 수 없다. */
    if(window.__DURDBG)window.__DURDBG.push({cx:+c.cx.toFixed(0),stemX:stem.x,up:stem.up,need,minBand,gapTol,bands,side:dbg});
  }
  /* 점: 머리 오른쪽의 작고 동글한 잉크 한 덩어리. 다음 음표 앞까지만 본다.
     ★ 두 곳만 본다 — 점은 음표와 **같은 높이**(칸에 놓인 음)이거나 **반 칸 위**(줄에 놓인
       음은 점을 위 칸에 찍는다)에 온다. 예전엔 위아래 0.65칸을 통째로 훑었는데, 오선
       아래쪽 낮은 음에서는 바로 밑의 **가사 글자**가 그 범위에 들어왔다.
     ★ 그리고 덩어리를 잴 때 검색창 밖으로 못 나가게 막아 뒀던 것이 진짜 원인이었다 —
       큰 가사 글자가 창 안쪽만 잘려서 '작고 동그란 점'처럼 보였다. 지금은 창 밖까지
       따라가 **진짜 크기**를 재고, 점보다 크면 버린다.
       실측: 실제 찬송가 사진의 여린내기 8분음표를 점8분음표로 잘못 읽던 것이 사라졌다. */
  let dot=false;
  {
    const dx0=Math.round(c.x1+sp*0.3);
    const dx1=Math.min(Math.round(c.x1+sp*1.5),Math.round(nextX0)-1,W-1);
    const lim=sp*0.52, minA=Math.max(3,Math.round(sp*sp*0.05)), maxA=Math.round(sp*sp*0.5);
    /* ★ 줄/칸 판정은 반드시 **정수로 반올림한 자리 번호**로 해야 한다. 처음엔
       `((bot-cy)/(sp/2))%2 < 0.4` 로 했는데, 실측 3.99 는 %2 가 1.99 라 짝수(줄)인데도
       칸으로 판정됐다 — 짝수 바로 아래 값을 통째로 놓치는 검사였다. */
    const st=Math.round((bot-c.cy)/(sp/2));
    const onLine=(Math.abs(st)%2)===0;
    /* 오선 바깥은 가사·글자가 사는 구역이다 — 거기서는 점을 믿지 않는다(점이 있어도
       없다고 본다). 놓치면 합계 검사에서 걸려 그 단을 건너뛰므로 안전한 실패다. */
    const inStaff=c.cy>=bot-4*sp-sp*0.6&&c.cy<=bot+sp*0.6;
    const spots=inStaff?(onLine?[c.cy-sp*0.5]:[c.cy]):[];
    const tol=Math.max(1.5,sp*0.22);
    for(const sy0 of spots){
      const dy0=Math.max(y0,Math.round(sy0-tol)), dy1=Math.min(y1,Math.round(sy0+tol));
      for(let y=dy0;y<=dy1&&!dot;y++)for(let x=dx0;x<=dx1;x++){
        const p=y*W+x;
        if(!ink[p]||vr[p]>lim||hr[p]>lim)continue;
        let ax0=x,ax1=x,ay0=y,ay1=y,area=0,over=false;
        const q=[p], mark=new Set([p]);
        while(q.length){
          const s2=q.pop(), sy=(s2/W)|0, sx=s2-sy*W;
          area++;
          if(sx<ax0)ax0=sx; if(sx>ax1)ax1=sx; if(sy<ay0)ay0=sy; if(sy>ay1)ay1=sy;
          if(area>maxA*2){ over=true; break; }
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            const nx=sx+dx, ny=sy+dy;
            if(nx<0||nx>=W||ny<y0||ny>y1)continue;
            const np=ny*W+nx;
            if(ink[np]&&!mark.has(np)){ mark.add(np); q.push(np); }
          }
        }
        const bw=ax1-ax0+1, bh=ay1-ay0+1;
        if(!over&&area>=minA&&area<=maxA&&bw<=sp*0.55&&bh<=sp*0.55&&bw>=sp*0.12&&bh>=sp*0.12
           &&Math.abs(bw-bh)<=Math.max(2,sp*0.25))dot=true;
        if(dot)break;
      }
      if(dot)break;
    }
  }
  let beats=null, sure=false;
  if(c.hollow){ beats=stem?2:4; sure=true; }
  else if(stem){
    if(bands===0){beats=1;sure=true;}
    else if(bands===1){beats=0.5;sure=true;}
    else if(bands===2){beats=0.25;sure=true;}
    else {beats=0.125;sure=false;}          // 32분음표는 찬송가에 거의 없다 — 못 믿는다
  }
  else { beats=1; sure=false; }             // 속이 찬데 기둥이 없다 = 뭔가 잘못 봤다
  if(dot&&beats!==null)beats=+(beats*1.5).toFixed(4);
  return {beats,sure,stem:!!stem,bands,dot,hollow:!!c.hollow};
}

async function staffGeom(url,clef){
  let img; try{ img=await imgFrom(url); }catch(e){ return null; }
  /* 사용자 요청으로 정확도를 속도보다 앞세운다(v50): 예전 1200px 로는 실제 찬송가
     한 단에서 오선 간격이 13px 밖에 안 나와 **빔 두 겹(16분음표)을 한 겹으로** 셌다.
     2000px 면 20px 가 되어 갈라진다. 느려지지만 호출 수는 그대로다(무료 한도 무관). */
  const cap=2000, sc=Math.min(1,cap/Math.max(1,img.width));
  const W=Math.max(1,Math.round(img.width*sc)), H=Math.max(1,Math.round(img.height*sc));
  if(W<200||H<36)return null;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g2=cv.getContext('2d',{willReadFrequently:true});
  g2.fillStyle='#fff'; g2.fillRect(0,0,W,H);
  const skew=bestSkew(img);            // 손으로 찍은 사진은 늘 조금 기울어 있다
  if(skew){ g2.translate(W/2,H/2); g2.rotate(skew); g2.translate(-W/2,-H/2); }
  g2.drawImage(img,0,0,W,H);
  g2.setTransform(1,0,0,1,0,0);
  let px; try{ px=g2.getImageData(0,0,W,H).data; }catch(e){ return null; }   // file:// 에서는 막힌다
  const N=W*H, hist=new Uint32Array(256), gray=new Uint8Array(N);
  for(let p=0,i=0;p<N;p++,i+=4){ const v=(px[i]*.299+px[i+1]*.587+px[i+2]*.114)|0; gray[p]=v; hist[v]++; }
  const th=Math.min(210,Math.max(55,otsuTh(hist,N)));
  const ink=new Uint8Array(N);
  for(let p=0;p<N;p++)if(gray[p]<th)ink[p]=1;

  /* 1) 오선 다섯 줄 찾기 */
  const rows=new Float32Array(H); let rmax=0;
  for(let y=0;y<H;y++){ let c=0; const o=y*W; for(let x=0;x<W;x++)c+=ink[o+x]; rows[y]=c/W; if(rows[y]>rmax)rmax=rows[y]; }
  if(rmax<0.3)return null;
  const lineTh=Math.max(0.3,rmax*0.55), thick=Math.max(4,Math.round(H*0.055));
  const runs=[]; let st=-1;
  for(let y=0;y<H;y++){
    if(rows[y]>=lineTh){ if(st<0)st=y; }
    else if(st>=0){ if(y-st<=thick)runs.push([st,y-1]); st=-1; }
  }
  if(st>=0&&H-st<=thick)runs.push([st,H-1]);
  if(runs.length<5)return null;
  const ctr=runs.map(r=>(r[0]+r[1])/2);
  let pick=null;
  for(let i=0;i+4<ctr.length;i++){
    const g=[ctr[i+1]-ctr[i],ctr[i+2]-ctr[i+1],ctr[i+3]-ctr[i+2],ctr[i+4]-ctr[i+3]];
    const mn=Math.min.apply(null,g), mx=Math.max.apply(null,g);
    if(mn<4||mx>mn*1.35)continue;
    const s=(ctr[i+4]-ctr[i])/4;
    if(Math.max.apply(null,g.map(v=>Math.abs(v-s)))/s>0.16)continue;
    pick={i,sp:s,top:ctr[i],bot:ctr[i+4]}; break;      // 위에서부터 처음 = 소프라노 보표
  }
  if(!pick)return null;
  const sp=pick.sp, top=pick.top, bot=pick.bot;
  if(sp<5)return null;                                 // 반칸이 2px 남짓이면 자리를 셀 수 없다

  /* 2) 오선 줄 지우기 */
  for(let k=0;k<5;k++){
    const a=runs[pick.i+k][0], b=runs[pick.i+k][1];
    const t=b-a+1, lim=Math.max(t*2+1,Math.round(sp*0.46));
    for(let x=0;x<W;x++){
      if(!ink[a*W+x]&&!ink[b*W+x])continue;
      let yT=a; while(yT-1>=0&&ink[(yT-1)*W+x])yT--;
      let yB=b; while(yB+1<H&&ink[(yB+1)*W+x])yB++;
      if(yB-yT+1<=lim)for(let y=a;y<=b;y++)ink[y*W+x]=0;
    }
  }

  /* 어느 행이 오선 줄인지 기억해 둔다 — 길이 판정(headDur)이 이 행을 건너뛴다 */
  const lineRow=new Uint8Array(H);
  for(let k=0;k<5;k++){
    const a=runs[pick.i+k][0], b=runs[pick.i+k][1];
    for(let y=Math.max(0,a-1);y<=Math.min(H-1,b+1);y++)lineRow[y]=1;
  }

  /* 관심 창: 위로 2.2칸(C6까지), 아래로 1.6칸(B3까지).
     더 넓히면 찬송가에서 오선 사이에 인쇄된 가사 글자가 들어와 음표로 오인된다. */
  const y0=Math.max(0,Math.round(top-sp*2.2)), y1=Math.min(H-1,Math.round(bot+sp*1.6));
  if(y1-y0<sp*4)return null;

  /* 세로·가로 잉크 런 길이. 아래에서 "머리 크기인 픽셀"을 고르는 기준이 된다. */
  const vr=new Uint16Array(N), hr=new Uint16Array(N);
  const measure=()=>{
    vr.fill(0); hr.fill(0);
    for(let x=0;x<W;x++){
      let y=0;
      while(y<H){
        if(!ink[y*W+x]){y++;continue;}
        let e=y; while(e+1<H&&ink[(e+1)*W+x])e++;
        const L=e-y+1; for(let k=y;k<=e;k++)vr[k*W+x]=L;
        y=e+1;
      }
    }
    for(let y=0;y<H;y++){
      const o=y*W; let x=0;
      while(x<W){
        if(!ink[o+x]){x++;continue;}
        let e=x; while(e+1<W&&ink[o+e+1])e++;
        const L=e-x+1; for(let k=x;k<=e;k++)hr[o+k]=L;
        x=e+1;
      }
    }
  };
  measure();
  /* 자리표(𝄞) 구간은 건너뛴다. 판정은 "세로로 오선 위와 아래를 **둘 다** 넘어서는
     한 덩어리 잉크"다 — 높은음자리표는 오선 아래에서 위까지 통째로 뻗는다.
     ★ 처음엔 그냥 "세로로 4.2칸보다 긴 잉크"로 잡았는데, SATB 악보에서 소프라노 머리→
       기둥→알토 머리→기둥이 하나로 이어져 그 길이를 넘겼다. 그래서 왼쪽 세 음이 통째로
       자리표 구간으로 취급돼 사라졌다. 위·아래를 둘 다 넘는지 봐야 기둥과 구분된다.
     박자표 숫자(4, 8 처럼 속에 구멍이 있는 것)는 이 구간을 조금 넘어갈 수 있어 음표로
     오인될 수 있다. 그건 개수가 어긋나게 만들 뿐이고, 개수가 다르면 우리는 아무것도
     덮어쓰지 않으므로 결과가 나빠지지는 않는다(그저 이 단에서 이득을 못 본다). */
  let clefEnd=0;
  const xLim=Math.round(W*0.14), hiEdge=top-sp*0.5, loEdge=bot+sp*0.5;
  for(let x=0;x<xLim;x++){
    let y=y0, hit=false;
    while(y<=y1){
      if(!ink[y*W+x]){y++;continue;}
      let e=y; while(e+1<=y1&&ink[(e+1)*W+x])e++;
      if(y<hiEdge&&e>loEdge){hit=true;break;}
      y=e+1;
    }
    if(hit)clefEnd=x;
  }
  if(clefEnd)clefEnd=Math.min(Math.round(W*0.2),clefEnd+Math.round(sp*1.6));

  /* 3) 속이 찬 머리: 세로·가로 런이 둘 다 머리 크기인 픽셀 */
  /* 세로 런에 상한을 두지 않는 것이 중요하다 — 머리에서 기둥으로 잉크가 이어지면 머리
     픽셀의 세로 런이 기둥 길이만큼 길어지는데, 상한을 두면 그 픽셀들이 빠져서 머리가
     위아래로 쪼개지고(특히 줄 위에 놓인 음) 통째로 사라진다. 기둥 자체는 가로가 얇아
     hr 하한에서 걸러지고, 빔·마디선·쉼표는 아래 덩어리 모양 검사에서 걸러진다. */
  const vLo=Math.max(2,Math.round(sp*0.46));
  const hLo=Math.max(2,Math.round(sp*0.5)), hHi=Math.round(sp*2.7);
  const head=new Uint8Array(N);
  for(let y=y0;y<=y1;y++){ const o=y*W;
    for(let x=clefEnd;x<W;x++){ const p=o+x;
      if(ink[p]&&vr[p]>=vLo&&hr[p]>=hLo&&hr[p]<=hHi)head[p]=1; } }
  const cands=[], seen=new Uint8Array(N), stk=new Int32Array(N);
  const minArea=Math.max(6,Math.round(sp*sp*0.22));
  for(let y=y0;y<=y1;y++)for(let x=clefEnd;x<W;x++){
    const p0=y*W+x; if(!head[p0]||seen[p0])continue;
    let sptr=0; stk[sptr++]=p0; seen[p0]=1;
    let ax0=x,ax1=x,ay0=y,ay1=y,area=0,symY=0;
    while(sptr>0){
      const q=stk[--sptr], qy=(q/W)|0, qx=q-qy*W;
      area++; symY+=qy;
      if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=qx+dx, ny=qy+dy;
        if(nx<clefEnd||nx>=W||ny<y0||ny>y1)continue;
        const np=ny*W+nx; if(head[np]&&!seen[np]){seen[np]=1;stk[sptr++]=np;}
      }
    }
    const bw=ax1-ax0+1, bh=ay1-ay0+1;
    /* 디버그 고리: 콘솔에서 window.__GEOMDBG=[] 을 먼저 두면 후보 덩어리 치수가 담긴다.
       이 알고리즘은 눈에 보이는 출력이 없어서, 이게 없으면 왜 음을 놓쳤는지 알 방법이 없다. */
    if(window.__GEOMDBG)window.__GEOMDBG.push({sp:+sp.toFixed(1),bw,bh,area,cy:+(symY/area).toFixed(1),cx:+((ax0+ax1)/2).toFixed(1),hRatio:+(bh/sp).toFixed(2),wRatio:+(bw/sp).toFixed(2),fill:+(area/(bw*bh)).toFixed(2)});
    if(area<minArea)continue;
    if(bh<sp*0.62||bh>sp*1.7||bw<sp*0.55||bw>sp*2.2)continue;   // 반 칸 높이는 쉼표다
    if(bw<bh*0.8)continue;                     // 음표 머리는 세로보다 가로가 길다
    if(area/(bw*bh)<0.5)continue;
    cands.push({x0:ax0,x1:ax1,cx:(ax0+ax1)/2,cy:symY/area,hollow:false});
  }

  /* 4) 속이 빈 머리: 잉크로 완전히 둘러싸인 흰 구멍 */
  const bg=new Uint8Array(N); let bptr=0;
  const pushBg=(x,y)=>{ if(x<0||x>=W||y<y0||y>y1)return; const p=y*W+x; if(!ink[p]&&!bg[p]){bg[p]=1;stk[bptr++]=p;} };
  for(let x=0;x<W;x++){ pushBg(x,y0); pushBg(x,y1); }
  for(let y=y0;y<=y1;y++){ pushBg(0,y); pushBg(W-1,y); }
  while(bptr>0){ const q=stk[--bptr], qy=(q/W)|0, qx=q-qy*W;
    pushBg(qx-1,qy); pushBg(qx+1,qy); pushBg(qx,qy-1); pushBg(qx,qy+1); }
  const holes=[];
  for(let y=y0;y<=y1;y++)for(let x=clefEnd;x<W;x++){
    const p0=y*W+x; if(ink[p0]||bg[p0])continue;
    let sptr=0; stk[sptr++]=p0; bg[p0]=1;
    let ax0=x,ax1=x,ay0=y,ay1=y,area=0,symY=0,symX=0;
    while(sptr>0){
      const q=stk[--sptr], qy=(q/W)|0, qx=q-qy*W;
      area++; symY+=qy; symX+=qx;
      if(qx<ax0)ax0=qx; if(qx>ax1)ax1=qx; if(qy<ay0)ay0=qy; if(qy>ay1)ay1=qy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(Math.abs(dx)+Math.abs(dy)!==1)continue;
        const nx=qx+dx, ny=qy+dy;
        if(nx<0||nx>=W||ny<y0||ny>y1)continue;
        const np=ny*W+nx; if(!ink[np]&&!bg[np]){bg[np]=1;stk[sptr++]=np;}
      }
    }
    const bw=ax1-ax0+1, bh=ay1-ay0+1;
    /* 디버그 고리: window.__HOLEDBG=[] (속이 빈 머리 후보) */
    if(window.__HOLEDBG)window.__HOLEDBG.push({cx:+(symX/area).toFixed(1),cy:+(symY/area).toFixed(1),bw,bh,area,wR:+(bw/sp).toFixed(2),hR:+(bh/sp).toFixed(2),minA:+Math.max(3,sp*sp*0.05).toFixed(0)});
    if(area<Math.max(3,sp*sp*0.05))continue;
    if(bw<sp*0.28||bw>sp*1.25||bh<sp*0.2||bh>sp*1.0)continue;
    /* 음표 머리는 기울어진 타원이라 구멍이 **가로로 뚜렷하게 길다**(실측 bw/bh≈1.36).
       16분음표의 꼬리 두 겹과 기둥 사이에 생기는 빈틈은 거의 정사각형(≈0.95)이라,
       여기서 갈라낸다 — 예전엔 0.7 이어서 그 빈틈이 음표 머리로 잡혀 개수가 어긋났다. */
    if(bw<bh*1.12)continue;
    holes.push({x0:ax0,x1:ax1,cx:symX/area,cy:symY/area,hollow:true});
  }
  /* 오선 밖(위·아래)에 구멍이 여럿 흩어져 있으면 그건 음표가 아니라 글자다
     (찬송가는 오선 사이에 가사를 인쇄한다). 그런 구멍은 통째로 버린다. */
  const outside=holes.filter(h=>h.cy<top-sp*0.6||h.cy>bot+sp*0.6);
  const useHoles=(outside.length>3)?holes.filter(h=>h.cy>=top-sp*0.6&&h.cy<=bot+sp*0.6):holes;
  for(const h of useHoles){
    if(cands.some(c=>Math.abs(c.cx-h.cx)<sp*0.7&&Math.abs(c.cy-h.cy)<sp*0.7))continue;
    cands.push(h);
  }
  if(cands.length<3)return null;

  /* 5) 같은 x 에 쌓인 것은 맨 위만 = 소프라노 */
  cands.sort((a,b)=>a.cx-b.cx);
  const cols=[];
  for(const c of cands){
    const L=cols.length?cols[cols.length-1]:null;
    if(L){
      const ov=Math.min(L.x1,c.x1)-Math.max(L.x0,c.x0);
      const mw=Math.min(L.x1-L.x0,c.x1-c.x0)+1;
      /* 위쪽 것을 고를 때 속 빈 머리인지 여부도 함께 따라가야 한다 — 길이 판정의 재료다 */
      if(ov>mw*0.5){ L.x0=Math.min(L.x0,c.x0); L.x1=Math.max(L.x1,c.x1);
                     L.ys.push(c.cy);
                     if(c.cy<L.cy){L.cy=c.cy;L.hollow=c.hollow;} continue; }
    }
    cols.push({x0:c.x0,x1:c.x1,cx:c.cx,cy:c.cy,hollow:c.hollow,ys:[c.cy]});
  }
  if(cols.length<3)return null;

  /* 6) 반칸 격자에 얼마나 잘 떨어지는지로 신뢰도를 판단한다 */
  const half=sp/2, base=CLEF_BOTTOM[clef==='bass'?'bass':'treble'];
  /* 길이를 재면서 **가짜 머리도 걸러낸다**(v50). 속이 찬 음표 머리는 기둥이 반드시
     있다(기둥 없는 음표는 온음표뿐이고 그건 속이 비어 있다). 그래서 "속이 찬데 기둥이
     없는 것"은 음표가 아니라 자리표·조표·글자 조각이다.
     ★ 실측: 실제 찬송가 사진에서 단마다 앞에 가짜 음 2개(자리표 자리 x=42,58)가
       잡혀 개수가 어긋났고, 그 때문에 음높이 보정(v49)까지 통째로 못 쓰고 있었다.
       이 한 줄로 개수가 Audiveris 와 정확히 같아졌다. */
  const res=[], devs=[];
  cols.forEach((c,ci)=>{
    const nextX0=(ci+1<cols.length)?cols[ci+1].x0:W;
    const d=headDur(ink,vr,hr,W,c,sp,y0,y1,bot,nextX0,(c.ys||[]).filter(v=>Math.abs(v-c.cy)>sp*0.4),lineRow);
    if(!d.hollow&&!d.stem)return;
    const q=(bot-c.cy)/half, step=Math.round(q);
    devs.push(Math.abs(q-step));
    res.push({x:c.cx/sc, cy:c.cy, step, abs:base+step, name:diaName(base+step),
              beats:d.beats, sure:d.sure, stem:d.stem, bands:d.bands, dot:d.dot, hollow:d.hollow});
  });
  if(res.length<3)return null;
  devs.sort((a,b)=>a-b);
  const med=devs[devs.length>>1];
  if(med>0.26)return null;                     // 격자에 안 맞으면 오선을 잘못 잡은 것이다
  const durSure=res.every(n=>n.sure);
  const total=+res.reduce((a,n)=>a+(n.beats||0),0).toFixed(4);
  return {sp,top,bot,med,notes:res,durSure,total};
}
/* AI 결과의 ♪ 줄 음이름을 우리가 센 것으로 덮어쓴다. 개수가 정확히 같을 때만 한다. */
function applyGeomPitch(text,names){
  if(!names||!names.length)return {text,changed:0,matched:false};
  const lines=text.split('\n');
  const idx=[]; lines.forEach((l,i)=>{ if(/^\s*♪/.test(l))idx.push(i); });
  if(idx.length!==1)return {text,changed:0,matched:false};      // 줄이 쪼개졌으면 정렬 근거가 없다
  const i0=idx[0], toks=lines[i0].replace(/^\s*♪\s*/,'').split(/\s+/).filter(Boolean);
  const NT=/^([A-G])([#♯b♭]?)(-?\d+)(:[\d.]+)?$/;
  const pos=[]; toks.forEach((t,k)=>{ if(NT.test(t))pos.push(k); });
  if(pos.length!==names.length)return {text,changed:0,matched:false};
  let changed=0;
  pos.forEach((k,n)=>{
    const m=toks[k].match(NT), want=names[n];
    const wl=want[0], wo=want.slice(1);
    const acc=(m[1].toUpperCase()===wl)?m[2]:'';
    const nt=wl+acc+wo+(m[4]||'');
    if(nt!==toks[k])changed++;
    toks[k]=nt;
  });
  lines[i0]='♪ '+toks.join(' ');
  return {text:lines.join('\n'),changed,matched:true};
}

/* 우리가 잰 음표 길이를 AI 결과의 ♪ 줄에 써 넣는다(v50).
   음이름(applyGeomPitch)보다 훨씬 조심해야 한다 — 박자는 한 음만 틀려도 그 뒤가 다 밀리고,
   음이름과 달리 "귀로 들어 이상하다"는 것도 늦게 알아차린다. 그래서 문을 세 개 둔다:
     1) 잰 음표 개수가 AI 가 적은 음표 개수와 정확히 같아야 한다(정렬 근거)
     2) 모든 음의 길이를 확신해야 한다(하나라도 애매하면 통째로 포기)
     3) 합계가 말이 돼야 한다 — 박자표의 정수 배(마디가 딱 떨어짐)이거나,
        AI 가 적은 합계와 거의 같아야 한다(서로 다른 두 방법이 같은 답을 냈다는 뜻)
   셋 중 하나라도 어긋나면 아무것도 하지 않는다. */
function applyGeomDur(text,notes,perBar){
  const none={text,changed:0,matched:false,why:''};
  if(!notes||!notes.length)return none;
  if(!notes.every(n=>n.sure&&n.beats>0))return {...none,why:'길이가 애매한 음이 있음'};
  const lines=text.split('\n');
  const idx=[]; lines.forEach((l,i)=>{ if(/^\s*♪/.test(l))idx.push(i); });
  if(idx.length!==1)return {...none,why:'♪ 줄이 하나가 아님'};
  const i0=idx[0], toks=lines[i0].replace(/^\s*♪\s*/,'').split(/\s+/).filter(Boolean);
  const NT=/^([A-G][#♯b♭]?-?\d+)(?::([\d.]+))?$/;
  const RT=/^r(?::([\d.]+))?$/i;
  const pos=[]; toks.forEach((t,k)=>{ if(NT.test(t))pos.push(k); });
  if(pos.length!==notes.length)return {...none,why:'개수 불일치'};
  const mine=notes.reduce((a,n)=>a+n.beats,0);
  const rests=toks.reduce((a,t)=>{ const m=t.match(RT); return a+(m?(m[1]?parseFloat(m[1]):1):0); },0);
  const aiTotal=toks.reduce((a,t)=>{
    const m=t.match(NT); if(m)return a+(m[2]?parseFloat(m[2]):1);
    const r=t.match(RT); if(r)return a+(r[1]?parseFloat(r[1]):1);
    return a; },0);
  const withRests=mine+rests;
  const per=perBar||4;
  const k=Math.round(withRests/per);
  const fitsBar=k>=1&&Math.abs(withRests-k*per)<=0.13;
  const fitsAI=Math.abs(withRests-aiTotal)<=0.26;
  if(!fitsBar&&!fitsAI)
    return {...none,why:'합계가 안 맞음('+withRests+'박)'};
  let changed=0;
  pos.forEach((k2,n)=>{
    const m=toks[k2].match(NT), want=notes[n].beats;
    const had=m[2]?parseFloat(m[2]):1;
    if(Math.abs(had-want)>1e-6)changed++;
    toks[k2]=m[1]+':'+want;
  });
  lines[i0]='♪ '+toks.join(' ');
  return {text:lines.join('\n'),changed,matched:true,why:fitsBar?'마디가 딱 맞음':'AI와 합계 일치'};
}

/* 오선이 모인 줄(단)을 찾아 한 단씩 잘라낸다.
   한 번에 보는 음표가 줄면 음높이 인식이 훨씬 정확해진다.
   반드시 가장 큰 사본(prepImage 의 hiUrl)에서 잘라야 한다 — 줄여 놓은 그림에서 오려내면
   오선 간격이 몇 픽셀로 뭉개져서, 잘라 보내는 의미가 없어진다. */
function splitSystems(url,targetW){
  return new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const W=img.width,H=img.height;
        const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0);
        const d=ctx.getImageData(0,0,W,H).data;
        const rows=new Float32Array(H);
        for(let y=0;y<H;y++){
          let c=0,o=y*W*4;
          for(let x=0;x<W;x++){const i=o+x*4;
            if((d[i]*.3+d[i+1]*.59+d[i+2]*.11)<150)c++;}
          rows[y]=c/W;
        }
        const isLine=y=>rows[y]>0.45;              // 가로로 길게 이어진 줄 = 오선
        const bands=[]; let st=-1;
        for(let y=0;y<H;y++){
          if(isLine(y)){ if(st<0)st=y; }
          else if(st>=0){ bands.push([st,y]); st=-1; }
        }
        if(st>=0)bands.push([st,H-1]);
        // 가까운 오선들을 한 단으로 묶는다
        const sys=[]; let cur=null;
        for(const [a,b] of bands){
          if(cur&&a-cur[1]<H*0.045){ cur[1]=b; }
          else { if(cur)sys.push(cur); cur=[a,b]; }
        }
        if(cur)sys.push(cur);
        const good=sys.filter(x=>x[1]-x[0]>H*0.008);
        if(good.length<2||good.length>14){ res(null); return; }
        const out=[];
        for(let i=0;i<good.length;i++){
          const prevEnd=i>0?good[i-1][1]:0;
          const nextStart=i<good.length-1?good[i+1][0]:H;
          const top=Math.max(0,Math.floor((good[i][0]+prevEnd)/2)-6);
          const bot=Math.min(H,Math.ceil((good[i][1]+nextStart)/2)+6);
          const hh=bot-top; if(hh<20)continue;
          const sc=Math.min(3,(targetW||1800)/W);   // 단 하나를 1800px 폭으로 — 오선 간격이 충분히 벌어진다
          const c2=document.createElement('canvas');
          c2.width=Math.round(W*sc); c2.height=Math.round(hh*sc);
          const x2=c2.getContext('2d');
          x2.fillStyle='#fff'; x2.fillRect(0,0,c2.width,c2.height);
          x2.filter='grayscale(1) contrast(1.2)';
          x2.drawImage(img,0,top,W,hh,0,0,c2.width,c2.height);
          const u=c2.toDataURL('image/jpeg',.92);
          /* t0/t1: 이 단이 원본 사진에서 차지한 세로 구간(0~1). 원본을 어떤 크기로 보여 주든
             비율은 그대로라, 사진 위에 하이라이트를 얹을 때 이 값을 그대로 쓴다. */
          out.push({url:u,b64:u.split(',')[1],t0:top/H,t1:bot/H});
        }
        res(out.length>=2?out:null);
      }catch(e){ res(null); }
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}

let camStream=null;
function closeCam(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  const w=$('camwrap'); if(w)w.style.display='none';
}
async function openCam(){
  const box=$('scanstate');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}}});
    const w=$('camwrap'); w.style.display='block';
    const v=$('cam'); v.srcObject=camStream; v.setAttribute('playsinline',''); v.muted=true; await v.play();
    if(box){box.className='';box.textContent='';}
  }catch(e){
    closeCam();
    if(box){box.className='callout err';box.textContent='이 환경에서는 카메라를 쓸 수 없습니다. 파일 선택이나 붙여넣기를 써 주세요.';}
  }
}
function shoot(){
  const v=$('cam'); if(!v||!v.videoWidth){toast('아직 화면이 준비되지 않았습니다.');return;}
  const fit=cap=>{
    const sc=Math.min(1,cap/Math.max(v.videoWidth,v.videoHeight));
    const cv=document.createElement('canvas');
    cv.width=Math.round(v.videoWidth*sc); cv.height=Math.round(v.videoHeight*sc);
    const c=cv.getContext('2d');
    c.filter='grayscale(1) contrast(1.25) brightness(1.05)';
    c.drawImage(v,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.9);
  };
  const out=fit(1600), ocrOut=fit(2200);
  closeCam();
  S.photos.push({url:out,b64:out.split(',')[1],ocrUrl:ocrOut});
  openPanel('scan');
}

/* ============ OCR: API 키 없이 코드와 가사 읽기 ============
   Tesseract.js 는 "글자"를 읽는다. 오선보의 음표는 못 읽는다.
   그래서 코드 심볼과 가사까지만 가져오고 멜로디는 포기한다. */
let wChord=null, wLyric=null;
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.onload=()=>res(); el.onerror=()=>rej(new Error('스크립트를 불러오지 못했습니다'));
    document.head.appendChild(el);
  });
}
/* 오선을 지운다. 가로로 길게 이어진 어두운 줄만 하얗게 만든다.
   음표는 일부 깎이지만 우리가 읽을 건 글자라 상관없다. */
function stripStaff(srcUrl,scale){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const W=Math.round(img.width*scale),H=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img,0,0,W,H);
      const d=ctx.getImageData(0,0,W,H), px=d.data;
      const dark=new Uint8Array(W*H);
      for(let i=0,p=0;i<px.length;i+=4,p++){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        dark[p]=v<150?1:0;
      }
      const rowCount=new Int32Array(H);
      for(let y=0;y<H;y++){let c=0;const o=y*W;for(let x=0;x<W;x++)c+=dark[o+x];rowCount[y]=c;}
      for(let y=0;y<H;y++){
        if(rowCount[y]<W*0.45)continue;
        const o=y*W;
        for(let x=0;x<W;x++){
          if(!dark[o+x])continue;
          // 위아래 3px 안이 비어 있으면 오선으로 보고 지운다(음표 기둥은 살린다)
          let up=0,dn=0;
          for(let k=1;k<=3;k++){
            if(y-k>=0&&dark[(y-k)*W+x])up++;
            if(y+k<H&&dark[(y+k)*W+x])dn++;
          }
          if(up<=1&&dn<=1){const i=(o+x)*4;px[i]=px[i+1]=px[i+2]=255;}
        }
      }
      // 대비 강화
      for(let i=0;i<px.length;i+=4){
        const v=(px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11);
        const t=v<170?0:255;
        px[i]=px[i+1]=px[i+2]=t;
      }
      ctx.putImageData(d,0,0);
      res(cv.toDataURL('image/png'));
    };
    img.onerror=()=>rej(new Error('이미지 처리 실패'));
    img.src=srcUrl;
  });
}
function fixChordToken(t){
  let x=t.replace(/[♭]/g,'b').replace(/[♯]/g,'#').replace(/[·•,.]$/,'').trim();
  x=x.replace(/^([A-G])[|1lI](?=[A-G])/,'$1/');
  x=x.replace(/([A-G][#b]?)[|lI]([A-G][#b]?)$/,'$1/$2');
  x=x.replace(/^([A-G])[oO0](?![a-z])/,'$1');
  x=x.replace(/^([A-G][#b]?)rn/,'$1m');
  x=x.replace(/^([A-G][#b]?)M(?=7|$)/,'$1maj');
  x=x.replace(/[^A-Ga-g#b\/0-9msuadijMΔ°+()\-]/g,'');
  if(/^[A-G]/.test(x))x=x[0].toUpperCase()+x.slice(1);
  return x;
}
/* OCR 가사 낱말에서 흔한 잡음만 가볍게 정리한다(사전 대조 없는 규칙 기반).
   실제 한글 사전으로 오타를 고치는 건 별도 작업 — 이건 "글자 아닌 것"만 걷어낸다. */
function cleanOcrLyricToken(t){
  return t
    .replace(/[|Il~`^*_<>{}\[\]0-9]/g,'')     // 오선·바코드성 잡음이 섞여 들어온 자리(가사에 나올 일 없는 문자)
    .replace(/[.,·•‥…]+$/,'')                  // 끝에 붙은 구두점 잡음
    .trim();
}
function wordsFrom(data){
  if(data.words&&data.words.length)return data.words;
  const out=[];
  const walk=n=>{ if(!n)return;
    if(Array.isArray(n)){n.forEach(walk);return;}
    if(n.text!==undefined&&n.bbox&&!n.words&&!n.lines&&!n.paragraphs){out.push(n);return;}
    ['blocks','paragraphs','lines','words'].forEach(k=>{if(n[k])walk(n[k])});
  };
  walk(data.blocks||data);
  return out;
}
function wordsToChart(words){
  const ws=words.filter(w=>w.text&&w.text.trim())
    .map(w=>({t:w.text.trim(),kind:w.kind,x0:w.bbox.x0,x1:w.bbox.x1,yc:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0}));
  if(!ws.length)return '';
  const medH=ws.map(w=>w.h).sort((a,b)=>a-b)[Math.floor(ws.length/2)]||20;
  ws.sort((a,b)=>a.yc-b.yc);
  /* 절 번호('v', 예: 전통 찬송가의 왼쪽 여백 "1." "2." "3.")는 코드('c')와는 다른 줄이지만
     그 옆 가사('l')와는 같은 줄이다 — 묶을 때는 코드만 따로, 가사+절번호는 한 묶음으로 본다. */
  const grp=k=>k==='c'?'c':'l';
  const lines=[];
  for(const w of ws){
    const L=lines[lines.length-1];
    if(L&&Math.abs(w.yc-L.yc)<medH*0.7&&grp(L.kind)===grp(w.kind)){
      L.items.push(w); L.yc=(L.yc*(L.items.length-1)+w.yc)/L.items.length;
    } else lines.push({yc:w.yc,items:[w],kind:w.kind});
  }
  const charW=Math.max(6,medH*0.6);
  const minX=Math.min(...ws.map(w=>w.x0));
  const out=[];
  for(const L of lines){
    L.items.sort((a,b)=>a.x0-b.x0);
    const isChord=L.kind==='c';
    let line='',vcol=0;
    /* line.length(문자 수)가 아니라 vcol(보이는 너비 누적)로 위치를 맞춘다 —
       한글 단어는 chord 폰트 기준 charW 단위보다 넓어서, 문자 수 기준으로
       칸을 세면 한글이 쌓일수록 실제 픽셀 위치보다 뒤처져 다음 코드와
       어긋난다(parseChart의 colToIndex와 같은 단위를 써야 함). */
    for(const w of L.items){
      /* 절 번호 1은 표시하지 않음(코드 붙은 기본 절), 2 이상만 "2) " 형식으로 —
         나머지 파서가 그 형식으로 다음 절 가사를 알아본다. */
      const text=isChord?fixChordToken(w.t):(w.kind==='v'?(w.t==='1'?'':w.t+') '):w.t);
      if(!text)continue;
      const col=Math.round((w.x0-minX)/charW);
      while(vcol<col){line+=' ';vcol++;}
      if(line.length&&line[line.length-1]!==' '){line+=' ';vcol++;}
      line+=text;vcol+=strDispW(text);
    }
    if(line.trim())out.push(line.replace(/\s+$/,''));
  }
  return out.join('\n');
}
async function ensureOcrWorkers(say){
  if(!window.Tesseract){
    say&&say('OCR 엔진을 내려받는 중…');
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }
  const SPARSE=(window.Tesseract&&Tesseract.PSM&&Tesseract.PSM.SPARSE_TEXT)||'11';
  if(!wChord){
    say&&say('코드 인식 준비 중…');
    wChord=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!==undefined)say&&say('코드 인식 준비 '+Math.round(m.progress*100)+'%')}});
    await wChord.setParameters({
      tessedit_pageseg_mode:SPARSE,
      tessedit_char_whitelist:'ABCDEFGabdgijmosu#/0123456789'
    });
  }
  if(!wLyric){
    say&&say('한글 인식 데이터를 내려받는 중… 처음 한 번만 오래 걸립니다.');
    wLyric=await Tesseract.createWorker(['kor','eng'],1,{logger:m=>{if(m.progress!==undefined)say&&say('한글 준비 '+Math.round(m.progress*100)+'%')}});
  }
}
/* 사진 여러 장을 OCR로 읽어 "코드+가사" 초안 텍스트를 만든다(음표는 못 읽음).
   - 단독으로 쓰면 키 없는 OCR 결과
   - runScan()에서 API 프롬프트에 참고 힌트로 얹으면 AI 채보 정확도를 보정하는 용도로도 쓴다 */
async function ocrDraft(photoUrls,say){
  await ensureOcrWorkers(say);
  const pages=[]; let chordN=0, lyricN=0;
  for(let i=0;i<photoUrls.length;i++){
    const tag=photoUrls.length>1?(i+1)+'/'+photoUrls.length+'쪽 ':'';
    /* 한 장에 단이 여러 개 있으면(전통 찬송가 등) 단 단위로 잘라 한 단씩 읽는다 —
       한 장 통째로 넣으면 밀도가 높아 코드·글자 인식이 훨씬 부정확해진다. */
    let shots=[photoUrls[i]];
    /* 단 단위로 자르면 그 조각 안에서 다시 확대할 여유가 생긴다(전체 페이지를 한 번에 키우는
       것보다 훨씬 싸다) — 그래서 여기서는 목표 해상도를 크게 잡는다. */
    try{ const parts=await splitSystems(photoUrls[i],2200); if(parts&&parts.length)shots=parts.map(p=>p.url); }catch(e){}
    for(let j=0;j<shots.length;j++){
      const tag2=shots.length>1?tag+(j+1)+'/'+shots.length+'단 ':tag;
      say&&say(tag2+'오선을 지우는 중…');
      /* 단 단위로 잘랐으면 이미 위에서 충분히 확대했으니 그대로, 통째로(단 분리 실패) 넣을 땐
         한 번 더 키운다 — 어느 쪽이든 작은 글자가 인식 가능한 크기가 되도록. */
      const clean=await stripStaff(shots[j],shots.length>1?1:1.4);
      say&&say(tag2+'코드 심볼을 읽는 중…');
      const rc=await wChord.recognize(clean,{},{blocks:true,text:false});
      const chordWords=wordsFrom(rc.data)
        .filter(w=>w.text&&w.text.trim()&&(w.confidence===undefined||w.confidence>40))
        .filter(w=>parseChord(fixChordToken(w.text.trim())))
        .map(w=>({text:w.text,bbox:w.bbox,kind:'c'}));
      say&&say(tag2+'가사를 읽는 중…');
      const rl=await wLyric.recognize(clean,{},{blocks:true,text:false});
      const rawLyric=wordsFrom(rl.data).filter(w=>w.text&&w.text.trim());
      const lyricWords=rawLyric
        .filter(w=>w.confidence===undefined||w.confidence>40)   // 확신도 낮은 잡음 토큰은 애초에 버린다(코드 인식과 동일 기준)
        .filter(w=>/[가-힣]/.test(w.text))
        .map(w=>({text:cleanOcrLyricToken(w.text),bbox:w.bbox,kind:'l'}))
        .filter(w=>w.text);
      /* 전통 찬송가는 절 가사 왼쪽에 "1. 2. 3. 4."로 번호가 붙어 있다.
         한글이 없어 위 필터에서 빠지므로, 홀로 있는 한 자리 숫자(+점)만 절 번호 후보로 따로 챙긴다. */
      const verseWords=rawLyric.filter(w=>{
          const t=w.text.trim();
          if(!/^[1-9][.).]?$/.test(t))return false;
          if(w.confidence!==undefined&&w.confidence<70)return false;   // 잘못 읽은 낱자 숫자(페이지 번호·연도 조각 등)를 절 번호로 오인하지 않도록 엄격하게
          return +t.replace(/[.).]/g,'')<=6;   // 찬송가 절이 6개를 넘는 경우는 거의 없다
        })
        .map(w=>({text:w.text.trim().replace(/[.).]/g,''),bbox:w.bbox,kind:'v'}));
      chordN+=chordWords.length; lyricN+=lyricWords.length;
      const txt=wordsToChart(chordWords.concat(lyricWords).concat(verseWords));
      if(txt.trim())pages.push(txt);
    }
  }
  return {text:pages.join('\n\n'),chordN,lyricN};
}

/* 모델 이름은 자주 바뀐다. 추측하지 말고 계정에서 실제 목록을 받아온다. */
let GMODELS=null, LAST_TRUNCATED=false;
async function geminiModels(gkey){
  if(GMODELS)return GMODELS;
  try{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(gkey)+'&pageSize=200');
    if(r.ok){
      const d=await r.json();
      const ok=(d.models||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>String(m.name||'').replace(/^models\//,''))
        .filter(n=>/gemini/i.test(n)&&!/embedding|aqa|tts|image|audio|native|thinking-exp/i.test(n));
      const score=n=>{
        let s=0;
        if(/flash/i.test(n))s+=100;          // 무료 등급은 flash 계열
        if(/lite/i.test(n))s-=20;            // lite 는 정확도가 낮다
        if(/latest/i.test(n))s+=15;
        if(/preview|exp/i.test(n))s-=30;
        const v=parseFloat((n.match(/(\d+(?:\.\d+)?)/)||[])[1]||0);
        s+=v*3;
        return s;
      };
      ok.sort((x,y)=>score(y)-score(x));
      if(ok.length){GMODELS=ok.slice(0,6);return GMODELS;}
    }else if(r.status===403){
      throw new Error('키가 거부되었습니다. AI Studio에서 키를 다시 확인해 주세요');
    }
  }catch(e){ if(/거부/.test(e.message))throw e; }
  return GEMINI_MODELS;   // 목록 조회 실패 시 예비 목록 — 실패는 캐시하지 않아 다음 시도 때 다시 조회한다
}
/* 읽어 온 멜로디가 "악보로서 말이 되는지" 스스로 채점한다.
   음높이 정답을 우리가 알 수는 없지만, 틀렸을 때 거의 항상 함께 나타나는 흔적은 알 수 있다.
     - 마디 박수 합이 박자표와 안 맞는다 (음표나 쉼표를 놓쳤거나 더 봤다)
     - 음역을 벗어난 음이 있다 (자리표·덧줄 오독)
     - 옥타브를 넘는 도약이 있다 (옥타브 숫자 오독)
   돌려주는 값은 {score:0~1, why:'사람이 읽을 설명'}. score 가 낮은 단만 다시 읽는다 —
   모든 단을 두 번 읽으면 Gemini 무료 한도를 두 배로 쓰게 되므로 문제가 있는 단에만 쓴다. */
function melScore(txt){
  const lines=(txt||'').split('\n').filter(l=>MEL_RE.test(l));
  if(!lines.length)return null;                 // 멜로디가 아예 없으면 채점 대상이 아니다
  let bars=0,badBar=0,notes=0,outRange=0,bigLeap=0;
  for(const l of lines){
    const clef=/^\s*♫/.test(l)?'bass':'treble';
    const [LO,HI]=MEL_RANGE[clef];
    const nts=parseMelody(l);
    const groups=[[]];
    for(const n of nts){ if(n.bar)groups.push([]); else groups[groups.length-1].push(n); }
    const gs=groups.filter(g=>g.length);
    gs.forEach((g,i)=>{
      const sum=g.reduce((a,n)=>a+(n.beats||1),0);
      if(i===0&&gs.length>1&&sum<P.beats-0.01)return;    // 못갖춘마디는 예외
      bars++; if(Math.abs(sum-P.beats)>0.26)badBar++;
    });
    let prev=null;
    for(const n of nts){
      if(n.bar||n.rest||n.midi===undefined)continue;
      notes++;
      if(n.midi<LO||n.midi>HI)outRange++;
      if(prev!==null&&Math.abs(n.midi-prev)>12)bigLeap++;
      prev=n.midi;
    }
  }
  if(!bars&&!notes)return null;
  const barBad=bars?badBar/bars:0, pitchBad=notes?(outRange+bigLeap)/notes:0;
  const why=[];
  if(badBar)why.push(bars+'마디 중 '+badBar+'마디가 박자표와 안 맞습니다');
  if(outRange)why.push('노래할 수 없는 음역의 음이 '+outRange+'개 있습니다');
  if(bigLeap)why.push('옥타브를 넘는 도약이 '+bigLeap+'군데 있습니다');
  return {score:Math.max(0,1-barBad-pitchBad*1.5),why:why.join('. ')};
}
/* 단 기록(sysRec)을 원본 사진 보기용 구조로 바꾼다.
   각 단에 곡 전체 진행도 구간 [b0,b1) 을 붙여, 재생 위치 → 어느 단인지 바로 찾게 한다.
   길이는 sysWeight 로 잰 박수 비율이라 재생 엔진의 계산과 완전히 같지는 않다 —
   눈으로 따라가는 보조 표시라 한 마디 정도 오차는 문제되지 않는다. */
function buildOrig(sysRec){
  const recs=(sysRec||[]).filter(r=>r&&S.photos[r.page]);
  if(!recs.length)return null;
  const tot=recs.reduce((a,r)=>a+Math.max(0,r.w||0),0);
  const pages=S.photos.map(ph=>({url:ph.showUrl||ph.url,sys:[]}));
  let acc=0, n=0;
  recs.forEach(r=>{
    const w=Math.max(0,r.w||0);
    const b0=tot>0?acc/tot:0; acc+=w;
    const b1=tot>0?acc/tot:1;
    pages[r.page].sys.push({t0:r.t0,t1:r.t1,b0,b1,n:++n+'단'});
  });
  const out={pages:pages.filter(p=>p.url&&p.sys.length),approx:recs.some(r=>r.whole)};
  return out.pages.length?out:null;
}
/* 이 단(사진 한 줄)이 곡 전체에서 차지하는 길이를 박 단위로 어림한다.
   원본 사진 위 하이라이트를 재생 위치에 맞춰 옮기려면 단마다 "몇 박짜리인가"가 필요하다.
   멜로디를 읽었으면 그 박수가 곧 정답이고, 못 읽었으면 마디·코드 개수로 어림한다.
   재생 엔진과 완전히 같은 계산은 아니다 — 눈으로 따라가는 보조 표시라 이 정도면 충분하다. */
function sysWeight(txt){
  let beats=0;
  for(const l of (txt||'').split('\n')){
    if(!/^\s*♪/.test(l))continue;
    for(const n of parseMelody(l))if(!n.bar)beats+=(n.beats||1);
  }
  if(beats>0.5)return beats;
  let ch=0,bars=0;
  for(const b of parseChart(txt||'')){
    if(b.k!=='pairs')continue;
    ch+=b.pairs.filter(x=>x.chord).length;
    bars+=b.pairs.filter(x=>x.bar).length;
  }
  return Math.max(1,bars||ch||1)*(P.beats||4);
}
/* 채보한 멜로디의 마지막 음이름 — 다음 단을 읽을 때 옥타브 기준으로 알려 준다 */
function stripFence(t){ return (t||'').trim().replace(/^```[a-z]*\n?/i,'').replace(/```\s*$/,'').trim(); }
function lastMelNote(txt){
  const lines=(txt||'').split('\n').filter(l=>/^\s*♪/.test(l));
  for(let i=lines.length-1;i>=0;i--){
    const nts=parseMelody(lines[i]).filter(n=>!n.bar&&!n.rest&&n.midi!==undefined);
    if(nts.length){ const m=nts[nts.length-1].midi; return nm(m,'sharp')+(Math.floor(m/12)-1); }
  }
  return '';
}
async function geminiScan(gkey,prompt,b64,say){
  const models=await geminiModels(gkey);
  let lastErr='';
  for(const model of models){
    if(say)say('읽는 중… ('+model+')');
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(gkey);
    let r;
    try{
      r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({
          contents:[{role:'user',parts:[
            {inline_data:{mime_type:'image/jpeg',data:b64}},
            {text:prompt}
          ]}],
          generationConfig:{temperature:0,maxOutputTokens:8192,thinkingConfig:{thinkingBudget:0}}
        })});
    }catch(e){ throw new Error('네트워크 오류 — 인터넷 연결을 확인해 주세요'); }

    let d=null;
    try{ d=await r.json(); }catch(e){}
    if(r.ok){
      const cand=(d&&d.candidates&&d.candidates[0])||null;
      const txt=(cand&&cand.content&&cand.content.parts)
        ? cand.content.parts.map(x=>x.text||'').join('') : '';
      if(txt.trim()){
        if(cand.finishReason==='MAX_TOKENS')LAST_TRUNCATED=true;
        return txt;
      }
      lastErr='빈 응답'+(cand&&cand.finishReason?' ('+cand.finishReason+')':'');
      continue;
    }
    const msg=(d&&d.error&&d.error.message)||('서버 응답 '+r.status);
    if(r.status===403) throw new Error('키가 거부되었습니다: '+msg);
    if(r.status===429){
      if(!P._retried){ P._retried=true;
        for(let w=25;w>0;w--){ if(say)say('무료 한도에 걸렸습니다. '+w+'초 뒤 자동으로 다시 시도합니다…'); await new Promise(z=>setTimeout(z,1000)); }
        return await geminiScan(gkey,prompt,b64,say);
      }
      { const qe=new Error('무료 한도를 다 썼습니다. 분당 한도라면 1~2분 뒤 됩니다. '
        +'몇 시간째 안 되면 하루 한도까지 쓴 것이고, 태평양 시간 자정(한국 시간 오후 4~5시)에 초기화됩니다. '
        +'그때까지는 아래 OCR이나 직접 입력을 쓰세요');
        qe.quota=true; throw qe; }
    }
    lastErr=msg;
  }
  if(/no longer available|not found|deprecated/i.test(lastErr))
    throw new Error('시도한 모델이 전부 더는 지원되지 않습니다. 새로고침 후 다시 시도해 보세요('+lastErr+')');
  throw new Error(lastErr||'인식 실패');
}
